ן תרופות?",["התרופות משפיעות יותר על ההישרדות","לשני המרכיבים השפעה שווה על התוצאה","עיסויים איכותיים ודפיברילציה מוקדמת מכריעים","איכות העיסויים אינה משפיעה על התוצאה"],2,"המחקר עקבי: ההתערבויות שמשפיעות באופן מוכח על הישרדות עם תוצאה נוירולוגית טובה הן עיסויים איכותיים ורציפים ודפיברילציה מוקדמת. תרופות משפרות את שיעור ההחזרה של מחזור ספונטני אך השפעתן על הישרדות ארוכת טווח מוגבלת. לכן אין להפסיק עיסויים לצורך מתן תרופה או לצורך ניסיונות חוזרים בהחדרת עירוי."],["החייאה","מדוע חשובה החזרה מלאה של בית החזה בין עיסויים?",["כדי להפחית את הכאב ואת הנזק לצלעות","כדי לחסוך באנרגיה ולהאריך את זמן העיסוי","כדי למנוע שברים בצלעות ובעצם החזה","היא מאפשרת מילוי חדרי הלב ומושכת דם ללב"],3,"בשלב ההרפיה נוצר לחץ תוך-חזי שלילי שמושך דם אל הלב — זהו למעשה שלב המילוי של המשאבה. הישענות על בית החזה בין עיסויים מונעת את החזרה המלאה, מפחיתה את ההחזר הוורידי ופוגעת משמעותית בתפוקה. זו אחת השגיאות הנפוצות ביותר בהחייאה, במיוחד כשהמעסה מתעייף."],["החייאה","מתי מחליפים מעסה בהחייאה?",["רק כאשר המעסה מבקש להתחלף","כל 10 דקות או כשהמעסה מתעייף","אין צורך להחליף מעסה במהלך ההחייאה","כל 2 דקות או בכל בדיקת קצב"],3,"החלפת מעסה מבוצעת כל 2 דקות, במקביל לבדיקת הקצב, כדי לצמצם את זמן ההפסקה. הסיבה היא שאיכות העיסויים יורדת משמעותית לאחר כדקה עד שתי דקות — לרוב עוד לפני שהמעסה מרגיש עייף. ההחלפה עצמה צריכה להימשך פחות מ-5 שניות."],["החייאה","מהו תפקיד ה-AED והאם ניתן להשתמש בו על ילדים?",["הוא מנתח קצב ומספק הלם, וניתן לשימוש בילדים","הוא מנשים את המטופל בלחץ חיובי אוטומטי","הוא מיועד למבוגרים בלבד ואסור בילדים","הוא מודד לחץ דם וסטורציה במקביל להלם"],0,"ה-AED מנתח באופן אוטומטי את קצב הלב וקובע אם הוא בר הלם, ולכן הוא בטוח לשימוש גם על ידי אנשים ללא הכשרה. בילדים מגיל שנה ומעלה יש להשתמש במדבקות ילדים ובמתאם מפחית אנרגיה, אך אם אלה אינם זמינים — משתמשים במדבקות מבוגר ולא נמנעים מדפיברילציה."],["החייאה","היכן מניחים את מדבקות הדפיברילטור?",["שתי המדבקות בצד שמאל של בית החזה","מתחת לעצם הבריח הימנית ובקו האמצע-בית שחי השמאלי","שתי המדבקות על הגב בין השכמות","שתי המדבקות על דופן הבטן העליונה"],1,"המיקום הסטנדרטי הוא מדבקה אחת מתחת לעצם הבריח הימנית מימין לעצם החזה, והשנייה בקו האמצע-בית שחי השמאלי בגובה הפטמה. המטרה היא שהזרם יעבור דרך שריר הלב. בתינוקות או כשהמדבקות גדולות מדי ניתן להניח אחת על החזה ואחת על הגב. יש להימנע מהנחה על קוצב מושתל או על מדבקות תרופתיות."],["החייאה","מהם הצעדים לפני מתן הלם חשמלי?",["וידוא שאיש אינו נוגע, הרחקת חמצן זורם והתרעה קולית","המשך עיסויים רציפים גם במהלך ההלם","הרטבת דופן החזה במים לשיפור המוליכות","הסרת כל הציוד והמוניטורים מהמטופל"],0,"לפני מתן ההלם יש לוודא באופן ויזואלי ומילולי שאיש אינו נוגע במטופל או במיטה, ולהרחיק מקור חמצן זורם מהחזה כדי למנוע התלקחות. ההתרעה נעשית בקול רם וברור. אין להמשיך עיסויים בזמן ההלם עצמו, אך יש לחדשם מיד לאחריו ללא בדיקת דופק — כדי לצמצם את ההפסקה למינימום."],["החייאה","מדוע מחדשים עיסויים מיד לאחר הלם ללא בדיקת דופק?",["כדי למנוע חזרה של פרפור החדרים","לא ניתן למשש דופק מיד לאחר מתן ההלם","כדי לחסוך זמן ולקצר את ההחייאה","גם אם הקצב חזר, השריר המום ואינו מייצר תפוקה מיידית"],3,"גם כאשר הדפיברילציה מצליחה, שריר הלב עובר תקופה קצרה של המימות ואינו מייצר תפוקה מספקת מיידית. בדיקת דופק בשלב זה תהיה שלילית ותבזבז זמן יקר. לכן מחדשים עיסויים מיד למשך שתי דקות ורק אז בודקים קצב מחדש. אם חזר מחזור ספונטני, העיסויים לא יזיקו באופן משמעותי."],["החייאה","מהי המשמעות של החייאה בהיפותרמיה קשה?",["אין לבצע החייאה בהיפותרמיה קשה כלל","יש להמשיך החייאה וחימום — אינו מת עד שהוא חם ומת","יש לבצע החייאה קצרה בלבד ואז לקבוע מוות","יש להפסיק את ההחייאה מוקדם מהרגיל"],1,"היפותרמיה מפחיתה דרמטית את הצריכה המטבולית של המוח ומגנה עליו, ולכן דווח על החלמות מלאות לאחר החייאות ממושכות מאוד. הכלל הוא שאין לקבוע מוות בהיפותרמי לפני שחומם — Not dead until warm and dead. יש להמשיך החייאה תוך כדי חימום ולפנות למרכז עם יכולת חימום חוץ-גופי."],["החייאה","כיצד בודקים דופק בתינוק?",["בעורק הפמורלי במפשעה בלבד","בעורק הקרוטידי בצד הצוואר","בעורק הברכיאלי בפנים הזרוע","בעורק הרדיאלי בשורש כף היד"],2,"בתינוק עד גיל שנה בודקים דופק בעורק הברכיאלי בפנים הזרוע, מפני שצווארו הקצר והשמנמן מקשה על מישוש קרוטידי אמין. בילדים מעל גיל שנה ובמבוגרים בודקים בקרוטיד. בכל הגילאים בדיקת הדופק אינה נמשכת יותר מ-10 שניות, ובספק — מתחילים החייאה."],["החייאה","מהו הסף לתחילת עיסויים בתינוק לפי הדופק?",["דופק מתחת ל-100 לדקה בכל מצב","דופק מתחת ל-60 לדקה עם סימני פרפוזיה ירודה","רק בהיעדר מוחלט של דופק מרכזי","דופק מתחת ל-40 לדקה עם אובדן הכרה"],1,"בתינוקות ובילדים מתחילים עיסויים כאשר הדופק נמוך מ-60 לדקה ויש סימני פרפוזיה ירודה, גם אם קיים דופק. הסיבה היא שבגילאים אלה תפוקת הלב תלויה כמעט לחלוטין בקצב, וברדיקרדיה משמעותה תפוקה שאינה מספקת. ברדיקרדיה בילד היא כמעט תמיד תוצאה של היפוקסיה, ולכן הטיפול הראשון הוא חמצון ואוורור."],["החייאה","מהי הסיבה השכיחה ביותר לדום לב בילדים?",["הפרעת קצב ראשונית ממקור חדרי","אוטם שריר הלב על רקע מחלה כלילית","כשל נשימתי והיפוקסיה מתקדמת","מום לב מולד שלא אובחן בלידה"],2,"בשונה ממבוגרים, שבהם דום לב נובע לרוב מהפרעת קצב על רקע מחלה כלילית, בילדים המסלול הוא כמעט תמיד היפוקסיה מתקדמת שמובילה לברדיקרדיה ואז לדום לב. המשמעות המעשית: הדגש הוא על אוורור וחמצון ולא על דפיברילציה, ולכן במציל יחיד שלא היה עד לאירוע מבצעים תחילה שתי דקות החייאה לפני הזעקת עזרה."],["החייאה","מהו ההבדל בגישה בין דום לב במבוגר לדום לב בילד עם מציל יחיד?",["במבוגר מבצעים 2 דקות החייאה לפני ההזעקה","אין הבדל — הגישה זהה בשני המקרים","במבוגר מזעיקים עזרה מיד; בילד 2 דקות החייאה תחילה","בילד מזעיקים עזרה מיד ומביאים דפיברילטור"],2,"במבוגר הסיבה השכיחה היא פרפור חדרים, והטיפול המכריע הוא דפיברילציה — ולכן מזעיקים עזרה ומביאים דפיברילטור מיד. בילד הסיבה היא היפוקסיה, והטיפול המכריע הוא אוורור — ולכן מציל יחיד שלא היה עד לאירוע מבצע תחילה כשתי דקות החייאה ורק אז עוזב להזעיק עזרה."],["החייאה","מהי המשמעות של הנחיות מקדימות או הוראת אל-החייאה בשטח?",["יש לכבד מסמך תקף וברור, ובספק — להתחיל החייאה","נדרש אישור בעל פה של בני המשפחה בלבד","ניתן להתעלם מהן ולהתחיל החייאה תמיד","יש להפסיק כל טיפול לרבות תמיכה נשימתית"],0,"מסמך תקף וברור של הוראת אל-החייאה יש לכבד. עם זאת, כאשר המסמך אינו זמין, אינו ברור או קיים ספק לגבי תוקפו — הכלל הוא להתחיל החייאה, מפני שניתן להפסיק בהמשך אך לא ניתן להחזיר זמן שאבד. בקשת בני משפחה לבדה, ללא מסמך תקף, אינה מהווה בסיס להימנעות מהחייאה."],["החייאה","מהו תפקידו של סד גב או משטח קשיח בהחייאה?",["אין לו תפקיד ממשי והוא מעכב את ההחייאה","הוא מונע הקאה ושאיפת תוכן קיבה בזמן ההנשמה","הוא מונע שקיעה במזרן ומבטיח עומק עיסוי אפקטיבי","הוא נדרש לקיבוע עמוד השדרה בזמן ההחייאה"],2,"כאשר המטופל שוכב על משטח רך, חלק מכוח העיסוי מתבזבז על שקיעת הגוף במזרן והעומק האפקטיבי קטן משמעותית. משטח קשיח מתחת לגב פותר זאת. חשוב שהנחתו לא תגרום להפסקה ממושכת בעיסויים — אם היא מסובכת, עדיף להעביר את המטופל לרצפה או לוותר ולהעמיק את העיסוי."],["החייאה","מהי הסכנה בניפוח קיבה במהלך הנשמות?",["דחיפת הסרעפת מעלה, הקאה ושאיפת תוכן קיבה","אין סכנה ממשית בניפוח קל של הקיבה","עלייה בלחץ הדם ובעומס על שריר הלב","ירידה בקצב הלב בשל גירוי עצב הוואגוס"],0,"אוויר שנכנס לקיבה מנפח אותה, דוחף את הסרעפת כלפי מעלה ומקטין את נפח הריאות, וכן מגביר משמעותית את הסיכון להקאה ולשאיפת תוכן קיבה — סיבוך קטלני. הדרך למנוע היא הנשמה איטית בנפח מתון ובלחץ נמוך, ופתיחת נתיב אוויר תקינה כדי שהאוויר ילך לריאות ולא לוושט."],["החייאה","מהו הטיפול הראשון בחנק מלא במבוגר בהכרה?",["מתן מים לשתייה לשטיפת הגוף הזר","חבטות בין השכמות ולחיצות בטן לסירוגין","התחלת עיסויי חזה מיידית בעמידה","הנשמה מפה לפה לדחיפת הגוף הזר פנימה"],1,"בחסימה מלאה של נתיב האוויר במבוגר בהכרה מבצעים לסירוגין חמש חבטות בין השכמות וחמש לחיצות בטן, עד לפינוי הגוף הזר או לאיבוד הכרה. בהיריון מתקדם ובהשמנת יתר קיצונית מבצעים לחיצות חזה במקום לחיצות בטן. אם המטופל מאבד הכרה — משכיבים ומתחילים החייאה, ובכל פתיחת נתיב אוויר בודקים אם הגוף הזר נראה."],["החייאה","מה עושים כאשר מטופל בחנק מאבד הכרה?",["ממתינים להגעת עזרה מקצועית עם ציוד","מנסים לשלוף את הגוף הזר בעיוורון מהלוע","ממשיכים בלחיצות בטן בתנוחת שכיבה","מתחילים החייאה — העיסויים עשויים לפלוט את החסימה"],3,"כאשר המטופל מאבד הכרה משכיבים אותו ומתחילים החייאה. העיסויים מייצרים לחץ תוך-חזי דומה ללחיצות בטן ועשויים לפלוט את החסימה. בכל פתיחת נתיב אוויר לצורך הנשמה מסתכלים לתוך הפה ומוציאים גוף זר אם הוא נראה. שליפה בעיוורון אסורה — היא עלולה לדחוף את החסימה עמוק יותר."],["החייאה","מהי הסיבה לכך שהחייאה בשטח פחות יעילה מהחייאה במעבדה?",["הציוד בשטח נחות מזה שבסימולציה","אין הבדל ממשי בין השטח לסביבת אימון","הפסקות, עומק לא מספיק, קצב שגוי והיפרוונטילציה","המטופלים בשטח מבוגרים וחולים יותר"],2,"מחקרי שטח מראים בעקביות ארבעה כשלים חוזרים: הפסקות ארוכות ותכופות מדי, עומק עיסוי לא מספיק, קצב מהיר או איטי מדי, והיפרוונטילציה. כל אחד מהם מפחית באופן מוכח את ההישרדות. לכן ההנחיות העדכניות מדגישות משוב בזמן אמת, החלפת מעסה כל שתי דקות וניטור ETCO2 כמדד לאיכות."],["נשימתי","מהו ההבדל בין מצוקה נשימתית לכשל נשימתי?",["במצוקה הגוף מפצה; בכשל מופיעות היפוקסיה והיפרקפניה","אין הבדל מהותי בין שני המצבים","מצוקה נשימתית חמורה יותר מכשל נשימתי","כשל נשימתי מתרחש בילדים ובתינוקות בלבד"],0,"במצוקה נשימתית המטופל עובד קשה — טכיפנאה, שימוש בשרירי עזר, נחיריים מתרחבים — אך מצליח לשמור על חמצון סביר. בכשל נשימתי הפיצוי מותש: מופיעים היפוקסיה, אגירת CO2, ירידה בהכרה, ולעיתים דווקא האטה בקצב הנשימה. ההאטה בקצב הנשימה בחולה שהיה טכיפנואי היא סימן מבשר רע ולא סימן שיפור."],["נשימתי","מהם הסימנים למצוקה נשימתית קשה?",["שרירי עזר, אי יכולת להשלים משפט ותנוחת חצובה","סטורציה 98 אחוז באוויר חדר ללא מאמץ","דיבור שוטף ורגוע עם משפטים שלמים","קצב נשימה 16 עם נשימה סדירה ועמוקה"],0,"הסימנים הקליניים למצוקה קשה כוללים שימוש בשרירי עזר בצוואר ובבין-הצלעות, אי יכולת להשלים משפט במשפט אחד, ישיבה בתנוחת חצובה, נחיריים מתרחבים, הזעה, אי שקט וכחלון מרכזי. חשוב לזכור שכחלון הוא סימן מאוחר, ושהיכולת לדבר במשפטים שלמים היא כלי הערכה מהיר ומצוין."],["נשימתי","מהו המנגנון של אסטמה?",["קרע ברקמת הריאה עם דלף אוויר לצדר","חסימה של עורק ריאתי מקריש שנדד","הצטברות נוזל באלוואולות מלחץ הידרוסטטי","ברונכוספזם, בצקת רירית והפרשת ריר בדרכי אוויר קטנות"],3,"באסטמה שלושה מנגנונים פועלים יחד: ברונכוספזם — התכווצות השריר החלק, בצקת של רירית הסימפונות, והפרשת ריר סמיך. התוצאה היא היצרות של דרכי האוויר הקטנות, בעיקר בנשיפה, ומכאן הצפצופים והנשיפה המוארכת. חשוב לדעת שמרחיבי סימפונות פועלים רק על המרכיב הראשון, ולכן נדרשים גם סטרואידים."],["נשימתי","מהו הסימן המדאיג ביותר בהתקף אסטמה קשה?",["צפצופים חזקים הנשמעים גם ללא סטטוסקופ","נשיפה מוארכת עם שימוש בשרירי בטן","שיעול יבש ומתמשך המחמיר בלילה","חזה שקט — היעדר צפצופים עם מצוקה נמשכת"],3,"צפצופים נוצרים מזרימת אוויר דרך דרכי אוויר מוצרות — ולכן היעלמותם במטופל שממשיך להיות במצוקה קשה מעידה על כך שכמעט אין זרימת אוויר כלל. זהו סימן לחסימה כמעט מוחלטת ולכשל נשימתי מתקרב, ולא לשיפור. שילוב של חזה שקט, ירידה בהכרה ועייפות מחייב התערבות מיידית ופינוי דחוף."],["נשימתי","מהו הטיפול הראשוני בהתקף אסטמה?",["משככי כאבים להקלה על עבודת הנשימה","מתן נוזלים בכמות גדולה לדילול ההפרשות","אנטיביוטיקה רחבת טווח למניעת זיהום","חמצן ומרחיבי סימפונות באינהלציה — סלבוטמול"],3,"הטיפול הראשוני הוא חמצן לפי הצורך ומרחיב סימפונות מסוג בטא-2 אגוניסט — סלבוטמול — באינהלציה. בהתקף בינוני עד קשה מוסיפים איפרטרופיום ברומיד וסטרואידים סיסטמיים. בהתקף מסכן חיים שוקלים אדרנלין. אנטיביוטיקה אינה חלק מהטיפול בהתקף אלא אם יש זיהום, ומתן נוזלים אינו הטיפול העיקרי."],["נשימתי","מהו COPD ומהם שני המרכיבים העיקריים שלו?",["דלקת ריאות חוזרת ואסטמה כרונית","תסחיף ריאתי חוזר ובצקת ריאות","ברונכיטיס כרונית ואמפיזמה","חזה אוויר חוזר ותמט ריאתי כרוני"],2,"COPD — מחלת ריאות חסימתית כרונית — מורכבת מברונכיטיס כרונית, המאופיינת בשיעול ובכיח מתמשכים ובדלקת של דרכי האוויר, ומאמפיזמה, שבה נהרסות דפנות האלוואולות ואובד שטח הפנים לחילוף גזים. הגורם העיקרי הוא עישון, והתהליך בלתי הפיך ברובו — בשונה מאסטמה."],["נשימתי","מהו החשש במתן חמצן בריכוז גבוה לחולה COPD?",["גרימת חזה אוויר בלחץ בשל בולות קיימות","ירידה חדה בלחץ הדם ובתפוקת הלב","דיכוי הדחף הנשימתי ואי התאמת אוורור-פרפוזיה","סכנת התלקחות והתפוצצות בסביבת המטופל"],2,"בחלק מחולי ה-COPD הכרוניים הדחף הנשימתי מגיב לחוסר חמצן ולא לרמת CO2, וחמצן בריכוז גבוה עלול לדכאו. מנגנון נוסף ומשמעותי יותר הוא שיבוש התאמת האוורור לפרפוזיה. עם זאת — ההנחיה המעשית ברורה: אין למנוע חמצן ממטופל היפוקסי. שואפים לסטורציה של 88 עד 92 אחוז ומנטרים בקפידה."],["נשימתי","מהו טווח הסטורציה המומלץ בחולה COPD?",["100 אחוז","94 עד 98 אחוז","80 עד 85 אחוז","88 עד 92 אחוז"],3,"בחולה COPD ידוע שואפים לטווח 88 עד 92 אחוז — מספיק כדי למנוע נזק היפוקסי אך לא גבוה מדי כך שיגרום לאגירת CO2. באוכלוסייה הכללית היעד הוא 94 עד 98 אחוז. אם המטופל במצוקה קשה או בהלם, נותנים חמצן בזרימה גבוהה ומטפלים בהיפוקסיה — היא הסכנה המיידית."],["נשימתי","מהם הסימנים לדלקת ריאות?",["צפצופים דו-צדדיים מפושטים ללא חום","קוצר נשימה פתאומי וחד ללא חום או שיעול","חום, שיעול פרודוקטיבי, כאב פלאוריטי וקרפיטציות מוקדיות","נשימה איטית ורדודה עם ירידה בהכרה"],2,"דלקת ריאות מתבטאת בחום, בצמרמורות, בשיעול עם כיח, בכאב פלאוריטי שמחמיר בנשימה עמוקה, ובקרפיטציות מוקדיות בהאזנה מעל האזור הפגוע. בקשישים ההצגה עשויה להיות לא טיפוסית — בלבול, נפילה או חולשה ללא חום. צפצופים מפושטים אופייניים לאסטמה, וקוצר נשימה פתאומי לתסחיף או לחזה אוויר."],["נשימתי","מהו חזה אוויר ספונטני ובמי הוא שכיח?",["חזה אוויר המופיע רק לאחר חבלה קהה","חזה אוויר המופיע בקשישים עם מחלת לב","קרע ספונטני של בולה — שכיח בצעירים גבוהים ורזים","חזה אוויר האופייני לילדים ולתינוקות"],2,"חזה אוויר ספונטני ראשוני מתרחש ללא טראומה, לרוב בקרע של בולה תת-פלאורלית. הוא שכיח בגברים צעירים, גבוהים ורזים ובמעשנים. הביטוי הוא כאב חד פתאומי בחזה וקוצר נשימה. חזה אוויר ספונטני שניוני מתרחש על רקע מחלת ריאות קיימת כמו COPD, והוא מסוכן יותר בשל הרזרבה הנשימתית המוגבלת."],["נשימתי","מהי היפרוונטילציה מסיבה חרדתית וכיצד מטפלים בה?",["נשימה איטית ורדודה — מתן חמצן וניטור","נשימה רועשת עם חרחורים — ביצוע סקשן","הפסקת נשימה מוחלטת — הנשמה במפוח","נשימה מהירה ועמוקה עם נימול — הרגעה והנחיה"],3,"בהיפרוונטילציה נשטף CO2 ונוצרת אלקלוזה נשימתית, שגורמת לנימול סביב הפה ובאצבעות, לסחרחורת ולעיתים לעווית בכפות הידיים. הטיפול הוא הרגעה והנחיה לנשימה איטית ומבוקרת. חשוב מאוד: היפרוונטילציה היא אבחנה שבשלילה — יש לשלול תחילה סיבות אורגניות כמו תסחיף ריאתי, חמצת מטבולית או אוטם. אין להשתמש בשקית ניילון."],["נשימתי","מהו סטרידור ומה משמעותו?",["צליל גבוה בשאיפה — חסימה בדרכי אוויר עליונות","צליל פצפוץ בשאיפה — נוזל בתוך האלוואולות","צליל שריקה בנשיפה — חסימה בדרכי אוויר תחתונות","היעדר מוחלט של קולות נשימה בהאזנה"],0,"סטרידור הוא צליל גבוה וצורמני שנשמע בעיקר בשאיפה ומעיד על היצרות בדרכי האוויר העליונות — גרון, קנה או מיתרי קול. הסיבות כוללות גוף זר, בצקת אלרגית, אפיגלוטיטיס, קרופ וכוויות נשימתיות. זהו סימן חירום שמחייב הערכה מיידית של נתיב האוויר. צפצופים בנשיפה מעידים על דרכי אוויר תחתונות."],["נשימתי","מהו הטיפול בחשד לאנפילקסיס עם מצוקה נשימתית?",["אנטיהיסטמין דרך הווריד כטיפול ראשון","אינהלציה במרחיב סימפונות בלבד","סטרואידים במינון גבוה כטיפול ראשון","אדרנלין תוך שרירי מיידי, חמצן, נוזלים ומרחיבים"],3,"אדרנלין תוך שרירי בירך החיצונית הוא הטיפול המציל וניתן מיידית — הוא מכווץ כלי דם, מרחיב סימפונות ומייצב תאי פיטום. בנוסף חמצן, נוזלים בשל הוזודילטציה, ומרחיבי סימפונות לפי הצורך. אנטיהיסטמינים וסטרואידים הם טיפול משני ומאוחר. עיכוב במתן אדרנלין הוא הגורם המרכזי לתמותה מאנפילקסיס."],["נשימתי","מהם הסימנים לחסימת נתיב אוויר חלקית?",["כחלון מיידי בשפתיים ובקצות האצבעות","היעדר תנועה של בית החזה בשאיפה","שיעול חזק, קול צרוד וסטרידור — יש תנועת אוויר","היעדר מוחלט של קול ושל שיעול"],2,"בחסימה חלקית המטופל מצליח להזיז אוויר: הוא משתעל בכוח, מדבר או משמיע קול, ולעיתים נשמע סטרידור. הטיפול הוא לעודד שיעול ולא להתערב — התערבות עלולה להפוך חסימה חלקית למלאה. בחסימה מלאה אין קול, אין שיעול יעיל ואין תנועת אוויר, והמטופל אוחז בגרונו — אז מתערבים מיידית."],["נשימתי","מהו ההבדל בין קרפיטציות לצפצופים?",["צפצופים נשמעים בשאיפה וקרפיטציות בנשיפה","קרפיטציות — פצפוץ מנוזל; צפצופים — שריקה מהיצרות","שני המונחים מתארים את אותו קול נשימה","קרפיטציות נשמעות בילדים וצפצופים במבוגרים"],1,"קרפיטציות הן קולות פצפוץ עדינים שנשמעים בעיקר בסוף השאיפה, ונובעות מפתיחת אלוואולות שהיו סגורות בשל נוזל — אופייניות לבצקת ריאות ולדלקת ריאות. צפצופים הם קולות מוזיקליים ממושכים שנשמעים בעיקר בנשיפה ונובעים מהיצרות של דרכי האוויר — אופייניים לאסטמה ול-COPD. ההבחנה מכוונת ישירות לטיפול שונה."],["נשימתי","מהי הסיבה השכיחה לחסימת נתיב אוויר במטופל ללא הכרה?",["הצטברות הפרשות וריר בלוע האחורי","גוף זר שנשאף אל דרכי האוויר","צניחת הלשון לאחור עקב אובדן טונוס","בצקת של רקמות הגרון ומיתרי הקול"],2,"אובדן טונוס השרירים גורם ללשון לצנוח לאחור ולחסום את הלוע — הסיבה השכיחה ביותר בכל מטופל ללא הכרה. הפתרון הוא פשוט ומיידי: תמרון פתיחת נתיב אוויר, ובטראומה — Jaw Thrust. לאחר מכן מנתב אוויר. גוף זר, בצקת והפרשות אפשריים אך שכיחים פחות."],["נשימתי","מהו התפקיד של סורפקטנט בריאות?",["קשירת חמצן והובלתו ברקמת הריאה","הפחתת מתח פנים באלוואולות ומניעת קריסתן","סינון וחימום של האוויר הנשאף","הפרשת ריר להגנה על דרכי האוויר"],1,"סורפקטנט הוא חומר שומני שמופרש מתאי סוג 2 באלוואולות ומפחית את מתח הפנים של שכבת הנוזל. בכך הוא מונע את קריסת האלוואולות בסוף הנשיפה ומקל על התפשטותן. חסר בסורפקטנט הוא הגורם לתסמונת המצוקה הנשימתית ביילוד פג, ולכן ניתנים סטרואידים לאם לפני לידה מוקדמת."],["נשימתי","מטופל עם קוצר נשימה פתאומי, כאב חד בחזה משמאל, כניסת אוויר מופחתת משמאל. מה החשד?",["התקף חרדה","חזה אוויר","בצקת ריאות","דלקת ריאות"],1,"קוצר נשימה פתאומי עם כאב חד וחד-צדדי, יחד עם ירידה בכניסת האוויר באותו צד, הם התמונה האופיינית לחזה אוויר. בניקוש נשמע היפר-רזוננס. דלקת ריאות מתפתחת בהדרגה עם חום, בצקת ריאות היא דו-צדדית עם קרפיטציות, והתקף חרדה אינו גורם לירידה חד-צדדית בכניסת אוויר — ואינו אבחנה לפני שלילת סיבות אורגניות."],["נשימתי","מהי המשמעות של נשימת קוסמאול?",["נשימה לא סדירה — פגיעת גזע המוח","נשימה עמוקה ומהירה — פיצוי על חמצת מטבולית","נשימה מתגברת ודועכת — אי ספיקת לב","נשימה איטית ורדודה — דיכוי נשימתי"],1,"נשימת קוסמאול היא נשימה עמוקה, מהירה וסדירה שנועדה לשטוף CO2 ולפצות על חמצת מטבולית קשה — קלאסית בקטואצידוזיס סוכרתי. היא סימן לחומרה ולא לבעיה נשימתית ראשונית. נשימת צ׳יין-סטוקס היא זו שמתגברת ודועכת עם הפסקות, ונשימת ביוט לא סדירה לחלוטין — שתיהן מעידות על פגיעה מוחית."],["נשימתי","מהו הטיפול בגוף זר בנתיב האוויר של תינוק?",["תמרון הימליך בעמידה או בישיבה","חמש חבטות גב וחמש לחיצות חזה לסירוגין","חמש לחיצות בטן בתנוחת שכיבה","שליפת הגוף הזר בעיוורון מהלוע"],1,"בתינוק עד גיל שנה אין מבצעים לחיצות בטן בשל הסיכון לפגיעה בכבד ובאיברים פנימיים. במקום זאת מניחים את התינוק על האמה כשראשו נמוך מגופו, מבצעים חמש חבטות בין השכמות, מהפכים ומבצעים חמש לחיצות חזה — וחוזרים לסירוגין. שליפה בעיוורון אסורה בכל גיל."],["נשימתי","מהי המשמעות של כחלון מרכזי?",["גוון כחלחל בשפתיים ובלשון — היפוקסמיה משמעותית","אודם וסומק בפנים ובחלק העליון של החזה","חיוורון כללי של העור והריריות","חיוורון וקור בקצות האצבעות והבהונות"],0,"כחלון מרכזי — בשפתיים, בלשון ובריריות — מעיד על ריווי חמצן נמוך בדם העורקי והוא סימן מאוחר ומדאיג. כחלון היקפי בקצות האצבעות עשוי לנבוע גם מקור או מפרפוזיה ירודה מקומית וללא היפוקסמיה. חשוב לדעת שבאנמיה קשה כחלון עלול שלא להופיע כלל למרות היפוקסיה משמעותית, מפני שנדרש המוגלובין לא רווי בכמות מספקת."],["נשימתי","מהי הפעולה הראשונה במטופל עם קוצר נשימה?",["החדרת עירוי והתחלת מתן נוזלים","הערכת נתיב אוויר, חמצן לפי הצורך והושבה נוחה","מדידת לחץ דם וסטורציה בשתי ידיים","מתן משככי כאבים להקלה על הנשימה"],1,"הסדר הוא תמיד ABC: ודא שנתיב האוויר פתוח, הערך את הנשימה, ספק חמצן לפי הצורך והושב את המטופל בתנוחה שמקלה עליו — לרוב ישיבה זקופה או חצובה. רק לאחר מכן ממשיכים למדדים, לאנמנזה ולטיפול הספציפי. השכבת מטופל עם קוצר נשימה היא שגיאה שמחמירה את מצבו מיידית."],["נשימתי","מהו בצקת ריאות קרדיוגנית לעומת לא קרדיוגנית?",["בצקת ריאות לא קרדיוגנית אינה קיימת בפועל","קרדיוגנית מתרחשת בצעירים ולא קרדיוגנית בקשישים","קרדיוגנית — כשל לב שמאלי; לא קרדיוגנית — עליית חדירות","שני המצבים זהים במנגנון ובטיפול"],2,"בבצקת קרדיוגנית הלחץ ההידרוסטטי בנימי הריאה עולה בשל כשל החדר השמאלי, והנוזל נדחף החוצה. בבצקת לא קרדיוגנית — למשל ב-ARDS, בטביעה, בשאיפת גזים או בספסיס — הלחץ תקין אך דופן הנימים ניזוקה וחדירותה עולה. ההבחנה משפיעה על הטיפול: משתנים וניטרטים יעילים בקרדיוגנית ולא בשנייה."],["נשימתי","מהו הסימן המוקדם ביותר להיפוקסיה?",["כחלון מרכזי בשפתיים ובלשון","דום נשימה עם אובדן הכרה מלא","אי שקט, חרדה ובלבול","ברדיקרדיה עם ירידה בלחץ הדם"],2,"המוח הוא האיבר הרגיש ביותר לחוסר חמצן, ולכן הביטוי המוקדם ביותר הוא שינוי במצב הנפשי — אי שקט, חרדה, בלבול ולעיתים תוקפנות. כחלון הוא סימן מאוחר, וברדיקרדיה מבשרת דום לב מתקרב. הכלל המנחה הוא שמטופל חסר מנוחה או תוקפני הוא היפוקסי עד שיוכח אחרת — ואין להרגיעו בתרופות לפני תיקון החמצון."],["נשימתי","מהו הטיפול בטביעה?",["ביצוע לחיצות בטן להוצאת המים מהקיבה","ניקוז המים מהריאות לפני כל פעולה","חילוץ בטוח, נתיב אוויר, חמצון והנשמות עם דגש על אוורור","חימום הנפגע בלבד עד להגעה לבית החולים"],2,"בטביעה הבעיה היא היפוקסיה, ולכן ההחייאה מתחילה בהנשמות ומדגישה אוורור — בשונה מהחייאה סטנדרטית. אין לנסות לנקז מים מהריאות: הכמות שנשאפת קטנה והניסיון מעכב טיפול וגורם להקאה. יש לחשוד בטראומה צווארית, במיוחד במים רדודים, ולחמם את הנפגע."],["נשימתי","מדוע טביעה במים קרים עשויה להיות בעלת פרוגנוזה טובה יותר?",["המים הקרים שוטפים את דרכי הנשימה","הקור גורם לעווית גרון שמונעת שאיפת מים","אין הבדל בפרוגנוזה בין מים קרים לחמים","היפותרמיה מהירה מפחיתה צריכה מטבולית ומגנה על המוח"],3,"קירור מהיר מפחית משמעותית את קצב המטבוליזם המוחי ואת צריכת החמצן, וכך מגן על המוח מפני נזק היפוקסי. תוארו החלמות מלאות לאחר טביעות ממושכות במים קרים, במיוחד בילדים. לכן ההנחיה היא להתחיל החייאה ולהמשיכה גם לאחר זמן ממושך, ולא לקבוע מוות לפני חימום."],["נשימתי","מהי המשמעות של סטורציה 100 אחוז במטופל שנשם עשן?",["המטופל מחומצן היטב ואינו זקוק לחמצן","אין צורך במתן חמצן כאשר הסטורציה מלאה","הערך מעיד שהמטופל אינו במצוקה נשימתית","הערך מטעה בשל קרבוקסיהמוגלובין — נדרש חמצן 100 אחוז"],3,"מד סטורציה רגיל אינו מבחין בין אוקסיהמוגלובין לקרבוקסיהמוגלובין, ולכן בהרעלת פחמן חד-חמצני הוא מציג ערך גבוה ומטעה למרות שהדם אינו נושא חמצן. לכן בכל חשד לחשיפה לעשן נותנים חמצן 100 אחוז ללא קשר לקריאה, ומסתמכים על ההיסטוריה ועל התמונה הקלינית. קיים גם מד ייעודי שמודד CO."],["נשימתי","מהי תסמונת ההיפרוונטילציה בהריון ומדוע היא נורמלית?",["התופעה אינה נורמלית ומחייבת בירור","פרוגסטרון מגביר את הדחף הנשימתי ונוצרת אלקלוזה קלה","קצב הלב המואץ גורר האצה בקצב הנשימה","הרחם המוגדל לוחץ על הריאות ומאיץ נשימה"],1,"בהיריון הפרוגסטרון מגביר את רגישות מרכז הנשימה ל-CO2, והאישה מנשימה יותר — בעיקר בהעמקת הנשימות. התוצאה היא רמת CO2 נמוכה יותר מהרגיל ואלקלוזה נשימתית קלה שהיא נורמלית. משמעות מעשית: ערך CO2 שנחשב תקין באישה לא הרה עשוי להעיד על אצירה ועל כשל נשימתי מתפתח באישה בהיריון."],["הכרתי","מהם הגורמים לירידה במצב הכרה לפי ראשי התיבות AEIOU-TIPS?",["סיבות טראומטיות ומכניות בלבד","סיבות זיהומיות וספטיות בלבד","אלכוהול, אפילפסיה, אינסולין, אורמיה, רעלים, טראומה, זיהום ושבץ","סיבות מטבוליות ואנדוקריניות בלבד"],2,"AEIOU-TIPS הוא כלי זיכרון שיטתי לסיבות לשינוי במצב הכרה: Alcohol, Epilepsy, Insulin — היפו או היפרגליקמיה, Overdose, Uremia, Trauma, Infection, Psychiatric ו-Stroke. השימוש בו מונע התמקדות מוקדמת בסיבה אחת ומבטיח שלא יפוספסו סיבות הפיכות מהירות כמו היפוגליקמיה או הרעלת אופיאטים."],["הכרתי","מהם הסימנים להיפוגליקמיה?",["הזעה, רעד, בלבול, חולשה ותוקפנות","מתן שתן מרובה עם צמא בלתי נשלט","נשימה עמוקה ומהירה עם התייבשות","עור יבש וחם עם ריח אצטון בנשימה"],0,"בהיפוגליקמיה מופעלת המערכת הסימפתטית: הזעה קרה, רעד, טכיקרדיה, חיוורון ורעב, ובמקביל מופיעים סימנים נוירוגליקופניים — בלבול, התנהגות חריגה, תוקפנות, פרכוסים ואובדן הכרה. עור יבש וחם ונשימת אצטון אופייניים לקטואצידוזיס. ההידרדרות בהיפוגליקמיה מהירה, ולכן זו הסיבה הראשונה שיש לשלול."],["הכרתי","מהו הטיפול בהיפוגליקמיה במטופל בהכרה?",["מתן סוכר דרך הפה — משקה ממותק או ג׳ל","מתן גלוקוז בעירוי תוך ורידי מיידי","הימנעות ממתן דבר עד להערכה בבית החולים","מתן אינסולין לאיזון רמת הסוכר בדם"],0,"במטופל בהכרה מלאה עם רפלקס בליעה שמור, הטיפול הפשוט והבטוח הוא מתן סוכר דרך הפה — משקה ממותק, ג׳ל גלוקוז או ממתק. במטופל עם ירידה בהכרה או ללא רפלקס בליעה אין להאכיל בשל סכנת שאיפה, ונותנים גלוקוז בעירוי או גלוקגון תוך שרירי. מתן אינסולין יחמיר את המצב באופן מסכן חיים."],["הכרתי","מהם הסימנים לקטואצידוזיס סוכרתי (DKA)?",["עלייה מהירה במשקל עם בצקות בגפיים","נשימת קוסמאול, ריח אצטון, התייבשות וכאב בטן","ברדיקרדיה עם עור חם ויבש למגע","הזעה קרה, רעד ועור לח עם חיוורון"],1,"ב-DKA חסר האינסולין גורם לפירוק שומנים וליצירת גופי קטון, ומכאן החמצת המטבולית וריח האצטון בנשימה. הגוף מפצה בנשימת קוסמאול עמוקה ומהירה. במקביל הסוכר הגבוה גורם למתן שתן מרובה, להתייבשות קשה, לצמא, לבחילות ולכאב בטן. ההתפתחות היא על פני שעות עד ימים ולא בדקות כמו בהיפוגליקמיה."],["הכרתי","מהי הפעולה הראשונה במטופל עם ירידה בהכרה ללא סיבה ברורה?",["הערכת ABC ובדיקת רמת הסוכר בדם","ביצוע בדיקה נוירולוגית מלאה ומתועדת","העברה מהירה לאמבולנס והתחלת פינוי","מתן תרופות הרגעה לייצוב המטופל"],0,"לאחר הבטחת נתיב אוויר, נשימה ומחזור, בדיקת סוכר היא הבדיקה הראשונה — היא מהירה, זמינה, ומזהה סיבה הפיכה שהטיפול בה מיידי ומציל. בהמשך מעריכים אישונים, GCS, סימני טראומה, סימני הרעלה ואנמנזה סביבתית. מתן תרופות הרגעה במטופל עם הכרה ירודה מסוכן, ובדיקה נוירולוגית מלאה אינה קודמת ל-ABC."],["הכרתי","מהו ההבדל בין שבץ איסכמי לשבץ דימומי?",["שני הסוגים זהים במנגנון ובגישה הטיפולית","איסכמי נגרם מדימום ודימומי מקריש חוסם","שבץ דימומי שכיח יותר משבץ איסכמי","איסכמי מחסימת כלי דם ודימומי מקרע של כלי דם"],3,"כ-85 אחוז מהשבצים הם איסכמיים — קריש או תסחיף חוסם עורק מוחי. כ-15 אחוז הם דימומיים — קרע בכלי דם עם דימום לרקמת המוח או לחלל התת-עכבישי. ההבחנה קריטית מפני שהטיפול הפוך לחלוטין: בשבץ איסכמי ניתן טיפול ממס קריש, ובדימומי טיפול כזה יהיה קטלני. לכן CT דחוף הוא הצעד המכריע."],["הכרתי","מהי שיטת FAST לזיהוי שבץ?",["Fast, Alert, Stable, Treated","Face, Arms, Speech, Time","Focus, Assess, Send, Transport","Fever, Ache, Sweat, Tremor"],1,"FAST בודקת שלושה סימנים ומדגישה את הזמן: Face — צניחה של צד אחד בפנים, Arms — חולשה או צניחה של זרוע אחת בהרמה, Speech — דיבור משובש או קושי בהבנה, ו-Time — תיעוד מדויק של זמן תחילת התסמינים. הזמן הוא הפרמטר שקובע את זכאות המטופל לטיפול ממס קריש, ולכן הוא המידע החשוב ביותר שהצוות מעביר."],["הכרתי","מדוע זמן תחילת התסמינים בשבץ הוא קריטי?",["הוא קובע זכאות לטיפול ממס קריש או לצנתור","עיתוי התסמינים אינו משנה את הטיפול","הוא משפיע על חישוב מינון התרופות בלבד","לצורך תיעוד רפואי והשלמת דוח הטיפול"],0,"חלון הזמן לטיפול תרומבוליטי מוגבל לשעות ספורות מתחילת התסמינים, ולצנתור מוחי החלון ארוך יותר אך עדיין מוגבל. לכן זמן תחילת התסמינים — או הזמן האחרון שבו המטופל נראה תקין — הוא המידע הקריטי ביותר. אם המטופל התעורר עם התסמינים, נחשב זמן ההתחלה כרגע שבו נראה תקין לאחרונה."],["הכרתי","מהם סוגי הפרכוסים העיקריים?",["פרכוסים מוקדיים בלבד מאזור מוגדר במוח","פרכוסים כלליים בלבד בשתי ההמיספרות","מוקדיים וכלליים, והכלליים כוללים טוני-קלוני","פרכוסי חום בלבד המופיעים בילדים"],2,"פרכוסים מוקדיים מתחילים באזור אחד במוח ועשויים להתבטא בתנועה או בתחושה מקומית, עם או בלי פגיעה בהכרה. פרכוסים כלליים מערבים את שתי ההמיספרות מההתחלה, וכוללים את הסוג הטוני-קלוני הקלאסי ואת פרכוסי ההיעדרות. פרכוס מוקדי שמתפשט ומתפתח לכללי מכונה התכללות שניונית."],["הכרתי","מהו הטיפול במטופל בזמן פרכוס פעיל?",["החזקה חזקה של הגפיים ומניעת תנועה","הכנסת חפץ לפה למניעת נשיכת הלשון","הגנה מפגיעה, פינוי סביבה, חמצן ומעקב","מתן מים או סוכר להרגעת המטופל"],2,"בזמן פרכוס אין לרסן את המטופל — ריסון גורם לשברים ולפגיעות. הפעולה היא הרחקת חפצים מסוכנים, הגנה על הראש, שחרור בגדים לוחצים, ומתן חמצן. אין להכניס דבר לפה — לא ניתן לבלוע את הלשון, וההכנסה גורמת לשברי שיניים, לחסימה ולנשיכה. לאחר הפרכוס משכיבים על הצד ומנטרים."],["הכרתי","מהו סטטוס אפילפטיקוס ומדוע הוא מסוכן?",["פרכוס המופיע בילדים על רקע חום גבוה","היעדר פרכוסים למרות רקע אפילפטי","פרכוס מעל 5 דקות או חוזר ללא התאוששות ביניהם","פרכוס בודד וקצר שחולף מעצמו"],2,"סטטוס אפילפטיקוס מוגדר כפרכוס שנמשך מעל 5 דקות או כסדרת פרכוסים ללא חזרה להכרה מלאה ביניהם. זהו מצב חירום: הפעילות החשמלית המתמשכת גורמת להיפוקסיה, לחמצת, להיפרתרמיה ולנזק נוירונלי בלתי הפיך. הטיפול הוא בנזודיאזפינים ותמיכה נשימתית, ופינוי דחוף."],["הכרתי","מהו המצב הפוסט-איקטלי?",["היעדר מוחלט של תסמינים לאחר האירוע","שלב הפעילות המוטורית הטונית-קלונית עצמו","תקופת בלבול, ישנוניות וכאב ראש לאחר הפרכוס","השלב המקדים שלפני תחילת הפרכוס"],2,"המצב הפוסט-איקטלי הוא תקופת ההתאוששות שלאחר פרכוס כללי, ובה המטופל מבולבל, ישנוני, סובל מכאב ראש וכאבי שרירים, ולעיתים מציג חולשה חולפת בגפה — שיתוק טוד. השלב נמשך דקות עד שעה. חשוב להבדילו מפגיעת ראש או משבץ, ולכן נדרשת הערכה חוזרת ומעקב אחר שיפור הדרגתי."],["הכרתי","מהי המשמעות של אישונים מכווצים דו-צדדית (Pinpoint)?",["הרעלה באמפטמינים ובחומרים סימפתומימטיים","הרעלת אופיאטים או פגיעה בגשר המוח","ממצא תקין בתאורה בהירה ובאור יום","היפוגליקמיה עמוקה עם ירידה בהכרה"],1,"אישונים מכווצים מאוד ודו-צדדיים הם סימן קלאסי להרעלת אופיאטים, במיוחד יחד עם דיכוי נשימתי וירידה בהכרה. סיבה נוספת חשובה היא פגיעה בגשר המוח, למשל מדימום. הרעלות בחומרים סימפתומימטיים כמו אמפטמינים גורמות דווקא לאישונים מורחבים, וכך גם אנטיכולינרגיים."],["הכרתי","מהי תסמונת הגמילה מאלכוהול ומהו הסיכון בה?",["ישנוניות עמוקה עם דיכוי נשימתי","רעד, אי שקט, הזיות ופרכוסים — סיכון לדליריום טרמנס","רגיעה, ישנוניות וירידה בקצב הלב","ירידה בלחץ הדם עם ברדיקרדיה"],1,"גמילה מאלכוהול מתפתחת שעות עד ימים לאחר הפסקת השתייה ומתבטאת ברעד, בהזעה, בטכיקרדיה, בחרדה ובהזיות. הצורה החמורה — דליריום טרמנס — מופיעה לאחר 48 עד 96 שעות וכוללת בלבול קשה, חוסר יציבות אוטונומית ופרכוסים, והתמותה בה משמעותית. הטיפול הוא בנזודיאזפינים, נוזלים ותיאמין."],["הכרתי","מהו ה-Triad של הרעלת אופיאטים?",["חום, פריחה מפושטת ושלשול","יתר לחץ דם, טכיקרדיה והזעה מרובה","דיכוי נשימתי, ירידה בהכרה ואישונים מכווצים","פרכוסים, חום גבוה ורעד שרירי"],2,"שלישיית האופיאטים היא דיכוי נשימתי, ירידה במצב ההכרה ואישונים מכווצים. הדיכוי הנשימתי הוא הגורם למוות, ולכן הטיפול הראשון הוא אוורור וחמצון — עוד לפני נלוקסון. נלוקסון הופך את ההשפעה אך משך פעולתו קצר מזה של רוב האופיאטים, ולכן קיים סיכון לחזרת הדיכוי ונדרש ניטור ממושך."],["הכרתי","מהי הסכנה במתן נלוקסון במינון גבוה למכור לאופיאטים?",["אין סכנה במתן מינון גבוה של נלוקסון","גרימת גמילה חדה עם אי שקט, הקאות ותוקפנות","החמרה של הדיכוי הנשימתי הקיים","ירידה חדה ומסוכנת ברמת הסוכר בדם"],1,"מתן נלוקסון במינון גבוה מדי למכור גורם לגמילה חדה ופתאומית: אי שקט קיצוני, תוקפנות, הקאות עם סיכון לשאיפה, כאבים וסערה אוטונומית. לכן המינון מטיטרים בהדרגה — המטרה היא החזרת נשימה תקינה ולא העמדה מלאה על רגליו. יש לזכור שנלוקסון מתפוגג לפני האופיאט וייתכן חזרת הדיכוי."],["הכרתי","מהי תסמונת כולינרגית וכיצד היא מתבטאת?",["יובש בפה, עצירות ואצירת שתן","הפרשות מרובות, ברדיקרדיה ואישונים מכווצים","עלייה בחום הגוף ובלחץ הדם","עור יבש וחם עם אישונים מורחבים"],1,"תסמונת כולינרגית נגרמת מעיכוב האנזים אצטילכולין-אסטראז, לרוב מזרחנים אורגניים. ראשי התיבות DUMBELS מתארים אותה: שלשול, מתן שתן, מיוזיס, ברדיקרדיה, ברונכוריאה, הקאות, דמעת, ריור והזעה. הגורם למוות הוא כשל נשימתי מהפרשות ומברונכוספזם. הטיפול הוא חיטוי, אטרופין במינון גבוה ו-2-PAM."],["הכרתי","מהם הסימנים לתסמונת אנטיכולינרגית?",["עור אדום ויבש, חום, אישונים מורחבים ובלבול","ברדיקרדיה עם הזעה מרובה וריור","שלשול, בחילות והתכווצויות בטן","הפרשות מרובות עם אישונים מכווצים"],0,"התסמונת האנטיכולינרגית מתוארת בביטוי אדום כסלק, יבש כעצם, חם כתנור, עיוור כעטלף ומטורף כמו כובען: עור אדום ויבש, חום גבוה, אישונים מורחבים, טשטוש ראייה, בלבול והזיות, טכיקרדיה ואצירת שתן. הגורמים כוללים אנטיהיסטמינים, נוגדי דיכאון טריציקליים וצמחים כמו דטורה. היא ההפך הגמור מהתסמונת הכולינרגית."],["הכרתי","מהו הטיפול בחשד להרעלת פרצטמול (אקמול)?",["מתן נלוקסון להיפוך ההשפעה המרכזית","פינוי למתן N-acetylcysteine בחלון הזמן המתאים","מתן פלומזניל להיפוך הדיכוי הנשימתי","מתן אטרופין לטיפול בתסמונת הכולינרגית"],1,"הרעלת פרצטמול היא ערמומית — בשעות הראשונות המטופל עשוי להיות אסימפטומטי לחלוטין או לסבול מבחילה בלבד, בעוד שהנזק הכבדי מתפתח ומתבטא רק לאחר 24 עד 72 שעות. הטיפול הוא N-acetylcysteine, שיעיל במיוחד בשעות הראשונות. לכן העדר תסמינים אינו מרגיע וכל חשד מחייב פינוי והערכת רמות בדם."],["הכרתי","מהי המשמעות של ריח פירותי בנשימה?",["קטואצידוזיס סוכרתי עם גופי קטון בדם","דלקת ריאות עם כיח מוגלתי וחום","הרעלת אלכוהול עם דיכוי מערכת העצבים","הרעלת אופיאטים עם דיכוי נשימתי"],0,"ריח פירותי או ריח דומה למסיר לק בנשימה נובע מאצטון — אחד מגופי הקטון שנוצרים בקטואצידוזיס סוכרתי. הוא מופיע יחד עם נשימת קוסמאול, התייבשות, בחילות וכאב בטן. חשוב לדעת שלא כל האנשים מסוגלים להריח אצטון, ולכן היעדר הריח אינו שולל את האבחנה — בדיקת סוכר היא הכלי המכריע."],["הכרתי","מהו התהליך הראשון שיש לשלול במטופל סוכרתי עם התנהגות חריגה?",["זיהום פעיל עם תגובה דלקתית מערכתית","היפוגליקמיה עם ביטוי נוירוגליקופני","שבץ מוחי איסכמי בהמיספרה הדומיננטית","הרעלה בתרופות או בחומרים אחרים"],1,"היפוגליקמיה היא הסיבה השכיחה, המהירה והמסוכנת ביותר להתנהגות חריגה בסוכרתי, והיא הפיכה לחלוטין תוך דקות עם טיפול פשוט. היא מחקה שיכרות, שבץ ומצב פסיכיאטרי, ולכן פוספסה פעמים רבות. בדיקת סוכר לוקחת שניות ויש לבצעה תמיד. רק לאחר שלילתה עוברים לשקול שבץ, זיהום או הרעלה."],["הכרתי","מהי הגישה למטופל עם ירידה בהכרה שהקיא?",["השארתו בשכיבה על הגב עם ניטור","הטיה על הצד וסקשן — הגנה על נתיב האוויר","מתן מים לשטיפת הפה ולניקוי ההפרשות","הושבה מיידית בזווית של 90 מעלות"],1,"מטופל עם הכרה ירודה שהקיא נמצא בסכנה מיידית לשאיפת תוכן קיבה. הפעולה היא הטיה על הצד — תנוחת התאוששות — יחד עם סקשן לפינוי ההפרשות, ובחשד לפגיעת עמוד שדרה מבצעים Log Roll מתואם. השארה על הגב מסוכנת, הושבה אינה מונעת שאיפה במטופל ללא הכרה, ומתן מים אסור."],["הכרתי","מהו ההבדל בין סינקופה לפרכוס?",["סינקופה נמשכת שעות עם התאוששות איטית","סינקופה — אובדן הכרה קצר; פרכוס — פעילות מוטורית ובלבול","פרכוס אינו מלווה באובדן הכרה כלל","אין הבדל קליני בין שני המצבים"],1,"בסינקופה אובדן ההכרה קצר, ההתאוששות מהירה ומלאה, ולרוב יש סימנים מקדימים כמו סחרחורת וטשטוש ראייה. בפרכוס יש פעילות מוטורית טונית-קלונית, לעיתים נשיכת לשון והרטבה, ולאחריו מצב פוסט-איקטלי של בלבול וישנוניות. חשוב לדעת שסינקופה עלולה להיות מלווה בתנועות עוויתיות קצרות שמבלבלות."],["הכרתי","מהם הסימנים המחשידים לדימום תת-עכבישי (SAH)?",["כאב ראש פתאומי וחזק, נוקשות עורף ורגישות לאור","כאב ראש הדרגתי וקל המחמיר בהתכופפות","חום גבוה עם צמרמורות וכאבי שרירים","חולשה מבודדת בגפה אחת ללא כאב ראש"],0,"התיאור הקלאסי הוא כאב הראש הגרוע ביותר בחיי המטופל, שמופיע בפתאומיות תוך שניות — Thunderclap Headache. מתלווים בחילות והקאות, נוקשות עורף, רגישות לאור ולעיתים ירידה בהכרה. הסיבה השכיחה היא קרע במפרצת מוחית. זהו מצב חירום עם תמותה גבוהה שדורש CT דחוף."],["הכרתי","מהי הסיבה השכיחה לבלבול חדש בקשיש?",["שינה לא מספקת והפרעה במחזור השינה","דמנציה מתקדמת עם הידרדרות הדרגתית","הזדקנות תקינה ללא רקע רפואי חריג","דליריום מסיבה חדה — זיהום, תרופות או הפרעה מטבולית"],3,"בלבול חדש או מחמיר בקשיש הוא דליריום עד שיוכח אחרת, והוא מבטא בעיה רפואית חדה. הסיבות השכיחות הן זיהום — במיוחד בדרכי השתן ובריאות, תרופות ותופעות לוואי, הפרעות אלקטרוליטים, היפוקסיה, כאב, עצירת שתן וגמילה. בשונה מדמנציה, הדליריום מתפתח תוך שעות עד ימים ומאופיין בתנודתיות."],["הכרתי","מהי המשמעות של אנמנזה סביבתית במטופל ללא הכרה?",["חיפוש תרופות, בקבוקים, מזרקים וסימנים בזירה","היא מעכבת את הפינוי ואינה משנה טיפול","אין לה חשיבות בהיעדר עדים לאירוע","היא רלוונטית במטופלים צעירים בלבד"],0,"במטופל שאינו מסוגל לספר, הזירה היא מקור המידע העיקרי. יש לחפש קופסאות תרופות ומרשמים, בקבוקי אלכוהול, מזרקים, פתקים, ריחות חריגים, מקורות חימום שעלולים לגרום להרעלת CO, וסימני טראומה. מידע זה משנה לעיתים לחלוטין את הטיפול, ואיסופו אורך שניות ואינו מעכב פינוי."],["הכרתי","מהי הסיבה לאישונים מורחבים ובלתי מגיבים דו-צדדית?",["היפוקסיה קשה, פגיעה מוחית או סימפתומימטיים","תגובה פיזיולוגית תקינה לחשיכה","היפוגליקמיה קלה עם הזעה ורעד","הרעלת אופיאטים עם דיכוי נשימתי"],0,"אישונים מורחבים ובלתי מגיבים בשני הצדדים מעידים על מצב חמור: היפוקסיה מוחית קשה, פגיעה מוחית נרחבת עם עליית לחץ תוך-גולגולתי, או הרעלה בחומרים סימפתומימטיים או אנטיכולינרגיים. בהקשר של דום לב זהו סימן פרוגנוסטי גרוע. יש להבחין מהרחבה תקינה בחושך, שבה התגובה לאור נשמרת."],["הכרתי","מהו הטיפול הראשוני במטופל עם חשד להרעלה בחומר לא ידוע?",["מתן פחם פעיל לכל מטופל עם חשד להרעלה","גרימת הקאה לפינוי החומר מהקיבה","הגנה על הצוות, ABC, שלילת סיבות וזיהוי תסמונת רעלנית","מתן אנטידוט אוניברסלי רחב טווח"],2,"אין אנטידוט אוניברסלי. הגישה היא הגנה על הצוות מפני חשיפה משנית, ייצוב ABC, בדיקת סוכר ושלילת סיבות הפיכות, וזיהוי תסמונת רעלנית אופיינית לפי אישונים, עור, הפרשות, מדדים ומצב הכרה — שמכוונת לטיפול. גרימת הקאה כבר אינה מומלצת ומסוכנת, ופחם פעיל ניתן רק בהתוויות מוגדרות ולא במטופל עם הכרה ירודה."],["הכרתי","מהי הרעלת ציאניד וכיצד היא מתבטאת?",["חמצת קשה, ירידה בהכרה ועור סמוק","שלשול והפרשות מרובות מכל הפתחים","חום גבוה עם פריחה מפושטת בעור","אישונים מכווצים עם דיכוי נשימתי"],0,"ציאניד משתק את הנשימה התאית ברמת המיטוכונדריה, כך שהתאים אינם מסוגלים לנצל חמצן למרות שהוא זמין. התוצאה היא חמצת לקטית קשה, ירידה מהירה בהכרה, ולעיתים עור סמוק בשל חמצן שלא נוצל בדם הוורידי. מקור שכיח הוא שריפה בחלל סגור עם שריפת פלסטיק. הטיפול הוא הידרוקסוקובלמין."],["ילדים","מהו טווח הדופק התקין בתינוק עד גיל שנה?",["100 עד 160","40 עד 80","160 עד 200","60 עד 100"],0,"בתינוק עד גיל שנה טווח הדופק התקין הוא 100 עד 160 לדקה. ככל שהילד גדל הדופק יורד: בפעוט כ-90 עד 150, בגיל הגן כ-80 עד 140, ובגיל בית הספר כ-70 עד 120. הטווחים הרחבים משקפים את התלות של הילד בקצב הלב לשמירת תפוקה — הוא אינו מסוגל להגדיל משמעותית את נפח הפעימה."],["ילדים","מהו טווח קצב הנשימה התקין בתינוק?",["8 עד 12","12 עד 20","30 עד 60","60 עד 80"],2,"בתינוק עד גיל שנה קצב הנשימה התקין הוא 30 עד 60 לדקה. בפעוט 24 עד 40, בגיל הגן 22 עד 34, ובגיל בית הספר 18 עד 30. הקצב המהיר נובע מדרישה מטבולית גבוהה ומנפח נשימה קטן. חשוב לדעת שברדיפנאה בילד היא סימן מבשר רע ומעידה על עייפות ועל כשל נשימתי מתקרב."],["ילדים","מהו המשולש להערכת ילד (PAT) ומה מרכיביו?",["הכרה, תנועה ויכולת דיבור","דופק, לחץ דם וסטורציה","מראה כללי, עבודת נשימה וזרימת דם לעור","גובה, משקל וגיל כרונולוגי"],2,"משולש ההערכה הפדיאטרי מאפשר להתרשם ממצב הילד תוך שניות וממרחק, לפני נגיעה בו: מראה כללי — טונוס, קשב, נחמות, מבט ובכי, עבודת נשימה — קולות חריגים, תנוחה, נסיגות ונחיריים, וזרימת דם לעור — חיוורון, כחלון או ריבוד. שילוב הצלעות מכוון לסוג הבעיה ולדחיפותה."],["ילדים","מדוע ילדים נמצאים בסיכון גבוה יותר להיפותרמיה?",["הם אינם מסוגלים לרעוד לייצור חום","הם מייצרים פחות חום מטבולי במנוחה","מערכת החיסון שלהם אינה מפותחת דיה","יחס שטח פנים למסה גדול ורזרבת שומן קטנה"],3,"שטח הפנים של ילד גדול יחסית למסת גופו, ולכן הוא מאבד חום מהר בהרבה. בנוסף שכבת השומן התת-עורי דקה, יכולת הרעד מוגבלת ביילודים, וראשו מהווה חלק גדול משטח הגוף. לכן חשיפה קצרה בטראומה או שטיפה בכוויות עלולות לגרום להיפותרמיה מהירה, ושמירת חום היא חלק מהטיפול."],["ילדים","מהו סימן מוקדם להלם בילד?",["ברדיקרדיה עם ירידה בקצב הנשימה","ירידה בלחץ הדם הסיסטולי מתחת לגיל","טכיקרדיה, מילוי קפילרי מוארך וקצוות קרות","הרחבת אישונים עם תגובה איטית לאור"],2,"ילדים מפצים היטב ושומרים על לחץ דם עד לשלב מאוחר מאוד, ולכן ירידה בלחץ הדם בילד היא סימן מאיים שמבשר קריסה קרובה. הסימנים המוקדמים הם טכיקרדיה, מילוי קפילרי מעל 2 שניות, קצוות קרות, חיוורון, ירידה בפעילות ובקשב וירידה במתן שתן. ברדיקרדיה בילד מבשרת דום לב."],["ילדים","מהי המשמעות של ברדיקרדיה בילד?",["סימן לכושר גופני טוב ולטונוס וגאלי","סימן מאיים — לרוב היפוקסיה ומבשר דום לב","תגובה פיזיולוגית תקינה לגירוי כאב","ממצא תקין בשינה עמוקה ובמנוחה"],1,"בילד ברדיקרדיה היא כמעט תמיד תוצאה של היפוקסיה מתמשכת ולא בעיה חשמלית ראשונית. מכיוון שתפוקת הלב בילד תלויה כמעט לחלוטין בקצב, ברדיקרדיה משמעה תפוקה שאינה מספקת. לכן היא נחשבת מבשר מיידי לדום לב, והטיפול הראשון הוא חמצון ואוורור — לא תרופות. בדופק מתחת ל-60 עם פרפוזיה ירודה מתחילים עיסויים."],["ילדים","מהו קרופ (Croup) וכיצד הוא מתבטא?",["היצרות של דרכי אוויר קטנות — צפצופים","זיהום של רקמת הריאה — חום וקרפיטציות","זיהום חיידקי של מכסה הגרון — ריור וחום גבוה","זיהום ויראלי של הגרון — שיעול נבחני וסטרידור"],3,"קרופ הוא לרינגוטרכאוברונכיטיס ויראלי שגורם לבצקת מתחת למיתרי הקול. הביטויים הם שיעול נבחני אופייני כמו כלב ים, צרידות וסטרידור בשאיפה, לרוב בלילה ולאחר תסמיני הצטננות. המצב שכיח בגילאי חצי שנה עד שלוש. הטיפול הוא אוויר לח או קר, סטרואידים, ובמצב קשה אדרנלין באינהלציה."],["ילדים","מהו אפיגלוטיטיס ומדוע הוא מצב חירום?",["דלקת חיידקית של מכסה הגרון — ריור וסכנת חסימה","דלקת של הסימפונות הקטנים — צפצופים","זיהום ויראלי של דרכי הנשימה העליונות","דלקת של האוזן התיכונה עם חום וכאב"],0,"אפיגלוטיטיס הוא זיהום חיידקי מהיר של מכסה הגרון שגורם לבצקת מסיבית. הילד מציג חום גבוה, מראה רעיל, ריור מפני שאינו מסוגל לבלוע, קול עמום וישיבה בתנוחת חצובה. הכלל הקריטי: אין להסתכל בגרון, אין לשכב את הילד ואין לגרום לו לבכות — כל אלה עלולים לגרום לחסימה מלאה. מפנים בישיבה עם חמצן ובהכנה מלאה."],["ילדים","מהי הסכנה בבדיקת גרון בילד עם חשד לאפיגלוטיטיס?",["העברת זיהום חיידקי אל הצוות המטפל","גרימת הקאה עם סיכון לשאיפת תוכן קיבה","גרימת כאב ואי נוחות למטופל הצעיר","גרימת עווית וחסימה מלאה של נתיב האוויר"],3,"האפיגלוטיס הנפוח והרגיש עלול להיסגר לחלוטין בתגובה לגירוי מכני או לבכי, וכשזה קורה בשטח החייאת נתיב האוויר קשה ביותר. לכן ההנחיה חד משמעית: אין לבדוק את הגרון, אין להשכיב, אין לנסות להחדיר דבר לפה, ואין להפריד את הילד מההורה. מפנים בישיבה, בשקט ובהכנה לנתיב אוויר קשה."],["ילדים","מהו ברונכיוליטיס ובאיזה גיל הוא שכיח?",["דלקת של רקמת הריאה בגיל ההתבגרות","דלקת של הסימפונות הגדולים בילדי בית ספר","דלקת של הגרון ומיתרי הקול בגיל בית ספר","זיהום ויראלי של סימפונות קטנים עד גיל שנתיים"],3,"ברונכיוליטיס נגרם לרוב מנגיף RSV ופוגע בתינוקות עד גיל שנתיים, בעיקר בחורף. הוא מתבטא בנזלת שמתקדמת לשיעול, לצפצופים, לקוצר נשימה ולקושי באכילה. בתינוקות צעירים מאוד הוא עלול להתבטא בדום נשימה. הטיפול תומך — חמצן, ניקוי הפרשות מהאף והידרציה. מרחיבי סימפונות יעילותם מוגבלת."],["ילדים","מהו פרכוס חום (Febrile Seizure) ובאיזה גיל הוא שכיח?",["פרכוס המופיע ללא חום או מחלה נלווית","פרכוס בגילאי חצי שנה עד חמש על רקע עליית חום","פרכוס על רקע חום המופיע בגיל מבוגר","פרכוס הנמשך שעות ואינו מגיב לטיפול"],1,"פרכוס חום מתרחש בילדים בגילאי חצי שנה עד חמש שנים, בדרך כלל בעליית חום מהירה ולא בהכרח בחום גבוה במיוחד. הצורה הפשוטה היא כללית, נמשכת פחות מ-15 דקות ואינה חוזרת באותו יום, ופרוגנוזתה טובה. חשוב לשלול זיהום של מערכת העצבים המרכזית ולהרגיע את ההורים, אך כל פרכוס ראשון מחייב הערכה רפואית."],["ילדים","מהו הטיפול הראשוני בילד עם פרכוס חום?",["טבילת הילד במים קרים להורדת חום מהירה","הגנה מפגיעה, שמירת נתיב אוויר, הורדת חום ופינוי","הכנסת חפץ לפה למניעת נשיכת הלשון","החזקה חזקה של הגפיים למניעת התנועות"],1,"הטיפול הוא הגנה על הילד מפגיעה, הנחתו על הצד לשמירת נתיב אוויר, מתן חמצן, הפשטה והורדת חום הדרגתית, ופינוי להערכה. אין להכניס דבר לפה ואין לרסן. טבילה במים קרים גורמת לרעד ולוזוקונסטריקציה ואינה מומלצת. פרכוס שנמשך מעל 5 דקות מחייב טיפול בבנזודיאזפינים."],["ילדים","מהו הסימן המבחין בהערכת התייבשות בתינוק?",["טמפרטורת החדר שבו שוהה התינוק","שינוי באורך ובצבע של הציפורניים","שינוי בצבע השיער ובמרקם העור","מרפס שקוע, ריריות יבשות וירידה בחיתולים רטובים"],3,"בתינוק מעריכים התייבשות לפי מרפס קדמי שקוע, ריריות יבשות, היעדר דמעות בבכי, ירידה במספר החיתולים הרטובים, טורגור עור ירוד, עיניים שקועות, ישנוניות ומילוי קפילרי מוארך. ירידה במשקל היא המדד המדויק ביותר. חשוב לזכור שתינוקות מתייבשים מהר מאוד בשל יחס שטח פנים גבוה ומאגרים קטנים."],["ילדים","מדוע נתיב האוויר של ילד שונה מזה של מבוגר?",["נתיב האוויר של הילד ארוך ורחב יותר","נתיב האוויר של הילד רחב ועמיד יותר","אין הבדל אנטומי משמעותי בין ילד למבוגר","ראש גדול, לשון גדולה, גרון גבוה וקדמי וקנה צר"],3,"בילד הראש גדול והעורף בולט, ולכן שכיבה שטוחה גורמת לכיפוף הצוואר ולחסימה — ומכאן הצורך בריפוד מתחת לכתפיים. הלשון גדולה יחסית לחלל הפה, רקמת השקדים בולטת, הגרון ממוקם גבוה וקדמי יותר, והקנה צר וקצר. מכיוון שהתנגדות זרימת האוויר עולה ביחס לחזקה רביעית של הרדיוס, בצקת קטנה מצמצמת דרמטית את הזרימה."],["ילדים","מהי התנוחה הנכונה לפתיחת נתיב אוויר בתינוק?",["סיבוב הראש לצד לניקוז ההפרשות","תנוחה ניטרלית עם ריפוד קל מתחת לכתפיים","כיפוף הצוואר קדימה עם סנטר אל החזה","הטיית ראש מלאה לאחור כמו במבוגר"],1,"בתינוק העורף הבולט גורם לכיפוף הצוואר בשכיבה, ולכן נדרשת תנוחה ניטרלית — לעיתים עם ריפוד דק מתחת לכתפיים כדי ליישר. הטיית ראש מלאה לאחור, כמו במבוגר, גורמת דווקא למתיחת יתר של הקנה הרך ולחסימתו. כיפוף קדימה או סיבוב לצד חוסמים אף הם."],["ילדים","מהו החישוב הבסיסי למינון תרופות בילדים?",["מינון קבוע לפי טווח גיל כרונולוגי","לפי משקל בק״ג — מ״ג לכל ק״ג","מחצית ממינון המבוגר בכל גיל","לפי גובה הילד בסנטימטרים"],1,"מינון בילדים מחושב תמיד לפי משקל בק״ג, ולעולם לא לפי הערכה גסה או שבריר ממינון מבוגר. כאשר המשקל אינו ידוע משתמשים בסרט ברוסלו שמעריך משקל לפי אורך הילד ומספק מינונים מוכנים. שגיאות במינון פדיאטרי הן מהשגיאות השכיחות והמסוכנות ביותר, ולכן נדרש חישוב כפול ובקרה."],["ילדים","מהו סרט ברוסלו ולמה הוא משמש?",["סרט למדידת לחץ דם בילדים","סרט לקיבוע גפיים שבורות בילדים","סרט למדידת חום גוף בתינוקות","הערכת משקל לפי אורך — מינונים וגדלי ציוד"],3,"סרט ברוסלו הוא סרט מדידה צבעוני שנפרש לאורך הילד, וכל צבע מייצג טווח משקל. הוא מספק במהירות את מינוני התרופות, את גדלי מנתב האוויר, הטובוס והמסכה, ואת אנרגיית הדפיברילציה המתאימה. הוא מפחית דרמטית שגיאות במצבי לחץ, ובמיוחד שימושי כשהמשקל אינו ידוע ואין זמן לשקילה."],["ילדים","מהם הסימנים המחשידים להתעללות בילד?",["פציעה יחידה עם הסבר עקבי ומתאים","נפילה מגובה בנוכחות עדים ובני משפחה","חוסר התאמה בין הסיפור לממצאים ופציעות בשלבים שונים","פציעה בברך או במרפק בגיל הליכה"],2,"הדגלים האדומים הם חוסר התאמה בין המנגנון המדווח לפציעה, שינויים בגרסה, פציעות בשלבי החלמה שונים, דפוסי פציעה חשודים כמו כוויות בצורת גרב או כפפה, פגיעות באזורים לא שכיחים, ועיכוב בלתי מוסבר בפנייה לעזרה. חובת הדיווח חלה על כל איש צוות, והתיעוד האובייקטיבי בשטח קריטי."],["ילדים","מהו הטיפול הראשוני בילד עם מצוקה נשימתית?",["החדרת עירוי מיידית לפני כל פעולה אחרת","השכבה מיידית של הילד על גבו לבדיקה","השארתו בתנוחה נוחה לו, חמצן ללא הפחדה","הפרדת הילד מההורה להפחתת המולה"],2,"בילד עם מצוקה נשימתית, בכי ותסיסה מגבירים את צריכת החמצן ואת החסימה. לכן משאירים אותו בתנוחה שנוחה לו — לרוב בישיבה או בזרועות ההורה, נותנים חמצן בשיטה שאינה מפחידה כמו זרימה חופשית מול הפנים, ונמנעים מפעולות מכאיבות ומיותרות. הפרדה מההורה או השכבה מחמירות את המצב."],["ילדים","מדוע חשוב לשמור על נוכחות ההורה בטיפול בילד?",["נדרש אישור משפטי של ההורה לכל פעולה","ההורה מספק את ההערכה במקום הצוות","נוכחות ההורה אינה משפיעה על מצב הילד","היא מרגיעה את הילד ומפחיתה מצוקה פיזיולוגית"],3,"נוכחות ההורה מפחיתה חרדה ובכי, וכך מפחיתה את צריכת החמצן ואת עבודת הנשימה — השפעה פיזיולוגית ממשית ולא רק רגשית. בנוסף ההורה הוא מקור מידע חיוני והוא מזהה שינויים במצב הילד לפני הצוות. לכן ההנחיה היא לשלב את ההורה בטיפול ולא להרחיקו, למעט כשהוא מפריע בפועל."],["ילדים","מהם הגדלים והמאפיינים המיוחדים של GCS בתינוקות?",["הסולם זהה למבוגר בכל הגילאים","הסולם אינו ישים בתינוקות ואינו נמדד","הסולם נמדד רק בילדים מעל גיל חמש","קיים סולם מותאם שבו המילולי מוערך לפי בכי"],3,"בתינוקות ובילדים קטנים שאינם מדברים משתמשים בסולם GCS מותאם. במרכיב המילולי מעריכים גרגור ומלמול תקינים כציון מלא, בכי עצבני, בכי לכאב, גניחה לכאב, והיעדר תגובה. במרכיב המוטורי מעריכים תנועה ספונטנית תכליתית. פתיחת העיניים נותרת זהה. השימוש בסולם המבוגר בתינוק ייתן ציון נמוך שגוי."],["ילדים","מהי הסיבה השכיחה לדום נשימה בתינוק?",["חסימת נתיב אוויר, זיהומים נשימתיים או שאיפת גוף זר","אוטם שריר הלב על רקע מום כלילי","הפרעת קצב ראשונית ממקור חדרי","יתר לחץ דם ריאתי עם כשל לב ימני"],0,"בתינוקות דום נשימה נובע כמעט תמיד מבעיה נשימתית או מחסימה: הפרשות ונזלת שחוסמות את האף — והתינוק נושם דרך האף בעיקר, ברונכיוליטיס מ-RSV שגורם לדום נשימה מרכזי, שאיפת גוף זר, זיהומים וספסיס. סיבות לבביות ראשוניות נדירות מאוד בגיל זה, ולכן הטיפול מתמקד באוורור ובניקוי נתיב האוויר."],["ילדים","מהו הטיפול הראשון בילד עם אנפילקסיס?",["אדרנלין תוך שרירי בירך לפי משקל","אינהלציה במרחיב סימפונות בלבד","אנטיהיסטמין בסירופ לפי משקל הילד","סטרואידים דרך הפה במינון גבוה"],0,"אדרנלין תוך שרירי בשריר הירך החיצוני הוא הטיפול המציל בכל גיל, והוא ניתן מיידית ללא עיכוב. המינון בילדים מחושב לפי משקל, ומזרקים אוטומטיים קיימים במינוני ילדים ומבוגרים לפי טווחי משקל. אנטיהיסטמינים וסטרואידים פועלים לאט ואינם מטפלים בחסימת נתיב האוויר או בקריסה ההמודינמית."],["ילדים","מדוע פגיעות ראש שכיחות יותר בילדים?",["הגולגולת עבה יותר ומעבירה כוח למוח","הראש גדול וכבד יחסית ושרירי הצוואר חלשים","ילדים נופלים פחות אך בעוצמה רבה יותר","המוח קטן ונע בחופשיות בתוך הגולגולת"],1,"ראשו של הילד מהווה חלק גדול ממשקל גופו ומרכז הכובד שלו גבוה, ושרירי הצוואר אינם חזקים מספיק לייצבו. לכן בכל האטה או נפילה הראש נע בעוצמה והוא לרוב האזור שפוגע ראשון. בנוסף הגולגולת דקה יותר וכוח עלול לעבור למוח גם ללא שבר. אצל תינוקות המרפס הפתוח מאפשר הצטברות דם משמעותית לפני הופעת סימנים."],["ילדים","מהי המשמעות של מרפס בולט בתינוק?",["ממצא תקין בכל תינוק עד גיל שנה","סימן לרעב ולצורך בהאכלה מיידית","סימן להתייבשות ולאובדן נוזלים","סימן אפשרי לעליית לחץ תוך-גולגולתי"],3,"המרפס הקדמי נסגר סביב גיל 12 עד 18 חודשים, ובמצב תקין הוא שטוח או שקוע מעט. מרפס בולט ומתוח בתינוק שקט מעיד על עליית לחץ תוך-גולגולתי — דימום, דלקת קרום המוח או הידרוצפלוס. מרפס שקוע הוא סימן להתייבשות. חשוב להעריך את המרפס כשהתינוק שקט וזקוף, שכן בכי גורם לבליטה חולפת."],["ילדים","מהי הכמות המומלצת לבולוס נוזלים בילד עם התייבשות קשה?",["10 מ״ל לק״ג","20 מ״ל לק״ג","50 מ״ל לק״ג","40 מ״ל לק״ג"],1,"בילד עם התייבשות קשה או הלם היפוולמי נותנים בולוס של 20 מ״ל לק״ג של תמיסה איזוטונית, מעריכים מחדש, וניתן לחזור. במצבים שבהם קיים חשש לעומס — הלם קרדיוגני, אי ספיקת לב או תת-תזונה קשה — מקטינים את הבולוס ל-5 עד 10 מ״ל לק״ג ומעריכים בזהירות רבה יותר."],["ילדים","מהי המשמעות של נחיריים מתרחבים ונסיגות בילד?",["תגובה פיזיולוגית לחשיפה לקור","ממצא תקין בשינה עמוקה ובמנוחה","סימני מאמץ נשימתי מוגבר ומצוקה","סימן לרעב ולצורך בהאכלה מיידית"],2,"התרחבות נחיריים בשאיפה ונסיגות — בין הצלעות, מתחת לצלעות ומעל עצם החזה — הן סימני עבודה נשימתית מוגברת. ככל שהנסיגות עמוקות ומעורבות יותר קבוצות שרירים, כך המצוקה חמורה יותר. סימנים נוספים הם נהמה בנשיפה, שהיא ניסיון ליצור לחץ חיובי עצמי ומעידה על מצוקה משמעותית, וכן תנועת ראש קדימה ואחורה בתינוקות."],["ילדים","מהו הטיפול בילד עם היפוגליקמיה ללא הכרה?",["מתן אינסולין לאיזון רמת הסוכר בדם","מתן משקה ממותק או ג׳ל גלוקוז לפה","המתנה להתאוששות ספונטנית עם ניטור","גלוקוז בעירוי לפי משקל, או גלוקגון תוך שרירי"],3,"בילד ללא הכרה אסור לתת דבר דרך הפה בשל סכנת שאיפה. הטיפול הוא גלוקוז בעירוי במינון ובריכוז המותאמים לגיל ולמשקל, ואם אין גישה ורידית — גלוקגון תוך שרירי. תמיסות מרוכזות מדי מסוכנות לוורידים של ילדים ולכן משתמשים בריכוזים נמוכים יותר מאשר במבוגר. לאחר התיקון יש לוודא אכילה למניעת הישנות."],["ילדים","מהי הסיבה השכיחה לחסימת נתיב אוויר בילדים קטנים?",["שאיפת גוף זר — מזון או חלקי צעצועים","זיהום כרוני של השקדים והאדנואידים","גידול או ציסטה בדרכי האוויר העליונות","בצקת אלרגית של הגרון ומיתרי הקול"],0,"ילדים בגילאי חצי שנה עד שלוש בוחנים את העולם דרך הפה, ודרכי האוויר שלהם צרות, ולכן שאיפת גוף זר היא סיבה שכיחה מאוד. הפריטים המסוכנים הם ענבים, אגוזים, נקניקיות, סוכריות עגולות וחלקי צעצועים קטנים. הצגה של קוצר נשימה או צפצופים פתאומיים בילד בריא, ללא חום, מחשידה מאוד לגוף זר."],["ילדים","מהי המשמעות של ילד שקט ואדיש שהיה קודם בוכה?",["הוא נרדם באופן טבעי לאחר הבכי הממושך","אין לכך משמעות קלינית בהערכת הילד","סימן מדאיג — ייתכן שהוא מידרדר ומתעייף","הוא נרגע וסימן לשיפור במצבו הקליני"],2,"ילד חולה שבוכה ומתנגד מפגין רזרבה תקינה. ילד שהופך שקט, רפוי, אדיש ואינו מגיב להורה או לגירוי — במיוחד לאחר תקופת בכי — נמצא לרוב במצב מידרדר של תשישות, היפוקסיה או הלם. זהו אחד הסימנים המדאיגים ביותר בהערכת ילד, ואין לפרשו כשיפור או כהירדמות."],["ילדים","מהי החשיבות של הערכת המראה הכללי בילד?",["היא רלוונטית להערכת מחלות עור ופריחות","היא משקפת תפקוד מוחי ופרפוזיה ומזהה ילד חולה","היא נדרשת בילדים מעל גיל בית ספר","היא מחליפה את הצורך במדידת מדדים"],1,"המראה הכללי — טונוס השרירים, עוררות, יכולת להירגע, מבט ואיכות הבכי או הדיבור — משקף את תפקוד המוח, ולכן הוא סמן רגיש לחמצון, לפרפוזיה ולהומאוסטזיס. ילד שנראה רע נחשב חולה קשה עד שיוכח אחרת, גם אם המדדים המספריים תקינים. עם זאת אין הוא מחליף מדידת מדדים אלא משלים אותה."],["ילדים","מהם המאפיינים המיוחדים של בית החזה בילד?",["הסרעפת אינה פעילה והנשימה חזית בלבד","כלוב הצלעות גמיש — הכוח עובר פנימה ללא שברים","הצלעות קשיחות ונשברות בקלות רבה","הריאות גדולות יחסית ותופסות נפח רב"],1,"עצמות הצלעות של ילד גמישות וסחוסיות יותר, ולכן הן סופגות פחות אנרגיה ומעבירות אותה לאיברים שמתחתיהן. התוצאה היא שילד עלול לסבול מחבלת ריאה קשה או מפגיעה בכבד ובטחול ללא שבר בצלעות כלל. לכן שבר בצלעות בילד מעיד על אנרגיה גבוהה מאוד ומחייב חשד לפגיעות פנימיות חמורות."],["ילדים","מהי הסכנה במתן נוזלים מהיר מדי לילד?",["ירידה חדה ברמת הסוכר בדם","עלייה בטמפרטורת הגוף ורעד","אין סכנה במתן נוזלים מהיר לילד","עומס נוזלים ובצקת ריאות, במיוחד ברקע לבבי"],3,"למרות שילד בהלם זקוק לנוזלים, מתן מהיר ובלתי מבוקר עלול לגרום לעומס — במיוחד בילד עם מחלת לב, עם אי ספיקת כליות או עם תת-תזונה קשה. לכן נותנים בולוסים מדודים לפי משקל, מעריכים מחדש לאחר כל בולוס, ומחפשים סימני עומס כמו קרפיטציות, כבד מוגדל וגודש ורידי צוואר."],["ילדים","מהי הגישה לילד לאחר טביעה?",["חימום הדרגתי בלבד עד להתאוששות","המתנה להתאוששות ספונטנית עם ניטור צמוד","החייאה עם דגש על אוורור, חשד לצוואר וטיפול בקור","ניקוז המים מהריאות לפני תחילת ההנשמה"],2,"בטביעה הבעיה היא היפוקסיה, ולכן ההחייאה מדגישה אוורור ומתחילה בהנשמות. יש לחשוד במנגנון טראומה — במיוחד צלילה למים רדודים — ולקבע בהתאם. היפותרמיה שכיחה ומחייבת חימום, אך היא גם מגנה על המוח ולכן אין לקבוע מוות לפני חימום. אין לנסות לנקז מים — הדבר מעכב טיפול וגורם להקאה."],["ילדים","מהי הסיבה לכך שילדים סובלים מפגיעות מרובות מערכות בטראומה?",["גופם קטן והאנרגיה מרוכזת ומגיעה למספר איברים","הם אינם חוגרים חגורת בטיחות ברכב","עצמותיהם חזקות ומעבירות את הכוח פנימה","הם נופלים מגובה רב יותר יחסית לגובהם"],0,"אותה כמות אנרגיה שמתפזרת בגוף מבוגר על פני שטח ומסה גדולים, מרוכזת בילד באזור קטן בהרבה — ולכן היא מגיעה למספר מערכות בו זמנית. בנוסף, השומן והשריר המגנים דלים והאיברים קרובים זה לזה. לכן ילד שנפגע בתאונה נחשב לפצוע רב מערכתי עד שיוכח אחרת, ומופנה למרכז טראומה פדיאטרי."],["אוכלוסיות מיוחדות","מהו השינוי המשמעותי ביותר בנפח הדם בהיריון?",["עלייה של כ-5 אחוז בלבד בנפח הדם","עלייה של כ-30 עד 50 אחוז בנפח הדם","אין שינוי בנפח הדם לאורך ההיריון","ירידה של כ-20 אחוז בנפח הדם"],1,"נפח הדם עולה בכ-30 עד 50 אחוז עד סוף ההיריון. המשמעות הקלינית קריטית: האישה מסוגלת לאבד כמות דם גדולה — עד כ-30 אחוז — לפני שיופיעו סימני הלם, ולכן היא מסווה דימום. בזמן שהיא נראית יציבה, זרימת הדם לרחם כבר מצטמצמת והעובר סובל. לכן העובר הוא המדד הרגיש יותר למצב האם."],["אוכלוסיות מיוחדות","מהי תסמונת הווריד הנבוב (Supine Hypotensive Syndrome)?",["עלייה בלחץ הדם בשכיבה על הגב","חסימה של עורק הירך בשכיבה ממושכת","לחץ הרחם על הווריד הנבוב — ירידה בהחזר ובלחץ","דימום מהווריד הנבוב התחתון בחבלה"],2,"מהשליש השני ואילך הרחם המוגדל לוחץ על הווריד הנבוב התחתון כאשר האישה שוכבת על גבה, ומפחית את ההחזר הוורידי בעד 30 אחוז. התוצאה היא ירידה בתפוקת הלב, סחרחורת, חיוורון ותת לחץ דם. הפתרון הוא הטיה שמאלה בכ-15 עד 30 מעלות או הזזה ידנית של הרחם שמאלה."],["אוכלוסיות מיוחדות","מהי הדרך הטובה ביותר לטפל בעובר בטראומה?",["טיפול ישיר בעובר דרך דופן הבטן","הימנעות ממתן נוזלים לאם למניעת עומס","פינוי איטי ומתון למניעת טלטול העובר","טיפול מיטבי באם — ייצובה הוא החייאת העובר"],3,"אספקת החמצן לעובר תלויה לחלוטין בפרפוזיה הרחמית, שתלויה בתפוקת הלב של האם. לכן חמצון, ייצוב המודינמי ומתן נוזלים לאם הם הטיפול הישיר בעובר. אין להימנע מנוזלים או מצילומים חיוניים בשל ההיריון. הכלל המנחה הוא: החייאת האם היא החייאת העובר."],["אוכלוסיות מיוחדות","מהי היפרדות שליה (Abruptio Placentae) וכיצד היא מתבטאת?",["היפרדות השליה מדופן הרחם — כאב, רחם קשה ודימום","ניתוק חבל הטבור בין העובר לשליה","מיקום נמוך של השליה מעל צוואר הרחם","דלקת חיידקית של השליה ושל מי השפיר"],0,"בהיפרדות שליה השליה מתנתקת מדופן הרחם לפני הלידה. הביטויים הם כאב בטן, רחם קשה ורגיש, דימום וגינלי — שעשוי להיות מועט או נעדר לחלוטין כאשר הדם כלוא מאחורי השליה, וסימני מצוקה עוברית. זהו הסיבוך המיילדותי השכיח והמסוכן ביותר בטראומה, והוא עלול להתרחש גם בחבלה קלה."],["אוכלוסיות מיוחדות","מהם השינויים הפיזיולוגיים במערכת הנשימה בהיריון?",["עלייה בנפח הדקה וירידה ברזרבה ובזמן להיפוקסיה","אין שינוי במערכת הנשימה לאורך ההיריון","ירידה בקצב הנשימה ובנפח הדקה","ירידה בצריכת החמצן ובקצב המטבוליזם"],0,"בהיריון הרחם דוחק את הסרעפת כלפי מעלה ומקטין את הנפח השייר התפקודי, בעוד שצריכת החמצן עולה בכ-20 אחוז. התוצאה היא רזרבה נשימתית קטנה מאוד — אישה בהיריון מגיעה להיפוקסיה מהר בהרבה בעת הפסקת אוורור. בנוסף בצקת בדרכי האוויר העליונות מקשה על אינטובציה. לכן חמצון מוקדם ונדיב הוא חובה."],["אוכלוסיות מיוחדות","מדוע קשישים בסיכון מוגבר בטראומה?",["הם נופלים לעיתים קרובות מגובה עמידה","הם מחלימים מהר יותר אך סובלים מסיבוכים","הם אינם חשים כאב ולכן מאחרים לפנות לעזרה","ירידה ברזרבות, מחלות רקע, תרופות ואוסטיאופורוזיס"],3,"בקשיש הרזרבה של כל מערכות הגוף מצומצמת, ולכן פגיעה שנחשבת קלה בצעיר עלולה להיות קריטית. מחלות רקע כמו מחלת לב ומחלת ריאות מגבילות את יכולת הפיצוי, תרופות כמו חוסמי בטא ונוגדי קרישה משנות את התגובה ואת הדימום, ואוסטיאופורוזיס גורם לשברים בכוח נמוך. בנוסף התמותה מטראומה בקשישים גבוהה משמעותית."],["אוכלוסיות מיוחדות","כיצד משפיעים נוגדי קרישה על הערכת קשיש עם חבלת ראש?",["הם מונעים דימום ומפחיתים את הסיכון","אין להם השפעה על הערכת חבלת ראש","הם רלוונטיים בפגיעות בטן ואגן בלבד","סיכון גבוה משמעותית לדימום תוך-גולגולתי גם בחבלה קלה"],3,"מטופלים הנוטלים נוגדי קרישה או נוגדי טסיות נמצאים בסיכון גבוה לדימום תוך-גולגולתי משמעותי גם לאחר חבלת ראש קלה מאוד, ולעיתים הדימום מתפתח בהדרגה על פני שעות. לכן הסף לפינוי ולהערכה הדמייתית נמוך בהרבה, וכל חבלת ראש בנוטל נוגדי קרישה מחייבת התייחסות רצינית גם אם ה-GCS תקין."],["אוכלוסיות מיוחדות","מדוע קשה לזהות הלם בקשיש הנוטל חוסמי בטא?",["התרופה מונעת טכיקרדיה והדופק נראה תקין","לחץ הדם עולה בהלם אצל נוטלי חוסמי בטא","קשישים אינם מפתחים הלם היפוולמי","קשישים מדממים פחות בשל כלי דם נוקשים"],0,"חוסמי בטא חוסמים את התגובה הסימפתטית של האצת קצב הלב, ולכן מנגנון הפיצוי המרכזי אינו נראה. מטופל עלול להיות בהלם עמוק עם דופק 70. בנוסף, לחץ דם של 120 עשוי להיות נמוך משמעותית עבור מטופל עם יתר לחץ דם כרוני. לכן מסתמכים על מילוי קפילרי, על מצב העור, על מצב ההכרה ועל המגמה."],["אוכלוסיות מיוחדות","מהי הגישה לטיפול במטופל עם מוגבלות קוגניטיבית?",["הימנעות מבדיקה גופנית בשל חוסר שיתוף פעולה","שימוש בכוח מתון לזירוז הבדיקה והפינוי","התעלמות מהמטופל ופנייה אל המלווה בלבד","פנייה ישירה בשפה פשוטה, שיתוף מלווה והתאמת קצב"],3,"פונים תמיד ישירות למטופל בשפה פשוטה וברורה, מסבירים כל פעולה לפני ביצועה, ומאפשרים זמן תגובה. המלווה או המטפל הקבוע הוא מקור מידע קריטי — הוא יודע מהו התפקוד הבסיסי ומה השתנה. שינוי מהתפקוד הרגיל הוא הממצא החשוב, ולכן חשוב לשאול מה שונה מהרגיל ולא להסתפק בהתרשמות."],["אוכלוסיות מיוחדות","מהם האתגרים בטיפול במטופל חירש או כבד שמיעה?",["דיבור בקול רם וצעקה כדי להתגבר על הליקוי","אין אתגרים מיוחדים בטיפול במטופל חירש","קשר עין, דיבור בקצב רגיל ותקשורת בכתב או מתורגמן","הימנעות מתקשורת ופנייה למלווה בלבד"],2,"פונים למטופל בקשר עין ישיר כדי לאפשר קריאת שפתיים, מדברים בקצב רגיל ולא מוגזם, ומוודאים תאורה מספקת. צעקה מעוותת את תנועות השפתיים ואינה מסייעת. תקשורת בכתב, שימוש בטלפון, או מתורגמן לשפת סימנים הם פתרונות יעילים. חשוב לוודא שהמכשירים של המטופל נמצאים עליו ופועלים."],["אוכלוסיות מיוחדות","מהי הגישה לטיפול במטופל השמן (Bariatric)?",["הטיפול זהה לחלוטין לכל מטופל אחר","הימנעות מפינוי בשל מגבלות ציוד ומשקל","שימוש בציוד רגיל תוך התאמת אופן השימוש","אתגרי נתיב אוויר, מדדים, ורידים, ציוד וכוח אדם נוסף"],3,"מטופל בהשמנת יתר מציב אתגרים מרובים: נתיב אוויר קשה, רזרבה נשימתית מוגבלת והידרדרות מהירה בשכיבה, שרוול לחץ דם שאינו מתאים ונותן קריאות שגויות, קושי בנגישות ורידית, וקושי בהערכת בטן וחזה. בנוסף נדרשים ציוד ייעודי בעל כושר נשיאה מתאים וכוח אדם נוסף — לבטיחות המטופל ולמניעת פגיעת גב בצוות."],["אוכלוסיות מיוחדות","מדוע ילדים בסיכון מוגבר לפגיעות רב מערכתיות?",["הם אינם חשים כאב ולכן אינם מדווחים","הם נופלים ונפגעים בתדירות גבוהה יותר","גופם קטן, האנרגיה מרוכזת והאיברים קרובים זה לזה","עצמותיהם חזקות ומעבירות כוח לאיברים"],2,"אותה כמות אנרגיה מתפזרת בילד על מסה ושטח קטנים בהרבה, והאיברים הפנימיים גדולים יחסית וקרובים זה לזה עם מעט שומן ושריר מגנים. התוצאה היא שכוח אחד פוגע במספר מערכות בו זמנית. לכן ילד שנפגע בתאונה משמעותית נחשב פצוע רב מערכתי עד שיוכח אחרת."],["אוכלוסיות מיוחדות","מהי הגישה למטופל עם מוגבלות שכלית שאינו משתף פעולה בבדיקה?",["מתן תרופות הרגעה לפני תחילת הבדיקה","ויתור על הבדיקה ופינוי ללא הערכה","שימוש מיידי באמצעי ריסון פיזיים","סבלנות, הפחתת גירויים, הסבר פשוט ומלווה מוכר"],3,"הגישה היא הפחתת גירויים — רעש, אורות ואנשים, הסבר פשוט וחזרתי, מתן זמן, ושיתוף אדם מוכר שהמטופל סומך עליו. סדר הבדיקה מותאם כך שפעולות פחות מאיימות נעשות ראשונות. ריסון או הרדמה נשקלים רק כשקיימת סכנה ממשית למטופל או לצוות, ותמיד כמוצא אחרון."],["אוכלוסיות מיוחדות","מהם השינויים במערכת העיכול בהיריון והשלכתם?",["הפסקה מוחלטת של תנועתיות המעי הדק","האצת ריקון הקיבה והפחתת סיכון לרפלוקס","האטת ריקון הקיבה — סיכון לשאיפת תוכן","אין שינוי בפעילות מערכת העיכול בהיריון"],2,"פרוגסטרון מרפה את השריר החלק, ולכן ריקון הקיבה מואט והסוגר הוושטי התחתון נחלש, בעוד שהרחם מעלה את הלחץ התוך-בטני. השילוב יוצר סיכון גבוה לרפלוקס ולשאיפת תוכן קיבה. לכן כל אישה בהיריון נחשבת כבעלת קיבה מלאה, ויש להיערך לכך בטיפול בנתיב האוויר ובמצבי הכרה ירודה."],["אוכלוסיות מיוחדות","מהי המשמעות של דופק בסיס גבוה יותר באישה בהיריון?",["עלייה של 10 עד 20 פעימות היא נורמלית ומסווה הלם","דופק מעל 100 בהיריון מעיד תמיד על הלם","אין שינוי בערכי הדופק לאורך ההיריון","הדופק הבסיסי יורד בכ-10 פעימות בהיריון"],0,"הדופק הבסיסי בהיריון עולה בכ-10 עד 20 פעימות, ולחץ הדם יורד בשליש השני. כתוצאה מכך המדדים שנחשבים חריגים בלא הרה עשויים להיות נורמליים בהיריון — ולהפך, מדדים שנראים תקינים עשויים להסתיר הלם מתפתח. לכן ההערכה מסתמכת על המגמה, על מצב העור, על מילוי קפילרי ועל מצב העובר."],["אוכלוסיות מיוחדות","כיצד מקבעים אישה בהיריון מתקדם ללוח גב?",["קיבוע רגיל בשכיבה שטוחה על הגב","קיבוע רגיל ואז הטיית הלוח כולו שמאלה 15 עד 30 מעלות","ויתור על הקיבוע בשל הסיכון לעובר","קיבוע בישיבה בזווית של 45 מעלות בלבד"],1,"מקבעים כרגיל ואז מטים את הלוח כולו — עם הפצועה מקובעת עליו — שמאלה בכ-15 עד 30 מעלות בעזרת מגבות או קצף. כך משתחרר הלחץ מהווריד הנבוב מבלי לפגוע ביישור עמוד השדרה. אם ההטיה אינה אפשרית, מבצעים הזזה ידנית של הרחם שמאלה באופן רציף."],["אוכלוסיות מיוחדות","מהי רעלת היריון (Preeclampsia) ומהם ביטוייה?",["ירידה בלחץ הדם עם בחילות והקאות","דימום וגינלי מועט ללא כאב או יתר לחץ","חום גבוה עם צמרמורות וכאבי שרירים","יתר לחץ דם, חלבון בשתן, בצקות והפרעות ראייה"],3,"רעלת היריון מופיעה לרוב לאחר שבוע 20 ומתאפיינת ביתר לחץ דם ובחלבון בשתן, לצד בצקות, כאב ראש, הפרעות ראייה, כאב ברביע ימני עליון ובחילות. הסכנה היא התקדמות לאקלמפסיה — פרכוסים מסכני חיים. הטיפול הוא הפחתת גירויים, מגנזיום סולפט למניעת פרכוסים, ופינוי דחוף ליולדת."],["אוכלוסיות מיוחדות","מהו הטיפול בפרכוס אקלמפטי?",["מתן נוזלים בכמות גדולה להורדת לחץ הדם","הרגעה מילולית והמתנה לסיום הפרכוס","המתנה לסיום הפרכוס לפני כל התערבות","הגנה מפגיעה, הטיה שמאלה, חמצן, מגנזיום ופינוי"],3,"באקלמפסיה מגנים על היולדת מפגיעה, מטים אותה שמאלה למניעת לחץ על הווריד הנבוב ולהגנת נתיב האוויר, נותנים חמצן, ומטפלים במגנזיום סולפט שהוא תרופת הבחירה. הפחתת גירויים חשובה מפני שאור ורעש עלולים לעורר פרכוס נוסף. הטיפול המכריע הוא סיום ההיריון, ולכן הפינוי דחוף ליחידת יולדות."],["אוכלוסיות מיוחדות","מהי הגישה לקשיש שנפל מגובה עמידה?",["מנגנון משמעותי — שברים, דימום תוך-גולגולתי וסיבה רפואית","אין צורך בפינוי אם הקשיש מתהלך","מנגנון קל שאינו מצריך הערכה מיוחדת","נדרש טיפול בכאב ובקיבוע הגפה בלבד"],0,"נפילה מגובה עמידה בקשיש היא מנגנון משמעותי בשל אוסטיאופורוזיס ובשל שימוש בנוגדי קרישה. חשוב לא פחות לשאול מדוע נפל — הנפילה עשויה להיות תוצאה של אירוע רפואי כמו הפרעת קצב, שבץ, היפוגליקמיה, זיהום או תת לחץ דם תנוחתי. טיפול רק בפציעה תוך התעלמות מהסיבה הוא כשל שכיח."],["אוכלוסיות מיוחדות","מהו הסיכון המיוחד בקיבוע קשיש ללוח גב?",["הקיבוע קל יותר בשל גמישות מופחתת","אין סיכון מיוחד בקיבוע קשיש ללוח","קיפוזיס דורש ריפוד ופצעי לחץ מתפתחים מהר","אין צורך בריפוד בשל שכבת שומן מגנה"],2,"בקשישים רבים קיים קיפוזיס — עיקול של עמוד השדרה — ואילוץ יישור מלא על לוח שטוח גורם לכאב, לפגיעה ואף לשבר. לכן מרפדים את החללים ומקבעים בתנוחה הפיזיולוגית של המטופל. בנוסף, העור הדק והרקמה התת-עורית הדלה גורמים לפצעי לחץ תוך זמן קצר במיוחד, ולכן יש לקצר את זמן השהייה על הלוח."],["אוכלוסיות מיוחדות","מהי ההשלכה של ירידה בתחושת הצמא בקשישים?",["הצטברות עודף נוזלים ובצקות בגפיים","נטייה מוגברת להתייבשות ולהחמרת מצבים רפואיים","עלייה בלחץ הדם ובעומס על הלב","אין לכך השלכה קלינית משמעותית"],1,"מנגנון הצמא נחלש עם הגיל, ובנוסף תפקוד הכליות בריכוז שתן יורד ותרופות משתנות שכיחות. התוצאה היא נטייה גבוהה להתייבשות, שמחמירה בלבול, מעלה סיכון לנפילות, לזיהומים ולאי ספיקת כליות. בקשיש עם בלבול חדש או חולשה יש לשקול התייבשות כסיבה תורמת ולהעריך נוזלים."],["אוכלוסיות מיוחדות","מהי המשמעות של פגיעה בתחושת הכאב בסוכרתי?",["לנוירופתיה אין השפעה על הערכת הכאב","נוירופתיה מסווה פציעות, כוויות ואוטם שקט","הסוכרתי חש כאב עז יותר מהרגיל","תחושת הכאב מוגברת באזורי הפגיעה"],1,"נוירופתיה סוכרתית מקהה את התחושה בגפיים ומשנה את תפיסת הכאב הוויסצרלי. התוצאות הן פצעים וכוויות בכפות הרגליים שאינם מורגשים ומתגלים מאוחר, ואוטם שריר הלב ללא כאב חזה. לכן בסוכרתי יש לבדוק באופן אקטיבי את כפות הרגליים ולשמור על חשד גבוה לאוטם גם ללא כאב."],["לידה","מהם שלושת שלבי הלידה?",["היריון, לידה והחלמה לאחר הלידה","פתיחה והתקצרות, יציאת העובר, יציאת השליה","קדם לידה, לידה פעילה וטיפול ביילוד","צירים מקדימים, דימום והתחלת הנקה"],1,"השלב הראשון מתחיל בצירים סדירים ונמשך עד לפתיחה מלאה של צוואר הרחם — הוא הארוך ביותר. השלב השני הוא מהפתיחה המלאה ועד ליציאת התינוק, וזהו השלב שבו הצוות מסייע בפועל. השלב השלישי הוא יציאת השליה, לרוב תוך 5 עד 30 דקות מהלידה. זיהוי השלב קובע אם לפנות או להתכונן ללידה בשטח."],["לידה","מהם הסימנים שהלידה קרובה ואין לפנות?",["כאב גב תחתון מתמשך ללא צירים","צירים תכופים וחזקים, דחף ללחוץ והכתרת הראש","צירים סדירים כל 10 דקות עם כאב גב","ירידת מים שאירעה לפני כשעתיים"],1,"הסימנים המכריעים הם צירים בתדירות של פחות מ-2 דקות ובעוצמה גבוהה, דחף בלתי נשלט ללחוץ או תחושת לחץ ביציאה, והכתרה — ראש התינוק נראה בפתח הנרתיק. במצב זה מתכוננים ללידה בשטח, מפני שנסיעה מסכנת את היולדת ואת התינוק. ריבוי לידות קודמות מקצר משמעותית את התהליך."],["לידה","מהו הדבר החשוב ביותר מיד לאחר יציאת ראש התינוק?",["הרמת הראש כלפי מעלה לשחרור הכתף","משיכת התינוק החוצה במהירות ובעדינות","הידוק וניתוק חבל הטבור באופן מיידי","בדיקה אם חבל הטבור כרוך סביב הצוואר וניגוב הפנים"],3,"מיד לאחר יציאת הראש בודקים אם חבל הטבור כרוך סביב הצוואר — מצב שכיח שעלול לחנוק את התינוק בהמשך הלידה. אם הוא רפוי, מחליקים אותו מעל הראש; אם הוא הדוק ולא ניתן לשחררו, מהדקים אותו בשתי מלחציים וחותכים ביניהן. במקביל מנגבים את הפנים. אין למשוך את התינוק ואין לנתק חבל טבור מוקדם."],["לידה","מהו הטיפול הראשוני ביילוד מיד לאחר הלידה?",["החדרת עירוי ומתן נוזלים מחוממים","מדידת משקל, אורך והיקף ראש","רחיצת היילוד במים פושרים וניקויו","ייבוש, חימום, מיקום נתיב אוויר וגירוי"],3,"ארבע הפעולות הראשוניות הן ייבוש יסודי — שהוא גם הגירוי העיקרי, חימום ומניעת אובדן חום, מיקום הראש בתנוחה ניטרלית לפתיחת נתיב האוויר, וגירוי עדין. רוב היילודים מגיבים לכך ומתחילים לנשום ולבכות. סקשן שגרתי אינו מומלץ עוד ושמור למצבים של חסימה. רחיצה ומדידות אינן דחופות."],["לידה","מהו סולם אפגר ומה מרכיביו?",["הערכה לפי צבע, דופק, תגובה, טונוס ונשימה","מדד למשקל הלידה ביחס לגיל ההיריון","מדד ללחץ הדם ולפרפוזיה של היילוד","מדד להערכת גיל ההיריון בשבועות"],0,"סולם אפגר מעריך חמישה פרמטרים, כל אחד בציון 0 עד 2: Appearance — צבע, Pulse — דופק, Grimace — תגובה לגירוי, Activity — טונוס שרירים, ו-Respiration — נשימה. הוא נמדד בדקה הראשונה ובדקה החמישית. חשוב מאוד: אין להמתין לציון אפגר כדי להתחיל החייאה — ההחלטה מבוססת על נשימה, דופק וטונוס."],["לידה","מהו הדופק התקין ביילוד ומהו הסף לפעולה?",["מעל 100 תקין; מתחת ל-100 הנשמה, מתחת ל-60 עיסויים","מעל 140 תקין; מתחת ל-140 נדרשת הנשמה","מעל 80 תקין; מתחת ל-80 נדרשים עיסויים","מעל 60 תקין; מתחת ל-60 נדרשות הנשמות"],0,"ביילוד דופק מעל 100 נחשב תקין. דופק מתחת ל-100 מחייב הנשמות בלחץ חיובי, שהן ההתערבות המרכזית והיעילה ביותר בהחייאת יילוד. דופק מתחת ל-60 למרות 30 שניות של הנשמה יעילה מחייב תוספת עיסויים ביחס 3 ל-1. הסיבה כמעט תמיד נשימתית, ולכן אוורור יעיל פותר את רוב המקרים."],["לידה","מהי הסיבה השכיחה ביותר לצורך בהחייאת יילוד?",["מום לב מולד שלא אובחן בהיריון","זיהום תוך-רחמי עם ספסיס של היילוד","דימום ניכר של היילוד בעת הלידה","כשל נשימתי — היילוד אינו מתחיל לנשום ביעילות"],3,"המעבר מחיים תוך-רחמיים לנשימה עצמאית דורש פינוי נוזל מהריאות ופתיחתן. כשהתהליך אינו מתרחש כראוי נוצרת היפוקסיה שמובילה לברדיקרדיה ולדיכוי. לכן ההתערבות המכריעה היא אוורור יעיל — היא פותרת את הרוב המכריע של המקרים. מומים, זיהום ודימום הם סיבות נדירות יחסית בלידה עצמה."],["לידה","מהו הטיפול ביילוד שאינו נושם לאחר ייבוש וגירוי?",["הנשמות בלחץ חיובי בקצב 40 עד 60 לדקה","המתנה של דקה עם המשך גירוי עדין","התחלת עיסויים מיידית ביחס 3 לאחת","מתן אדרנלין דרך חבל הטבור"],0,"אם היילוד אינו נושם או מתנשם בגניחות לאחר ייבוש וגירוי, מתחילים הנשמות בלחץ חיובי בקצב 40 עד 60 לדקה — הפעולה החשובה ביותר בהחייאת יילוד. יש לוודא שהחזה עולה. רק אם הדופק נותר מתחת ל-60 לאחר 30 שניות של אוורור יעיל, מוסיפים עיסויים. אדרנלין נשקל בשלב מאוחר בהרבה."],["לידה","מתי מהדקים וחותכים את חבל הטבור?",["מיד לאחר הלידה בכל מצב של היילוד","לאחר שעה של מגע עור לעור עם האם","לאחר יציאת השליה מחלל הרחם","לאחר דקה עד שלוש ביילוד יציב, ומיד אם נדרשת החייאה"],3,"ביילוד יציב ממתינים כדקה עד שלוש דקות לפני הידוק החבל — עיכוב שמאפשר מעבר דם נוסף מהשליה ומשפר את מאגרי הברזל ואת יציבות הלחץ. אם היילוד זקוק להחייאה מיידית, מהדקים וחותכים מיד. ההידוק נעשה בשתי מלחציים במרחק זה מזה, והחיתוך ביניהן במכשיר סטרילי."],["לידה","מהי צניחת חבל הטבור (Cord Prolapse) ומהו הטיפול?",["חבל טבור קצר מהרגיל שמותח את השליה","חבל הטבור כרוך סביב צוואר העובר","חבל טבור עבה מהרגיל שחוסם את התעלה","החבל יוצא לפני העובר ונלחץ — הרמת החלק המציג ופינוי"],3,"בצניחת חבל טבור החבל יוצא לפני העובר והראש לוחץ עליו, כך שאספקת הדם והחמצן לעובר נחסמת. זהו מצב חירום מיילדותי אמיתי. הטיפול הוא הרמה ידנית של החלק המציג בעדינות כדי להפחית לחץ מהחבל, השכבת היולדת בתנוחת טרנדלנבורג או בתנוחת ברכיים-חזה, כיסוי החבל בגזה לחה, חמצן ופינוי דחוף לניתוח קיסרי."],["לידה","מהי מצג עכוז (Breech) ומהי הגישה בשטח?",["הישבן או הרגליים ראשונים — פינוי דחוף וסיוע ללא משיכה","מצב תיאורטי שאינו מתרחש בלידות בשטח","הראש יוצא ראשון בתנוחה עורפית קדמית","העובר שוכב לרוחב הרחם ללא חלק מציג"],0,"במצג עכוז הישבן או הרגליים מציגים ראשונים, והסכנה היא לכידה של הראש לאחר יציאת הגוף — הראש הוא החלק הגדול ביותר והוא יוצא אחרון. הגישה המועדפת היא פינוי דחוף לניתוח קיסרי. אם הלידה מתקדמת ואין ברירה, תומכים בגוף ללא משיכה ומאפשרים ליציאה להתקדם בכוחות עצמה. משיכה גורמת ללכידת הראש."],["לידה","מהו דימום לאחר לידה ומהו הטיפול הראשוני?",["דימום קל ותקין הנמשך מספר שעות","דימום מוגבר — עיסוי רחם, הנקה, נוזלים ופינוי דחוף","דימום שנפסק באופן ספונטני תוך דקות","דימום צפוי שאינו דורש התערבות טיפולית"],1,"דימום לאחר לידה הוא סיבה מובילה לתמותת יולדות. הסיבה השכיחה ביותר היא אטוניה — רחם שאינו מתכווץ. הטיפול הראשוני הוא עיסוי הרחם דרך דופן הבטן עד להתקשותו, עידוד הנקה שמשחררת אוקסיטוצין טבעי, מתן נוזלים ופינוי דחוף. אין להחדיר דבר לנרתיק ואין למשוך את חבל הטבור בכוח."],["לידה","מהי המשמעות של מי שפיר ירוקים (Meconium)?",["ממצא תקין המופיע ברוב הלידות","העובר הפריש מקוניום — מצוקה עוברית וסיכון לשאיפה","סימן ללידה מוקדמת לפני שבוע 37","זיהום חיידקי של מי השפיר ושל הרחם"],1,"מקוניום במי השפיר מעיד לרוב על מצוקה עוברית שגרמה להרפיית הסוגר. הסכנה היא שאיפת מקוניום לריאות, שגורמת לחסימה ולדלקת כימית קשה. הגישה העדכנית: אם היילוד נמרץ ובוכה — מטפלים כרגיל. אם הוא רפוי ואינו נושם — מתחילים אוורור מיידית. סקשן טרכאלי שגרתי אינו מומלץ עוד."],["לידה","מהו הטיפול ביילוד לאחר לידה בשטח לשמירה על חום גופו?",["רחיצת היילוד במים חמים לחימום מהיר","השארת היילוד חשוף לאוויר החדר","ייבוש, החלפת מגבת, כיסוי הראש ומגע עור לעור","עטיפה בניילון בלבד ללא ייבוש מוקדם"],2,"היילוד מאבד חום במהירות רבה בשל שטח פנים גדול, עור רטוב ורזרבת שומן קטנה. הפעולות הן ייבוש מיידי והחלפת המגבת הרטובה ביבשה, כיסוי הראש שדרכו אובד חום רב, ומגע עור לעור עם האם תחת שמיכה. היפותרמיה ביילוד גורמת להיפוגליקמיה, לחמצת ולהחמרת מצוקה נשימתית."],["לידה","מהי כתפיים נעוצות (Shoulder Dystocia) ומהו התמרון הראשוני?",["חבל הטבור נעוץ בין הכתף לעצם החיק","העובר שוכב לרוחב הרחם ללא חלק מציג","הכתפיים נתקעות לאחר יציאת הראש — תמרון מקרוברטס","ראש העובר אינו יוצא למרות הצירים"],2,"בכתפיים נעוצות הראש יוצא אך הכתף הקדמית נתקעת מאחורי עצם החיק. זהו מצב חירום — חבל הטבור נלחץ והזמן קריטי. התמרון הראשון הוא מקרוברטס: כיפוף חד של ירכי היולדת אל בטנה, שמסובב את האגן ומשחרר את הכתף. ניתן להוסיף לחץ סופרה-פובי מעל עצם החיק. אין למשוך את הראש בכוח ואין ללחוץ על קרקעית הרחם."],["לידה","מהי שליית פתח (Placenta Previa) וכיצד היא מתבטאת?",["שליה המכסה את צוואר הרחם — דימום בהיר ללא כאב","שליה קטנה מהרגיל עם אי ספיקה שלייתית","זיהום חיידקי של השליה ושל מי השפיר","היפרדות של השליה מדופן הרחם"],0,"בשליית פתח השליה ממוקמת נמוך ומכסה את צוואר הרחם. הביטוי הקלאסי הוא דימום וגינלי בהיר ופתאומי ללא כאב, בעיקר בשליש השלישי. זאת בניגוד להיפרדות שליה שבה יש כאב ורחם קשה. הכלל הקריטי: אין לבצע בדיקה וגינלית פנימית בדימום בהיריון מתקדם — היא עלולה לגרום לדימום קטלני."],["לידה","מהו היריון חוץ רחמי ומהי הסכנה בו?",["השרשה מחוץ לרחם, לרוב בחצוצרה — סכנת קרע ודימום","היריון הנמשך מעבר לשבוע 42 להיריון","היריון תקין המתפתח מחוץ לחלל הרחם","היריון תאומים עם סיכון ללידה מוקדמת"],0,"בהיריון חוץ רחמי הביצית המופרית משתרשת מחוץ לחלל הרחם, ברוב המקרים בחצוצרה. עם גדילת ההיריון החצוצרה נקרעת וגורמת לדימום תוך-בטני מסיבי. התמונה הקלאסית היא אישה בגיל הפוריות עם כאב בטן תחתונה, איחור במחזור, ולעיתים דימום מועט וסימני הלם. זהו מצב חירום מסכן חיים שדורש ניתוח."],["לידה","מהו הטיפול ביולדת עם דימום וגינלי לפני הלידה?",["ביצוע בדיקה וגינלית פנימית להערכת המקור","חמצן, נוזלים, הטיה שמאלה, ספירת פדים ופינוי דחוף","המתנה בבית עד להתייצבות הדימום","החדרת פד לנרתיק לספיגת הדימום"],1,"בדימום בהיריון מתקדם אין לבצע בדיקה וגינלית פנימית ואין להחדיר דבר לנרתיק — בשליית פתח פעולה זו עלולה לגרום לדימום קטלני. הטיפול הוא חמצן, מתן נוזלים, הטיה שמאלה למניעת לחץ על הווריד הנבוב, ספירת פדים להערכת כמות הדימום, ופינוי דחוף. שמירת חום חשובה אף היא."],["לידה","מהו הסימן להפרדות השליה לאחר הלידה?",["התארכות חבל הטבור, זרם דם קצר ושינוי בצורת הרחם","הפסקה מוחלטת של הצירים לאחר הלידה","ירידה בלחץ הדם ועלייה בקצב הלב","דימום מסיבי ופתאומי מהנרתיק"],0,"סימני היפרדות השליה הם התארכות של החלק החיצוני של חבל הטבור, זרם דם קצר ופתאומי, ושינוי בצורת הרחם שהופך עגול וגבוה יותר. השליה יוצאת לרוב תוך 5 עד 30 דקות. אין למשוך את חבל הטבור כדי לזרז — משיכה עלולה לגרום להיפוך רחם או לקריעת החבל. את השליה מביאים לבית החולים לבדיקת שלמות."],["לידה","מהי הגישה כאשר השליה אינה יוצאת תוך 30 דקות?",["משיכה נמרצת של חבל הטבור לזירוז","המתנה של שעתיים נוספות במקום","פינוי היולדת לבית החולים עם ניטור הדימום","הכנסת יד לחלל הרחם להוצאת השליה"],2,"אם השליה אינה יוצאת תוך כ-30 דקות, מפנים את היולדת לבית החולים תוך ניטור צמוד של הדימום והמדדים. משיכה של חבל הטבור עלולה לגרום להיפוך רחם — סיבוך קטלני — או לקריעת החבל ולהשארת שליה כלואה. הכנסת יד לרחם היא פעולה בית חולימית ואינה מבוצעת בשטח."],["לידה","מהו הסיוע הנכון בעת יציאת גוף התינוק?",["משיכה מהירה של הגוף לאחר יציאת הראש","סיבוב הגוף ב-180 מעלות לשחרור הכתפיים","הרמה מיידית של התינוק אל בטן האם","תמיכה והכוונה עדינה מטה לכתף הקדמית ואז מעלה"],3,"לאחר יציאת הראש הוא מסתובב באופן טבעי. תומכים בו בשתי הידיים ומכוונים בעדינות כלפי מטה לשחרור הכתף הקדמית, ואז בעדינות כלפי מעלה לשחרור הכתף האחורית. לאחר מכן הגוף יוצא במהירות ויש להיערך לכך — התינוק חלקלק. אין למשוך ואין לסובב בכוח — פעולות אלה פוגעות במקלעת הזרוע ובעמוד השדרה."],["לידה","מהו הטיפול הראשוני ביילוד פג שנולד בשטח?",["טיפול זהה לחלוטין ליילוד בשל","המתנה ללא התערבות עד להגעה ליחידת פגים","דגש על שמירת חום, תמיכה נשימתית ומניעת היפוגליקמיה","קירור מכוון להפחתת הצריכה המטבולית"],2,"פג נמצא בסיכון גבוה במיוחד להיפותרמיה בשל עור דק, שטח פנים גדול והיעדר שומן חום — ולכן שמירת החום היא בראש סדר העדיפויות, כולל שקילת עטיפה בניילון ייעודי. בנוסף חסר סורפקטנט גורם למצוקה נשימתית, ומאגרי הגליקוגן הדלים מובילים להיפוגליקמיה. הפינוי הוא ליחידת פגים."],["לידה","מהו התפקיד של הפחתת גירויים ביולדת עם רעלת היריון?",["האצת תהליך הלידה וקיצור השלב השני","הגברת נוחות היולדת והפחתת חרדתה","הפחתת הדימום הווגינלי לאחר הלידה","אור, רעש ומגע עלולים לעורר פרכוס אקלמפטי"],3,"במצב של רעלת היריון קשה המוח נמצא במצב רגיש, וגירויים חיצוניים כמו אור חזק, רעש פתאומי ומגע מיותר עלולים לעורר פרכוס אקלמפטי. לכן מטפלים בסביבה שקטה ומוחשכת, מצמצמים פעולות מיותרות ומעבירים בעדינות. זהו חלק ממשי מהטיפול הרפואי ולא רק שיפור נוחות."],["לידה","מהו הסימן להיפוך רחם (Uterine Inversion)?",["רחם שהתהפך והתפרץ דרך הנרתיק — דימום והלם","רחם קשה ובולט מעל קו הטבור","רחם קטן מהרגיל שאינו מתכווץ כראוי","היעדר מוחלט של דימום לאחר הלידה"],0,"היפוך רחם הוא סיבוך נדיר וקטלני שבו הרחם מתהפך פנימה החוצה, לרוב בעקבות משיכה של חבל הטבור או לחץ על קרקעית הרחם. התוצאה היא דימום מסיבי והלם, לעיתים גם עם תגובה וגאלית קשה. הטיפול הוא טיפול אגרסיבי בהלם ופינוי מיידי. זו הסיבה המרכזית לאיסור המוחלט על משיכת חבל הטבור."],["לידה","מהי חשיבות ההנקה מיד לאחר הלידה?",["חשיבות תזונתית ואימונולוגית ליילוד","אין להנקה חשיבות בשעות הראשונות","ההנקה מחליפה טיפול רפואי בדימום","שחרור אוקסיטוצין שמכווץ את הרחם ומפחית דימום"],3,"גירוי הפטמה משחרר אוקסיטוצין טבעי מבלוטת יותרת המוח, שגורם להתכווצות הרחם ובכך מפחית משמעותית את הדימום שלאחר הלידה. בנוסף היא תורמת לוויסות חום התינוק, ליציבות הסוכר ולקשר בין האם לתינוק. זהו כלי טיפולי זמין ויעיל בשטח, במיוחד כשאין תרופות."],["אקלים ובעלי חיים","מהם ארבעת מנגנוני העברת החום מהגוף לסביבה?",["הולכה, הסעה, קרינה והתאדות","דחיסה, התפשטות, זרימה, סינון","חימום, קירור, בידוד, ריכוז","הזעה, נשימה, שתן, צואה"],0,"הולכה היא העברת חום במגע ישיר בין שני עצמים — למשל שכיבה על קרקע קרה. הסעה היא העברת חום לאוויר או לנוזל שנע מעל הגוף — למשל רוח. קרינה היא העברת אנרגיה ללא מתווך לעצם קר יותר. התאדות היא אובדן חום דרך הזעה ונשימה — והיא המנגנון היעיל ביותר בסביבה חמה, אך היא מפסיקה לפעול בלחות גבוהה."],["אקלים ובעלי חיים","מהי טמפרטורת גוף תקינה והיכן ממוקם מרכז ויסות החום?",["כ-37 מעלות — המרכז בהיפותלמוס במוח","כ-38 מעלות — המרכז בבלוטת התריס","כ-36 מעלות — המרכז בגזע המוח","כ-35 מעלות — המרכז בחוט השדרה"],0,"טמפרטורת הגוף התקינה היא כ-37 מעלות בתוספת או בחיסור של כ-0.6 מעלות. מרכז ויסות החום ממוקם בהיפותלמוס, והוא פועל בשתי דרכים: ויסות פיזיולוגי — הזעה, רעד, כיווץ והרחבת כלי דם, וויסות התנהגותי — פעולה מודעת לשינוי תנאי אי נוחות, כמו לבישת בגדים או חיפוש צל."],["אקלים ובעלי חיים","מהי התייבשות ומאיזה אחוז אובדן נוזלים היא פוגעת בתפקוד?",["אובדן של מעל 2 אחוז פוגע בתפקוד הרציונלי","אובדן של מעל 30 אחוז מנוזלי הגוף","אובדן של מעל 20 אחוז מנוזלי הגוף","אובדן של מעל 10 אחוז מנוזלי הגוף"],0,"אובדן של מעל 2 אחוז מנוזלי הגוף כבר פוגע בתפקוד הרציונלי ובביצועים. הסיבות הן חוסר בשתייה, הזעה מוגברת, הקאות ושלשולים. הסימנים כוללים ירידה בתדירות מתן שתן וצבע כהה, צמא, ריריות יבשות, דופק ונשימה מהירים, סחרחורת ובלבול, בחילות, כאבי ראש, חולשה ועילפון."],["אקלים ובעלי חיים","מהי תשישות חום ומהם ביטוייה?",["חום 37 עד 40 עם עור חיוור וקר, טכיקרדיה וחולשה","חום מעל 40 מעלות עם שינוי במצב ההכרה","חום גוף תקין ללא תסמינים או ממצאים","חום גוף נמוך מ-35 מעלות עם רעד וקשיון"],0,"בתשישות חום מנגנוני הוויסות עדיין פועלים, אך הגוף מתקשה לעמוד בעומס. חום הליבה נע בין 37 ל-40 מעלות והמאזן הנוזלי שלילי — אובדן של מעל 5 אחוז ממשקל הגוף. הביטויים הם עור חיוור, קר ודביק, טכיקרדיה, מיעוט מתן שתן, כאבי ראש, חולשה, סחרחורת, בחילות, צמרמורות ואפתיה. הטיפול הוא מנוחה בצל, קירור והחזר נוזלים."],["אקלים ובעלי חיים","מהם שני סוגי מכת החום?",["מכת חום קלה ומכת חום קשה","קלאסית מחשיפה סביבתית, ומכת חום לאחר מאמץ","מכת חום ראשונית ומכת חום משנית","מכת חום חיצונית ומכת חום פנימית"],1,"מכת חום קלאסית מתפתחת באיטיות בקשישים, בילדים ובחולים כרוניים החשופים לחום סביבתי גבוה, לרוב ללא מאמץ ולעיתים עם עור יבש. מכת חום לאחר מאמץ מתפתחת במהירות בצעירים בריאים המתאמצים בתנאי חום, והעור עשוי להיות עדיין מזיע. שתי הצורות מסכנות חיים ומחייבות קירור מיידי."],["אקלים ובעלי חיים","מהו הטיפול המיידי במכת חום?",["קירור אגרסיבי מיידי בכל אמצעי — לפני הפינוי","מתן נוזלים קרים דרך הפה בלבד","חימום הדרגתי למניעת רעד וכיווץ כלי דם","המתנה לפינוי וקירור בחדר המיון"],0,"בכת חום כל דקה בטמפרטורה גבוהה גורמת נזק תאי בלתי הפיך, ולכן הכלל הוא לקרר תחילה ולפנות אחר כך. הקירור נעשה בכל אמצעי — התזת מים רבים ורצוי קרים, שקיות קרח באזורי כלי דם גדולים, הפעלת אוורור או מיזוג, והפשטה. במקביל מוערכים ABC ומותקן עירוי. שוקלים דורמיקום אם מופיעים רעד קיצוני או פרכוסים."],["אקלים ובעלי חיים","כיצד נמדדת טמפרטורת הגוף בחשד למכת חום?",["מדידה רקטלית — המשקפת נאמנה את חום הליבה","מדידה בכף היד או בקצה האצבע","מדידה במצח באמצעות מדחום אינפרה-אדום","מדידה אקסילרית מתחת לבית השחי"],0,"מדידה רקטלית היא היחידה שמשקפת נאמנה את טמפרטורת הליבה, ולכן היא הנדרשת בחשד למכת חום ובחשד להיפותרמיה. מדידה אקסילרית או פומית מתאימה למטופלים בהכרה מלאה וללא חשד למכת חום. מדידת מצח או אוזן מושפעת מטמפרטורת הסביבה ואינה אמינה במצבי קיצון."],["אקלים ובעלי חיים","מהי הרעלת מים (היפונתרמיה) ומהי הסיבה לה?",["חסר בברזל עם אנמיה ותשישות כללית","עודף סוכר בדם עם מתן שתן אוסמוטי","ירידה בריכוז הנתרן — אובדן בהזעה ושתיית מים מרובה","עודף נתרן בפלזמה מצריכת מלח מרובה"],2,"בהזעה ממושכת אובדים גם מים וגם נתרן. כאשר המאמץ מלווה בשתיית מים מרובה ללא מלחים, ריכוז הנתרן בפלזמה נדלל עוד יותר. הביטויים הם בחילות והקאות, כאבי ראש, שינוי במצב הכרה, מתן שתן בכמויות גדולות, אטקסיה, עלייה בלחץ תוך-גולגולתי ופרכוסים. הטיפול הוא צריכת מים מבוקרת, מאכלים מלוחים ומתן NaCl 0.9 אחוז."],["אקלים ובעלי חיים","מהי היפותרמיה ומהן דרגותיה?",["מתחת ל-35 — קלה 35 עד 32, בינונית 32 עד 28, קשה מתחת ל-28","חום ליבה מתחת ל-20 מעלות בלבד","חום ליבה מתחת ל-37 מעלות בשלוש דרגות","חום ליבה מתחת ל-30 מעלות בלבד"],0,"היפותרמיה מוגדרת כטמפרטורת ליבה מתחת ל-35 מעלות. בדרגה קלה, 35 עד 32, מופיעים עור קר וחיוור, רעידות, בלבול, ירידה בקואורדינציה והשתנה מרובה. בדרגה בינונית, 32 עד 28, הרעידות פוסקות ומופיעים ערפול הכרה, קשיון שרירים, האטה בדופק ובנשימה וירידה בלחץ הדם. מתחת ל-28 היא קשה."],["אקלים ובעלי חיים","מדוע פוסקות הרעידות בהיפותרמיה בינונית?",["הגוף התחמם והרעד כבר אינו נדרש","הרעידות אינן קשורות לוויסות חום הגוף","מנגנון ייצור החום קורס — סימן להחמרה","המטופל נרגע והמתח השרירי פחת"],2,"רעד הוא מנגנון ייצור חום פעיל שצורך אנרגיה. כאשר חום הליבה יורד מתחת לכ-32 מעלות, מאגרי הגליקוגן מתרוקנים והמנגנון קורס — הרעידות פוסקות. לכן הפסקת רעד במטופל קר היא סימן מדאיג להחמרה, ולא סימן לשיפור. במקביל מופיעים קשיון שרירים, האטה בדופק ובנשימה וירידה בהכרה."],["אקלים ובעלי חיים","מהו הטיפול בהיפותרמיה בשטח?",["הרחקה מהקור, הפשטה מבגד רטוב, חימום הדרגתי וניטור סוכר","מתן אלכוהול או קפאין לחימום פנימי","עיסוי נמרץ של הגפיים לשיפור הזרימה","חימום מהיר ב
