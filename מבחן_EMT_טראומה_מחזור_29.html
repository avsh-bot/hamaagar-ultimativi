:root{
  --orange:#E07B39; --orange-dk:#C25E22; --orange-lt:#FDF1E7;
  --blue:#1B4965;   --blue-md:#2E6E94;   --blue-lt:#E8F1F6;
  --red:#C0392B;    --red-lt:#FCEDEB;
  --gray-900:#22282D; --gray-700:#4A555E; --gray-500:#7A868F;
  --gray-300:#CBD3D9; --gray-150:#E6EBEF; --gray-50:#F5F7F9;
  --green:#2E7D5B; --green-lt:#E9F5EF;
  --shadow:0 2px 10px rgba(27,73,101,.08);
  --shadow-lg:0 8px 30px rgba(27,73,101,.14);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:linear-gradient(170deg,#F7F9FB 0%,#EFF4F7 100%);
  color:var(--gray-900); line-height:1.65; min-height:100vh;
  padding:16px; direction:rtl;
}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;line-height:1.3}
.wrap{max-width:860px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid var(--gray-150)}

/* ---------- header ---------- */
.exam-header{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--blue) 0%,#154056 100%);
  color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.exam-header::after{content:"";position:absolute;inset-inline-start:-40px;top:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(224,123,57,.28),transparent 68%);pointer-events:none}
.cohort-logo{width:84px;height:84px;flex-shrink:0;border-radius:12px;background:rgba(255,255,255,.94);padding:5px;position:relative;z-index:1}
.exam-header h1{font-size:1.55rem;margin-bottom:3px;position:relative;z-index:1}
.exam-subtitle{font-size:.9rem;opacity:.9;font-weight:300;position:relative;z-index:1}

/* ---------- buttons ---------- */
.btn{font-family:inherit;font-size:1rem;font-weight:500;border:none;border-radius:10px;padding:11px 20px;cursor:pointer;
  transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(224,123,57,.32)}
.btn-primary:hover{background:var(--orange-dk)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-md)}
.btn-ghost{background:var(--gray-50);color:var(--gray-700);border:1.5px solid var(--gray-300)}
.btn-ghost:hover{background:var(--gray-150)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:var(--red-lt);color:var(--red);border:1.5px solid #EBC2BD}
.btn-danger:hover{background:#F8DDD9}
.btn-sm{padding:8px 14px;font-size:.9rem}

/* ---------- home ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.mode-grid{grid-template-columns:1fr}}
.mode{border:2px solid var(--gray-150);border-radius:var(--radius);padding:22px;cursor:pointer;transition:.18s;background:#fff;text-align:start}
.mode:hover{border-color:var(--orange);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.mode .ic{font-size:2.1rem;line-height:1;margin-bottom:10px}
.mode h3{font-size:1.2rem;color:var(--blue);margin-bottom:6px}
.mode p{font-size:.92rem;color:var(--gray-700);margin-bottom:12px}
.pill{display:inline-block;background:var(--orange-lt);color:var(--orange-dk);font-size:.8rem;font-weight:500;
  padding:3px 11px;border-radius:20px}
.pill.blue{background:var(--blue-lt);color:var(--blue)}

/* ---------- setup ---------- */
.sec-title{font-size:1.05rem;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.topic{display:flex;align-items:center;gap:9px;border:1.5px solid var(--gray-150);border-radius:9px;padding:9px 12px;
  cursor:pointer;font-size:.92rem;transition:.14s;background:var(--gray-50)}
.topic:hover{border-color:var(--blue-md);background:#fff}
.topic.on{background:var(--blue-lt);border-color:var(--blue-md);color:var(--blue);font-weight:500}
.topic input{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0}
.topic .cnt{margin-inline-start:auto;font-size:.8rem;color:var(--gray-500);font-weight:400}
.len-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.len{border:1.5px solid var(--gray-300);border-radius:9px;padding:9px 17px;cursor:pointer;font-size:.94rem;background:#fff;transition:.14s}
.len:hover{border-color:var(--orange)}
.len.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:500}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.progress-shell{flex:1;min-width:150px;height:9px;background:var(--gray-150);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),#F0A264);border-radius:20px;transition:width .3s ease;width:0}
.counter{font-size:.9rem;color:var(--gray-700);font-weight:500;white-space:nowrap}
.score-chip{background:var(--blue-lt);color:var(--blue);border-radius:20px;padding:4px 13px;font-size:.86rem;font-weight:500;white-space:nowrap}
.qtopic{display:inline-block;background:var(--gray-50);border:1px solid var(--gray-150);color:var(--gray-700);
  font-size:.8rem;padding:3px 11px;border-radius:20px;margin-bottom:12px}
.qtext{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.24rem;font-weight:700;line-height:1.55;margin-bottom:18px;color:var(--gray-900)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:11px;border:1.8px solid var(--gray-150);border-radius:11px;padding:13px 15px;
  cursor:pointer;transition:.14s;background:#fff;font-size:1rem;text-align:start;font-family:inherit;line-height:1.55;width:100%}
.opt:hover:not(.locked){border-color:var(--orange);background:var(--orange-lt)}
.opt.locked{cursor:default}
.opt .mark{width:26px;height:26px;border-radius:50%;background:var(--gray-50);border:1.5px solid var(--gray-300);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:var(--gray-700);flex-shrink:0;margin-top:1px}
.opt.correct{border-color:var(--green);background:var(--green-lt)}
.opt.correct .mark{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-lt)}
.opt.wrong .mark{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.62}

.fb{margin-top:16px;border-radius:11px;padding:15px 17px;border-inline-start:4px solid;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--green-lt);border-color:var(--green)}
.fb.no{background:var(--red-lt);border-color:var(--red)}
.fb .fb-h{font-weight:700;font-family:'Frank Ruhl Libre',serif;font-size:1.05rem;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.fb.ok .fb-h{color:var(--green)}
.fb.no .fb-h{color:var(--red)}
.fb .fb-b{font-size:.97rem;color:var(--gray-700);line-height:1.7}
.navrow{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}

/* ---------- results ---------- */
.ring-wrap{display:flex;justify-content:center;margin:10px 0 18px}
.ring{position:relative;width:172px;height:172px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-family:'Frank Ruhl Libre',serif;font-size:2.6rem;font-weight:900;color:var(--blue);line-height:1}
.ring .lbl{font-size:.85rem;color:var(--gray-500)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
.stat{background:var(--gray-50);border-radius:11px;padding:13px;text-align:center;border:1px solid var(--gray-150)}
.stat .n{font-family:'Frank Ruhl Libre',serif;font-size:1.5rem;font-weight:700;line-height:1.2}
.stat .t{font-size:.8rem;color:var(--gray-500)}
.stat.g .n{color:var(--green)} .stat.r .n{color:var(--red)} .stat.b .n{color:var(--blue)}
.bd{margin-bottom:9px}
.bd-h{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.bd-h .p{color:var(--gray-500);font-size:.85rem}
.bar{height:8px;background:var(--gray-150);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px}
.hidden{display:none!important}
.note{font-size:.87rem;color:var(--gray-500);background:var(--gray-50);border-radius:9px;padding:11px 13px;
  border-inline-start:3px solid var(--gray-300);margin-top:14px}
@media(max-width:600px){
  body{padding:11px}
  .card{padding:17px}
  .cohort-logo{width:60px;height:60px}
  .exam-header{padding:14px 15px;gap:12px}
  .exam-header h1{font-size:1.2rem}
  .qtext{font-size:1.1rem}
  .stats{grid-template-columns:1fr 1fr}
}
@media print{body{background:#fff}.exam-header{box-shadow:none}}
</style>
</head>

<script>
var PRACTICE=[["מבוא ל-PHTLS","מהו הסדר הנכון של שלבי הסקר הראשוני בטראומה על פי PHTLS?",["C-A-B-D-E","X-A-B-C-D-E","A-B-C-D-E","A-B-C-X-D-E"],1,"בגישת ה-PHTLS העדכנית הוקדם שלב ה-X לפני נתיב האוויר, מפני שדימום עורקי פורץ הורג תוך דקות ספורות — מהר יותר מחסימת נתיב אוויר. לכן עוצרים אותו קודם. הסדר הישן A-B-C-D-E אינו כולל את ה-X. הסדר C-A-B שייך להחייאה במצבים לא טראומטיים, שבה עיסויים קודמים לנתיב אוויר."],["מבוא ל-PHTLS","מהי הפעולה הראשונה בעדיפות לעצירת דימום פורץ מגפה?",["הרמת הגפה מעל גובה הלב","הפעלת לחץ ישיר","חבישה לוחצת עם תחבושת אישית","הנחת חוסם עורקים"],1,"לחץ ישיר הוא הפעולה הראשונה בעדיפות משום שהוא זמין מיידית, אינו דורש ציוד ויעיל ברוב הדימומים. חוסם עורקים הוא העדיפות השנייה, כאשר הלחץ הישיר נכשל או כשמדובר בקטיעה או בריבוי נפגעים. הרמת גפה לא הוכחה כיעילה כשיטה עצמאית ואינה מופיעה עוד כהמלצה. חבישה לוחצת היא המשך של הלחץ הישיר ולא תחליף לו בשלב הראשון."],["מבוא ל-PHTLS","מה נבדק בשלב ה-D של הסקר הראשוני?",["חשיפה מלאה של הפצוע ושמירה על חום גופו","הערכת דופק, מילוי קפילרי ומצב העור","הערכת קצב, עומק וסדירות הנשימה","הערכת מצב הכרה, אישונים ותנועה גסה של גפיים"],3,"שלב ה-D הוא Disability — הערכה נוירולוגית מהירה הכוללת מצב הכרה לפי AVPU או GCS, בדיקת אישונים ותנועה גסה של הגפיים. חשיפה ושמירה על חום שייכות לשלב ה-E, הערכת דופק ומילוי קפילרי שייכות ל-C, והערכת קצב ועומק הנשימה שייכת ל-B."],["מבוא ל-PHTLS","פצוע פותח עיניים רק בתגובה לכאב. כיצד יסווג לפי AVPU?",["Verbal","Alert","Pain","Unresponsive"],2,"AVPU היא סולם מהיר בן ארבע דרגות. Alert הוא ער וממוקד ספונטנית, Verbal הוא מגיב לפנייה קולית, Pain הוא מגיב רק לגירוי כאב, ו-Unresponsive הוא ללא כל תגובה. פצוע שפותח עיניים רק לכאב מסווג כ-P. חשוב לזכור ש-P או U מתאימים בערך ל-GCS 8 ומטה ומחייבים התייחסות לנתיב האוויר."],["מבוא ל-PHTLS","מהי מטרת שלב ה-E בסקר הראשוני?",["הערכה נוירולוגית של הכרה, אישונים ותנועת גפיים","חשיפת הפצוע לאיתור פציעות ומניעת היפותרמיה","הערכת בטיחות הזירה טרם הגישה אל הפצוע","הערכת יעילות האוורור והחמצון בבית החזה"],1,"שלב ה-E הוא Exposure — הפשטת הפצוע כדי לא לפספס פציעות נסתרות, ומיד לאחר מכן כיסוי ושמירה על חום הגוף. היפותרמיה בטראומה היא חלק משילוש המוות יחד עם חמצת וקרישיות לקויה, ולכן החימום אינו נוחות אלא טיפול. הערכה נוירולוגית שייכת ל-D, אוורור ל-B, ובטיחות הזירה לשלב ה-S המקדים."],["מבוא ל-PHTLS","מהו שילוש המוות (Trauma Triad of Death) בטראומה?",["דימום, זיהום, כשל רב מערכתי","היפותרמיה, חמצת וקרישיות לקויה","היפוקסיה, היפוולמיה, היפוגליקמיה","היפוקסיה, היפרקפניה, בצקת מוחית"],1,"שילוש המוות מתאר מעגל קסמים הרסני: היפותרמיה פוגעת בתפקוד אנזימי הקרישה, הקרישיות הלקויה מחמירה את הדימום, הדימום גורם להיפופרפוזיה ולחמצת מטבולית, והחמצת בתורה מדכאת עוד יותר את הקרישה ואת תפקוד שריר הלב. כל צלע מזינה את השתיים האחרות. מכאן החשיבות של שמירת חום, נוזלים מחוממים ופינוי מהיר."],["מבוא ל-PHTLS","מהי משמעות שעת הזהב (Golden Hour) בטראומה?",["הזמן שבו יש להשלים את הסקר השניוני בזירה","הזמן המרבי המותר לשהיית הצוות בזירה","חלון הזמן שבו טיפול מכריע משפר את ההישרדות","משך הזמן שבו כדאי להמשיך החייאה בטראומה"],2,"שעת הזהב מבטאת את התפיסה שהתערבות מכרעת — בעיקר ניתוח לעצירת דימום — בשעה הראשונה מהפגיעה משפרת דרמטית את הישרדות הפצוע. בפועל היום מדברים יותר על תקופת הזהב ועל עשר דקות הפלטינה בשטח, מפני שהחלון משתנה לפי סוג הפגיעה. זהו אינו זמן מוקצב לסקר שניוני ואינו מגביל את משך ההחייאה."],["מבוא ל-PHTLS","כמה זמן מומלץ שצוות ישהה בזירה עם פצוע קריטי?",["עד 10 דקות","עד 30 דקות","עד 20 דקות","עד 5 דקות בכל מקרה"],0,"עשר דקות הפלטינה הוא היעד המקובל לשהות בזירה עם פצוע דחוף. בזמן זה מבצעים רק פעולות מצילות חיים — עצירת דימום, נתיב אוויר, ניקור חזה ובידוד פצע יונק — וכל השאר נעשה בדרך. הסיבה היא שהטיפול המכריע בדימום פנימי הוא ניתוח, וכל דקה נוספת בשטח היא איבוד דם. עם זאת אין זה כלל נוקשה ובחילוץ ממושך הזמן עשוי להתארך בהכרח."],["מבוא ל-PHTLS","פצוע מגיב רק לכאב, נושם 8 נשימות בדקה. מה הפעולה הראשונה?",["סיוע נשימתי במפוח עם חמצן","קיבוע לוח גב מיידי","פתיחת עירוי ומתן נוזלים","מדידת סטורציה והנחת מסכת חמצן"],0,"קצב נשימה של 8 בדקה הוא ברדיפנאה שאינה מספקת אוורור דקה מספק, ולכן היא מחייבת סיוע נשימתי אקטיבי במפוח ולא רק מתן חמצן. מסכת חמצן פסיבית מעלה את ריכוז החמצן אך אינה מפנה CO2 ואינה מגדילה את הנפח הדקתי. קיבוע ונוזלים חשובים בהמשך אך אינם קודמים לכשל אוורור בשלב ה-B."],["מבוא ל-PHTLS","באילו נסיבות יש עדיפות לחוסם עורקים על פני לחץ ישיר כפעולה ראשונה?",["בכל דימום עורקי מגפה עליונה או תחתונה","בפצוע יחיד עם דימום ורידי מתמשך מהזרוע","בדימום מפצע נרחב בראש או בצוואר","באירוע רב נפגעים או בקטיעה טראומטית"],3,"חוסם עורקים מוקדם עדיף כאשר אין אפשרות מעשית להפעיל לחץ ישיר מתמשך — למשל באירוע רב נפגעים שבו מטפל אחד מטפל בכמה פצועים, בקטיעה טראומטית, בזירה לא בטוחה או תחת אש. בדימום שגרתי מגפה מתחילים תמיד בלחץ ישיר. בדימום מהראש והצוואר לא ניתן להשתמש בחוסם עורקים כלל, ומשתמשים בלחץ ישיר או בפאקינג."],["מבוא ל-PHTLS","מהי הפעולה הנכונה בפתיחת נתיב אוויר בפצוע טראומה עם חשד לפגיעת צוואר?",["סיבוב הראש לצד","Jaw Thrust","הטיית ראש מלאה לאחור","Head Tilt Chin Lift"],1,"Jaw Thrust — דחיקת הלסת קדימה — מרימה את הלשון מהלוע מבלי להזיז את עמוד השדרה הצווארי, ולכן היא שיטת הבחירה בכל חשד לפגיעת צוואר. Head Tilt Chin Lift דורשת הטיית ראש לאחור ומסכנת חוט שדרה פגוע. סיבוב הראש לצד מסוכן במיוחד. אם ה-Jaw Thrust נכשל וכשל נתיב האוויר מסכן חיים, נתיב אוויר גובר על שיקולי הצוואר."],["מבוא ל-PHTLS","מתי אין להחדיר מנתב אוויר לוע-פה (OPA)?",["בפצוע עם חשד לשבר בבסיס הגולגולת","בפצוע עם דימום פעיל מהאף ומהלוע","בפצוע ללא הכרה שרפלקס ההקאה שלו שמור","בפצוע ללא הכרה שאינו נושם באופן עצמוני"],2,"OPA מותר רק בחסר הכרה עמוק ללא רפלקס הקאה. אם הרפלקס שמור, המנתב יגרום להקאה ולשאיפת תוכן קיבה. חשד לשבר בבסיס הגולגולת הוא התווית נגד למנתב אף-לוע (NPA) בשל הסכנה לחדירה לחלל הגולגולת, לא ל-OPA. דימום מהאף אינו מונע שימוש ב-OPA."],["מבוא ל-PHTLS","מהו סימן מוקדם ואמין לירידה בפרפוזיה בפצוע טראומה?",["טכיקרדיה ועור קר, חיוור ולח","הרחבת אישונים דו-צדדית","ירידה בלחץ הדם הסיסטולי","ירידה בסטורציה מתחת ל-90 אחוז"],0,"מנגנוני הפיצוי הסימפתטיים פועלים הרבה לפני שלחץ הדם יורד: הדופק מואץ, כלי הדם ההיקפיים מתכווצים והעור נעשה קר, חיוור ולח. ירידה בלחץ הדם היא סימן מאוחר שמופיע רק לאחר אובדן של כ-30 אחוז מנפח הדם, ולכן ההסתמכות עליה מסוכנת. סטורציה נמוכה ואישונים מורחבים אינם ספציפיים להיפופרפוזיה מוקדמת."],["מבוא ל-PHTLS","איזה ממצא בסקר הראשוני מחייב הגדרת הפצוע כדחוף?",["פצע שטחי בקרקפת שדימומו נעצר בלחץ","כאב בטן קל ללא רגישות או שמירה בבדיקה","קצב נשימה 26 עם שימוש בשרירי עזר","שבר סגור בזרוע עם דופק היקפי נמוש ותקין"],2,"קצב נשימה מעל 20 בדקה יחד עם מאמץ נשימתי ניכר הוא אחד הקריטריונים המובהקים להגדרת פצוע כדחוף, מפני שהוא מעיד על כשל נשימתי מתפתח או על ניסיון פיצוי על חמצת. שבר סגור עם דופק תקין, פצע קרקפת שנעצר וכאב בטן קל ללא ממצאים אינם מסכני חיים מיידית ואינם מחייבים הגדרה כדחוף בפני עצמם."],["מבוא ל-PHTLS","מהו הרכיב הראשון שיש להעריך בשלב ה-S המקדים?",["בטיחות הצוות והמטופל","הצורך בכוחות עזר","מנגנון הפגיעה ומספר הנפגעים","התרשמות כללית מהפצוע"],0,"בטיחות היא תמיד קודמת לכול — מטפל שנפגע הופך לנפגע נוסף ומצמצם את יכולת הטיפול. רק לאחר וידוא בטיחות הזירה מעריכים את מנגנון הפגיעה, מספר הנפגעים, ההתרשמות הכללית והצורך בכוחות עזר. הכלל המנחה הוא שאין נכנסים לזירה שאינה מאובטחת."],["מבוא ל-PHTLS","מה מהבאים אינו קריטריון לקיבוע ללוח גב וצווארון?",["רגישות מקומית או הגבלה בתנועת הצוואר","חסר נוירולוגי היקפי בגפיים התחתונות","חבלה קהה בשילוב שינוי במצב ההכרה","כאב בכתף לאחר נפילה נמוכה, הכרה מלאה"],3,"כאב מקומי בכתף בלבד, ללא רגישות בעמוד השדרה, ללא חסר נוירולוגי, עם הכרה מלאה וללא חבלה מסיחה — אינו מצדיק קיבוע. הקריטריונים לקיבוע כוללים מנגנון קהה עם שינוי בהכרה, רגישות או הגבלת תנועה בצוואר או בגו, חסר נוירולוגי היקפי, או חוסר יכולת להעריך עקב חבלה מסיחה, שיכרות או מחסום שפה. קיבוע מיותר גורם לכאב, לפצעי לחץ ולסיכון נתיב אוויר."],["מבוא ל-PHTLS","פצוע לאחר חילוץ מטביעה בבריכה רדודה. מה ההנחה הטיפולית הנכונה?",["אין צורך בקיבוע אם הפצוע בהכרה מלאה","יש לחשוד במנגנון טראומה ולקבע","יש להתמקד רק בהחזר חום ובחמצון","יש לבצע קיבוע רק אם דווח על צלילה"],1,"בכל נפגע שחולץ לאחר טביעה, ובמיוחד במים רדודים, יש לחשוד במנגנון טראומה של צלילה ופגיעה צווארית — גם אם אין דיווח מפורש, שכן הנפגע עשוי להיות מבולבל או ללא הכרה. זהו כלל מפורש בהנחיות. חמצון והחזר חום חשובים אך אינם מבטלים את הצורך בהערכה ובקיבוע."],["מבוא ל-PHTLS","מהו ההבדל העיקרי בין הסקר הראשוני לסקר השניוני?",["הראשוני מטפל בסכנות חיים, השניוני בודק מכף רגל ועד ראש","הראשוני נעשה בזירה והשניוני רק בבית החולים","הראשוני כולל מדדים מספריים והשניוני התרשמות בלבד","הראשוני מבוצע בידי פרמדיק והשניוני בידי חובש"],0,"הסקר הראשוני הוא סריקה מהירה וממוקדת שמטרתה למצוא ולטפל מיד בכל מה שהורג בדקות הקרובות. הסקר השניוני מתבצע רק לאחר שהראשוני הושלם ורק בפצוע שאינו דחוף או במהלך הפינוי, והוא כולל בדיקה שיטתית מכף רגל ועד ראש, מדדים מספריים, אנמנזה מלאה וטיפול משלים. שני הסקרים מתבצעים בשטח."],["מבוא ל-PHTLS","באיזה שלב של הטיפול נכון לתת משככי כאבים לפצוע?",["לפני תחילת הסקר הראשוני","בשלב ה-C של הסקר הראשוני","בסקר השניוני","רק לאחר ההגעה לבית החולים"],2,"טיפול בכאב הוא חלק מהסקר השניוני, לאחר שהושלמה ההערכה של סכנות החיים המיידיות ובוצע הטיפול המציל. מתן משככי כאבים לפני כן עלול לטשטש ממצאים ולעכב זיהוי בעיות קריטיות. עם זאת טיפול בכאב אינו מותרות — הוא מפחית תגובת סטרס ומשפר שיתוף פעולה, ולכן אין להזניחו."],["מבוא ל-PHTLS","מהי המשמעות של T&T בסכמת הטיפול בפצוע?",["Treat and Transport","Transfer and Transmit","Test and Treat","Trauma and Triage"],0,"T&T הוא Treat and Transport — שלב ההכרעה שבו נשאלת שאלת הזהב: האם הפצוע דחוף. אם כן, מבצעים רק פעולות מצילות חיים ומפנים מיידית תוך המשך הטיפול בדרך. אם לא, ניתן להשלים סקר שניוני בזירה. זהו צומת ההחלטה המרכזי שמפריד בין הסקר הראשוני לשניוני."],["מבוא ל-PHTLS","פצוע עם חרחורים מנתיב אוויר עליון. מה הפעולה המיידית?",["החדרת מנתב אוויר לוע-פה","סילוק הפרשות וסקשן","הטיית הראש לאחור","הנשמה במפוח בלחץ גבוה"],1,"חרחורים מעידים על נוזל בנתיב האוויר העליון — דם, הפרשות או תוכן קיבה. הפעולה המיידית היא סילוק ההפרשות בסקשן או ניקוי ידני, לפני כל פעולה אחרת. החדרת מנתב אוויר לתוך לוע מלא נוזל אינה פותרת את הבעיה, והנשמה בלחץ תדחוף את התוכן עמוק יותר לריאות ותגרום לשאיפה."],["מבוא ל-PHTLS","מה מבטא מילוי קפילרי של יותר מ-2 שניות בפצוע?",["ירידה בפרפוזיה ההיקפית","פגיעה מקומית בכלי הדם של הגפה בלבד","היפוקסיה מרכזית","עלייה בלחץ התוך-גולגולתי"],0,"מילוי קפילרי מוארך מעיד על וזוקונסטריקציה היקפית כתגובת פיצוי לירידה בפרפוזיה, ולכן הוא סימן מוקדם יחסית להלם. עם זאת יש לו מגבלות: קור סביבתי, גיל מבוגר ומחלת כלי דם היקפית מאריכים אותו גם ללא הלם, ולכן הוא נבדק תמיד בהקשר של שאר הממצאים. הוא אינו מדד להיפוקסיה מרכזית ואינו קשור ישירות ללחץ תוך-גולגולתי."],["מבוא ל-PHTLS","גבר לאחר תאונת אופנוע, ער וממוקד, מתלונן על כאב עז ברגל שבורה, דופק 128, ל״ד 100/70, עור חיוור. מה ההסבר הסביר ביותר?",["הלם מפוצה עם דימום פנימי","תגובה וגאלית לכאב","הלם נוירוגני עקב פגיעה בעמוד השדרה","כאב בלבד ללא משמעות המודינמית"],0,"דופק 128 עם עור חיוור ולחץ דופק מצומצם (100/70) בפצוע טראומה הם תמונה קלאסית של הלם מפוצה — הגוף מפצה בטכיקרדיה ובוזוקונסטריקציה כדי לשמור על לחץ דם, ולכן הסיסטולי עדיין נראה סביר. כאב לבדו אכן מעלה דופק אך אינו מסביר חיוורון ולחץ דופק מצומצם. תגובה וגאלית גורמת לברדיקרדיה, ובהלם נוירוגני העור חם ויבש והדופק אינו מהיר."],["מבוא ל-PHTLS","מה מהבאים הוא פעולה מצילת חיים המותרת בשלב ה-T&T בפצוע דחוף?",["הרכבת מוניטור אק״ג לשנים עשר עופרות","קיבוע שבר בזרוע בסד ואקום","ניקור חזה בחשד לחזה אוויר בלחץ","בדיקת סוכר בדם"],2,"בפצוע דחוף מבצעים בזירה רק פעולות שמונעות מוות בדקות הקרובות: עצירת דימום, פתיחת נתיב אוויר, ניקור חזה בחשד לחזה אוויר בלחץ ובידוד פצע יונק. כל השאר — קיבוע שברים, בדיקות ומוניטורים — נעשה תוך כדי הפינוי או לאחר תחילתו, כדי לא לבזבז את עשר דקות הפלטינה."],["מבוא ל-PHTLS","מדוע חשוב לתת נוזלים מחוממים לפצוע טראומה?",["כדי למנוע החמרת היפותרמיה שבשילוש המוות","כדי לשפר את קצב הזרימה דרך סט העירוי","כדי להפחית את הכאב בעת החדרת העירוי","כדי להעלות את לחץ הדם במהירות רבה יותר"],0,"עירוי של ליטר נוזל בטמפרטורת החדר לפצוע קר מוריד עוד יותר את חום הליבה ומחמיר את ההיפותרמיה, שהיא צלע בשילוש המוות ופוגעת ישירות בקרישת הדם. נוזלים מחוממים מונעים זאת. השפעה על קצב הזרימה או על לחץ הדם אינה השיקול, ומתן נוזל חמים אינו טיפול בכאב."],["מבוא ל-PHTLS","פצוע עם דימום פורץ מהמפשעה. מהי הפעולה הנכונה?",["Wound Packing ולחץ ישיר ממושך","הרמת הגפה וחבישה לוחצת","הנחת שתי תחבושות זו על גבי זו","הנחת חוסם עורקים גבוה על הירך"],0,"אזור המפשעה הוא אזור צירי (Junctional) שבו לא ניתן להניח חוסם עורקים ביעילות מפני שאין מקום פרוקסימלי מספיק. הטיפול הוא דחיסת פצע (Wound Packing) עם גזה או חומר המוסטטי עמוק לתוך הפצע, ואחריו לחץ ישיר ממושך של מספר דקות. חבישה שטחית או הרמת גפה לא יעצרו דימום עורקי באזור זה."],["מבוא ל-PHTLS","באילו שני אזורים בגוף שוכחים לרוב לחפש דימום נסתר בשלב ה-C?",["הגב התחתון ודופן הבטן הקדמית","הקרקפת, בתי השחי והמפשעות","הצוואר האחורי ובית החזה הצדי","כפות הידיים וגב כפות הרגליים"],1,"אזורים אלה מוסתרים כשהפצוע שוכב על הגב או לבוש, והדם נספג בבגדים ובקרקע ולא נראה. הקרקפת עשירה מאוד בכלי דם ויכולה לדמם באופן משמעותי, ובתי השחי והמפשעות הם אזורים ציריים עם כלי דם גדולים. לכן הסריקה בשלב ה-C חייבת לכלול מישוש ידני של אזורים אלה, ולא רק התבוננות."],["מבוא ל-PHTLS","מטרת ההתרשמות הכללית (General Impression) בזירה היא:",["להתרשם תוך שניות ממצבו ומגורמי סיכון דמוגרפיים","לקבוע סדר קדימויות פינוי בין מספר פצועים","לתעד את מנגנון הפגיעה לצורך הדיווח למוקד","להשלים את הסקר השניוני בזמן קצר יותר"],0,"ההתרשמות הכללית היא מבט של שניות ספורות שבו קולטים את תנוחת הנפגע ביחס לסביבה, את מראהו הכללי ואת נתוניו הדמוגרפיים — קשישים, ילדים קטנים ונשים בהיריון נמצאים בסיכון מוגבר לפציעות חמורות. היא נעשית לפצוע יחיד ואינה תחליף לטריאז׳ באירוע רב נפגעים, ואינה מחליפה את הסקר השניוני."],["מבוא ל-PHTLS","פצוע נושם 4 נשימות בדקה עם סטורציה 82 אחוז. מהי ההתערבות הנדרשת ב-B?",["סקשן והמתנה לשיפור","החדרת מנתב אוויר בלבד","הנשמה במפוח עם חמצן","מסכת חמצן ברזרבואר בזרימה גבוהה"],2,"קצב נשימה של 4 בדקה הוא ברדיפנאה קיצונית שאינה מספקת אוורור, ולכן נדרשת הנשמה אקטיבית במפוח עם חמצן. מסכת חמצן פסיבית — גם בזרימה גבוהה — אינה מסייעת כאשר הבעיה היא נפח דקה ולא ריכוז חמצן, ואינה מפנה CO2. מנתב אוויר לבדו פותח את הנתיב אך אינו מנשים."],["מבוא ל-PHTLS","מה מטרת הערכת מנגנון הפגיעה (Kinematics) בזירה?",["להעריך את מהירות הרכב בעת ההתנגשות","לצפות מראש פציעות אפשריות שאינן נראות לעין","לתעד את נסיבות האירוע עבור חקירת המשטרה","לקבוע את יעד הפינוי ואת אמצעי הפינוי"],1,"הבנת מנגנון הפגיעה מאפשרת לצפות פציעות סמויות — למשל קרע באאורטה בפגיעה חזיתית או פגיעה בטחול בפגיעה צדית שמאלית — עוד לפני שיופיעו סימנים קליניים. זהו כלי חיזוי שמנחה את הבדיקה ואת רמת החשד, ולא רק תיעוד או שיקול פינוי. הוא מסייע גם בהחלטה על פינוי למרכז טראומה גם כשהפצוע נראה יציב."],["מבוא ל-PHTLS","גבר בן 60 נפל מגובה 3 מטרים ונחת על הרגליים. מה הפגיעה שיש לחפש בנוסף לשברים בגפיים התחתונות?",["קרע בסרעפת עם מעבר איברי בטן לחזה","שברים דחוסים בחוליות המותניות והחזיות","דלקת בקרום הלב עם קולות לב עמומים","שבר בעצם הבריח עם פגיעה במקלעת הזרוע"],1,"בנחיתה על הרגליים הכוח מועבר דרך העקבים לשלד הצירי — קלקנאוס, עצמות הרגל, האגן ואז עמוד השדרה, ולכן שברים דחוסים (Compression Fractures) בחוליות המותניות והחזיות הם ממצא אופייני. עצם הבריח נשברת בנחיתה על הידיים או על הכתף. קרע בסרעפת שייך לחבלה קהה חזקה לבטן, ודלקת בקרום הלב אינה פגיעה טראומטית."],["מבוא ל-PHTLS","מהו הדגש הבטיחותי המרכזי לפני ירידה מהאמבולנס בזירת פיצוץ?",["הגנה אישית באפוד מגן וקסדה","החניית הרכב בסמוך למוקד לצמצום זמן","הכנת ציוד רפואי מלא","הכנת תג מיון לכל נפגע"],0,"בזירת פיצוץ קיים סיכון ממשי למטען משני שנועד לפגוע בכוחות ההצלה, ולכן איש הצוות יורד מהרכב רק כשהוא ממוגן באפוד מגן ובקסדה. בנוסף, על הנהגים להחנות את רכבי ההצלה במרחק בטוח של כ-50 מטר ממוקד הזירה — ולא בסמוך אליו. הכנת ציוד ותגי מיון חשובה אך אינה קודמת למיגון האישי."],["קינמטיקה","על פי חוק שימור האנרגיה, מה קורה לאנרגיה הקינטית בעת פגיעה?",["היא מומרת לצורות אחרות ומועברת לרקמות","היא מתחלקת שווה בשווה בין שני הגופים","היא נשמרת בגוף ומשתחררת בהדרגה","היא נעלמת עם עצירת התנועה"],0,"אנרגיה אינה נעלמת אלא מומרת — לחום, לקול, לעיוות חומר ולנזק לרקמות. ככל שיותר אנרגיה מועברת לגוף, כך הנזק גדול יותר. זו הסיבה שאזור קמטים ברכב, קסדה וכריות אוויר מצילים חיים: הם סופגים ומפזרים אנרגיה לאורך זמן ומרחק ארוכים יותר, ולכן פחות אנרגיה מגיעה לרקמות."],["קינמטיקה","מהי הנוסחה לאנרגיה קינטית וכיצד היא משפיעה על חומרת הפגיעה?",["מסה כפול מהירות — לשניהם השפעה זהה","חצי מסה כפול מהירות בריבוע — למהירות משקל רב","מסה כפול תאוצה — לתאוצה השפעה בלעדית","מסה חלקי מהירות — למסה השפעה גדולה יותר"],1,"האנרגיה הקינטית שווה לחצי מהמסה כפול המהירות בריבוע. מכיוון שהמהירות מועלית בריבוע, הכפלת המהירות מרבעת את האנרגיה, בעוד שהכפלת המסה רק מכפילה אותה. לכן פגיעת קליע קל במהירות גבוהה יכולה להיות הרסנית יותר מפגיעת גוף כבד איטי, ולכן מהירות הרכב היא הפרמטר הקריטי ביותר בתאונה."],["קינמטיקה","מהו מנגנון Down & Under בתאונה חזיתית?",["הגוף נזרק לאחור אל המושב","הגוף מסתובב סביב צירו","הגוף מחליק מטה וקדימה מתחת להגה","הגוף נע מעלה וקדימה אל השמשה"],2,"במסלול Down and Under הנוסע מחליק מטה וקדימה, הברכיים פוגעות בלוח המחוונים והכוח מועבר במעלה עצמות הרגל. הפציעות האופייניות הן שברים בפיקת הברך, בעצם הירך ובקרסול, פריקה אחורית של הירך ופגיעות אגן. במסלול Up and Over הגוף נע מעלה וקדימה, והפגיעות הן בראש, בצוואר, בחזה ובבטן."],["קינמטיקה","אילו פגיעות אופייניות למנגנון Up & Over?",["קרע בטחול עם דימום לחלל הרטרו-פריטונאלי","שבר דחוס בעמוד השדרה המותני והאגן","שברים בקרסול, בפיקת הברך ובעצם הירך","פגיעת ראש, פגיעת חזה בהגה וקרע באאורטה"],3,"במסלול Up and Over הראש פוגע בשמשה ויוצר סדק בצורת קורי עכביש, מה שמחייב חשד גבוה לפגיעת ראש ולפגיעה בעמוד השדרה הצווארי. החזה והבטן פוגעים בהגה וגורמים לחזה מרפרף, חבלת ריאה, קרעים בסרעפת וקרע באאורטה עקב כוחות הגזירה בהאטה פתאומית. שברים בקרסול ובברך שייכים ל-Down and Under."],["קינמטיקה","מהו מנגנון הפגיעה האופייני לתאונת פגיעה מאחור במהירות נמוכה?",["קרע באאורטה מכוחות גזירה בהאטה פתאומית","Whiplash — היפראקסטנציה ואחריה היפרפלקציה","קרע בטחול מדחיסה לרביע שמאלי עליון","שברים דו-צדדיים בעצמות הירך מהלוח הקדמי"],1,"בפגיעה מאחור הרכב נדחף קדימה בעוד הראש נשאר מאחור מפאת האינרציה — נוצרת היפראקסטנציה ואחריה תנועת ריבאונד להיפרפלקציה. התוצאה היא מתיחת רקמות רכות בצוואר ולעיתים שבר או פריקה של חוליות, שעלול להיות לא יציב. משענת ראש מכוונת נכון מפחיתה משמעותית את הפגיעה. קרע באאורטה ובטחול אופייניים לפגיעות במהירות גבוהה."],["קינמטיקה","בפגיעה צדית שמאלית ברכב, איזה איבר בטני נמצא בסיכון מוגבר?",["הטחול","הכבד","כיס המרה","הלבלב"],0,"הטחול ממוקם ברביע השמאלי העליון, ולכן בפגיעה צדית שמאלית הוא נמצא בקו הכוח הישיר. בפגיעה צדית ימנית הכבד הוא האיבר בסיכון. בנוסף לפגיעות הבטן, פגיעה צדית גורמת לשברים בצלעות ובאגן באותו צד, לפגיעה בעצם הבריח ולתנועת כיפוף צדי מסוכנת של הצוואר."],["קינמטיקה","מה הופך התהפכות רכב למנגנון מסוכן במיוחד?",["הפגיעה מרוכזת תמיד בראש ובעמוד השדרה","הגוף נחשף לכוחות מכיוונים מרובים ובלתי צפויים","המהירות בהתהפכות גבוהה מבכל מנגנון אחר","הרכב עולה באש ברוב מקרי ההתהפכות"],1,"בהתהפכות הגוף מקבל סדרת פגיעות מכיוונים משתנים, ולכן לא ניתן לצפות איזה כוח פעל על איזה חלק בגוף. הסיכון לפליטה מהרכב עולה דרמטית — ופליטה מכפילה את התמותה. לכן ההנחיה היא לחשוד בפגיעות מרובות בכל אזורי הגוף ולפנות למרכז טראומה גם אם הפצוע נראה יציב."],["קינמטיקה","מהי שלישיית ולדו (Waddell's Triad) בפגיעת הולך רגל מבוגר?",["אגן בפגוש, ברכיים בגלגל, כתפיים בדלת","רגליים בפגוש, גו על מכסה המנוע, ראש בקרקע","ראש בשמשה, חזה בהגה, בטן בלוח המחוונים","צוואר בהיפראקסטנציה, גב בגלגל, אגן בקרקע"],1,"שלישיית ולדו מתארת שלוש פגיעות עוקבות: הפגוש פוגע ברגליים ושובר את עצמות השוק, הגוף נזרק על מכסה המנוע ופוגע בחזה ובבטן, ולבסוף הנפגע נופל לקרקע ופוגע בראשו. חשוב לזכור שהפגיעה השלישית — הראש — היא לרוב הקטלנית ביותר, גם אם היא נראית פחות דרמטית בזירה."],["קינמטיקה","מהו הגורם המשפיע ביותר על חומרת הפגיעה בנפילה מגובה?",["מזג האוויר ותנאי הראות בזמן הנפילה","שעת היום ומשך הזמן עד להגעת הצוות","גובה הנפילה, משטח הנחיתה וחלק הגוף שנחת","גיל הנפגע ומחלות הרקע שלו בלבד"],2,"שלושת הפרמטרים הקובעים הם הגובה — שקובע את האנרגיה, משטח הנחיתה — שקובע את מרחק העצירה ולכן את קצב העברת האנרגיה, וחלק הגוף שנחת ראשון — שקובע את מסלול הכוח בגוף. גיל אכן משפיע על עמידות אך הוא אינו הגורם המכניסטי המרכזי."],["קינמטיקה","מאיזה גובה נפילה נחשבת חמורה במבוגר ומאיזה בילד?",["מעל 3 מטר במבוגר, מעל 6 מטר בילד","מעל 10 מטר במבוגר, מעל 6 מטר בילד","מעל 2 מטר במבוגר, מעל 1 מטר בילד","מעל 6 מטר במבוגר, מעל 3 מטר בילד"],3,"במבוגר נפילה מגובה העולה על 6 מטרים נחשבת חמורה, ובילד הסף נמוך יותר — 3 מטרים, או פי 2 עד 3 מגובהו של הילד. הסיבה היא שראשו של הילד גדול ביחס לגופו, מסתו קטנה יותר והאנרגיה מתפזרת על שטח גוף קטן, ולכן נזק רב יותר לכל יחידת מסה."],["קינמטיקה","נפילה עם נחיתה על כפות הידיים. איזה שבר אופייני?",["שבר דחוס בחוליות המותניות והחזיות","שבר קולס ברדיוס הדיסטלי עם הסטה גבית","שבר בקלקנאוס עם פגיעה בעמוד השדרה","שבר בטבעת האגן עם דימום רטרו-פריטונאלי"],1,"נחיתה על יד פשוטה מעבירה את הכוח דרך שורש כף היד וגורמת לשבר קולס — שבר ברדיוס הדיסטלי עם הסטה גבית. בנוסף יש לחפש שברים בעצם הבריח ובכתפיים, וכן פגיעות עמוד שדרה צווארי. שבר בקלקנאוס ושברים דחוסים בחוליות המותניות אופייניים לנחיתה על הרגליים."],["קינמטיקה","כיצד משפיע מרחק העצירה על חומרת הפגיעה?",["ככל שמרחק העצירה ארוך יותר הנזק גדול יותר","ככל שמרחק העצירה קצר יותר הנזק גדול יותר","מרחק העצירה משפיע רק בפגיעות חודרות","הנזק נקבע ממסת הגוף ולא ממרחק העצירה"],1,"עצירה במרחק קצר מחייבת העברת אותה כמות אנרגיה בזמן קצר, ולכן הכוחות הפועלים על הרקמות גדולים בהרבה. זהו העיקרון שמאחורי כרית אוויר, קסדה ואזור קמטים — כולם מאריכים את מרחק וזמן העצירה ומפחיתים את הכוח. נפילה על בטון מסוכנת בהרבה מנפילה על חול מאותו גובה בדיוק מסיבה זו."],["קינמטיקה","מה ההשפעה של צפיפות הרקמה על מידת הנזק בפגיעה?",["ככל שהרקמה צפופה יותר מועברת אליה פחות אנרגיה","רק רקמות מלאות אוויר נפגעות מהעברת אנרגיה","צפיפות הרקמה משפיעה רק בפגיעות הדף","ככל שהרקמה צפופה יותר מועברת אליה יותר אנרגיה"],3,"רקמות צפופות כמו עצם, כבד וטחול סופגות יותר אנרגיה מהחלקיק העובר דרכן ולכן נפגעות קשה יותר. רקמות בעלות צפיפות נמוכה כמו ריאה סופגות פחות ולעיתים הקליע עובר דרכן בנזק מוגבל יחסית. עם זאת, בפגיעות הדף דווקא איברים מלאי אוויר רגישים במיוחד — מנגנון שונה לחלוטין, של הפרשי צפיפות בממשקים."],["קינמטיקה","מהי קוויטציה (Cavitation) בפגיעה חודרת?",["דימום מתמשך ממסלול הקליע לאחר הפגיעה","קריעה של כלי דם גדול בסמוך לפצע הכניסה","הצטברות אוויר בחלל הצדר סביב הפגיעה","יצירת חלל זמני סביב המסלול עקב דחיסת רקמות"],3,"קוויטציה היא היווצרות חלל זמני סביב מסלול הקליע, כאשר הרקמות נדחסות הצידה בעוצמה ואז חוזרות. החלל הזמני יכול להיות גדול בהרבה מקוטר הקליע ולפגוע ברקמות המרוחקות ממסלולו הישיר. באנרגיה בינונית החלל גדול פי 3 עד 5 מקוטר הקליע, ובאנרגיה גבוהה פי 25 ויותר — ולכן פצע קטן בכניסה עלול להסתיר נזק פנימי עצום."],["קינמטיקה","כיצד מסווגות פגיעות חודרות לפי רמת אנרגיה?",["סכין — אנרגיה נמוכה, אקדח — בינונית, רובה סער — גבוהה","כל הפגיעות החודרות הן באנרגיה גבוהה","סכין — אנרגיה בינונית, אקדח — נמוכה, רובה סער — גבוהה","הסיווג נקבע לפי גודל פצע הכניסה בלבד"],0,"סכין ודוקרן הם פגיעות אנרגיה נמוכה — הנזק מוגבל למסלול הישיר של הלהב וכמעט ללא קוויטציה. אקדח ורובים מסוימים הם אנרגיה בינונית עם קוויטציה מתונה. רובי סער הם אנרגיה גבוהה עם קוויטציה נרחבת ונזק רקמתי מסיבי הרבה מעבר למסלול. גודל פצע הכניסה אינו מנבא את הנזק הפנימי."],["קינמטיקה","אילו שאלות חשוב לברר בפצוע דקירה?",["מיקום הדקירה, המבנים באזור וסוג כלי הנשק","גובה התוקף ומרחקו מהנפגע בעת הדקירה","מספר הדקירות והזמן שחלף מאז האירוע","האם הפצוע היה בהכרה מלאה בעת הפגיעה"],0,"מיקום הדקירה ואורך ורוחב הלהב מאפשרים לצפות אילו איברים נמצאים בטווח. גם מין הדוקר רלוונטי — גברים נוטים לדקור מלמעלה למטה ונשים מלמטה למעלה, מה שמשנה את מסלול הפגיעה המשוער. מספר הדקירות חשוב אך משני, ומצב ההכרה הוא ממצא קליני ולא נתון מכניסטי."],["קינמטיקה","דקירה באזור מתחת לקו הפטמות. באילו חללים יש לחשוד בפגיעה?",["בחלל בית החזה בלבד, מעל קו הסרעפת","גם בבית החזה וגם בחלל הבטן","בחלל הבטן בלבד, מתחת לקו הסרעפת","ברקמות שטחיות בלבד ללא חדירה לחלל"],1,"הסרעפת עולה בנשיפה עד לגובה הפטמות בערך, ולכן כל דקירה מתחת לקו זה — ואפילו מעט מעליו — עלולה לחצות אותה ולפגוע גם באיברי הבטן וגם באיברי בית החזה. זהו האזור התורקו-אבדומינלי, והוא מחייב חשד כפול תמיד. הנחה שהפגיעה מוגבלת לחלל אחד היא שגיאה קלאסית."],["קינמטיקה","מהי הפגיעה האופיינית לרוכב אופנוע במנגנון פגיעה קדמית?",["פגיעת ראש וחזה בכידון ושברים דו-צדדיים בירך","שברים בכפות הרגליים ובקרסוליים משני הצדדים","פגיעה בעמוד השדרה המותני ובטבעת האגן","כוויות חיכוך נרחבות בגב ובגפיים העליונות"],0,"בפגיעה קדמית האופנוע מסתובב קדימה סביב הציר הקדמי והרוכב נזרק על הכידון — הראש, החזה, הבטן והאגן פוגעים בו, והירכיים מקבלות שברים דו-צדדיים. בנוסף יש סיכון גבוה לפליטה מהאופנוע ולפגיעה משנית בקרקע או בעצם אחר. בפגיעה צדית אופייניים שברים בגפיים ולכידת הרגל בין האופנוע לעצם."],["קינמטיקה","אילו פגיעות עלולה לגרום חגורת בטיחות שנחגרה נכון?",["שפשופים שטחיים לאורך קו החגורה בלבד","פגיעות בגפיים תחתונות ובמפרקי הירך","פגיעה במקלעת הזרוע ובעצם הבריח בלבד","פגיעות בטן, שברים בצלעות ובחוליות וקרע בסרעפת"],3,"חגורת הבטיחות מצילה חיים אך היא עצמה יוצרת פגיעות: החלק הבטני עלול לגרום לקרע במעי, לפגיעה בלבלב ולשבר מסוג Chance בחוליות המותניות, והחלק האלכסוני עלול לשבור צלעות ועצם בריח ולגרום לחבלת ריאה. סימן חגורה בבטן הוא ממצא שמחייב חשד גבוה לפגיעה תוך-בטנית גם בפצוע שנראה תקין."],["קינמטיקה","אילו פגיעות אופייניות לכריית אוויר?",["קרע בסרעפת עם מעבר איברי בטן לחזה","חתכים, שפשופים והמטומות מקומיות בפנים ובזרועות","פגיעות פנימיות קשות בחזה ובבטן העליונה","שברים דחוסים בחוליות המותניות והחזיות"],1,"כרית אוויר מתנפחת ומתרוקנת במהירות רבה ולכן פוגעת מקומית — חתכים ושפשופים בפנים ובזרועות והמטומות. חשוב לזכור שכרית אוויר מגנה רק בפגיעה הראשונה, ולכן בהתנגשות משנית או בהתהפכות היא כבר לא מספקת הגנה. כמו כן אם הנוסע ישב קרוב מדי או ללא חגורה, הכרית עצמה עלולה לגרום לפגיעה חמורה יותר."],["קינמטיקה","מהי המשמעות הקלינית של סדק בצורת קורי עכביש בשמשה?",["הרכב נסע במהירות נמוכה בעת ההתנגשות","חשד גבוה לפגיעת ראש ולפגיעה בעמוד שדרה צווארי","הפגיעה הראשונית הגיעה מכיוון אחורי","הנוסע היה חגור והחגורה בלמה את תנועתו"],1,"סדק בצורת קורי עכביש נוצר כאשר ראש הנוסע פוגע בשמשה, ולעיתים נמצאים בו דם ושערות. זהו סימן ישיר להעברת אנרגיה גבוהה לראש ולצוואר, ולכן הוא מחייב חשד גבוה לפגיעת ראש ולפגיעה צווארית גם אם הפצוע ער ומדבר. הוא גם מעיד לרוב על כך שהנוסע לא היה חגור."],["קינמטיקה","מהי המשמעות של פליטה מרכב בתאונה?",["אין לכך משמעות קלינית מעבר לפצע החיצוני","היא מפחיתה את הסיכון בשל ריחוק מהמכשול","הסיכון לפציעה חמורה ולמוות עולה משמעותית","היא מעידה שהנוסע היה חגור בחגורה תקינה"],2,"פליטה מהרכב מעידה על אנרגיה גבוהה במיוחד, וגם חושפת את הנפגע לפגיעה משנית בקרקע או בעצמים בסביבה. הסיכון למוות עולה פי כמה. פליטה כמעט תמיד מעידה על אי חגירת חגורה. זהו קריטריון עצמאי לפינוי למרכז טראומה גם אם הפצוע נראה יציב לחלוטין."],["קינמטיקה","מדוע יש לחשוד בפגיעות פנימיות בקשישים גם במנגנון קל?",["בשל אוסטיאופורוזיס, שבריריות רקמות ונוגדי קרישה","בשל עלייה בנפח הדם ובתפוקת הלב עם הגיל","בשל ירידה בתחושת הכאב עם הגיל בלבד","בשל עלייה בגמישות כלי הדם והרקמות הרכות"],0,"בקשישים העצמות דלילות ונשברות בכוח נמוך, כלי הדם והרקמות שבריריים יותר, ותרופות נוגדות קרישה שכיחות מאוד ומגבירות דימומים באופן דרמטי — למשל דימום תת-דוראלי לאחר חבלה קלה בראש. בנוסף חוסמי בטא מונעים טכיקרדיה ומסווים הלם. לכן נפילה מגובה עמידה בקשיש היא מנגנון משמעותי."],["קינמטיקה","מהו מנגנון הפגיעה בתסמונת המעיכה (Crush Syndrome)?",["כוויה עמוקה בגפה עם נמק של רקמת השריר","פגיעה חודרת עמוקה במסת שריר גדולה","קרישת דם בוורידים העמוקים של הגפה הלכודה","לחץ ממושך על שריר עם שחרור תוצרי הרס לדם"],3,"בלחץ ממושך על מסת שריר גדולה נגרם נמק שרירי (Rhabdomyolysis). בעת שחרור הלחץ משתחררים לזרם הדם אשלגן, מיוגלובין וחומצות — האשלגן עלול לגרום להפרעות קצב קטלניות ולדום לב, והמיוגלובין חוסם את הכליות וגורם לאי ספיקה כלייתית חדה. לכן הטיפול המונע — עירוי נוזלים אגרסיבי — ניתן לפני שחרור הלחץ ולא אחריו."],["קינמטיקה","רכב נסע במהירות 60 קמ״ש והתנגש בעץ. אילו שלוש התנגשויות מתרחשות?",["הרכב בעץ, הנוסע בהגה, החזה בחגורה","הרכב בעץ, הנוסע בכביש, הראש בקרקע","הרכב בעץ, הנוסע ברכב, האיברים בדפנות הגוף","הרכב בעץ, הנוסע בשמשה, הברכיים בלוח"],2,"מודל שלוש ההתנגשויות מסביר מדוע נפגעים איברים פנימיים גם ללא סימנים חיצוניים. ההתנגשות הראשונה היא של הרכב במכשול, השנייה של גוף הנוסע בתוך הרכב, והשלישית — הקריטית — היא של האיברים הפנימיים בדפנות הגוף ובמבנים המקבעים אותם. כוחות הגזירה בהתנגשות השלישית הם שגורמים לקרע באאורטה, בכבד ובטחול."],["קינמטיקה","מהי המשמעות של מות נוסע אחר באותו רכב?",["משמעותי רק אם הנפטר ישב במושב הקדמי","משמעותי רק אם הפצוע היה עד לאירוע עצמו","אין לכך משמעות אם הפצוע נראה יציב","מדד לאנרגיה גבוהה ולחשד לפגיעות בכל הנוסעים"],3,"מוות של נוסע באותו תא נוסעים הוא סמן קינמטי מובהק לכך שהאנרגיה שפעלה על הרכב הייתה גבוהה במיוחד, ולכן כל הנוסעים בסיכון לפגיעות חמורות — גם אלה שנראים יציבים לחלוטין. זהו קריטריון עצמאי לפינוי למרכז טראומה. מיקום המושב אינו משנה את המשמעות הקינמטית."],["קינמטיקה","מהו ההבדל העיקרי בין פצע כניסה לפצע יציאה בפגיעת ירי?",["פצע היציאה גדול יותר, אך אינו מעיד על המסלול","פצע הכניסה מדמם יותר בשל לחץ הכניסה","פצע היציאה קטן וסדיר יותר מפצע הכניסה","אין הבדל בגודל או בצורה בין שני הפצעים"],0,"פצע יציאה לרוב גדול ובלתי סדיר יותר מפני שהקליע מתעוות ומתהפך בתוך הרקמות. עם זאת, ההסתמכות על כך לקביעת מסלול הקליע אינה אמינה — קליעים נודדים, מתפצלים ומשנים כיוון בתוך הגוף, ורסיסים משניים מעצם שבורה יוצרים פגיעות נוספות. לכן מטפלים תמיד לפי החשד האנטומי הרחב ולא לפי הקו המשוער בין הפצעים."],["קינמטיקה","ילד בן 5 נפגע מרכב. מדוע ראשו בסיכון מוגבר בהשוואה למבוגר?",["גולגולתו עבה יותר ומעבירה כוח לרקמת המוח","ראשו גדול יחסית לגופו ושרירי צווארו חלשים","מוחו קטן יחסית לגולגולת ונע בתוכה בחופשיות","הוא נזרק לאחור ופוגע בעורף בכל מקרה"],1,"ראשו של ילד קטן מהווה חלק גדול בהרבה ממשקל גופו לעומת מבוגר, ושרירי הצוואר שלו חלשים ואינם מייצבים אותו. כתוצאה מכך הראש נע בעוצמה רבה יותר בכל האטה או תאוצה, והוא לרוב האזור הראשון שפוגע. בנוסף הגולגולת דקה וגמישה יותר, כך שכוח עלול לעבור למוח גם ללא שבר."],["הלם","מהי ההגדרה הפיזיולוגית של הלם?",["אספקת חמצן ואנרגיה לרקמות שאינה מספקת את צורכיהן","עלייה בקצב הלב מעל 100 פעימות לדקה","אובדן של יותר מ-20 אחוז מנפח הדם במחזור","ירידה בלחץ הדם הסיסטולי מתחת ל-90 ממ״כ"],0,"הלם הוא מצב של היפופרפוזיה — אספקת חמצן וגלוקוז לרקמות אינה מספקת את הדרישה המטבולית שלהן. ההגדרה היא תאית ולא מספרית, ולכן ניתן להיות בהלם עם לחץ דם תקין לחלוטין — זהו הלם מפוצה. הסתמכות על ערך מספרי של לחץ דם או דופק כהגדרה מובילה לזיהוי מאוחר ומסוכן."],["הלם","מהם ארבעת סוגי ההלם העיקריים?",["דיסטריבוטיבי, המורגי, מטבולי, נשימתי","היפוולמי, קרדיוגני, דיסטריבוטיבי, חסימתי","היפוולמי, ספטי, אנפילקטי, נוירוגני","קרדיוגני, נוירוגני, המורגי, טראומטי"],1,"החלוקה הפיזיולוגית המקובלת היא לארבעה סוגים לפי המנגנון: היפוולמי — חסר נפח, קרדיוגני — כשל משאבה, חסימתי — חסימה מכנית למילוי או לפליטה, ודיסטריבוטיבי — פגם בפיזור, שכולל את ההלם הספטי, האנפילקטי והנוירוגני. שלושת האחרונים הם תת-סוגים של הקטגוריה הרביעית ולא קטגוריות עצמאיות."],["הלם","גבר לאחר תאונת דרכים: דופק 130, ל״ד 88/70, עור קר וחיוור, מבולבל. איזה שלב הלם?",["שלב 2 — 15 עד 30 אחוז אובדן דם","שלב 1 — עד 15 אחוז אובדן דם","שלב 4 — מעל 40 אחוז אובדן דם","שלב 3 — 30 עד 40 אחוז אובדן דם"],3,"שינוי במצב ההכרה יחד עם ירידה בלחץ הדם הסיסטולי מציין את המעבר לשלב 3 — אובדן של 30 עד 40 אחוז מנפח הדם. בשלב 2 הדופק כבר מהיר ולחץ הדופק מצומצם אך הסיסטולי עדיין נשמר וההכרה בעיקר חרדתית. בשלב 4 המטופל בדרך כלל אינו מגיב, הדופק חלש מאוד או בלתי נמוש והעור אפרפר."],["הלם","מדוע לחץ הדם הסיסטולי נשמר בשלבים המוקדמים של הלם?",["מפני שנפח הדם אינו יורד בשלבים המוקדמים","בזכות שחרור נוזלים מחלל המעי אל זרם הדם","מפני שהלב מגדיל את נפח החדרים ואת מילויים","בזכות מנגנוני פיצוי של טכיקרדיה ווזוקונסטריקציה"],3,"המערכת הסימפתטית מגיבה מיידית בהאצת קצב הלב, בהגברת כוח ההתכווצות ובכיווץ כלי הדם ההיקפיים — כך נשמר לחץ הדם למרות אובדן הנפח. המחיר הוא ירידה בפרפוזיה לעור, לשרירים ולמעי, ומכאן העור הקר והחיוור. כשמנגנוני הפיצוי מותשים לחץ הדם צונח במהירות, ולכן ירידה בלחץ הדם היא סימן מאוחר ומאיים."],["הלם","מהו לחץ דופק מצומצם (Narrow Pulse Pressure) ומה משמעותו?",["הפרש קטן בין סיסטולי לדיאסטולי — הלם היפוולמי","הפרש גדול בין סיסטולי לדיאסטולי — הלם נוירוגני","דופק לא סדיר לחלוטין — פגיעה בשריר הלב","דופק איטי וסדיר — תגובה וגאלית מוגברת"],0,"לחץ הדופק הוא ההפרש בין הסיסטולי לדיאסטולי. בהלם היפוולמי מוקדם הוזוקונסטריקציה מעלה את הדיאסטולי בעוד הסיסטולי נשאר או יורד מעט, וההפרש מצטמצם. זהו אחד הסימנים המוקדמים ביותר להלם ומופיע עוד לפני ירידת הסיסטולי. לחץ דופק מורחב אופייני דווקא להלם נוירוגני ולספטי מוקדם."],["הלם","מדוע בהלם נוירוגני העור חם ויבש ולא קר ולח?",["בשל ירידה בקצב הלב שמפחיתה את זרימת הדם לעור","בשל היות הדימום פנימי ולא חיצוני באזור הפגיעה","בשל עלייה בטמפרטורת הליבה ובקצב המטבוליזם","בשל אובדן טונוס סימפתטי שמונע כיווץ כלי דם והזעה"],3,"בהלם נוירוגני נקטעת הבקרה הסימפתטית מתחת לגובה הפגיעה, ולכן כלי הדם אינם מתכווצים והעור נשאר חם, ורדרד ויבש. גם ההזעה נעדרת מאותה סיבה. בנוסף אין טכיקרדיה — הדופק תקין או אף איטי, בשל דומיננטיות הוואגוס. זהו ההבדל המבחין החשוב ביותר מהלם היפוולמי, שבו העור קר, לח וחיוור והדופק מהיר."],["הלם","אישה בת 30 לאחר עקיצת דבורה: קוצר נשימה, צפצופים, אורטיקריה, ל״ד 80/50. מה הטיפול הראשון?",["מתן אדרנלין תוך שרירי","מתן אנטיהיסטמין דרך הפה","מתן חמצן והמתנה לתגובה","מתן סטרואידים בעירוי"],0,"באנפילקסיס אדרנלין תוך שרירי הוא הטיפול המציל היחיד והוא ניתן מיידית ללא עיכוב — הוא מכווץ כלי דם, מרחיב סימפונות ומייצב תאי פיטום. אנטיהיסטמינים וסטרואידים הם טיפול משני שפועל לאט ואינו מטפל בקריסה ההמודינמית או בחסימת נתיב האוויר. חמצן חיוני אך אינו מטפל בסיבה. עיכוב במתן אדרנלין הוא הגורם המרכזי לתמותה באנפילקסיס."],["הלם","מהו המנגנון של הלם חסימתי?",["אובדן נפח דם מדימום פנימי או חיצוני","הרחבה נרחבת של כלי הדם ההיקפיים בגוף","חסימה מכנית למילוי הלב או לפליטת הדם ממנו","כשל בהתכווצות שריר הלב ובכוח הפליטה"],2,"בהלם חסימתי הלב תקין והנפח תקין, אך מכשול מכני מונע זרימה. הסיבות העיקריות הן חזה אוויר בלחץ, טמפונדה לבבית ותסחיף ריאתי מסיבי. חשוב שכן — מתן נוזלים לבדו לא יפתור אותו, ורק הסרת החסימה תציל: ניקור חזה, ניקוז פריקרד או המסת קריש. זהו הבדל מהותי מהלם היפוולמי."],["הלם","מהו הסימן המבחין בין טמפונדה לבבית לחזה אוויר בלחץ?",["גודש ורידי הצוואר מופיע בטמפונדה בלבד","בחזה אוויר אין כניסת אוויר בצד אחד, בטמפונדה היא תקינה","תת לחץ דם מופיע בטמפונדה לבבית בלבד","טכיקרדיה מופיעה בחזה אוויר בלחץ בלבד"],1,"שני המצבים הם הלם חסימתי ושניהם מציגים את שלישיית בק החלקית — גודש ורידי צוואר, תת לחץ דם וטכיקרדיה. ההבדל הקליני המעשי בשטח הוא בהאזנה: בחזה אוויר בלחץ נעלמת כניסת האוויר בצד הפגוע ולעיתים יש היפר-רזוננס וסטיית קנה, ואילו בטמפונדה כניסת האוויר סימטרית ותקינה וקולות הלב עמומים."],["הלם","מה מהבאים מאפיין הלם קרדיוגני?",["היעדר מוחלט של דופק היקפי בלבד","עור חם ויבש עם ברדיקרדיה","עור ורדרד עם לחץ דופק מורחב","גודש ריאתי, קרפיטציות ובצקת היקפית"],3,"בהלם קרדיוגני הלב אינו מצליח לשאוב את הדם המגיע אליו, ולכן נוצר גודש לאחור — לריאות ולמערכת הוורידית. הביטויים הם קרפיטציות, קוצר נשימה, גודש ורידי צוואר ובצקת בגפיים. זהו ההבדל המכריע מהלם היפוולמי: כאן הבעיה אינה חסר נפח אלא עודף נפח שהלב אינו מצליח להזיז, ולכן מתן נוזלים אגרסיבי מסוכן ועלול לגרום לבצקת ריאות."],["הלם","מטופל עם חשד להלם ספטי. איזה ממצא צפוי בשלב המוקדם (Warm Shock)?",["עור קר וחיוור עם מילוי קפילרי מוארך","עור חם ואדום עם לחץ דופק מורחב","עור יבש עם דופק חלש מאוד","ברדיקרדיה עם לחץ דם תקין"],1,"בשלב המוקדם של ההלם הספטי מתרחשת וזודילטציה נרחבת — ההתנגדות ההיקפית יורדת, תפוקת הלב עולה כפיצוי, והעור נראה חם ואדום עם לחץ דופק מורחב. זהו שלב מטעה שבו החולה עלול להיראות טוב יחסית. בהמשך, כשמנגנוני הפיצוי כושלים ונוזל בורח למדור השלישי, המצב הופך ל-Cold Shock עם עור קר ותמונה דומה להלם היפוולמי."],["הלם","מהו הטיפול העיקרי בהלם היפוולמי מדמם בשטח?",["מתן תרופות מכווצות כלי דם","מתן נוזלים בכמות גדולה עד לנורמליזציה של לחץ הדם","הרמת רגליים והמתנה לייצוב","עצירת הדימום ופינוי מהיר לניתוח"],3,"בהלם המורגי הבעיה היא אובדן דם, והנוזל אינו תחליף לדם — הוא אינו נושא חמצן ואינו קורש. לכן הטיפול המכריע הוא עצירת הדימום ופינוי מהיר לחדר ניתוח, כאשר הנוזלים ניתנים במידה מבוקרת בלבד. החזרת לחץ הדם לנורמה שוטפת קרישים ומחמירה דימום. תרופות מכווצות כלי דם אסורות בהלם המורגי — הן מחמירות את האיסכמיה ברקמות."],["הלם","מהי החייאת נוזלים מבוקרת (Permissive Hypotension) ומתי היא מיושמת?",["שמירה על ל״ד סיסטולי כ-90 בדימום שאינו נשלט","מתן נוזלים חופשי עד ל״ד סיסטולי 120 בכל פצוע","דחיית מתן הנוזלים עד להגעה לחדר ההלם","הימנעות מוחלטת ממתן נוזלים בפצוע טראומה"],0,"בדימום פנימי שלא ניתן לעצור בשטח שואפים ללחץ דם מינימלי שמספיק לפרפוזיה של איברים חיוניים — כ-90 ממ״כ סיסטולי או דופק רדיאלי נמוש — ולא יותר. לחץ גבוה יותר מגביר את קצב הדימום ושוטף את הקריש. חשוב לציין שבפצוע ראש הגישה שונה: שם נדרש לחץ גבוה יותר לשמירה על פרפוזיה מוחית."],["הלם","מדוע הרטמן/רינגר לקטט מועדף על סליין בהחייאת טראומה?",["הוא זול משמעותית וזמין יותר בניידות","הרכבו קרוב לפלזמה ואינו גורם לחמצת היפרכלורמית","הוא נספג מהר יותר מהמדור התוך-כלי לתאים","הוא מכיל תאי דם אדומים ונושא חמצן"],1,"סליין מכיל ריכוז כלור גבוה בהרבה מהפלזמה, ומתן כמות גדולה שלו גורם לחמצת מטבולית היפרכלורמית — בעייתי במיוחד בפצוע שכבר בחמצת מטבולית מהיפופרפוזיה. הרטמן מכיל אלקטרוליטים בהרכב דומה לפלזמה ולקטט שמומר לביקרבונט. אף אחד מהם אינו מכיל תאי דם או נושא חמצן."],["הלם","מהו התפקיד של תרופת חומצה טרנקסמית (TXA) בטראומה?",["הגברת ייצור תאי הדם האדומים במח העצם","עיכוב פירוק קרישי דם והפחתת הדימום","העלאת לחץ הדם באמצעות כיווץ כלי דם","הרחבת כלי דם ושיפור הפרפוזיה ההיקפית"],1,"חומצה טרנקסמית היא נוגדת פיברינוליזה — היא מונעת מהגוף לפרק את הקרישים שנוצרו, ובכך מפחיתה דימום ותמותה בפצועי טראומה. מחקר CRASH-2 הראה שהיא יעילה במיוחד כשניתנת בתוך 3 שעות מהפגיעה, ומזיקה אם ניתנת מאוחר יותר. היא אינה מעלה לחץ דם ואינה משפיעה על ייצור תאי דם."],["הלם","גבר בן 70 עם דימום, דופק 78, ל״ד 90/70, עור חיוור וקר. מדוע הדופק אינו מהיר?",["הדימום כנראה נעצר והפיצוי כבר אינו נדרש","ייתכן שהוא נוטל חוסמי בטא שמונעים טכיקרדיה","הוא אינו נמצא בהלם למרות הדימום החיצוני","הגיל המבוגר גורם לדופק איטי גם בהלם עמוק"],1,"חוסמי בטא הם תרופה נפוצה מאוד בקשישים והם חוסמים את התגובה הסימפתטית של האצת קצב הלב. התוצאה היא שהמטופל נמצא בהלם עמוק אך הדופק שלו נראה תקין — מצב מסוכן במיוחד שמוביל להערכת חסר. לכן בקשיש מסתמכים על סימנים אחרים: עור, מילוי קפילרי, לחץ דופק ומצב הכרה. גיל כשלעצמו אינו גורם לברדיקרדיה."],["הלם","מה מהבאים מייצג הלם דיסטריבוטיבי?",["חזה אוויר בלחץ וטמפונדה לבבית","דימום פנימי מקרע בטחול או בכבד","הלם ספטי, אנפילקטי ונוירוגני","אוטם נרחב של שריר הלב עם כשל משאבה"],2,"בהלם דיסטריבוטיבי נפח הדם תקין והלב תקין, אך מרחב כלי הדם התרחב באופן שאינו מאפשר פיזור תקין — כמו מים בכמות קבועה בצינור שהתרחב. שלושת המצבים המרכזיים הם ספטי, אנפילקטי ונוירוגני. חזה אוויר בלחץ הוא חסימתי, דימום הוא היפוולמי, ואוטם נרחב הוא קרדיוגני."],["הלם","מהי המשמעות של רמת לקטט מוגברת בדם בפצוע טראומה?",["עלייה בייצור אנרגיה במסלול האירובי","ירידה בתפקוד הכליות ובפינוי חומצות מהדם","מטבוליזם אנאירובי כתוצאה מהיפופרפוזיה רקמתית","זיהום חיידקי פעיל עם תגובה דלקתית"],2,"כאשר אין מספיק חמצן ברקמות, התאים עוברים לנשימה אנאירובית שמייצרת חומצה לקטית. רמת הלקטט משקפת אפוא את עומק ההיפופרפוזיה, והיא סמן רגיש מוקדם להלם — לעיתים לפני שינוי במדדים החיוניים. פינוי הלקטט לאורך זמן הוא גם מדד לתגובה לטיפול. לקטט גבוה אינו מעיד ישירות על זיהום או על כשל כלייתי."],["הלם","מדוע ילדים משמרים לחץ דם תקין עד שלב מאוחר בהלם?",["בשל יכולת פיצוי טובה בוזוקונסטריקציה ובטכיקרדיה","בשל נפח דם גדול יותר יחסית למשקל הגוף","בשל ערכי לחץ דם בסיסיים גבוהים מהמבוגר","בשל קצב דימום איטי יותר מכלי דם גמישים"],0,"מערכת הלב וכלי הדם של ילדים גמישה ובעלת יכולת פיצוי מצוינת — הם מעלים דופק ומכווצים כלי דם בעוצמה רבה, ולכן שומרים על לחץ דם תקין גם לאחר אובדן משמעותי של נפח. הבעיה היא שכשהפיצוי קורס, הקריסה חדה ומהירה מאוד. לכן בילד מסתמכים על דופק, מילוי קפילרי, מצב הכרה וטמפרטורת הגפיים — ותת לחץ דם בילד הוא סימן מאיים ביותר."],["הלם","מהי כמות הבולוס המומלצת לילד בהלם היפוולמי?",["5 מ״ל לק״ג","10 מ״ל לק״ג","40 מ״ל לק״ג","20 מ״ל לק״ג"],3,"בילד עם הלם היפוולמי נותנים בולוס של 20 מ״ל לכל ק״ג משקל גוף, מעריכים מחדש, וניתן לחזור עליו. חישוב לפי משקל הוא קריטי בילדים משום שמנה קבועה עלולה להיות מסוכנת או לא מספקת. בהלם קרדיוגני או בחשד לעומס נוזלים נותנים מנות קטנות יותר של 5 עד 10 מ״ל לק״ג בזהירות."],["הלם","מהו האינדקס ההלם (Shock Index) וכיצד מחושב?",["לחץ הדופק חלקי הדופק — תקין מעל 0.5","דופק כפול לחץ דם דיאסטולי — תקין מתחת ל-1","לחץ דם סיסטולי חלקי דופק — תקין מעל 1","דופק חלקי לחץ דם סיסטולי — מעל 0.9 מחשיד"],3,"אינדקס ההלם הוא הדופק חלקי לחץ הדם הסיסטולי. בערכים תקינים הוא נע סביב 0.5 עד 0.7, וערך מעל 0.9 מחשיד להלם — לעיתים עוד לפני שכל אחד מהמדדים בנפרד נראה חריג. זהו כלי פשוט ושימושי במיוחד לזיהוי הלם מפוצה ולניבוי הצורך במתן דם."],["הלם","מה הסיכון במתן נוזלים מוגזם לפצוע מדמם?",["ירידה בקצב הלב מתחת ל-40 פעימות לדקה","עלייה מסוכנת ברמת הנתרן והכלור בדם","שטיפת הקריש, דילול גורמי קרישה והחמרת הדימום","עלייה בטמפרטורת הליבה ובקצב המטבוליזם"],2,"מתן נוזלים מוגזם מזיק בשלושה מישורים: העלאת לחץ הדם מפרקת את הקריש שנוצר במקום הדימום, הנוזל מדלל את גורמי הקרישה ואת תאי הדם האדומים, והנוזל הקר מחמיר היפותרמיה. שלושתם יחד מזינים את שילוש המוות. זו הסיבה המרכזית למעבר לגישת החייאת נוזלים מבוקרת ולהעדפת מתן דם ומוצריו כשזמינים."],["הלם","פצוע עם פגיעת ראש קשה ודימום. מהו יעד לחץ הדם?",["כמו בכל פצוע מדמם — כ-90 ממ״כ סיסטולי","גבוה יותר — לפחות 110 ממ״כ לפרפוזיה מוחית","נמוך יותר — כ-70 ממ״כ להפחתת הדימום המוחי","אין חשיבות ללחץ הדם כל עוד החמצון תקין"],1,"פצוע ראש הוא היוצא מן הכלל לגישת ההיפוטנסיה המותרת. המוח הפגוע נמצא בסיכון לנזק משני מאיסכמיה, ולחץ הפרפוזיה המוחי תלוי ישירות בלחץ הדם העורקי. אפילו אירוע בודד של תת לחץ דם מכפיל את התמותה בפגיעת ראש. לכן היעד גבוה יותר — כ-110 ממ״כ סיסטולי ומעלה. לחץ נמוך אינו מפחית דימום מוחי אלא מחמיר איסכמיה."],["הלם","מהי תגובת הגוף ההורמונלית המיידית לאובדן דם?",["עיכוב הפרשת קורטיזול והפחתת תגובת הדחק","הפעלת רנין-אנגיוטנסין-אלדוסטרון ושחרור קטכולאמינים","הפרשת הורמון גדילה להאצת תיקון הרקמות","הפרשת אינסולין מוגברת להורדת רמת הסוכר"],1,"הירידה בפרפוזיה מפעילה שרשרת תגובות: הכליה מפרישה רנין שמוביל לייצור אנגיוטנסין ואלדוסטרון — הראשון מכווץ כלי דם והשני מגביר ספיגת נתרן ומים. במקביל משתחררים אדרנלין ונוראדרנלין שמאיצים את הלב ומכווצים כלי דם, ומשתחרר ADH לשימור מים. אינסולין דווקא מדוכא, וקורטיזול עולה ולא יורד."],["הלם","גבר עם פגיעה בחוט השדרה בגובה C5: ל״ד 80/50, דופק 55, עור חם ויבש. מה הטיפול הראשוני?",["מתן נוזלים בזהירות ושקילת מכווצי כלי דם","מתן נוזלים בכמות גדולה עד ל״ד סיסטולי 120","הרמת ראש האלונקה ב-45 מעלות להפחתת גודש","מתן חוסמי בטא להאטת הדופק ולייצוב הקצב"],0,"בהלם נוירוגני הבעיה אינה חסר נפח אלא מרחב כלי דם מוגדל. מתן נוזלים מסייע במידה מסוימת אך עודף נוזלים גורם לבצקת ריאות מפני שהלב תקין. לכן נותנים נוזלים בזהירות ומוסיפים תרופות מכווצות כלי דם — הטיפול הפיזיולוגי הנכון. חוסמי בטא יחמירו את הברדיקרדיה ואת ההלם, והרמת הראש תפחית עוד יותר את הפרפוזיה המוחית."],["הלם","מהי המשמעות של עור מרובד (Mottling) בפצוע?",["סימן לתגובה אלרגית מפושטת בעור","סימן לחשיפה ממושכת לקור סביבתי בלבד","סימן לזיהום מקומי מתפשט ברקמה התת-עורית","סימן להיפופרפוזיה עורית קשה ולהלם מתקדם"],3,"עור מרובד הוא דפוס כתמים סגלגלים-כחלחלים, המופיע קודם על הברכיים ומתפשט פרוקסימלית. הוא נובע מוזוקונסטריקציה קיצונית ומזרימה לא אחידה בכלי הדם הקטנים, ומעיד על הלם מתקדם עם פרוגנוזה גרועה. אמנם קור גורם גם הוא לשינויי צבע, אך דפוס הריבוד המתפשט בפצוע הוא סימן מדאיג שאין להתעלם ממנו."],["הלם","באיזה מצב מתן נוזלים בכמות גדולה מסוכן במיוחד?",["הלם היפוולמי משלשולים","הלם ספטי מוקדם","התייבשות בחום","הלם קרדיוגני"],3,"בהלם קרדיוגני הלב כבר אינו מצליח להתמודד עם הנפח שמגיע אליו, ולכן העמסת נוזלים תגרום לגודש ריאתי ולבצקת ריאות שתחמיר את ההיפוקסיה ואת המצב כולו. הטיפול הוא בשיפור תפוקת הלב — תמיכה אינוטרופית וטיפול בסיבה. בשלושת המצבים האחרים יש חסר נפח אמיתי או יחסי, ומתן נוזלים הוא הטיפול הנכון."],["הלם","מטופל עם הלם ספטי לא מגיב לשני בולוסים של נוזלים. מה הצעד הבא?",["המתנה של 30 דקות והערכה חוזרת","הפסקת נוזלים לחלוטין","שקילת מתן תרופות וזופרסוריות","מתן בולוס שלישי גדול יותר"],2,"בהלם ספטי הבעיה המרכזית היא וזודילטציה, ולכן כאשר מילוי נפח אינו מספיק נדרשת תמיכה בכיווץ כלי דם — נוראדרנלין הוא התרופה המועדפת. המשך העמסת נוזלים ללא הגבלה גורם לבצקת ריאות ולבצקת רקמות ומחמיר את התוצאה. עיכוב של 30 דקות בהלם ספטי מעלה משמעותית את התמותה — כל שעת עיכוב בטיפול משמעותית."],["הלם","מהו ההבדל בין הלם מפוצה ללא מפוצה?",["במפוצה הדימום חיצוני ובלא מפוצה הוא פנימי","במפוצה המטופל בהכרה ובלא מפוצה תמיד ללא הכרה","ההבדל תיאורטי ואינו בא לידי ביטוי קליני","במפוצה לחץ הדם נשמר בפיצוי, בלא מפוצה הוא צונח"],3,"בהלם מפוצה הגוף עדיין מצליח לשמור על לחץ דם באמצעות טכיקרדיה ווזוקונסטריקציה, ולכן המדדים עשויים להיראות תקינים למרות פרפוזיה רקמתית ירודה. בהלם לא מפוצה מנגנוני הפיצוי מותשים ולחץ הדם צונח. ההבחנה קריטית משום שזיהוי בשלב המפוצה מאפשר התערבות בזמן, בעוד שבשלב הלא מפוצה התמותה עולה משמעותית."],["הלם","מדוע פצוע בהלם צריך להישמר חם?",["היפותרמיה פוגעת בקרישה ומחמירה את הדימום","כדי להאיץ את פינוי הלקטט מהרקמות","כדי להעלות את קצב הלב ואת תפוקת הלב","כדי לשפר את נוחותו ולהפחית רעד וחרדה"],0,"אנזימי הקרישה פועלים ביעילות רק בטווח טמפרטורה צר סביב 37 מעלות. ירידה של מעלות בודדות מאטה משמעותית את הקרישה, וכתוצאה מכך הדימום נמשך למרות מנגנוני הקרישה התקינים. בנוסף היפותרמיה מדכאת את תפקוד שריר הלב וגורמת להפרעות קצב. שמירת חום בפצוע היא לכן פעולה טיפולית ממש ולא עניין של נוחות."],["הלם","מהו סימן מוקדם לירידה בפרפוזיה למוח?",["אי שקט, חרדה ובלבול","אישונים בלתי מגיבים","פרכוסים כלליים","ברדיקרדיה עמוקה"],0,"המוח רגיש מאוד לירידה באספקת החמצן, והביטוי המוקדם ביותר הוא שינוי עדין בהתנהגות — אי שקט, חרדה ותוקפנות שנראים לעיתים כהתנהגות בעייתית. חשוב לזכור שפצוע אגרסיבי הוא היפוקסי עד שיוכח אחרת. אישונים בלתי מגיבים, ברדיקרדיה ופרכוסים הם ביטויים מאוחרים בהרבה שמעידים על נזק מתקדם."],["הלם","גבר בן 45 עם כאב בחזה, קוצר נשימה, ל״ד 85/60, קרפיטציות בשתי הריאות, גודש ורידי צוואר. מהי האבחנה?",["הלם קרדיוגני","הלם ספטי","הלם היפוולמי","הלם נוירוגני"],0,"השילוב של כאב בחזה, גודש ורידי צוואר וקרפיטציות דו-צדדיות מצביע על כשל משאבה — הלב אינו מצליח לשאוב את הדם והוא נאגר לאחור בריאות ובוורידים הגדולים. הסיבה השכיחה היא אוטם נרחב. בהלם היפוולמי ורידי הצוואר שטוחים והריאות נקיות, בהלם נוירוגני העור חם והדופק אינו מהיר, ובספטי יש רקע זיהומי."],["הלם","מהי חשיבות מדידת רמת הסוכר בפצוע עם הכרה ירודה והלם?",["לצורך תיעוד רפואי והשלמת דוח הטיפול","מדידת הסוכר מחליפה הערכה נוירולוגית מלאה","ערך סוכר גבוה שולל מצב של הלם מתקדם","היפוגליקמיה היא סיבה הפיכה שיש לשלול מיד"],3,"היפוגליקמיה היא אחת הסיבות ההפיכות המהירות ביותר לירידה במצב ההכרה, וטיפול בה מיידי ומציל. היא עלולה גם להיות הסיבה לאירוע עצמו — למשל נהג סוכרתי שאיבד הכרה וגרם לתאונה. לכן בדיקת סוכר היא חלק סטנדרטי בכל מטופל עם הכרה ירודה. סוכר תקין אינו שולל הלם ואינו מחליף הערכה נוירולוגית."],["הלם","איזו עמדה מומלצת לפצוע בהלם היפוולמי ללא חשד לפגיעת עמוד שדרה?",["שכיבה שטוחה על הגב","ישיבה בזווית 45 מעלות","שכיבה על הבטן","ישיבה זקופה"],0,"שכיבה שטוחה מאפשרת החזר ורידי מרבי ופרפוזיה מוחית טובה יותר. תנוחת טרנדלנבורג — הרמת רגליים מעל הראש — כבר אינה מומלצת מפני שלא הוכחה כמשפרת תוצאות והיא עלולה להחמיר תפקוד נשימתי ולהעלות לחץ תוך-גולגולתי. ישיבה זקופה מפחיתה החזר ורידי ומחמירה את ההלם, ושכיבה על הבטן מסכנת את נתיב האוויר."],["הלם","מה עלול לגרום להלם היפוולמי שאינו המורגי?",["פגיעה בחוט השדרה עם אובדן טונוס סימפתטי","אוטם שריר הלב עם כשל בכוח ההתכווצות","חזה אוויר בלחץ עם ירידה בהחזר הוורידי","כוויות נרחבות, הקאות ושלשולים ממושכים"],3,"הלם היפוולמי לא המורגי נובע מאובדן נוזלים שאינם דם: בכוויות נרחבות דולפת פלזמה דרך העור הפגוע, בהקאות ושלשולים אובדים נוזלים ואלקטרוליטים, וכך גם בהתייבשות קשה ובדלקת לבלב. פגיעה בחוט השדרה גורמת להלם נוירוגני, חזה אוויר בלחץ להלם חסימתי, ואוטם להלם קרדיוגני."],["ראש","מהי שלישיית קושינג (Cushing's Triad) ומה משמעותה?",["טכיקרדיה, תת לחץ דם ונשימה שטחית — דימום","ברדיקרדיה, תת לחץ דם ואישונים מכווצים — הרעלה","טכיקרדיה, יתר לחץ דם ונשימה מהירה — הלם","ברדיקרדיה, יתר לחץ דם ונשימה לא סדירה — ICP גבוה"],3,"שלישיית קושינג היא תגובת חירום של הגוף ללחץ תוך-גולגולתי גבוה: הגוף מעלה את לחץ הדם כדי לשמור על פרפוזיה מוחית, הברוררצפטורים מגיבים בהאטת הדופק, ולחץ על גזע המוח משבש את מרכז הנשימה. זהו סימן מאוחר ומאיים המבשר על הרניאציה מתקרבת, ומחייב פינוי דחוף ביותר."],["ראש","מהו טווח הציונים של סולם גלזגו (GCS) במבוגר?",["3 עד 12","0 עד 15","1 עד 15","3 עד 15"],3,"סולם גלזגו נע בין 3 ל-15. הציון המינימלי הוא 3 ולא 0, משום שכל אחד משלושת המרכיבים — פתיחת עיניים, תגובה מילולית ותגובה מוטורית — מתחיל בציון 1 גם בהיעדר מוחלט של תגובה. פתיחת עיניים עד 4, תגובה מילולית עד 5 ותגובה מוטורית עד 6."],["ראש","פצוע פותח עיניים לכאב, ממלמל מילים לא ברורות, ומושך את הגפה בתגובה לכאב. מה ה-GCS?",["7","8","10","9"],1,"פתיחת עיניים לכאב שווה 2, מילים לא ברורות ובלתי מובנות שוות 2, ומשיכת גפה מגירוי כאב שווה 4 — סך הכול 8. יש לזכור ש-GCS של 8 ומטה מוגדר כפגיעת ראש קשה ומחייב הבטחת נתיב אוויר. חשוב לתעד גם את הפירוט של שלושת המרכיבים ולא רק את הסכום."],["ראש","מה מבטא GCS של 8 ומטה?",["פגיעת ראש קלה שאינה מחייבת פינוי דחוף","פגיעת ראש קשה המחייבת הבטחת נתיב אוויר","מצב הכרה תקין עם ירידה זמנית בקשב","פגיעת ראש בינונית הדורשת מעקב בלבד"],1,"GCS 13 עד 15 הוא פגיעה קלה, 9 עד 12 בינונית, ו-8 ומטה קשה. הכלל המנחה הוא Less than eight, intubate — מטופל בציון זה אינו מסוגל להגן על נתיב האוויר שלו, ובסיכון גבוה לשאיפת תוכן קיבה ולהיפוקסיה שתגרום לנזק מוחי משני."],["ראש","מהי הסכנה העיקרית בהיפוקסיה בפצוע ראש?",["עלייה בסיכון לזיהום של רקמת המוח","ירידה בלחץ התוך-גולגולתי ובפרפוזיה","האטת קצב הלב ופגיעה בתפוקת הלב","גרימת נזק מוחי משני והחמרת התוצאה"],3,"הפגיעה הראשונית מתרחשת ברגע החבלה ואינה ניתנת לשינוי. הנזק המשני מתפתח בשעות שלאחריה, ושני הגורמים המובילים אליו הם היפוקסיה ותת לחץ דם. אירוע בודד של סטורציה מתחת ל-90 אחוז מעלה משמעותית את התמותה. מכאן שכל תפקיד הצוות בשטח הוא מניעת הנזק המשני — חמצון, שמירת לחץ דם ופינוי מהיר."],["ראש","מהם סימני שבר בבסיס הגולגולת?",["נפיחות והמטומה נרחבת בקרקפת העורפית","סימן רקון, סימן באטל ונוזל צלול מהאוזן","אישונים מכווצים דו-צדדית ללא תגובה לאור","דימום מהאף בלבד ללא ממצאים נוספים"],1,"סימן רקון הוא שטפי דם סביב שתי העיניים, וסימן באטל הוא שטף דם מאחורי האוזן מעל עצם המסטואיד. שניהם מופיעים לרוב מספר שעות לאחר החבלה. נוזל צלול או מדמם מהאף או מהאוזן מחשיד לדליפת נוזל שדרה. משמעות מעשית קריטית: אסור להחדיר מנתב אף-לוע או זונדה דרך האף בחשד כזה."],["ראש","מהו ההבדל בין דימום אפידורלי לסובדורלי?",["האפידורלי מופיע בקשישים והסובדורלי בצעירים","האפידורלי עורקי ומהיר עם מרווח צלול, הסובדורלי ורידי","שניהם ורידיים ומתפתחים באיטיות על פני ימים","האפידורלי ורידי ואיטי, הסובדורלי עורקי ומהיר"],1,"דימום אפידורלי נובע לרוב מקרע בעורק המנינגיאלי האמצעי בעקבות שבר בעצם הטמפורלית. מכיוון שהדימום עורקי הוא מהיר, והתמונה הקלאסית היא אובדן הכרה, מרווח צלול שבו החולה ער ומדבר, ואז הידרדרות מהירה. דימום סובדורלי נובע מקריעת ורידים גשריים, מתפתח לאט יותר ושכיח במיוחד בקשישים, באלכוהוליסטים ובנוטלי נוגדי קרישה."],["ראש","מדוע דימום סובדורלי שכיח יותר בקשישים?",["בשל עיבוי הגולגולת והקטנת המרווח התת-דוראלי","בשל עלייה בלחץ הדם הסיסטמי עם הגיל","בשל אטרופיה מוחית שמותחת את הוורידים הגשריים","בשל ירידה בנפח הדם ובלחץ הפרפוזיה המוחי"],2,"עם הגיל המוח מתכווץ ומתרחק מהגולגולת, והוורידים הגשריים שחוצים את המרווח נמתחים ונעשים פגיעים. אפילו חבלה קלה עלולה לקרוע אותם. בנוסף, המרווח שנוצר מאפשר לדם להצטבר בכמות ניכרת לפני שיופיעו סימנים — ולכן קשיש עלול להגיע ימים או שבועות לאחר החבלה עם בלבול הדרגתי. נוגדי קרישה מחמירים משמעותית."],["ראש","מהי המשמעות של אישון מורחב חד-צדדי בפצוע ראש?",["לחץ על עצב הגולגולת השלישי — הרניאציה מתקרבת","פגיעה ישירה בגלגל העין באותו צד","תגובה פיזיולוגית תקינה לאור בהיר בזירה","הרעלת אופיאטים עם דיכוי נשימתי נלווה"],0,"הרחבת אישון חד-צדדית שאינו מגיב לאור נגרמת מלחץ על עצב הגולגולת השלישי (Oculomotor) כתוצאה מהיסט מוחי — לרוב הרניאציה של האונקוס. הצד המורחב מציין בדרך כלל את צד הפגיעה. זהו סימן חירום המחייב פינוי מיידי. פגיעה ישירה בעין אכן יכולה לגרום לכך ולכן יש לבדוק, אך בפצוע ראש ההנחה היא הרניאציה עד שיוכח אחרת."],["ראש","מהי הגישה הנכונה להיפרוונטילציה בפצוע ראש?",["יש להנשים באיטיות בכל מקרה של פגיעת ראש","יש לבצע היפרוונטילציה שגרתית בכל פצוע ראש","היפרוונטילציה מבוקרת רק בסימני הרניאציה מובהקים","היפרוונטילציה משפרת פרפוזיה מוחית תמיד"],2,"היפרוונטילציה מורידה CO2, וה-CO2 הנמוך גורם לוזוקונסטריקציה מוחית שאמנם מפחיתה לחץ תוך-גולגולתי אך גם מקטינה את זרימת הדם למוח ומחמירה איסכמיה. לכן היא שמורה כאמצעי הצלה זמני בלבד, בסימני הרניאציה ברורים כמו אישון מורחב או תנוחת נוקשות. אחרת מנשימים בקצב תקין ושומרים על נורמוקפניה."],["ראש","מהי זעזוע מוח (Concussion)?",["דימום תוך מוחי קטן הנראה בהדמיה","פגיעה תפקודית זמנית ללא ממצא מבני בהדמיה","בצקת מוחית נרחבת עם עליית לחץ תוך-גולגולתי","שבר לינארי בגולגולת ללא הסטת שברים"],1,"זעזוע מוח הוא הפרעה תפקודית זמנית שנגרמת מהאצה או האטה מהירה של המוח בתוך הגולגולת, ללא נזק מבני שנראה ב-CT. הביטויים כוללים בלבול זמני, אמנזיה סביב האירוע, כאב ראש, סחרחורת ובחילה, ולעיתים אובדן הכרה קצר. הסכנה המרכזית היא תסמונת הפגיעה השנייה — חבלה נוספת לפני ההחלמה עלולה להיות קטלנית."],["ראש","פצוע ראש עם GCS 14 שהופך תוך 10 דקות ל-GCS 9. מה המשמעות?",["תגובה פיזיולוגית תקינה לגירוי כאב חוזר","הידרדרות מהירה המחשידה לדימום מתרחב","עייפות ותשישות על רקע האירוע הטראומטי","מגמת שיפור צפויה בהמשך הטיפול"],1,"ירידה של 2 נקודות ומעלה ב-GCS היא סימן אזהרה משמעותי, וירידה של 5 נקודות ב-10 דקות מחשידה מאוד לדימום מתרחב עם עליית לחץ תוך-גולגולתי. זהו מצב חירום ניתוחי. הערך המנבא הגדול ביותר של GCS הוא במגמה לאורך זמן ולא בערך יחיד, ולכן חובה לבצע מדידות חוזרות ולתעד אותן."],["ראש","מהו הטיפול בנוזל צלול הדולף מהאוזן בפצוע ראש?",["החדרת ספוגית סופגת עמוק לתעלת האוזן","כיסוי רופף בגזה סטרילית ללא חסימת הניקוז","חסימת תעלת האוזן בגזה לוחצת והדוקה","שטיפת תעלת האוזן במים סטריליים ובחיטוי"],1,"נוזל צלול מהאוזן מחשיד לדליפת נוזל שדרה משבר בבסיס הגולגולת. חסימת הדליפה מעלה את הלחץ התוך-גולגולתי ומגבירה סיכון לזיהום עולה למוח, ולכן מכסים ברפיון בלבד ומאפשרים ניקוז חופשי. שטיפה או החדרת ספוגית מסכנות בהחדרת חיידקים ישירות לחלל התוך-גולגולתי."],["ראש","מהי המשמעות של תנוחת נוקשות דקורטיקטית?",["פשיטה של הגפיים העליונות והתחתונות כאחד","היעדר מוחלט של תנועה בכל ארבע הגפיים","כיפוף של כל ארבע הגפיים בתגובה לגירוי כאב","כיפוף הידיים אל החזה ופשיטת הרגליים — מעל גזע המוח"],3,"בתנוחה דקורטיקטית הידיים מכופפות אל בית החזה והרגליים פשוטות, והיא מעידה על פגיעה בהמיספרות או מעל גזע המוח — ציון 3 במרכיב המוטורי. בתנוחה דצרברטית כל הגפיים פשוטות והידיים מסובבות פנימה, והיא מעידה על פגיעה עמוקה יותר בגזע המוח — ציון 2 ופרוגנוזה גרועה יותר. מעבר מדקורטיקטי לדצרברטי מסמן הידרדרות."],["ראש","מדוע יש להימנע מהשכבת פצוע ראש עם הראש נמוך מהגוף?",["התנוחה מקשה על מדידת לחץ דם מהימנה","התנוחה מפריעה להנחה נכונה של הצווארון","התנוחה מעלה את הלחץ התוך-גולגולתי ואת הבצקת","התנוחה גורמת לכאב ראש ולאי נוחות בלבד"],2,"תנוחת ראש נמוך מעכבת ניקוז ורידי מהמוח ומעלה את הלחץ התוך-גולגולתי. ההמלצה, בהיעדר תת לחץ דם, היא הרמת ראש האלונקה בכ-30 מעלות תוך שמירה על יישור עמוד השדרה — כך משתפר הניקוז הוורידי מבלי לפגוע בפרפוזיה. יש להקפיד גם שהצווארון לא יהיה הדוק מדי, שכן לחץ על ורידי הצוואר משיג אפקט דומה."],["ראש","גבר בן 25 לאחר חבלת ראש: היה ללא הכרה, התעורר ודיבר, וכעת שוב מאבד הכרה. מה החשד?",["שבר לינארי בגולגולת ללא פגיעה תוך-מוחית","היפוגליקמיה על רקע צום ממושך לפני החבלה","דימום אפידורלי עם מרווח צלול אופייני","זעזוע מוח פשוט עם התאוששות הדרגתית"],2,"דפוס אובדן הכרה, מרווח צלול והידרדרות חוזרת הוא התיאור הקלאסי של דימום אפידורלי. הדימום העורקי המהיר מקרע בעורק המנינגיאלי האמצעי צובר נפח עד שהוא מתחיל ללחוץ על המוח. זהו מצב חירום ניתוחי שבו פינוי מהיר לניקוז מציל חיים — בזעזוע מוח פשוט אין הידרדרות מתקדמת כזו."],["ראש","מהו CPP ומה הנוסחה שלו?",["לחץ עורקי ממוצע פחות לחץ תוך-גולגולתי","מכפלת הדופק בלחץ הדם הסיסטולי","לחץ דם סיסטולי פחות לחץ דם דיאסטולי","סכום לחץ הדם והלחץ התוך-גולגולתי"],0,"לחץ הפרפוזיה המוחי שווה ללחץ העורקי הממוצע פחות הלחץ התוך-גולגולתי. מכאן נגזרות שתי מסקנות טיפוליות: ירידה בלחץ הדם או עלייה בלחץ התוך-גולגולתי — שתיהן מפחיתות פרפוזיה מוחית. זו הסיבה שבשטח שומרים על לחץ דם תקין ומעלה ומונעים כל גורם שמעלה לחץ תוך-גולגולתי."],["ראש","מדוע אין להשתמש במנתב אף-לוע בחשד לשבר בבסיס הגולגולת?",["הוא גורם לדימום מסיבי מרירית האף","קיים סיכון לחדירה דרך השבר אל חלל הגולגולת","הוא אינו יעיל בשמירת נתיב אוויר בפצועי ראש","הוא מעלה את הלחץ התוך-גולגולתי בהחדרה"],1,"בשבר בלוח הקריבריפורמי המחיצה בין חלל האף לחלל הגולגולת נפרצת, ומנתב אף-לוע עלול לחדור דרכה ישירות למוח. זהו סיבוך נדיר אך הרסני. לכן בכל חשד — סימן רקון, סימן באטל, דליפת נוזל צלול — משתמשים במנתב לוע-פה או באמצעים אחרים בלבד. אותו כלל חל על החדרת זונדה דרך האף."],["ראש","איזה סוג של פגיעת ראש נגרם מכוחות סיבוביים (Rotational Forces)?",["שבר לינארי בגולגולת ללא הסטת שברים","דימום אפידורלי מהעורק המנינגיאלי האמצעי","המטומה תת-עורית נרחבת ברקמת הקרקפת","פגיעה אקסונלית מפושטת בסיבי העצב הארוכים"],3,"פגיעה אקסונלית מפושטת נגרמת מכוחות גזירה סיבוביים שקורעים את סיבי העצב הארוכים ברחבי המוח, ואופיינית לתאונות במהירות גבוהה ולתסמונת הילד המטולטל. הממצא הקליני הבולט הוא ירידה עמוקה בהכרה שאינה מוסברת בהדמיה — ה-CT עשוי להיראות כמעט תקין. הפרוגנוזה לרוב גרועה."],["ראש","מהו הגורם המרכזי לנזק מוחי משני?",["השבר בגולגולת עצמו","מיקום החבלה בקרקפת","גיל המטופל","היפוקסיה ותת לחץ דם"],3,"הפגיעה הראשונית מתרחשת ברגע החבלה ולא ניתן לשנותה. הנזק המשני מתפתח אחריה, ושני הגורמים המובילים והניתנים למניעה הם היפוקסיה ותת לחץ דם — כל אחד מהם מכפיל בערך את התמותה, ושילובם גרוע בהרבה. לכן כל מאמץ הצוות בשטח מכוון לחמצון תקין, לשמירת לחץ דם ולמניעת עליית לחץ תוך-גולגולתי."],["ראש","מהי הבדיקה הנוירולוגית המהירה שיש לבצע בשלב ה-D?",["בדיקת רפלקסים גידיים בארבע הגפיים","בדיקת שיווי משקל וקואורדינציה בעמידה","בדיקת שדות ראייה ותנועות גלגלי העיניים","מצב הכרה, אישונים ותנועה גסה של ארבע הגפיים"],3,"בשלב ה-D מבצעים הערכה נוירולוגית מהירה בלבד: מצב הכרה לפי AVPU או GCS, בדיקת גודל האישונים ותגובתם לאור, ותנועה גסה של ארבע הגפיים. בדיקות מפורטות כמו רפלקסים, שדות ראייה ושיווי משקל אינן מתאימות לשלב זה ואינן מעשיות בפצוע קריטי — הן שייכות לסקר השניוני או לבית החולים."],["ראש","גבר לאחר חבלת ראש מקיא מספר פעמים ומתלונן על כאב ראש חזק. מה החשד?",["התקף מיגרנה שהוחמר בעקבות החבלה","התייבשות על רקע אובדן נוזלים בהקאות","עליית לחץ תוך-גולגולתי עם דימום מתרחב","הרעלת מזון עם גירוי של מערכת העיכול"],2,"הקאה חוזרת בפצוע לאחר חבלת ראש — במיוחד הקאה בקילוח ללא בחילה מקדימה — יחד עם כאב ראש הולך ומחמיר, היא סימן קלאסי לעליית לחץ תוך-גולגולתי. אלו סימנים מוקדמים שמופיעים לפני שלישיית קושינג ולפני שינויי הכרה, ולכן זיהוים מאפשר פינוי בזמן. אין לייחס אותם להתייבשות או למיגרנה בהקשר של חבלה."],["ראש","מהי החשיבות של תיעוד GCS ראשוני בשטח?",["הוא נדרש בפצועים ללא הכרה בלבד","הוא בסיס להשוואה ולזיהוי מגמת הידרדרות","הוא קובע את יעד הפינוי ואת אמצעי הפינוי","לצורך חיוב ביטוחי ותיעוד משפטי של האירוע"],1,"ערך GCS בודד מוגבל בערכו — המידע החשוב הוא המגמה. GCS ראשוני שנמדד בשטח הוא נקודת ההתייחסות שלפיה יזוהה שינוי, וללא תיעודו לא ניתן לדעת אם המטופל משתפר או מידרדר. לכן הוא נמדד ומתועד בכל פצוע ראש — לא רק בחסרי הכרה — וחוזרים עליו במרווחים קבועים."],["ראש","מהי הסיבה השכיחה לחסימת נתיב אוויר בפצוע ראש ללא הכרה?",["עווית ממושכת של מיתרי הקול בתגובה לגירוי","בצקת של רקמות הגרון ומיתרי הקול","צניחת הלשון לאחור עקב אובדן טונוס השרירים","דימום פעיל מהאף אל תוך הלוע האחורי"],2,"אובדן הטונוס בשרירי הלשון והלוע גורם ללשון לצנוח לאחור ולחסום את הלוע — זו הסיבה השכיחה ביותר לחסימת נתיב אוויר בכל מטופל ללא הכרה. הפתרון הפשוט הוא Jaw Thrust בפצוע טראומה, ולאחריו מנתב אוויר. דימום ובצקת אפשריים אך פחות שכיחים, ועווית מיתרי קול נדירה בהקשר זה."],["ראש","פצוע עם חבלת ראש ומדדים: ל״ד 190/100, דופק 48, נשימות לא סדירות. מה המצב?",["הלם היפוולמי מתקדם עם כשל מנגנוני פיצוי","שלישיית קושינג המעידה על לחץ תוך-גולגולתי גבוה","תגובה אלרגית קשה עם קריסה המודינמית","התקף חרדה עם היפרוונטילציה ואי שקט"],1,"השילוב של יתר לחץ דם קיצוני, ברדיקרדיה ונשימה לא סדירה הוא שלישיית קושינג במלואה. הוא מעיד על לחץ תוך-גולגולתי גבוה מאוד ועל הרניאציה מתקרבת. חשוב להבחין: בהלם היפוולמי לחץ הדם נמוך והדופק מהיר — בדיוק ההפך. זהו מצב חירום המחייב פינוי מיידי, שמירה על חמצון ושקילת היפרוונטילציה מבוקרת."],["ראש","כיצד משפיע אלכוהול על הערכת פצוע ראש?",["הוא משפר את דיוק ה-GCS בשל הרפיית השרירים","הוא אינו משפיע על מהימנות ההערכה","הוא עלול לטשטש את ההכרה ולהסוות פגיעת ראש","הוא מעלה את הלחץ התוך-גולגולתי באופן ישיר"],2,"שיכרות מורידה את ה-GCS ומחקה פגיעת ראש, ולכן קיימת סכנה אמיתית לייחס ירידה בהכרה לאלכוהול ולפספס דימום תוך-גולגולתי. הכלל הוא לעולם לא לייחס שינוי בהכרה לאלכוהול — יש להניח פגיעת ראש עד שיוכח אחרת. שיכרות היא גם חבלה מסיחה שמחייבת קיבוע עמוד שדרה בשל חוסר יכולת להעריך."],["ראש","מהו הטיפול בעצם או בגוף זר החודר לגולגולת?",["דחיפת הגוף הזר פנימה כדי למנוע תזוזה","ייצוב הגוף הזר במקומו וכיסוי סטרילי מסביב","הוצאה מיידית של הגוף הזר ועצירת הדימום","סיבוב עדין של הגוף הזר לשחרור הרקמה"],1,"גוף זר חודר מייצב את הפצע ולעיתים חוסם כלי דם שנקרעו. הוצאתו בשטח עלולה לגרום לדימום בלתי נשלט ולנזק נוסף בעת המשיכה. לכן מייצבים אותו במקומו בעזרת חבישות מסביב, מכסים סטרילית ומפנים דחוף לניתוח. אותו עיקרון חל על גוף זר חודר בכל אזור בגוף — למעט חסימה של נתיב האוויר."],["ראש","מהו הסיכון בקיבוע צווארון הדוק מדי בפצוע ראש?",["גרימת פצעי לחץ בעור הצוואר והעורף","הגבלת תנועת הלסת והקושי בפתיחת נתיב אוויר","לחץ ישיר על בלוטת התריס ועל קנה הנשימה","חסימת ניקוז ורידי מהמוח והעלאת הלחץ התוך-גולגולתי"],3,"צווארון הדוק לוחץ על ורידי הצוואר החיצוניים והפנימיים ומקשה על ניקוז הדם מהמוח, מה שמעלה את הלחץ התוך-גולגולתי ומחמיר את מצב הפצוע. לכן מקפידים על מידה נכונה והידוק מתון, ובפצוע ראש קשה שוקלים אף להימנע מצווארון קשיח ולהעדיף ייצוב ידני. פצעי לחץ הם חשש אמיתי אך פחות דחוף."],["ראש","מהי תסמונת הילד המטולטל (Shaken Baby Syndrome)?",["זיהום של קרומי המוח בגיל הרך","מום מולד בגולגולת עם לחץ על רקמת המוח","פגיעה מוחית מכוחות תאוצה-האטה ללא סימנים חיצוניים","פגיעה מוחית לאחר נפילה מגובה נמוך"],2,"טלטול תינוק יוצר כוחות תאוצה-האטה חזקים שגורמים לדימומים תת-דוראליים, לדימומים ברשתית ולפגיעה אקסונלית מפושטת — לרוב ללא כל סימן חיצוני של חבלה. ראשו הגדול של התינוק ושרירי צוואר חלשים מגבירים את הפגיעות. חוסר התאמה בין הסיפור לממצאים מחייב חשד להתעללות ודיווח."],["ראש","מהי המשמעות של אמנזיה רטרוגרדית לאחר חבלת ראש?",["חוסר זיכרון לאירועים שקדמו לחבלה","חוסר יכולת לזהות אנשים מוכרים","אובדן הכרה ממושך","חוסר זיכרון לאירועים שלאחר החבלה"],0,"אמנזיה רטרוגרדית היא אובדן זיכרון לאירועים שלפני החבלה, ואמנזיה אנטרוגרדית היא חוסר יכולת ליצור זיכרונות חדשים לאחריה. משך האמנזיה מתאם עם חומרת הפגיעה ומהווה מדד קליני שימושי. מטופל ששואל שוב ושוב את אותה שאלה מפגין אמנזיה אנטרוגרדית — ממצא שמחייב הערכה גם אם ה-GCS תקין."],["ראש","פצוע ראש עם סטורציה 88 אחוז. מה העדיפות?",["תיקון החמצון מיידית לפני כל פעולה אחרת","הרגעת המטופל בתרופות להפחתת צריכת החמצן","מתן נוזלים להעלאת לחץ הפרפוזיה המוחי","פינוי מיידי תוך דילוג על פעולות בשטח"],0,"היפוקסיה היא הגורם המרכזי לנזק מוחי משני, וסטורציה של 88 אחוז מחייבת תיקון מיידי — חמצן בזרימה גבוהה ובמידת הצורך סיוע נשימתי. אין להעדיף פינוי על פני חמצון, שכן הנזק מצטבר בכל דקה. הרגעה בתרופות בפצוע היפוקסי מסוכנת מפני שהיא מדכאת נשימה ומחמירה את המצב."],["ראש","מהו הסימן המוקדם ביותר לעליית לחץ תוך-גולגולתי?",["אישונים מורחבים ובלתי מגיבים לאור","נשימת צ׳יין-סטוקס עם הפסקות נשימה","שינוי במצב ההכרה ובהתנהגות המטופל","ברדיקרדיה עמוקה עם יתר לחץ דם"],2,"שינויים בהכרה ובהתנהגות — בלבול, אי שקט, ישנוניות — הם הביטוי המוקדם ביותר של עליית לחץ תוך-גולגולתי, מפני שקליפת המוח רגישה ביותר. הסימנים האחרים — ברדיקרדיה, אישונים בלתי מגיבים ודפוסי נשימה חריגים — מופיעים בשלב מאוחר כשהלחץ כבר מגיע לגזע המוח. לכן חובה על מדידות הכרה חוזרות."],["עמוד שדרה","כמה חוליות יש בעמוד השדרה הצווארי?",["7","12","5","9"],0,"בעמוד השדרה הצווארי שבע חוליות, C1 עד C7. בחזי שתים עשרה, במותני חמש, ובעצה ובעצם הזנב יתרתן. שתי החוליות הראשונות מיוחדות: C1 היא האטלס הנושאת את הגולגולת, ו-C2 היא האקסיס שסביב הבליטה שלה מסתובב הראש. פגיעה גבוהה ב-C3 עד C5 מסכנת את עצבוב הסרעפת."],["עמוד שדרה","באיזה גובה נמצא מרכז העצבוב של הסרעפת?",["L1 עד L3","C3 עד C5","T1 עד T4","C1 עד C2"],1,"עצב הפרנוס יוצא מהשורשים C3 עד C5 ומעצבב את הסרעפת. הכלל לזכירה הוא C3, 4, 5 keep the diaphragm alive. פגיעה מעל גובה זה גורמת לשיתוק מיידי של הסרעפת ולדום נשימה, ולכן פגיעות צוואריות גבוהות מסכנות חיים מיידית ומחייבות תמיכה נשימתית."],["עמוד שדרה","מהו הלם נוירוגני ומהו הלם שדרתי (Spinal Shock)?",["שני המונחים מתארים את אותה תופעה בדיוק","השדרתי מתייחס לפגיעות בעמוד השדרה המותני בלבד","נוירוגני חולף תוך ימים והשדרתי נותר קבוע","נוירוגני הוא כשל המודינמי, שדרתי הוא אובדן תפקוד זמני"],3,"הלם נוירוגני הוא מצב המודינמי — תת לחץ דם וברדיקרדיה עקב אובדן הטונוס הסימפתטי, ומחייב טיפול בנוזלים ובוזופרסורים. הלם שדרתי הוא תופעה נוירולוגית — שיתוק רפה ואובדן רפלקסים ותחושה מתחת לגובה הפגיעה, שעשוי לחלוף תוך ימים עד שבועות. הבלבול בין השניים שכיח, אך המשמעות הטיפולית שונה לחלוטין."],["עמוד שדרה","מטופל עם פגיעה בחוט השדרה בגובה T4. איזה סימן צפוי?",["שיתוק של הסרעפת עם נשימה בטנית בלבד","אובדן תחושה בפנים ובגפיים העליונות","שיתוק בגפיים התחתונות עם תפקוד תקין בידיים","שיתוק בארבע הגפיים עם שמירה על הסרעפת"],2,"פגיעה בגובה T4 היא מתחת למקטעים המעצבבים את הגפיים העליונות, ולכן הידיים מתפקדות והשיתוק מוגבל לגפיים התחתונות — פאראפלגיה. שיתוק בארבע הגפיים מחייב פגיעה צווארית. הסרעפת נשמרת מפני שעצבובה יוצא מ-C3 עד C5, אך שרירי הבטן והצלעות משותקים ולכן יכולת השיעול והנשימה העמוקה נפגעת."],["עמוד שדרה","מהו התסמין המחשיד ביותר לפגיעה בחוט השדרה בפצוע בהכרה?",["כאב מקומי בגב התחתון המחמיר בתנועה","סחרחורת בקימה מהירה ממצב שכיבה","כאב ראש עורפי המקרין אל הצוואר","נימול, חולשה או אובדן תחושה בגפיים"],3,"תלונה על נימול, עקצוץ, חולשה או אובדן תחושה בגפיים היא הביטוי הישיר של פגיעה בחוט השדרה ומחייבת קיבוע וחשד מיידיים. כאב גב מקומי חשוב ומצדיק בדיקה אך אינו ספציפי — ניתן לשבור חוליה ללא פגיעה בחוט. סחרחורת וכאב ראש אינם סימנים נוירולוגיים מוקדיים."],["עמוד שדרה","מהי תסמונת החוט הקדמי (Anterior Cord Syndrome)?",["אובדן מוטורי ותחושת כאב וחום, עם שמירת תחושה עמוקה","אובדן תחושה בפנים עם שמירה על הגפיים","שיתוק מוטורי בצד אחד של הגוף בלבד","אובדן תחושת מגע עדין ורטט בלבד"],0,"תסמונת החוט הקדמי נגרמת מפגיעה באספקת הדם דרך העורק השדרתי הקדמי, ולכן נפגעים המסלולים הקדמיים — המוטורי והספינותלמי שנושא כאב וחום. המסלולים האחוריים, שנושאים תחושה עמוקה, מיקום ורטט, נשמרים. הפרוגנוזה של תסמונת זו היא הגרועה מבין תסמונות החוט החלקיות."],["עמוד שדרה","מהי תסמונת החוט המרכזי (Central Cord Syndrome) ובמי היא שכיחה?",["שכיחה לאחר פגיעות חודרות בעמוד השדרה","שכיחה בספורטאים צעירים לאחר דחיסה צירית","שכיחה בקשישים לאחר היפראקסטנציה — חולשה בידיים","שכיחה בילדים לאחר נפילה מגובה נמוך"],2,"תסמונת החוט המרכזי אופיינית לקשישים עם היצרות תעלה קיימת שעברו מנגנון היפראקסטנציה — למשל נפילה עם חבלה במצח. הפגיעה במרכז החוט פוגעת בעיקר בסיבים המעצבבים את הגפיים העליונות, ולכן החולשה בידיים בולטת יותר מאשר ברגליים. זו התסמונת החלקית השכיחה ביותר, ופרוגנוזתה טובה יחסית."],["עמוד שדרה","מהי תסמונת בראון-סקאר (Brown-Séquard)?",["אובדן תחושה מלא ללא כל חסר מוטורי","פגיעה דו-צדדית מלאה בכל חתך החוט","פגיעה בשורשי העצבים ללא מעורבות החוט","חיתוך חצי חוט — חסר מוטורי באותו צד וחושי בנגדי"],3,"בפגיעה בחצי חוט — לרוב מפגיעה חודרת — נפגעים המסלולים המוטוריים והתחושה העמוקה באותו צד של הפגיעה, ואילו תחושת הכאב והחום נפגעת בצד הנגדי. הסיבה היא שסיבי הכאב והחום מצטלבים כבר בגובה הכניסה לחוט, בעוד שהמסלולים המוטוריים מצטלבים גבוה יותר בגזע המוח. זוהי התסמונת בעלת הפרוגנוזה הטובה ביותר."],["עמוד שדרה","מדוע פגיעות עמוד שדרה שכיחות במיוחד באזור הצווארי והמעבר החזי-מותני?",["אלו אזורי מעבר בין קטע נייד לקטע מקובע","באזורים אלו מספר החוליות קטן מהרגיל","באזורים אלו השרירים המייצבים חזקים במיוחד","אלו האזורים הצפופים ביותר בחוליות ובעצבים"],0,"אזורי מעבר בין קטע גמיש לקטע קשיח סופגים את מרב עומס הכוחות. הצוואר נייד מאוד ונושא ראש כבד ללא תמיכה של בית חזה, והמעבר בין החוליה החזית האחרונה למותנית הראשונה מפריד בין הקטע החזי המקובע לצלעות לבין הקטע המותני הנייד. לכן כמחצית מהפגיעות בצוואר וחלק ניכר בנוסף באזור T12-L1."],["עמוד שדרה","מהי הגישה הנכונה לחילוץ פצוע מרכב עם חשד לפגיעת עמוד שדרה, כאשר הוא יציב?",["חילוץ מבוקר תוך שמירה על יישור ציר הגוף","משיכה מהירה מהרכב לקיצור זמן החשיפה","המתנה פסיבית עד להגעת צוות חילוץ ייעודי","הוצאה בסיבוב על הצד דרך דלת הנהג"],0,"בפצוע יציב מבצעים חילוץ מבוקר תוך שמירה על יישור בין הראש, הצוואר והגו לאורך כל התנועה, בעזרת מספר מטפלים ואמצעי חילוץ. חילוץ חירום מהיר שמור למצבים שבהם יש סכנה מיידית לחיים — שריפה, זירה לא בטוחה או צורך בהחייאה — ואז שיקולי הבטיחות גוברים על שיקולי העמוד. המתנה פסיבית בפצוע יציב אינה נדרשת אם הצוות מסוגל לחלץ."],["עמוד שדרה","מהו הסיכון העיקרי בקיבוע ממושך ללוח גב?",["פצעי לחץ, כאב, קושי בנשימה וסיכון לנתיב האוויר","ירידה ברמת הסוכר בדם בשל השכיבה הממושכת","עלייה בלחץ הדם ובקצב הלב בשל אי הנוחות","גרימת שברים נוספים בעמוד השדרה"],0,"לוח הגב הוא משטח קשיח שיוצר לחץ על עצם העצה ועל העורף תוך דקות, גורם לכאב משמעותי, מגביל את התפשטות בית החזה ופוגע בנשימה, ומקשה על טיפול בנתיב אוויר ובהקאה. מסיבות אלה הוא הפך לאמצעי חילוץ בלבד ולא לאמצעי הובלה ממושך, וההנחיות העדכניות מצמצמות מאוד את השימוש בו."],["עמוד שדרה","פצוע עם חשד לפגיעת עמוד שדרה שמקיא. מה הפעולה?",["ביצוע סקשן בלבד ללא כל שינוי בתנוחה","הוצאת הצווארון והטיית הראש לצד","הרמת ראש האלונקה ללא הזזת הפצוע","סיבוב הפצוע כיחידה אחת על הצד תוך שמירת ציר"],3,"נתיב האוויר גובר, אך ניתן להגן עליו מבלי לוותר על יישור העמוד: סיבוב כיחידה אחת עם מספר מטפלים ששומרים על ציר ראש-צוואר-גו, כך שהתוכן מתנקז החוצה. הוצאת הצווארון והטיית הראש מסכנות את חוט השדרה. סקשן לבדו לרוב אינו מספיק בהקאה בנפח גדול, והרמת ראש האלונקה אינה מונעת שאיפה."],["עמוד שדרה","מהו סימן אופייני לפגיעה בחוט השדרה בגבר?",["פריאפיזם — זקפה ממושכת ובלתי רצונית","הזעה מוגברת בגפיים מתחת לגובה הפגיעה","הרחבת אישונים דו-צדדית ללא תגובה לאור","ברדיקרדיה מתמשכת ללא תגובה לאטרופין"],0,"פריאפיזם נגרם מאובדן הבקרה הסימפתטית על כלי הדם באיבר המין, שגורם לאגירת דם. זהו סימן ספציפי יחסית לפגיעה בחוט השדרה ומופיע בשלב מוקדם. סימנים נוספים כוללים עור חם ויבש מתחת לגובה הפגיעה, שיתוק רפה, אובדן שליטה על סוגרים ונשימה סרעפתית בלבד. הזעה דווקא נעדרת מתחת לגובה הפגיעה."],["עמוד שדרה","מהי נשימה סרעפתית (Diaphragmatic Breathing) ומה משמעותה?",["תנועת בטן ללא תנועת חזה — שיתוק בין-צלעיים","נשימה לא סדירה לחלוטין — פגיעה בגזע המוח","נשימה עמוקה ואיטית — סימן לחמצת מטבולית","נשימה מהירה ושטחית — סימן להיפוקסיה"],0,"כאשר הפגיעה בחוט השדרה נמצאת מתחת ל-C5 אך מעל המקטעים החזיים, הסרעפת ממשיכה לפעול אך שרירי הבין-צלעיים משותקים. התוצאה היא בטן שעולה ויורדת ללא תנועה של בית החזה. זהו סימן מבשר רע — הרזרבה הנשימתית מוגבלת מאוד, והפצוע עלול לכשול נשימתית בכל רגע ומחייב ניטור צמוד."],["עמוד שדרה","מהו הכלל בבדיקת עמוד השדרה בפצוע עם חבלה מסיחה?",["יש לבדוק תנועה אקטיבית ולשחרר לפי התוצאה","ניתן לשלול פגיעה אם הפצוע אינו מתלונן","לא ניתן לשלול פגיעה — יש לקבע","יש להסתמך על מנגנון הפגיעה בלבד"],2,"חבלה מסיחה — שבר כואב בגפה, כוויה או פציעה דרמטית — מסיטה את תשומת לב הפצוע ומונעת ממנו לחוש כאב בעמוד השדרה. לכן בדיקה נורמלית אינה אמינה ולא ניתן לשלול פגיעה קלינית, והכלל הוא לקבע. אותו עיקרון חל על שיכרות, על שימוש בסמים, על מחסום שפה ועל ירידה בהכרה."],["עמוד שדרה","מהו הכוח המנגנוני העיקרי בפגיעות צלילה למים רדודים?",["סיבוב חד של הראש ביחס לגו בעת הכניסה","דחיסה צירית של עמוד השדרה לאורך צירו","כיפוף צדי של הצוואר בפגיעה בקרקעית","היפראקסטנציה חדה של עמוד השדרה הצווארי"],1,"בצלילה הראש פוגע בקרקעית והכוח מועבר במאונך לאורך ציר עמוד השדרה — דחיסה צירית שגורמת לשברי פיצוץ (Burst Fractures) בחוליות הצוואריות ולהתפרצות שברי עצם לתוך התעלה. זהו מנגנון קטלני במיוחד בקרב צעירים. אותו מנגנון פועל גם בנפילה עם נחיתה על הראש או על הרגליים."],["עמוד שדרה","פצוע לאחר תאונה מדווח על נימול בשתי הידיים שחלף מיד. מה הגישה?",["לקבע ולפנות — תסמין חולף מחשיד לפגיעה","לשחררו מקיבוע מאחר שהתסמין חלף מעצמו","להמתין ולבחון אם התסמין חוזר בהמשך","להפנותו לבדיקה עצמאית במרפאה בהמשך"],0,"תסמין נוירולוגי חולף מעיד על כך שהחוט נפגע או נדחס באופן זמני, ולכן קיים סיכון ממשי לחוסר יציבות מכנית ולפגיעה נוספת בכל תזוזה. היעלמות התסמין אינה מרגיעה — היא מעידה רק על כך שהלחץ הוסר, לא על כך שהעמוד יציב. לכן קיבוע ופינוי הם חובה."],["עמוד שדרה","מהי הסיבה לברדיקרדיה בהלם נוירוגני?",["ירידה
