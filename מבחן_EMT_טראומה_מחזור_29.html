טבילה במים חמים"],0,"מרחיקים מהסביבה הקרה, מפשיטים ביגוד רטוב שממשיך לגזול חום, מכסים בשמיכות ומחממים בהדרגה. נותנים חמצן ומנטרים רמת גלוקוז, ושוקלים עירוי נוזלים מחוממים. אין לתת אלכוהול או קפאין — האלכוהול מרחיב כלי דם היקפיים ומגביר אובדן חום. עיסוי נמרץ עלול לגרום להחזרת דם קר מהפריפריה ולהפרעות קצב."],["אקלים ובעלי חיים","מהי המשמעות של האמירה שמטופל אינו מת עד שהוא חם ומת?",["היפותרמיה מגנה על המוח — יש לחמם לפני קביעת מוות","ביצוע החייאה בהיפותרמי אסור בשל הפרעות קצב","אמירה תיאורטית ללא משמעות מעשית","יש להפסיק החייאה מוקדם בהיפותרמיה קשה"],0,"היפותרמיה מפחיתה דרמטית את הצריכה המטבולית של המוח ומאריכה משמעותית את חלון ההישרדות. תועדו החלמות מלאות ללא נזק נוירולוגי לאחר החייאות ממושכות מאוד — למשל אישה שטבעה ל-80 דקות והחלימה במלואה לאחר חימום. לכן אין לקבוע מוות בהיפותרמי לפני שחומם, ויש להמשיך החייאה תוך כדי חימום."],["אקלים ובעלי חיים","מהן כוויות קור (Frostbite) והיכן הן שכיחות?",["כוויות הנגרמות מחשיפה לחום קיצוני","קפיאת נוזלי גוף באזורים מרוחקים — אצבעות, אוזניים ואף","דלקת שטחית של העור מחשיפה לרוח","נזק לעור מחשיפה ממושכת לקרינת שמש"],1,"בחשיפה לקור מתרחשת וזוקונסטריקציה שמפחיתה את זרימת הדם לפריפריה, ובטמפרטורה של כמינוס 2 מעלות נוזלי הגוף קופאים ונוצרים גבישי קרח שהורסים תאים. האזורים השכיחים הם קצות אצבעות הידיים והרגליים, האוזניים, האף ואיברי המין. הפגיעה מסווגת לשטחית ולעמוקה."],["אקלים ובעלי חיים","מהו הטיפול בכוויות קור?",["טבילת האזור במים רותחים לחימום מהיר","עיסוי חזק של האזור להחזרת הזרימה","הרחקה מהקור, חימום האזור, חבישה לא לוחצת ופינוי","שפשוף האזור בשלג או בבד לחימום"],2,"מרחיקים מהסביבה הקרה, מחממים את האזור הפגוע בעדינות באמצעות חום גוף, מניחים חבישה לא לוחצת, נותנים נוזלים מחוממים ומפנים במהירות עם הגפה מורמת. אין לשפשף את האזור — שפשוף הורס רקמות קפואות. אין לחמם אם קיים סיכון להקפאה חוזרת, מפני שמחזור הפשרה-הקפאה גורם לנזק חמור בהרבה."],["אקלים ובעלי חיים","מהן רגלי חפירות (Trench Foot)?",["כווייה תרמית שטחית באזור כפות הרגליים","חשיפה ממושכת לקור ולחות ללא קפיאה — גפה נפוחה ואדומה","פגיעת קור עם קפיאת נוזלים ברקמה","זיהום פטרייתי של כפות הרגליים והציפורניים"],1,"רגלי חפירות היא פגיעת קור לא קפיאתית שנגרמת משעות של חשיפה לקור וללחות עם זרימת דם מועטה. הגפה נראית קרה, נפוחה ואדומה, ומופיעה תחושת נימול או חוסר תחושה. ההחלמה נמשכת שבועות עד חודשים וייתכן נזק בלתי הפיך. מצב קרוב הוא שלפוחיות קור, ששכיח באנשים עם בעיה בזרימה ההיקפית."],["אקלים ובעלי חיים","מהם הנחשים הארסיים הנפוצים בישראל?",["הצפע הארצישראלי בלבד מכל מיני הנחשים","צפע ארצישראלי, אפעה, שרף עין גדי, פתן שחור ועכן","בישראל אין נחשים ארסיים המסכנים אדם","הזעמן השחור והנחש התלום בלבד"],1,"בישראל תשעה מיני נחשים ארסיים השייכים לשלוש משפחות. הצפע הארצישראלי הוא הנפוץ ביותר בארץ, האפעה הוא הנפוץ ביותר באזור באר שבע ודרומה, ולשניהם קיים נסיוב נוגד ארס. שרף עין גדי ארסי אך אין לו נסיוב בישראל. הזעמן השחור, לעומתם, אינו ארסי כלל."],["אקלים ובעלי חיים","כיצד מזהים צפע ארצישראלי?",["ראש שטוח וצר ללא דוגמה מובחנת על הגב","ראש משולש ורחב ומעוינים חומים בקו עקלתון רציף","גוף ירוק בהיר עם פסים אורכיים בהירים","ראש עגול וגוף בצבע אחיד ללא דוגמה"],1,"הצפע הארצישראלי מזוהה בראש משולש ורחב באזור הצוואר, ובדוגמה אופיינית של מעוינים חומים על הגב המחוברים בקו עקלתון רציף בצורת זיגזג. הוא מצוי במקומות יישוב, בחורש, במשקים חקלאיים, בגלי אבנים ובערמות אשפה, מסוגל לטפס על עצים, פעיל בלילה וניזון ממכרסמים."],["אקלים ובעלי חיים","מהן הפעולות האסורות בטיפול בהכשת נחש?",["מציצת הארס, קירור האזור, קיבוע הדוק ותפיסת הנחש","הרגעת הנפגע ומניעת מאמץ גופני מיותר","מתן חמצן ופינוי מהיר עם הגפה מונחת","הסרת תכשיטים מהגפה לפני התפתחות בצקת"],0,"מציצת הארס הוכחה כבלתי יעילה. קירור האזור המוכש הוכח כלא יעיל ואף פוגע ברקמות מסביב. קיבוע או חבישות הוכחו כלא יעילים וכגורמים נזק. ניסיון לתפוס את הנחש מסוכן ומיותר — אפשר לצלמו אם אין עיכוב בפינוי. חשוב למנוע מאמץ מהמוכש ולא לעכב את הפינוי."],["אקלים ובעלי חיים","מהם סוגי הארס לפי מנגנון הפעולה?",["ארס נוזלי וארס מוצק לפי צורת ההזרקה","ארס חם וארס קר לפי תגובת הרקמה","נוירוטוקסי, קרדיוטוקסי, המטוטוקסי וציטוטוקסי","ארס חומצי וארס בסיסי לפי דרגת החומציות"],2,"ארס נוירוטוקסי פוגע במערכת העצבים, ארס קרדיוטוקסי פוגע בתפקוד שריר הלב, ארס המטוטוקסי פוגע במערכת הדם ובקרישה, וארס ציטוטוקסי פוגע מקומית בתאים וגורם לנמק. חשוב להבחין בין סיוב — פלזמת הדם ללא מרכיבי קרישה, לבין סיוב נוגדני או אנטי-סרום, שהוא אנטידוט המכיל נוגדנים."],["אקלים ובעלי חיים","מהם שני העכבישים הארסיים בישראל וכיצד הם מתבטאים?",["השושן החום בלבד מכל מיני העכבישים","האלמנה השחורה בלבד מכל מיני העכבישים","אלמנה שחורה — התכווצויות בטן; שושן חום — כאב וצבע כחול","בישראל אין עכבישים ארסיים המסכנים אדם"],2,"האלמנה השחורה טורפת את הזכר לאחר הזדווגות, ונשיכתה גורמת לאודם, לכאב ולנפיחות באזור, להתכווצויות בטן חמורות או קשיון בטן, לבחילות והקאות, לרעד ולהזעה. השושן החום פעיל בשעות החשיכה, ונשיכתו גורמת לכאב קל בתחילה, לחום, לצמרמורות, לכאבים בכל הגוף ולצבע עור כחול עמוק סביב אזור הנשיכה."],["אקלים ובעלי חיים","מהם המאפיינים של עקיצת עקרב צהוב?",["שיתוק מיידי של הגפה שנעקצה","עקיצה חסרת תסמינים ברוב המקרים","דימום מסיבי מאתר העקיצה עם הלם","כאב, נפיחות ואודם עם שפעול אוטונומי — מסוכן לילדים"],3,"העקרב הצהוב מסתתר מתחת לאבנים ביום ומשוטט בלילה. העקיצה גורמת לכאב, לנפיחות ולאודם מקומיים, להפרשות מרובות ולשפעול סימפתטי או פרה-סימפתטי — טכיקרדיה או ברדיקרדיה, טכיפנאה או ברדיפנאה, יתר או תת לחץ דם, ואישונים מורחבים או אישוני סיכה. הוא מסוכן במיוחד לילדים ולתינוקות בשל יחס המינון למשקל."],["אקלים ובעלי חיים","מהו הטיפול בעקיצת דבורה או צרעה?",["מריחת משחה מרגיעה על אזור העקיצה","הוצאת העוקץ בגירוד, חמצן ומעקב אחר אנפילקסיס","המתנה ללא טיפול עד לחלוף התסמינים","לחיצה על שקית הארס להוצאת העוקץ"],1,"הסימפטומים הרגילים — כאב, נפיחות ואודם מקומיים — הם תוצאה של הטוקסין המוזרק ויחלפו תוך שעות עד ימים. את העוקץ מוציאים בגירוד ולא בלחיצה, שכן לחיצה סוחטת ארס נוסף מהשקית. הסכנה האמיתית היא באנשים אלרגיים שמפתחים תגובה תוך דקות, מפריחה ועד הלם אנפילקטי — ולכן נדרש מעקב."],["אקלים ובעלי חיים","מהו הטיפול באנפילקסיס לאחר עקיצה?",["מתן סטרואידים במינון גבוה כטיפול ראשון","קירור מקומי של אזור העקיצה בקרח","מתן אנטיהיסטמין דרך הפה או הווריד","ABC, חמצן, אדרנלין במזרק אוטומטי ואז אנטיהיסטמין"],3,"הטיפול הוא ABC ומתן חמצן, אדרנלין במזרק אוטומטי כטיפול המציל והמיידי, ולאחריו אנטיהיסטמין וסטרואידים כטיפול משלים. אדרנלין הוא היחיד שפועל מהר מספיק כדי להפוך את חסימת נתיב האוויר ואת הקריסה ההמודינמית, ולכן אין לעכבו לטובת התרופות האחרות."],["אקלים ובעלי חיים","מהי כלבת ומהי דרך ההדבקה?",["מחלה נגיפית קטלנית המועברת ברוק של חיה נגועה","מחלה חיידקית המועברת בנשיכת מכרסמים","מחלה נגיפית המועברת בטיפות רוק באוויר","מחלה תורשתית הפוגעת במערכת העצבים"],0,"כלבת היא מחלה זיהומית קטלנית הנגרמת מנגיף ומועברת ברוק של בעל חיים נגוע דרך נשיכה, שריטה או ליקוק. המקורות הם חיות בר — שועלים ותנים — וכן כלבים וחתולים. למחלה אין טיפול והיא קטלנית ב-99.999 אחוז מהמקרים אם היא מגיעה למערכת העצבים המרכזית, ולכן מניעה היא הכול."],["אקלים ובעלי חיים","מהם שלבי מחלת הכלבת?",["דגירה של שבוע עד שנה, פרודרום של כ-4 ימים ואז המחלה","שלושה שלבים בני יום אחד כל אחד","שלב אחד בלבד המתפתח תוך ימים","המחלה מתפרצת מיד עם הנשיכה ללא דגירה"],0,"תקופת הדגירה נמשכת משבוע עד שנה — הנגיף חודר לעצבים ומטפס לכיוון המוח בקצב של 1 עד 3 מ״מ לשעה. שלב הפרודרום נמשך כ-4 ימים עם סימנים כלליים של חום, כאבים וחולשה. לאחריו מופיעים שינויים בהתנהגות ואלימות, ריור מוגבר, הידרופוביה, פוטופוביה, פרכוסים ושיתוק שרירים. המוות מגיע כ-4 ימים לאחר מכן."],["אקלים ובעלי חיים","מהו הטיפול בנשיכת כלב?",["חבישה הדוקה של הפצע לעצירת הדימום","המתנה ומעקב אחר החיה במשך עשרה ימים","הזרקת אנטיביוטיקה מקומית באתר הנשיכה","ניקוי במים וסבון, חיטוי, אי חבישה ופינוי לחיסונים"],3,"מרגיעים את הנפגע ומונעים תזוזה של אזור הנשיכה, מנקים את הפצע במים ובסבון ומחטאים באלכוהול. אין לחבוש את הפצע בשל חשש לטטנוס — סגירת הפצע יוצרת סביבה אנאירובית. מפנים לבית חולים, לקופת חולים או ללשכת בריאות למתן חיסונים פסיביים ואקטיביים, חיסון נגד טטנוס ואנטיביוטיקה."],["אקלים ובעלי חיים","מתי ניתן חיסון אקטיבי נגד כלבת בנוסף לפסיבי?",["חיסון אקטיבי אינו ניתן במחלת הכלבת","כשהחיה במעקב מפתחת סימני מחלה או שאין גישה אליה","בכל נשיכה מכל בעל חיים ללא יוצא מן הכלל","בילדים ובמדוכאי חיסון בלבד"],1,"בנשיכה מחיה שניתן לאתר ולעקוב אחריה, החיה מושמת בהסגר למעקב של 10 ימים. אם היא מפתחת סימני מחלה — או אם אין בידי הצוות גישה לחיה כלל — ניתן חיסון אקטיבי בנוסף לפסיבי. הגישה זהירה מפני שהמחלה קטלנית כמעט ב-100 אחוז ברגע שהתפרצה, בעוד שהחיסון יעיל אם ניתן בזמן."],["אקלים ובעלי חיים","מהי הגישה למניעת פגיעות חום באוכלוסיות בסיכון?",["הגדלת צריכת הקפה והמשקאות הממריצים","אין צורך במניעה מעבר לשתייה רגילה","הגברה הדרגתית של המאמץ ליצירת התאקלמות","זיהוי קבוצות סיכון, שתייה, הימנעות ממאמץ והצללה"],3,"קבוצות הסיכון הן קשישים, ילדים קטנים, חולים כרוניים, נוטלי תרופות מסוימות ומתאמנים בתנאי חום. המניעה כוללת שתייה מספקת של מים ומלחים, הימנעות ממאמץ בשעות החמות, לבוש קל ובהיר, הצללה, ומודעות לסימנים המקדימים. חשוב לזכור שמכת חום עלולה להיות קטלנית גם בצעירים ובריאים, כמו במקרים בגיבושי צה״ל."],["אקלים ובעלי חיים","מהי הסכנה בשתיית אלכוהול בקור?",["וזודילטציה מגבירה אובדן חום ופוגעת בשיפוט","לאלכוהול אין השפעה על ויסות חום הגוף","האלכוהול מגביר את הרעד ואת ייצור החום","האלכוהול מחמם את הגוף ומעלה חום ליבה"],0,"אלכוהול מרחיב כלי דם היקפיים ויוצר תחושת חמימות מדומה בעוד שבפועל אובדן החום גובר משמעותית. בנוסף הוא פוגע בשיפוט ומונע מהאדם לחפש מחסה, מדכא רעד ומעכב את ייצור החום. לכן שתיית אלכוהול היא גורם סיכון מרכזי למקרי היפותרמיה ומוות מקור, ואין לתת אותו לנפגעי קור."],["פינוי והרמה","מהם עקרונות ההרמה הבטוחה?",["גב ישר, כיפוף ברכיים, משא קרוב לגוף וללא סיבוב","הרמה מהירה ככל האפשר לקיצור זמן העומס","כיפוף הגב והרמה בעזרת שרירי הזרועות","הרמה בידי מטפל אחד לשמירה על תיאום"],0,"עקרונות ההרמה הבטוחה הם שמירה על גב ישר וניצול שרירי הרגליים החזקים, כיפוף בברכיים ולא במותניים, החזקת המשא קרוב ככל האפשר למרכז הגוף, פיסוק רגליים לבסיס יציב, והימנעות מוחלטת מסיבוב הגו תוך כדי נשיאה. סיבוב תחת עומס הוא הגורם השכיח ביותר לפגיעות גב בצוותים."],["פינוי והרמה","מהי הסכנה העיקרית בסיבוב הגו תוך כדי הרמה?",["החלקת המשא מהידיים ונפילתו על הפצוע","עייפות מוגברת של שרירי הגב והכתפיים","אובדן שיווי משקל ונפילה של המטפל","פגיעה בדיסקים ובעמוד השדרה המותני"],3,"סיבוב הגו תחת עומס יוצר כוחות גזירה על הדיסקים הבין-חולייתיים ועל מפרקי הפאסט, והוא הגורם המכני השכיח ביותר לפריצת דיסק ולפגיעות גב בקרב אנשי צוות. הפתרון הוא להזיז את הרגליים ולסובב את כל הגוף כיחידה אחת, ולא לסובב את הגו ביחס לאגן."],["פינוי והרמה","מתי מבצעים חילוץ חירום מרכב?",["כאשר הפצוע מבקש לצאת מהרכב בעצמו","בכל תאונת דרכים עם מנגנון משמעותי","כשקיימת סכנה מיידית — שריפה, זירה לא בטוחה או החייאה","בכל פצוע שחולץ מרכב לאחר תאונה"],2,"חילוץ חירום מוותר על חלק מהגנת עמוד השדרה לטובת מהירות, ולכן הוא שמור למצבים שבהם ההמתנה מסוכנת יותר: שריפה או סכנת שריפה, זירה לא מאובטחת, מצב שבו לא ניתן להגיע לפצוע קריטי אחר, או פצוע שזקוק להחייאה ולא ניתן לבצעה במקומו. בכל מקרה אחר מבצעים חילוץ מבוקר."],["פינוי והרמה","מהו העיקרון בהעברת פצוע ממשטח למשטח?",["העברה מהירה ללא תיאום לקיצור זמן החשיפה","הרמה בידי מטפל אחד לשמירה על אחידות","תיאום, ספירה משותפת, מספר מטפלים ויישור ציר הגוף","גרירה זהירה על הרצפה עד לאלונקה"],2,"העברת פצוע מחייבת תיאום מלא: מנחה יחיד שמנהל את התהליך, ספירה משותפת ברורה, מספר מטפלים מספיק לפי משקל הפצוע, ושמירה על יישור ראש-צוואר-גו לאורך כל התנועה. חוסר תיאום גורם לתנועה לא אחידה שמסכנת את עמוד השדרה ואת בטיחות הצוות."],["פינוי והרמה","מהי החשיבות של קשירת הפצוע לאלונקה?",["שיפור נוחות הפצוע בזמן הנסיעה","דרישה ביורוקרטית של נוהל הפינוי","הגבלת תנועת המטופל למניעת התנגדות","מניעת נפילה ותזוזה בבלימה או בפנייה חדה"],3,"רכב בתנועה מפעיל כוחות תאוצה והאטה משמעותיים, ובבלימה או בפנייה חדה פצוע לא מקובע עלול ליפול או להזיז את עמוד השדרה. קשירה נכונה כוללת רצועות על החזה, על האגן ועל הרגליים, ובקיבוע שדרתי גם קיבוע ראש. יש לוודא שהרצועות אינן מגבילות את הנשימה."],["פינוי והרמה","מהם השיקולים בבחירת יעד הפינוי?",["מרחק הנסיעה מהזירה לבית החולים בלבד","העדפתו האישית של הפצוע ובני משפחתו","זמינות האמבולנס ומספר אנשי הצוות","מצב הפצוע, יכולות בית החולים, מרחק, זמן וקיבולת"],3,"היעד נקבע לפי חומרת מצב הפצוע ויציבותו, יכולות המוסד — מרכז טראומה, יחידת כוויות, יכולת צנתור או נוירוכירורגיה, מרחק וזמן נסיעה, וקיבולת הקליטה באותו רגע. פצוע קריטי לא יציב עשוי להזדקק לבית החולים הקרוב לייצוב, בעוד שפצוע יציב עם פגיעה מורכבת יופנה למרכז המתאים גם אם רחוק יותר."],["פינוי והרמה","מתי שוקלים פינוי מסוק?",["כשהפינוי הקרקעי ארוך משמעותית או הגישה קשה","בפצועים קלים לצורך קיצור זמן הפינוי","בכל פצוע עם מנגנון פגיעה משמעותי","בשעות היום בלבד ובתנאי ראות טובים"],0,"פינוי אווירי נשקל כאשר זמן ההגעה למרכז המתאים בדרך הקרקע ארוך משמעותית, כשהגישה לזירה קשה, או כשנדרשות יכולות טיפול מתקדמות בדרך. יש לשקול גם את זמן ההמתנה למסוק, את תנאי מזג האוויר ואת בטיחות אזור הנחיתה. פינוי אווירי אינו מהיר יותר בהכרח בטווחים קצרים."],["פינוי והרמה","מהי החשיבות של דיווח מקדים לבית החולים?",["תיעוד משפטי של רצף הטיפול בפצוע","הכנת צוות, ציוד וחדר ניתוח מראש — קיצור זמן","הפחתת העומס על צוות האמבולנס בהגעה","דרישה פרוצדורלית של נוהל העבודה"],1,"דיווח מקדים מאפשר לבית החולים להפעיל צוות טראומה, להכין חדר הלם, לשריין דם, ולעיתים להכין חדר ניתוח או צנתור עוד לפני הגעת הפצוע. בפצוע קריטי הדבר חוסך דקות יקרות. הדיווח צריך לכלול גיל, מנגנון, ממצאים עיקריים, מדדים, טיפול שניתן וזמן הגעה משוער."],["פינוי והרמה","מהי ההשפעה של האטה ותאוצה באמבולנס על פצוע ראש?",["תנועות הרכב משפרות את הניקוז הוורידי","שינויי תנוחה משפיעים על הלחץ התוך-גולגולתי","ההשפעה מוגבלת לפצועי בטן ואגן בלבד","אין לתאוצה ולהאטה השפעה על פצוע ראש"],1,"תאוצות והאטות חדות משנות את התפלגות הדם ואת הלחץ התוך-גולגולתי, ובלימות חדות עלולות להחמיר את מצב הפצוע. לכן בפצוע ראש נדרשת נהיגה חלקה ומתונה, ללא בלימות ופניות חדות. יש להימנע גם מרעש מיותר ומצפירה שאינה נחוצה, שכן גירויים מעלים לחץ תוך-גולגולתי."]];
var SHCHZUR=[["בטן ואגן","קריעה של אילו מהאיברים הבאים תוביל לפריטוניטיס ולספסיס בסבירות הגבוהה ביותר?",["וריד נבוב תחתון","כיס מרה","מעי גס","אאורטה בטנית"],2,"המעי הגס מכיל תוכן צואתי עתיר חיידקים. קריעה שלו משחררת את התוכן לחלל הצפק וגורמת לפריטוניטיס חיידקית שמתקדמת במהירות לספסיס. וריד נבוב תחתון ואאורטה בטנית הם כלי דם — קריעתם גורמת לדימום מסיבי ולהלם המורגי, לא לזיהום. קרע בכיס המרה משחרר מרה וגורם לפריטוניטיס כימית, שהיא פחות ספטית ומתקדמת לאט יותר."],["בטן ואגן","מה האיבר שנפגע בסבירות הגבוהה ביותר במנגנון של דקירה לבטן?",["מעי דק","טחול","כבד","סרעפת"],2,"הכבד הוא האיבר המוצק הגדול ביותר בבטן ותופס נפח נרחב ברביע הימני העליון, ולכן בפגיעה חודרת לבטן הוא הנפגע השכיח ביותר. הטחול הוא האיבר השכיח ביותר דווקא בחבלה קהה, לא חודרת. הסרעפת נפגעת בעיקר בדקירות מתחת לפטמה ובאזור התורקו-אבדומינלי. המעי הדק נפגע לעיתים קרובות אך פחות מהכבד בשל מיקומו העמוק יותר."],["אוכלוסיות מיוחדות","אישה בטרימסטר שלישי לאחר תאונת דרכים מתלוננת על כאב בבטן ועל סחרחורת בשכיבה על הגב. בבדיקתה דימום וגינלי מועט, לחץ דם 96/60, דופק 105. מה המשפט המדויק ביותר?",["בגלל עלייה בנפח הדם בהיריון, דימום משמעותי נדיר ולכן פחות מסוכן","דופק מהיר בהיריון הוא תמיד ספציפי להלם המורגי","הסימנים המתוארים הם לא ספציפיים בהיריון, אולם דימום או כאב מחשידים לפגיעה שלייתית","לחץ דם סיסטולי מתחת ל-100 נחשב להלם בהיריון בטרימסטר שני ושלישי"],2,"בהיריון מתרחשים שינויים פיזיולוגיים שגורמים לדופק מהיר יותר וללחץ דם נמוך יותר גם ללא פגיעה, ולכן המדדים לבדם אינם ספציפיים. עם זאת, שילוב של כאב בטן ודימום וגינלי לאחר חבלה מחשיד מאוד להיפרדות שליה (Abruptio Placentae). העלייה בנפח הדם דווקא מסווה הלם ומסוכנת — האם עלולה לאבד עד 30 אחוז מנפח הדם לפני שיופיעו סימנים. הסחרחורת בשכיבה על הגב נובעת מתסמונת הווריד הנבוב (Supine Hypotensive Syndrome)."],["כוויות","מהם הסיבוכים הנובעים כתוצאה מכוויות?",["שוק היפוולמי, מכת חום, זיהומים קשים","זיהומים קשים, היפותרמיה, פגיעות נוירולוגיות","שוק היפוולמי, היפותרמיה, זיהומים קשים","זיהומים קשים, היפותרמיה, פגיעות בכלי דם"],2,"כווית עור נרחבת פוגעת בשלושת התפקידים העיקריים של העור. אובדן מחסום הנוזלים גורם לדליפה מסיבית של פלזמה ולשוק היפוולמי. אובדן הבידוד התרמי גורם להיפותרמיה — סיבוך שכיח ומסוכן שמחמיר בגלל שטיפה במים קרים. אובדן המחסום החיידקי חושף את הגוף לזיהומים קשים ולספסיס. מכת חום אינה סיבוך של כווייה אלא פגיעת אקלים נפרדת, ופגיעות נוירולוגיות אינן אופייניות לכוויות תרמיות."],["הלם","הנפח הפעימה (Stroke Volume) מושפע מהמדד הפיזיולוגי:",["Heart Rate","Cardiac Output","Osmotic Pressure","Preload"],3,"נפח הפעימה נקבע על ידי שלושה גורמים — Preload (מידת המתיחה של חדרי הלב בסוף הדיאסטולה), התכווצות שריר הלב, ו-Afterload. על פי חוק פרנק-סטרלינג, ככל שה-Preload גדול יותר כך נמתחים סיבי שריר הלב וההתכווצות חזקה יותר. תפוקת הלב (Cardiac Output) היא התוצאה של נפח הפעימה כפול קצב הלב, ולכן היא נגזרת ולא משפיעה. Osmotic Pressure משפיע על תנועת נוזלים בין מדורים ולא ישירות על נפח הפעימה."],["הלם","מה המדד הפיזיולוגי שמשתנה בלחץ הדופק (Pulse Pressure) בהלם נוירוגני?",["ירידה ב-Preload","עלייה ב-Afterload","עלייה ב-Preload","ירידה ב-Cardiac Output"],0,"בהלם נוירוגני נפגעת הבקרה הסימפתטית על כלי הדם, נוצרת וזודילטציה נרחבת והדם נאגר בפריפריה. התוצאה היא ירידה בהחזר הוורידי ללב, כלומר ירידה ב-Preload, ומכאן השינוי בלחץ הדופק. חשוב לזכור שההבדל הקליני מהלם היפוולמי הוא שבהלם נוירוגני העור חם ויבש והדופק אינו מהיר, מאחר שגם התגובה הסימפתטית של טכיקרדיה נחסמת."],["הלם","איזה מהמצבים הבאים מאופיין בבריחה של נוזלים למדור שלישי (Third Space)?",["הלם היפוולמי (Hypovolemic)","הלם חסימתי (Obstructive)","הלם ספטי (Septic)","הלם קרדיוגני (Cardiogenic)"],2,"בהלם ספטי משתחררים מתווכי דלקת שגורמים לעלייה חדה בחדירות דופן כלי הדם. הנוזל התוך-כלי דולף לרקמות ולחלל הבין-תאי — המדור השלישי — כך שנוצר חסר נפח יחסי למרות שלא אבד נוזל מהגוף. בהלם היפוולמי הנוזל אובד ממש מהגוף, בהלם חסימתי הבעיה מכנית ומונעת מילוי או פליטה, ובהלם קרדיוגני המשאבה עצמה כושלת."],["הלם","השגת לחץ דם של כ-90 ממ״כ סיסטולי לפצוע עם דימום בטני תבוצע על ידי:",["סט עירוי בזרימה מהירה של 1 ליטר סליין","בולוסים חוזרים של 0.5 ליטר הרטמן/רינגר","פתיחת סט עירוי בזרימה מהירה של 1 ליטר הרטמן/רינגר","בולוסים חוזרים של 0.5 ליטר סליין"],1,"בדימום בטני שאינו ניתן לעצירה בשטח נוקטים בגישת החייאת נוזלים מבוקרת (Permissive Hypotension) — מתן בולוסים קטנים וחוזרים עד להשגת דופק רדיאלי או לחץ דם של כ-90 ממ״כ בלבד. מתן נוזלים בזרימה חופשית מעלה את לחץ הדם, שוטף את הקריש שנוצר ומחמיר את הדימום, וגם מדלל גורמי קרישה. הרטמן/רינגר לקטט מועדף על סליין בהחייאת טראומה מפני שהוא איזוטוני ומאוזן יותר ואינו גורם לחמצת היפרכלורמית."],["ילדים","הגעת לשמור על התינוק של השכנים בזמן שהם יצאו לערב בילוי. אחרי שנרדמת על הספה, החלטת ללכת לראות איך התינוק ישן וגילית שהוא לא נושם. מה הפעולה הראשונה שיש לבצע?",["לרוץ לסלון לחפש את הטלפון כדי להתקשר למד״א","להתחיל לבצע 2 דקות החייאה כולל עיסויים והנשמות","להתחיל לבצע 2 דקות של גירוי סטרנלי לנשימה","לרוץ למכולת הקרובה להביא דפיברילטור"],1,"בדום לב בילדים ובתינוקות המנגנון הוא כמעט תמיד נשימתי-היפוקסי ולא הפרעת קצב, ולכן העדיפות היא חמצון מיידי ולא דפיברילציה. כאשר המציל לבדו ולא היה עד לאירוע, מבצעים תחילה כ-2 דקות של החייאה ורק אז עוזבים כדי להזעיק עזרה — בניגוד למבוגר, שבו מזעיקים עזרה ומביאים דפיברילטור מיד. גירוי סטרנלי אינו טיפול בדום נשימה ומבזבז זמן קריטי."],["ילדים","מה מהבאים הוא היגד נכון בנוגע לגורמי סיכון ב-SIDS (מוות בעריסה)?",["ניתן לצפות מראש ולמנוע על ידי הימנעות מעישון ושתיית אלכוהול בהיריון ובסביבת התינוק","ניתן להפחית את הסיכון על ידי הימנעות משינת התינוק על הבטן, על מזרן רך ובסביבה חמה","ניתן להפחית את הסיכון על ידי שימוש בבייבי-סנס לניטור ביתי של נשימת התינוק","ניתן לצפות מראש ולמנוע על ידי הימנעות משינה משותפת של התינוק במיטת ההורים"],1,"SIDS מוגדר כמוות פתאומי ובלתי מוסבר, ולכן לא ניתן לצפות אותו מראש או למנוע אותו לחלוטין — רק להפחית סיכון. גורמי הסיכון הניתנים לשינוי הם שינה על הבטן, מזרן רך, מצעים ובובות במיטה, וחימום יתר. מכאן מסע ההסברה Back to Sleep. עישון ואלכוהול אכן מעלים סיכון אך הניסוח לצפות ולמנוע שגוי. מכשירי ניטור ביתיים לא הוכחו כמפחיתי תמותה מ-SIDS."],["הדף ואר״ן","צוות מטפל בנפגע שהיה קרוב למוקד פיצוץ. הנפגע סובל מקרע בעור התוף ומחזה אוויר (Pneumothorax), אך ללא חבלות חיצוניות, רסיסים או פצעים. לאיזה סוג של פגיעת הדף (Blast Injury) מתאימים ממצאים אלו?",["פגיעת הדף רביעונית (Quaternary)","פגיעת הדף שלישונית (Tertiary)","פגיעת הדף ראשונית (Primary)","פגיעת הדף שניונית (Secondary)"],2,"פגיעת הדף ראשונית נגרמת ממגע ישיר של גל ההדף עם הגוף, והיא פוגעת בעיקר באיברים מלאי אוויר שבהם יש הפרשי צפיפות חדים — אוזן תיכונה, ריאות ומעי. קרע בעור התוף וחזה אוויר ללא כל פגיעה חיצונית הם החתימה הקלאסית שלה. פגיעה שניונית נגרמת מרסיסים מעופפים, שלישונית מהעפת הגוף אל עצמים או מקריסת מבנה, ורביעונית מכל השאר — כוויות, שאיפת גזים רעילים והחמרת מחלות רקע."],["קינמטיקה","בתאונה בה רכב פרטי פוגע בהולך רגל, מהו ההבדל הקינמטי העיקרי הצפוי בין נפגע מבוגר לבין נפגע ילד (בהנחה שמהירות הרכב זהה ושאר פרטי התאונה זהים)?",["אין הבדל משמעותי, בשני המקרים הפגיעה הראשונית היא תמיד בשוקיים","ילדים נמוכים יותר, ולכן הסיכון להיגרר מתחת לרכב גבוה יותר","ילדים נוטים להישאר על מכסה המנוע לאורך זמן רב יותר מאשר מבוגרים","מבוגרים יפגעו לרוב באזור האגן תחילה, בעוד ילדים יפגעו באזור הראש"],1,"קומתו הנמוכה של הילד משנה את כל שרשרת הפגיעה. הפגוש פוגע בו גבוה יותר יחסית לגוף — באגן ובבטן במקום בברכיים — ולכן הוא נהדף קדימה ומטה ולא נזרק על מכסה המנוע כמו מבוגר. כתוצאה מכך הסיכון שייגרר או ידרס מתחת לרכב גבוה משמעותית. במבוגר המנגנון הקלאסי הוא שלישיית ולדו: פגיעה בברכיים, ואז בגוף על מכסה המנוע, ואז בראש בעת הנפילה לקרקע."],["חזה","מטופל לאחר חבלה קהה בחזה מאובחן עם חזה מרפרף (Flail Chest) ומציג סימני מצוקה נשימתית והיפוקסיה. מעבר לכאב ולפגיעה המכנית באוורור, איזו פגיעה נלווית היא הגורם העיקרי להפרעה בחמצון (Oxygenation) במקרים אלו?",["תמט ריאה מלא עקב חזה אוויר","קרע באבי העורקים (Aorta)","פגיעה בעצב הסרעפת ושיתוק שרירי הנשימה","חבלה חודרנית לרקמת הריאה (Pulmonary Contusion)"],3,"התנועה הפרדוקסלית של מקטע החזה המרפרף נראית דרמטית, אך המחקר הראה שהגורם העיקרי להיפוקסיה הוא חבלת הריאה (Pulmonary Contusion) שמתחת למקטע השבור. הרקמה החבולה מתמלאת בדם ובבצקת, האלוואולות אינן מתפקדות, ונוצר Shunt — דם עובר דרך ריאה שאינה מאווררת. הכוח שנדרש כדי לשבור מספר צלעות ברצף בהכרח פגע גם ברקמת הריאה שמתחתיהן. לכן הטיפול מתמקד בחמצון ובתמיכה נשימתית, לא רק בייצוב מכני של המקטע."],["חזה","מטופל נפגע בתאונת דרכים עם פגיעה קשה בחזה. הוא מציג סימני גודש ורידי צוואר ולחץ דם נמוך. בהאזנה אין כניסת אוויר בצד הפגוע. מהו הגורם העיקרי להלם במצב זה?",["חזה אוויר בלחץ (Tension Pneumothorax) הגורם לעלייה בלחץ התוך-חזי ולירידה בהחזר הוורידי","פגיעה ישירה בשריר הלב הגורמת לירידה בכושר ההתכווצות","אובדן דם מסיבי לחלל הבטן הגורם להלם היפוולמי","טמפונדה לבבית (Cardiac Tamponade) הגורמת להגבלה במילוי הלב"],0,"השילוב של גודש ורידי צוואר, תת לחץ דם והיעדר כניסת אוויר בצד אחד הוא התמונה הקלאסית של חזה אוויר בלחץ. האוויר הנכלא בחלל הצדר דוחס את הריאה, מסיט את המדיאסטינום ומעלה את הלחץ התוך-חזי, מה שמקפל את הוורידים הנבובים ומונע החזר ורידי ללב. בטמפונדה לבבית יש אמנם גודש ורידי ותת לחץ דם, אך כניסת האוויר תקינה בשני הצדדים. בהלם היפוולמי ורידי הצוואר שטוחים ולא גדושים."],["בטן ואגן","צוות מגיע לפצוע דקירה בבטן עליונה. בבדיקתו: הכרה מעורפלת, דופק רדיאלי חלש ומהיר (130), עור קר ולח, אין דימום חיצוני פורץ נראה לעין. מהי האסטרטגיה הטיפולית הנכונה ביותר בשלב ה-C?",["מתן החייאת נוזלים מאסיבית עד להחזרת לחץ דם לנורמה (120/80) טרם הפינוי","ביצוע בדיקת אגן ויציבות עצמות לפני החלטת פינוי כדי לשלול שברים","הנחת חבישת אשרמן על פצע הדקירה בבטן בשל סמיכותו לבית החזה","הגדרת הפצוע כדחוף, פינוי מיידי, מתן נוזלים במידה ויש התוויות"],3,"זהו דימום פנימי שאינו ניתן לעצירה בשטח, והטיפול המציל היחיד הוא ניתוח בחדר ניתוח. לכן כל דקה בשטח היא נזק, והפעולה הנכונה היא הגדרת הפצוע כדחוף ופינוי מיידי, כאשר מתן הנוזלים נעשה בדרך ורק לפי התוויות. החזרת לחץ הדם לנורמה מסוכנת — היא שוטפת קרישים ומגבירה את קצב הדימום. חבישת אשרמן מיועדת לפצע יונק בבית החזה ולא לבטן, ובדיקת אגן מעכבת פינוי ללא תועלת."],["מבוא ל-PHTLS","אתם מוזנקים לזירת תאונת דרכים חזיתית במהירות גבוהה. הפצוע, גבר כבן 45, חולץ מהרכב לאחר 15 דקות. ב-B נצפו נשימות מהירות, שימוש בשרירי עזר ובית חזה לא סימטרי משמאל. ב-C: דופק רדיאלי מהיר מאוד (140) וחלש, מילוי קפילרי 4 שניות, עור קר וחיוור. ב-D: GCS 12. תוך כדי הכנה לפינוי המטופל הופך אגרסיבי, מנסה לתלוש את הצווארון, והדופק הרדיאלי נעלם. מהו הניתוח הקליני המדויק ביותר?",["היעלמות הדופק הרדיאלי והשינוי בהכרה מעידים על כשל מנגנוני הפיצוי; יש להתחיל מתן נוזלים מהיר עד להחזרת הדופק הרדיאלי לפני הפינוי","המטופל סובל מחבלה מסיחה עקב שברים באגן; יש לבצע קיבוע אגן הדוק ולפנות מיידית ללא פעולות נוספות בשטח","המטופל מפתח פגיעת ראש משנית עם לחץ תוך-גולגולתי גבוה; יש לבצע היפרוונטילציה מיידית כדי להוריד את הלחץ","ההידרדרות ב-C ובמצב ההכרה, בשילוב עם ממצאי ה-B המוקדמים, מעלה חשד סביר לפגיעת חזה"],3,"הרמז המרכזי הוא שממצאי ה-B היו חריגים כבר מלכתחילה — חזה לא סימטרי ושימוש בשרירי עזר — וההידרדרות המהירה ב-C מצטרפת אליהם לתמונה אחת של פגיעת חזה מתקדמת, למשל חזה אוויר בלחץ. אגרסיביות ואי שקט פסיכומוטורי הם ביטוי של היפוקסיה מוחית ולא של פגיעת ראש. עיכוב הפינוי לצורך מילוי נוזלים בדימום שאינו נשלט הוא שגיאה, והיפרוונטילציה שגרתית גורמת לוזוקונסטריקציה מוחית ומחמירה איסכמיה."],["נשימתי","בן 20 עם קוצר נשימה פתאומי. חיוור ומזיע, מתנשם 30 נשימות בדקה, לא משלים משפטים, דופק 120. נשמעו קולות צפצופים. על פי ההיסטוריה, מהי האבחנה המבדלת הסבירה ביותר?",["אסטמה, התקף אלרגי","בצקת ריאות, חנק מגוף זר","תסחיף ריאתי, התקף חרדה","דלקת ריאות, החמרה ב-COPD"],0,"צפצופים (Wheezing) הם ביטוי להיצרות של דרכי האוויר הקטנות, ובגיל צעיר עם התקף פתאומי האבחנות המובילות הן אסטמה ותגובה אלרגית או אנפילקסיס. COPD אינו סביר בגיל 20 מפני שהוא דורש שנים של עישון. בצקת ריאות מתבטאת בקרפיטציות ולא בצפצופים טהורים, וחנק מגוף זר גורם לסטרידור. תסחיף ריאתי מתבטא לרוב בכאב פלאוריטי וקוצר נשימה ללא צפצופים, והתקף חרדה הוא אבחנה שבשלילה בלבד."],["ראש","שאלת בונוס — מהו ההיגד הנכון ביותר לגבי הטיפול והשמירה על זרימת דם תקינה למוח (פרפוזיה) אצל פצוע ראש בדרג השטח?",["יש להוריד את לחץ הדם הסיסטולי מתחת ל-60 ממ״כ כדי למנוע דימום","יש להשכיב את הפצוע עם הראש נמוך מהרגליים כדי להגביר את זרימת הדם למוח","יש לשאוף ללחץ דם סיסטולי של 90-100 ממ״כ לפחות כדי להבטיח חמצון של המוח","אין צורך לספק חמצן כלל אם הפצוע נושם באופן עצמאי"],2,"בפצוע ראש, לחץ הפרפוזיה המוחי הוא לחץ העורקי הממוצע פחות הלחץ התוך-גולגולתי. כאשר הלחץ התוך-גולגולתי עולה, ירידה בלחץ הדם הסיסטולית פוגעת קשות בזרימת הדם למוח וגורמת לנזק משני. אפילו אירוע בודד של תת לחץ דם מכפיל את התמותה, ולכן שומרים על סיסטולי של 90-100 ממ״כ לפחות. היפוקסיה גורמת לנזק משני זהה ולכן חמצון חובה. השכבת הראש נמוך מעלה את הלחץ התוך-גולגולתי ומחמירה את המצב."],["עמוד שדרה","ידוע כי כמחצית מהפגיעות בעמוד השדרה הן בעמוד השדרה הצווארי. איזו טענה מבין הטענות הבאות אינה תומכת בעובדה שעמוד השדרה הצווארי רגיש במיוחד לפגיעות?",["חוליות הצוואר עטופות בשרירים קטנים בלבד, וטווח התנועה גדול באופן יחסי","הראש האנושי שוקל כ-7-10 ק״ג","בגובה C3, חוט השדרה ממלא כ-30 אחוז מנפח ה-Spinal Canal","הראש מצוי בקצה של צוואר דק וגמיש, ללא עצמות נוספות המתחברות כהגנה","כל תזוזה, אפילו קטנה, יכולה לגרום ללחץ על חוט השדרה באזור הצוואר"],2,"העובדה שחוט השדרה ממלא רק כ-30 אחוז מנפח התעלה בגובה C3 מלמדת דווקא על מרווח בטיחות גדול יחסית — יש מקום לתזוזה מבלי שהחוט ייפגע, ולכן היא אינה תומכת ברגישות המיוחדת. כל שאר הטענות כן מסבירות את הפגיעות: ראש כבד על צוואר דק וגמיש, ללא בית חזה או אגן שמייצבים כמו בשאר עמוד השדרה, עם שרירים קטנים בלבד וטווח תנועה רחב. שימו לב שבשאלה זו חמש אפשרויות."],["הלם","אילו מהבאים הוא ההיגד הנכון ביותר בנוגע לספסיס?",["הגוף מגיב לזיהום בצורה קיצונית עד פגיעה ברקמותיו שלו","נגרם אך ורק מזיהום חיידקי או מזיהום פטרייתי","לא ניתן להגדיר ספסיס בהיעדר חום של מעל 38 מעלות","נגרם רק מזיהומים של חיידקים גראם שליליים"],0,"ספסיס מוגדר כתפקוד לקוי של איברים המסכן חיים, הנובע מתגובה מווסתת בצורה לקויה של המאכסן לזיהום. במילים אחרות — לא החיידק הוא שהורג, אלא סערת הציטוקינים של הגוף עצמו שפוגעת ברקמות. הזיהום יכול להיות חיידקי, ויראלי, פטרייתי או טפילי, ולא רק גראם שלילי. חום כלל אינו תנאי — חולים קשים, קשישים ומדוכאי חיסון עלולים דווקא להיות היפותרמיים, וזהו סימן פרוגנוסטי גרוע."],["אקלים ובעלי חיים","כיצד נבדיל בין מכת חום לתשישות חום?",["במכות חום נצפה לראות ירידת לחץ דם ב-55 אחוז מהמקרים","טמפרטורה מעל 40 מעלות ושינוי במצב הכרה","אין דרך להבדיל בשטח בין מכת חום לתשישות חום","טמפרטורה מעל 39 מעלות ושינוי במצב הכרה"],1,"מכת חום מוגדרת בשני קריטריונים: חום גוף ליבה מעל 40 מעלות יחד עם הפרעה בתפקוד מערכת העצבים המרכזית — בלבול, הזיות, פרכוסים או ירידה בהכרה. תשישות חום מתאפיינת בחום גוף בין 37 ל-40 מעלות והכרה שמורה. הסף של 39 מעלות אינו נכון. ההבחנה קריטית משום שמכת חום היא מצב מסכן חיים המחייב קירור אגרסיבי מיידי בשטח עוד לפני הפינוי."],["אקלים ובעלי חיים","אילו מהנחשים הבאים אינו ארסי?",["אפעה","שרף עין גדי","צפע ארצישראלי","זעמן שחור"],3,"הזעמן השחור הוא נחש גדול ותוקפני למראה אך אינו ארסי כלל, ולכן נשיכתו גורמת רק לפצע מקומי. הצפע הארצישראלי הוא הנחש הארסי הנפוץ ביותר בארץ ולו קיים נסיוב נוגד ארס. האפעה הוא הנחש הארסי הנפוץ ביותר באזור באר שבע ודרומה, וגם לו קיים נסיוב. שרף עין גדי ארסי אף הוא, ולו דווקא אין נסיוב נוגד ארס בישראל."],["אקלים ובעלי חיים","בכל אחד מהתרחישים הבאים המטופל מרגיש קר למגע. באיזה מהם הכי פחות סביר שתימדד היפותרמיה אמיתית (טמפרטורת ליבה נמוכה)?",["גבר בן 81, ירידה במצב הכרה בבית אבות, ספסיס בחשד ל-UTI, ל״ד 100/60, דופק 120, נשימות 28, עור קר ולח ללא חום מדווח","צעיר בן 19, שהה 40 דקות רטוב עם רוח חזקה אחרי שנפל לנחל, רועד, דיבור כבד, הליכה לא יציבה","גבר בן 32, נמצא אחרי אירוע המוני, בלבול קשה, עור סמוק, 30 נשימות, דופק 150, סטורציה תקינה, דיווח על אמפטמינים ואקסטזי ושתייה מרובה של מים","בת 24, תאונת דרכים, חשד לקרע טחול עם שוק לא מפוצה: חיוורת, קרת עור, דופק 140, ל״ד 80/50, דימום פנימי משמעותי"],2,"התרחיש של אמפטמינים ואקסטזי הוא היחיד שבו הפיזיולוגיה מייצרת ייצור חום עודף ולא אובדן חום. עור סמוק, טכיקרדיה, טכיפנאה ובלבול מצביעים על היפרתרמיה והיפונתרמיה משתיית מים מרובה — ההפך הגמור מהיפותרמיה. בשלושת האחרים העור קר בגלל אובדן חום אמיתי או וזוקונסטריקציה קשה: חשיפה סביבתית רטובה עם רוח, היפותרמיה משנית לספסיס בקשיש, והיפותרמיה בטראומה כחלק משילוש המוות."],["הכרתי","תעדוף לבית של גבר בן 34 שנמצא ישן עמוק לאחר שחזר ממסיבה. חברים אומרים ששתה אלכוהול ולא יודעים אם לקח עוד משהו. בבדיקתו: הכרה מעורפלת, מגיב לכאב בגניחה, 6 נשימות בדקה, סטורציה 89 באוויר חדר, דופק 52, לחץ דם 92/58, אישונים מכווצים דו-צדדיים, עור קר וחיוור, בדיקת סוכר תקינה, ללא עדות לטראומה. איזו מהאפשרויות הבאות מתאימה למצבו?",["Naloxone (Narcan) — אנטידוט להרעלת אופיאטים","Hydroxocobalamin — אנטידוט להרעלת ציאנידים","N-acetylcysteine (NAC) — אנטידוט להרעלת אקמול","Flumazenil — אנטידוט להרעלת בנזודיאזפינים"],0,"השילוש הקלאסי של הרעלת אופיאטים הוא דיכוי נשימתי, ירידה במצב ההכרה ואישונים מכווצים (Pinpoint). כאן מופיעים כל השלושה יחד עם ברדיקרדיה, ולכן נלוקסון הוא הטיפול המתאים. פלומזניל אמנם הופך בנזודיאזפינים אך אינו גורם לאישונים מכווצים באופן אופייני, והוא מסוכן מאוד במטופל שנחשף לחומרים לא ידועים כי הוא עלול לעורר פרכוסים עמידים. ציאנידים גורמים לעור סמוק וחמצת קשה, ואקמול אינו גורם לירידה בהכרה בשלב מוקדם."],["הכרתי","הגעתם לחממה חקלאית בעקבות קריאה על עובד בן 42 שהתמוטט לאחר ריסוס. עם הגעת הצוות: המטופל בהכרה מעורפלת, מזיע מאוד, מפריש רוק בכמות רבה, עם דמעת, ברדיקרדיה 46 לדקה, לחץ דם 88/50, סטורציה 92 אחוז ונשימות שטחיות. על פי עדות חבריו נחשף לחומר הדברה ממשפחת זרחנים אורגניים דרך העור לפני כשעה. מהי הפעולה הראשונית החשובה ביותר שעל הצוות לבצע בשטח?",["מתן Pralidoxime (2-PAM) לשיקום האנזים AChE","מתן אטרופין במזרק אוטומטי במינון גבוה עד סימני אטרופיניזציה","סיוע נשימתי במסכה עם ריכוז חמצן גבוה","שטיפת גוף המטופל והפשטת בגדים נגועים לפני כל פעולה נוספת"],3,"בחשיפה דרך העור החומר ממשיך להיספג כל עוד הוא על גוף המטופל, ולכן כל טיפול תרופתי יהיה חסר תוחלת ואף מסוכן לצוות עצמו לפני חיטוי. הפשטת בגדים ושטיפה עוצרים את מקור החשיפה ומגנים גם על המטפלים מזיהום משני. רק לאחר מכן ניתן אטרופין, שהוא הטיפול העיקרי לתסמונת המוסקרינית, ובהמשך 2-PAM לשחזור האנזים. יש לזכור את ראשי התיבות DUMBELS או SLUDGE לזיהוי התסמונת הכולינרגית."],["לידה","מהם כלי הדם התקינים בחבל הטבור?",["שני עורקים ווריד אחד","שני עורקים ושני ורידים","עורק אחד וווריד אחד","שני ורידים ועורק אחד"],0,"חבל הטבור התקין מכיל שלושה כלי דם: שני עורקים טבוריים ווריד טבורי אחד. העורקים מובילים דם דל חמצן מהעובר אל השליה, והווריד מחזיר דם עשיר חמצן מהשליה אל העובר — כלומר בדיוק ההפך מהמקובל בזרימה הסיסטמית. חבל טבור עם שני כלי דם בלבד (Single Umbilical Artery) נחשב לממצא חריג הקשור לעיתים למומים מולדים."],["אוכלוסיות מיוחדות","איזה שינוי פיזיולוגי צפוי להתרחש בלחץ הדם של אישה בטרימסטר השני להריון?",["ירידה קלה של 5-15 ממ״כ בלחץ הדם","אין שינוי כלל בערכי לחץ הדם במהלך כל ההריון","עלייה של 10-15 ממ״כ בלחץ הסיסטולי","עלייה משמעותית בלחץ הדם הדיאסטולי בלבד"],0,"בטרימסטר השני מגיעה הוזודילטציה ההיריונית לשיאה בהשפעת פרוגסטרון, ההתנגדות ההיקפית יורדת ואיתה לחץ הדם — ירידה קלה של 5-15 ממ״כ שהיא נורמלית לחלוטין. לקראת סוף ההיריון הערכים חוזרים בהדרגה לרמת הבסיס. משמעות קלינית חשובה: ערך לחץ דם שנראה נורמלי בהיריון עשוי למעשה להיות גבוה יחסית לאישה זו, ולהסתיר רעלת היריון או הלם מוקדם."],["לידה","מהו הדגש החשוב ביותר בעת סיוע ליציאת ראש התינוק (Crowning)?",["הפעלת לחץ-נגדי עדין על הגולגולת למניעת קרעים","עידוד היולדת ללחוץ בכל כוחה במהלך יציאת הראש","ביצוע סקשן מיידי לפה ולאף עוד לפני יציאת הכתפיים","משיכת הראש כלפי מטה במהירות כדי לזרז את הלידה"],0,"בשלב ההכתרה תפקיד המטפל הוא לשלוט בקצב היציאה ולא לזרז אותה. לחץ-נגדי עדין על הגולגולת מונע יציאה מהירה ופתאומית שגורמת לקרעים בפרינאום ביולדת ולשינויי לחץ חדים בראש העובר. דחיפה בכל הכוח בשלב זה מסוכנת מאותה סיבה, ומשיכת הראש עלולה לפגוע במקלעת הזרוע ובעמוד השדרה הצווארי. סקשן שגרתי מיידי אינו מומלץ עוד ושמור למצבים של חסימת נתיב אוויר."],["החייאה","במהלך החייאת יילוד, מהו היחס הנדרש בין עיסויים להנשמות?",["30 עיסויים ל-2 הנשמות","5 עיסויים להנשמה אחת","3 עיסויים להנשמה אחת","15 עיסויים ל-2 הנשמות"],2,"בהחייאת יילוד היחס הוא 3 עיסויים להנשמה אחת, כלומר 90 עיסויים ו-30 הנשמות בדקה. היחס הזה שונה מכל שאר גילאי החיים משום שדום לב ביילוד הוא כמעט תמיד תוצאה של כשל נשימתי, ולכן נדרש דגש חזק במיוחד על אוורור. היחס 30 ל-2 שייך למבוגר ולמציל יחיד בילדים, והיחס 15 ל-2 שייך לשני מצילים בילדים ובתינוקות."],["הדף ואר״ן","מי האחראי על קדימויות הטיפול וניהול אתר הטיפול בזירה?",["פיקוד 10","פינוי 10","חניון 10","רפואה 10"],3,"רפואה 10 הוא הפרמדיק האחראי על קביעת קדימויות הטיפול ועל ניהול אתר הטיפול בזירה. פיקוד 10 הוא איש הצוות הבכיר באמבולנס הראשון והוא מנהל את האירוע כולו מול המוקד וגורמי החירום האחרים. חניון 10 אחראי על סדר החניון ועל שמירת צירי פינוי פנויים. פינוי 10 אחראי על הפינוי של כל הארגונים ונמצא בקשר רציף עם המוקד."]];

    '<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-ghost btn-sm" onclick="allTopics(true)">בחר הכל</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="allTopics(false)">נקה בחירה</button>'+
    '</div><div class="topic-grid">';
  topics.forEach(function(t){
    h+='<label class="topic on" data-t="'+esc(t)+'"><input type="checkbox" checked onchange="tog(this)">'+
       '<span>'+(TOPIC_ICON[t]||'▪️')+' '+esc(t)+'</span><span class="cnt">'+counts[t]+'</span></label>';
  });
  h+='</div></div>'+
  '<div class="card"><h2 class="sec-title">🔢 כמה שאלות?</h2><div class="len-row" id="lenRow">'+
    [20,50,100,200,'הכל'].map(function(n,k){
      return '<button class="len'+(k===1?' on':'')+'" data-n="'+n+'" onclick="pickLen(this)">'+n+'</button>';}).join('')+
  '</div>'+
  '<div class="navrow"><button class="btn btn-ghost" onclick="home()">→ חזרה</button><div class="spacer"></div>'+
  '<button class="btn btn-primary" onclick="startPractice()">התחל מבחן ▸</button></div>'+
  '<div id="setupWarn" class="note hidden" style="border-color:var(--red);color:var(--red)">יש לבחור לפחות נושא אחד.</div>'+
  '</div>';
  app().innerHTML=h;
}
function tog(cb){cb.closest('.topic').classList.toggle('on',cb.checked);}
function allTopics(v){document.querySelectorAll('.topic').forEach(function(l){l.querySelector('input').checked=v;l.classList.toggle('on',v);});}
function pickLen(b){document.querySelectorAll('.len').forEach(function(x){x.classList.remove('on');});b.classList.add('on');}

function startPractice(){
  var sel=[];
  document.querySelectorAll('.topic').forEach(function(l){ if(l.querySelector('input').checked) sel.push(l.dataset.t); });
  if(!sel.length){document.getElementById('setupWarn').classList.remove('hidden');return;}
  var pool=PRACTICE.filter(function(q){return sel.indexOf(q[0])>-1;});
  var lenBtn=document.querySelector('.len.on');
  var n=lenBtn.dataset.n;
  pool=shuffle(pool.slice());
  if(n!=='הכל') pool=pool.slice(0,Math.min(+n,pool.length));
  begin('practice',pool);
}
function startShchzur(){ begin('shchzur', SHCHZUR.slice()); }

function begin(mode,qs){
  S={mode:mode,qs:qs,i:0,answers:new Array(qs.length).fill(null),sel:[],done:false};
  render();
}

/* ---------- מסך שאלה ---------- */
function render(){
  var q=S.qs[S.i], ans=S.answers[S.i], multi=Array.isArray(q[3]);
  var correct = multi? q[3] : [q[3]];
  var answered = ans!==null;
  var pct = Math.round(((S.i)/S.qs.length)*100);
  var scored=S.answers.filter(function(a){return a!==null;}).length;
  var right=S.answers.filter(function(a){return a&&a.ok;}).length;

  var h='<div class="card">'+
   '<div class="topbar">'+
     '<span class="counter">שאלה '+(S.i+1)+' מתוך '+S.qs.length+'</span>'+
     '<div class="progress-shell"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
     '<span class="score-chip">✓ '+right+'/'+scored+'</span>'+
   '</div>'+
   '<div class="qtopic">'+(TOPIC_ICON[q[0]]||'▪️')+' '+esc(q[0])+'</div>'+
   '<div class="qtext">'+esc(q[1])+'</div>'+
   (multi&&!answered?'<div class="note" style="margin:0 0 12px">☑️ שאלה מרובת תשובות — סמן/י את כל הנכונות ולחץ/י על "בדיקה".</div>':'')+
   '<div class="opts">';

  q[2].forEach(function(o,j){
    var cls='opt', mark=String.fromCharCode(1488+j);
    if(answered){
      cls+=' locked';
      var isC = correct.indexOf(j)>-1;
      var wasPicked = ans.pick.indexOf(j)>-1;
      if(isC){cls+=' correct';mark='✓';}
      else if(wasPicked){cls+=' wrong';mark='✕';}
      else cls+=' dim';
    } else if(multi && S.sel.indexOf(j)>-1){ cls+=' correct'; }
    h+='<button class="'+cls+'" onclick="pick('+j+')"'+(answered?' disabled':'')+'>'+
       '<span class="mark">'+mark+'</span><span>'+esc(o)+'</span></button>';
  });
  h+='</div>';

  if(multi && !answered){
    h+='<div class="navrow"><button class="btn btn-blue" onclick="checkMulti()">בדיקה</button></div>';
  }

  if(answered){
    h+='<div class="fb '+(ans.ok?'ok':'no')+'">'+
       '<div class="fb-h">'+(ans.ok?'✅ תשובה נכונה':'❌ תשובה שגויה')+'</div>'+
       '<div class="fb-b">'+
         (ans.ok?'':'<strong>התשובה הנכונה: </strong>'+correct.map(function(c){return esc(q[2][c]);}).join(' · ')+'<br><br>')+
         esc(q[4])+
       '</div></div>';
  }

  h+='<div class="navrow">'+
     '<button class="btn btn-ghost" onclick="go(-1)"'+(S.i===0?' disabled':'')+'>→ הקודמת</button>'+
     '<button class="btn btn-ghost" onclick="go(1)"'+(S.i>=S.qs.length-1?' disabled':'')+'>הבאה ←</button>'+
     '<div class="spacer"></div>'+
     '<button class="btn btn-danger btn-sm" onclick="finish()">סיום וקבלת ציון</button>'+
   '</div></div>';

  app().innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(j){
  var q=S.qs[S.i];
  if(S.answers[S.i]!==null) return;
  if(Array.isArray(q[3])){
    var k=S.sel.indexOf(j);
    if(k>-1) S.sel.splice(k,1); else S.sel.push(j);
    render(); return;
  }
  S.answers[S.i]={pick:[j], ok:(j===q[3])};
  render();
}
function checkMulti(){
  var q=S.qs[S.i];
  var a=S.sel.slice().sort(), b=q[3].slice().sort();
  S.answers[S.i]={pick:S.sel.slice(), ok:(a.length===b.length && a.every(function(v,i){return v===b[i];}))};
  S.sel=[];
  render();
}
function go(d){
  var n=S.i+d;
  if(n<0||n>=S.qs.length) return;
  S.i=n; S.sel=[]; render();
}

/* ---------- מסך תוצאות ---------- */
function finish(){
  var scored=[],right=0,byTopic={},wrongList=[];
  S.answers.forEach(function(a,i){
    if(a===null) return;
    var q=S.qs[i]; scored.push(i);
    byTopic[q[0]]=byTopic[q[0]]||{n:0,r:0};
    byTopic[q[0]].n++;
    if(a.ok){right++;byTopic[q[0]].r++;} else wrongList.push(i);
  });
  var n=scored.length;
  var pct = n? Math.round(right/n*100) : 0;
  var C=2*Math.PI*74, off=C*(1-pct/100);
  var color = pct>=85?'var(--green)': pct>=70?'var(--orange)':'var(--red)';
  var msg = pct>=90?'מצוין! 🎯 שליטה מרשימה בחומר.' : pct>=80?'טוב מאוד 👏 עוד קצת חידוד ואתה שם.' :
            pct>=70?'עברת ✅ — כדאי לחזור על הנושאים החלשים.' : pct>=55?'קרוב 💪 שווה סבב חזרה ממוקד.' : 'צריך עוד עבודה 📖 חזרה על החומר ואז תרגול נוסף.';

  var h='<div class="card">'+
    '<h2 class="sec-title" style="justify-content:center;font-size:1.35rem">🏁 סיכום התרגול</h2>'+
    '<div class="ring-wrap"><div class="ring">'+
      '<svg width="172" height="172"><circle cx="86" cy="86" r="74" fill="none" stroke="var(--gray-150)" stroke-width="15"/>'+
      '<circle cx="86" cy="86" r="74" fill="none" stroke="'+color+'" stroke-width="15" stroke-linecap="round" '+
      'stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg>'+
      '<div class="val"><div class="num">'+pct+'%</div><div class="lbl">ציון</div></div>'+
    '</div></div>'+
    '<p style="text-align:center;font-size:1.05rem;margin-bottom:18px">'+msg+'</p>'+
    '<div class="stats">'+
      '<div class="stat g"><div class="n">'+right+'</div><div class="t">נכונות</div></div>'+
      '<div class="stat r"><div class="n">'+(n-right)+'</div><div class="t">שגויות</div></div>'+
      '<div class="stat b"><div class="n">'+n+'/'+S.qs.length+'</div><div class="t">נענו</div></div>'+
    '</div>';

  var tk=Object.keys(byTopic);
  if(tk.length){
    h+='<h3 class="sec-title" style="font-size:1rem;margin-top:6px">📊 פילוח לפי נושא</h3>';
    tk.sort(function(a,b){return (byTopic[a].r/byTopic[a].n)-(byTopic[b].r/byTopic[b].n);}).forEach(function(t){
      var o=byTopic[t], p=Math.round(o.r/o.n*100);
      var c = p>=80?'var(--green)': p>=60?'var(--orange)':'var(--red)';
      h+='<div class="bd"><div class="bd-h"><span>'+(TOPIC_ICON[t]||'▪️')+' '+esc(t)+'</span>'+
         '<span class="p">'+o.r+'/'+o.n+' · '+p+'%</span></div>'+
         '<div class="bar"><i style="width:'+p+'%;background:'+c+'"></i></div></div>';
    });
  }

  if(wrongList.length){
    h+='<div class="navrow" style="margin-top:18px">'+
       '<button class="btn btn-blue" onclick="retryWrong()">🔁 תרגול השאלות שטעיתי בהן ('+wrongList.length+')</button></div>';
    S._wrong=wrongList.map(function(i){return S.qs[i];});
  }
  h+='<div class="navrow">'+
     '<button class="btn btn-ghost" onclick="render()">→ חזרה למבחן</button>'+
     '<button class="btn btn-primary" onclick="home()">🏠 מסך הבית</button>'+
     '</div></div>';
  app().innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){ begin(S.mode, shuffle(S._wrong.slice())); }

home();

</script>
</body>
</html>
