 חדה ברמת האשלגן בדם ובשריר הלב","אובדן העצבוב הסימפתטי ודומיננטיות של הוואגוס","עליית לחץ תוך-גולגולתי עם תגובת קושינג","פגיעה ישירה בצומת הסינו-אטריאלי בלב"],1,"הסיבים הסימפתטיים ללב יוצאים מהמקטעים T1 עד T4, ופגיעה מעליהם מנתקת אותם. עצב הוואגוס לעומת זאת יוצא מהמוח ואינו נפגע, ולכן הוא נותר דומיננטי ומאט את הלב. זו הסיבה שבהלם נוירוגני הדופק אינו מהיר — בניגוד לכל סוגי ההלם האחרים — וזהו סימן מבחין חשוב מאוד."],["עמוד שדרה","מה יש לבדוק בהערכה מוטורית מהירה של פצוע עם חשד לפגיעת עמוד שדרה?",["כוח אחיזה בשתי כפות הידיים בלבד","טווח תנועה אקטיבי מלא של עמוד השדרה הצווארי","רפלקסים גידיים בברכיים ובגידי אכילס","תנועה אקטיבית והתנגדות בארבע הגפיים ותחושה"],3,"ההערכה כוללת בקשה מהפצוע להזיז את אצבעות הידיים והרגליים, לבדוק כוח מול התנגדות בארבע הגפיים, ולבדוק תחושה בכל גפה. חשוב לבדוק ולתעד לפני ואחרי כל תזוזה או קיבוע. בדיקת טווח תנועה אקטיבי של הצוואר אסורה בחשד לפגיעה, ורפלקסים גידיים אינם מעשיים בשטח."],["עמוד שדרה","מדוע ילדים עלולים לסבול מפגיעת חוט שדרה ללא שבר בהדמיה (SCIWORA)?",["בשל חוסר שיתוף פעולה בבדיקה הקלינית","בשל גמישות רבה שמאפשרת מתיחת החוט ללא שבר","בשל גודלו הקטן של החוט ביחס לתעלת השדרה","בשל היעדר סחוס ורצועות בין חוליות הצוואר"],1,"עמוד השדרה של ילד גמיש מאוד בשל רצועות אלסטיות וחוליות שטרם התגרמו במלואן, ולכן הוא יכול להימתח משמעותית ולחזור למקומו מבלי להישבר — בעוד חוט השדרה, שגמישותו מוגבלת בהרבה, נמתח וניזוק. מכאן שצילום תקין אינו שולל פגיעה, וההערכה הקלינית מכריעה."],["עמוד שדרה","מהי הפעולה הראשונה בטיפול בפצוע עם חשד לפגיעת עמוד שדרה?",["ייצוב ידני של הראש בקו האמצע","הנחת הפצוע על לוח גב עם חוסמי ראש","ביצוע בדיקה נוירולוגית מלאה ומתועדת","הנחת צווארון קשיח במידה מתאימה"],0,"ייצוב ידני הוא הפעולה הראשונה והוא מתחיל מיד עם הגישה לפצוע — עוד לפני שמביאים ציוד. הוא נשמר ברציפות עד להשלמת הקיבוע. הצווארון הקשיח מוסיף ייצוב אך אינו מונע תנועה במלואה, ולוח הגב מגיע בשלב מאוחר יותר. בדיקה נוירולוגית חשובה אך אינה קודמת להגנה על החוט."],["עמוד שדרה","מהי המשמעות של אובדן שליטה על סוגרים בפצוע טראומה?",["סימן להתייבשות ולאובדן נוזלים משמעותי","סימן אפשרי לפגיעה בחוט השדרה","תופעה נורמלית ושכיחה לאחר כל חבלה","סימן לזיהום פעיל בדרכי השתן"],1,"אובדן שליטה על סוגרים בפצוע טראומה מחשיד לפגיעה בחוט השדרה שפגעה בעצבוב האוטונומי של השלפוחית ושל פי הטבעת. הוא מופיע לצד סימנים אחרים כמו שיתוק רפה, אובדן תחושה ופריאפיזם. זהו ממצא משמעותי שיש לתעד, והוא אינו תופעה נורמלית לאחר חבלה."],["עמוד שדרה","מטופל עם פגיעה בגובה C4. מהי הסכנה המיידית ביותר?",["התפתחות מהירה של פצעי לחץ בעורף","אובדן שליטה על שלפוחית השתן ואצירה","כשל נשימתי עקב שיתוק הסרעפת","ירידה בתנועתיות המעי עם חסימה תפקודית"],2,"פגיעה בגובה C4 היא בטווח העצבוב הסרעפתי (C3 עד C5), ולכן קיים סיכון מיידי לשיתוק הסרעפת ולדום נשימה. זוהי סכנת החיים המיידית שגוברת על כל שאר הבעיות. הטיפול הוא ניטור נשימתי צמוד וסיוע נשימתי בהתאם. שאר הסיבוכים משמעותיים אך אינם מסכנים חיים בדקות הראשונות."],["עמוד שדרה","מהי המשמעות של Log Roll ומתי הוא מבוצע?",["הרמת הפצוע בידי שני מטפלים בו זמנית","סיבוב הפצוע כיחידה אחת לבדיקת גב או להנחה","הטיית האלונקה כולה לצד להגנת נתיב האוויר","סיבוב הראש בלבד לצורך בדיקת העורף"],1,"Log Roll הוא סיבוב מתואם של הפצוע כגוף אחד, תוך שמירה מוחלטת על יישור ראש-צוואר-גו, המבוצע על ידי מספר מטפלים כשאחד מהם מנחה ושומר על הראש. הוא מתבצע לצורך בדיקת הגב בשלב ה-E, להנחה על לוח גב, ובמצב של הקאה. אין לסובב את הראש בנפרד מהגוף בשום שלב."],["עמוד שדרה","באילו מצבים גוברת שאלת נתיב האוויר על שיקולי קיבוע עמוד השדרה?",["בילדים ובתינוקות בשל נתיב אוויר צר","לעולם לא — הקיבוע קודם בכל מצב","בכל פצוע טראומה עם מנגנון משמעותי","כאשר קיימת חסימת נתיב אוויר מסכנת חיים"],3,"סדר העדיפויות בסקר הראשוני קובע שנתיב אוויר קודם לשיקולי עמוד שדרה. פצוע שאינו מסוגל לנשום ימות בדקות, בעוד שהסיכון לפגיעה נוירולוגית נוספת מתנועה זהירה נמוך יחסית. לכן במצב של חסימה מסכנת חיים מבצעים את הפעולה הנדרשת — כולל תמרונים שמזיזים את הצוואר — תוך צמצום התנועה למינימום ההכרחי."],["חזה","מהם הסימנים הקלאסיים של חזה אוויר בלחץ?",["גודש ורידי צוואר, היעדר כניסת אוויר וסטיית קנה","קולות לב עמומים ודופק פרדוקסלי בשאיפה","קרפיטציות דו-צדדיות וכיח ורדרד ומוקצף","נשימה סרעפתית ואישונים מכווצים דו-צדדית"],0,"בחזה אוויר בלחץ האוויר נכלא בחלל הצדר, דוחס את הריאה ומסיט את המדיאסטינום. התוצאות הן היעדר כניסת אוויר בצד הפגוע, היפר-רזוננס בניקוש, גודש ורידי צוואר, תת לחץ דם וסטיית קנה — סימן מאוחר. קרפיטציות שייכות לבצקת ריאות, קולות לב עמומים ודופק פרדוקסלי לטמפונדה."],["חזה","מהו הטיפול המיידי בחזה אוויר בלחץ בשטח?",["הנשמה בלחץ חיובי גבוה עם חמצן","הנחת נקז חזה עם מערכת ניקוז סגורה","הנחת חבישה אטומה ומודבקת מכל הצדדים","ניקור חזה במחט בצד הפגוע"],3,"ניקור חזה במחט משחרר את הלחץ הכלוא והופך את המצב לחזה אוויר פשוט — פעולה מצילת חיים שמבוצעת מיד עם הזיהוי הקליני, ללא המתנה לצילום. חבישה אטומה מכל הצדדים היא דווקא הסיבה האפשרית למצב. הנשמה בלחץ חיובי מחמירה את הכליאה. נקז חזה הוא פעולה בית חולימית."],["חזה","היכן מבוצע ניקור חזה במחט?",["מרווח בין-צלעי שני בקו האמצע-בריחי, מעל הצלע","מרווח בין-צלעי חמישי בקו האמצע-בריחי","מתחת לעצם החזה בזווית של 45 מעלות","מרווח בין-צלעי שביעי בקו האחורי-בית שחי"],0,"האתר הקלאסי הוא המרווח הבין-צלעי השני בקו האמצע-בריחי, והמחט מוחדרת מעל השפה העליונה של הצלע התחתונה — כדי להימנע מהצרור העצבי-כלי דם שעובר לאורך השפה התחתונה של כל צלע. אתר חלופי מקובל היום הוא המרווח החמישי בקו האמצע-בית שחי, שנמצא יעיל יותר במבוגרים בעלי דופן חזה עבה."],["חזה","מהו פצע יונק (Sucking Chest Wound) וכיצד מטפלים בו?",["קרע בסרעפת עם מעבר איברים — קיבוע מיידי","פצע מדמם בדופן החזה — חבישה לוחצת והדוקה","שבר בצלעות עם תנועה פרדוקסלית — קיבוע בסד","פצע פתוח שדרכו נכנס אוויר — חבישה אטומה משלוש רוחות"],3,"בפצע פתוח בדופן החזה האוויר נשאב פנימה בכל שאיפה וגורם לתמט הריאה. הטיפול הוא חבישה אטומה שמודבקת בשלוש רוחות בלבד, כך שהיא נאטמת בשאיפה ומאפשרת יציאת אוויר בנשיפה — כמו שסתום חד-כיווני. אטימה מלאה בארבע רוחות עלולה להפוך את המצב לחזה אוויר בלחץ."],["חזה","פצוע עם חבישה אטומה על פצע חזה מפתח קוצר נשימה מחמיר ותת לחץ דם. מה הפעולה?",["הסרת החבישה או פתיחת פינה לשחרור הלחץ","הידוק החבישה ותוספת שכבה אטומה נוספת","מתן נוזלים בכמות גדולה להעלאת לחץ הדם","הנשמה בלחץ גבוה להתגברות על ההתנגדות"],0,"התמונה מתאימה להתפתחות חזה אוויר בלחץ מתחת לחבישה שנאטמה לחלוטין. הפעולה המיידית והפשוטה היא הסרת החבישה או הרמת פינה — כך האוויר הכלוא משתחרר וניתן להעריך מחדש. אם אין שיפור מבצעים ניקור חזה. הידוק החבישה או הנשמה בלחץ יחמירו את המצב באופן מיידי."],["חזה","מהו חזה מרפרף (Flail Chest)?",["שבר בעצם החזה עם הסטה של המקטע הקדמי","שברים בשלוש צלעות ומעלה בשני מקומות בכל צלע","שבר בצלע אחת בשני מקומות שונים","שבר בעצם הבריח עם פגיעה ברקמת הריאה"],1,"חזה מרפרף מוגדר כשלוש צלעות סמוכות או יותר, שכל אחת מהן שבורה בשני מקומות, כך שנוצר מקטע שמנותק משלמות דופן החזה. המקטע נע בתנועה פרדוקסלית — פנימה בשאיפה והחוצה בנשיפה. הכוח הנדרש ליצירתו גבוה, ולכן חבלת ריאה מתלווה כמעט תמיד והיא הגורם העיקרי להיפוקסיה."],["חזה","מהו הטיפול המרכזי בחזה מרפרף בשטח?",["חמצון ותמיכה נשימתית לצד שיכוך כאב","קיבוע המקטע בשקי חול או בחבישה הדוקה","השכבת הפצוע על הצד הבריא לייצוב המקטע","הימנעות ממתן חמצן בשל סכנת ניפוח יתר"],0,"הטיפול מתמקד בבעיה האמיתית — היפוקסיה מחבלת הריאה — ולכן חמצן, תמיכה נשימתית ובמידת הצורך הנשמה בלחץ חיובי הם העיקר. שיכוך כאב חשוב מפני שכאב מונע נשימה עמוקה ושיעול וגורם לתמט. קיבוע חיצוני בשקי חול נזנח מזמן — הוא מגביל את התפשטות בית החזה ומחמיר את האוורור."],["חזה","מהי טמפונדה לבבית ומהי שלישיית בק?",["דם בשק הפריקרד — תת לחץ דם, גודש ורידי וקולות עמומים","קרע במסתם הלב — אוושה, בצקת וקוצר נשימה","אוויר בשק הפריקרד — כאב, קוצר נשימה וסחרחורת","דם בחלל הצדר — תת לחץ דם, טכיקרדיה וחיוורון"],0,"טמפונדה נגרמת מהצטברות דם בשק הפריקרד הקשיח, שמגביל את מילוי חדרי הלב. שלישיית בק כוללת תת לחץ דם, גודש ורידי צוואר וקולות לב עמומים. בשטח קשה לזהות קולות לב עמומים, ולכן מסתמכים גם על פולסוס פרדוקסוס ועל היעדר תגובה לנוזלים. הטיפול המכריע הוא ניקוז — פעולה בית חולימית."],["חזה","מהו המובנד (Hemothorax) ומהי כמות הדם שיכולה להצטבר בחלל הצדר?",["עד 100 מ״ל בלבד בשל לחץ הרקמות","עד כ-3 ליטר בכל צד — מקור להלם המורגי","עד 500 מ״ל בכל צד של בית החזה","דם אינו מצטבר בחלל הצדר אלא ברקמת הריאה"],1,"כל חלל צדר יכול להכיל כמות גדולה של דם — עד כ-3 ליטר, כלומר יותר ממחצית נפח הדם. לכן חזה דמי מסיבי הוא סיבה עצמאית להלם המורגי, ולעיתים מקור הדימום החבוי היחיד. הביטוי הקליני משלב היעדר כניסת אוויר בצד הפגוע עם עמימות בניקוש — בשונה מהיפר-רזוננס בחזה אוויר — וורידי צוואר שטוחים."],["חזה","כיצד מבחינים קלינית בין חזה אוויר בלחץ לחזה דמי מסיבי?",["בשני המצבים ורידי הצוואר גדושים והניקוש עמום","בחזה דמי מופיעה סטיית קנה ובחזה אוויר לא","לא ניתן להבחין ביניהם בתנאי שטח ללא הדמיה","בחזה אוויר הוורידים גדושים והניקוש מהדהד, בדמי להפך"],3,"בשני המצבים אין כניסת אוויר בצד הפגוע ויש הלם, אך המנגנון שונה. בחזה אוויר בלחץ האוויר לוחץ, ורידי הצוואר גדושים והניקוש מהדהד. בחזה דמי מסיבי הפצוע מאבד נפח דם, ולכן ורידי הצוואר שטוחים והניקוש עמום. ההבחנה קריטית: ניקור חזה יעזור באחד ולא בשני."],["חזה","מהי חבלת ריאה (Pulmonary Contusion) ומדוע היא מסוכנת?",["דימום ובצקת ברקמת הריאה המתפתחים בהדרגה","הצטברות אוויר ברקמה התת-עורית של דופן החזה","דימום לחלל הצדר עם תמט ריאה מיידי","קרע בסימפונות הראשיים עם בריחת אוויר"],0,"בחבלת ריאה הדם והבצקת ממלאים את האלוואולות ומונעים חילוף גזים, כך שנוצר Shunt. הסכנה המיוחדת היא שההתפתחות הדרגתית — המצב עלול להיראות תקין בשעה הראשונה ולהחמיר משמעותית בשעות שלאחריה. לכן פצוע עם מנגנון חזה משמעותי מחייב ניטור מתמשך גם אם הוא נראה יציב, ומתן נוזלים מוגזם מחמיר את הבצקת."],["חזה","מהו המנגנון של קרע באאורטה בתאונת דרכים?",["כוחות גזירה בהאטה באזור הליגמנטום ארטריוזום","שבר בעצם החזה עם פגיעה ישירה בכלי הדם","פגיעה חודרת ישירה בדופן כלי הדם","עלייה חדה בלחץ הדם הסיסטמי בעת הפגיעה"],0,"בהאטה פתאומית הלב והאאורטה העולה ממשיכים לנוע קדימה בעוד האאורטה היורדת מקובעת לעמוד השדרה. נקודת המעבר — סמוך לליגמנטום ארטריוזום מיד אחרי מוצא עורק תת-הבריח השמאלי — סופגת את כוחות הגזירה ונקרעת. רוב הנפגעים מתים בזירה, והשורדים תלויים בהמטומה עוטפת. אין סימן קליני אמין, ולכן החשד מבוסס על המנגנון."],["חזה","מהו הסימן האופייני לאמפיזמה תת-עורית?",["נפיחות אדומה וחמה עם רגישות במישוש","כאב חד המחמיר בשאיפה עמוקה","תחושת פצפוץ מתחת לעור במישוש","כחלון מרכזי סביב השפתיים ובלשון"],2,"אמפיזמה תת-עורית היא הצטברות אוויר ברקמה התת-עורית, ובמישוש היא נותנת תחושת פצפוץ אופיינית כמו נייר צלופן. היא מעידה על בריחת אוויר ממערכת הנשימה — חזה אוויר, קרע בקנה או בסימפונות, או פגיעה בוושט. כשהיא מתפשטת במהירות לצוואר ולפנים היא מעידה על פגיעה גדולה ומחייבת פינוי דחוף עם מעקב אחר נתיב האוויר."],["חזה","פצוע עם דקירה בחזה משמאל, ל״ד 80/60, ורידי צוואר גדושים, קולות לב עמומים, כניסת אוויר שווה. מה החשד?",["טמפונדה לבבית","חזה אוויר בלחץ","קרע בסרעפת","חזה דמי מסיבי"],0,"כניסת אוויר שווה בשני הצדדים שוללת חזה אוויר בלחץ וחזה דמי, ולכן השילוב של גודש ורידי צוואר, תת לחץ דם וקולות לב עמומים — שלישיית בק — מצביע על טמפונדה. אזור הדקירה בחזה שמאלי בין קו הפטמות לעצם החזה הוא אזור התיבה הקרדיאלית שבו הסיכון גבוה במיוחד. הטיפול הוא פינוי מהיר ביותר לניקוז."],["חזה","מהו קרע בסרעפת ומה הסימן האופייני?",["קרע בקנה הנשימה — אמפיזמה תת-עורית מתפשטת","מעבר איברי בטן לחלל החזה — קולות מעי בהאזנה","קרע בשריר הבין-צלעי — כאב מקומי בנשימה","הצטברות אוויר בפריקרד — קולות לב עמומים"],1,"קרע בסרעפת נגרם מעלייה חדה בלחץ התוך-בטני בחבלה קהה, לרוב בצד שמאל מפני שהכבד מגן על הצד הימני. איברי בטן — קיבה, מעי, טחול — נודדים לחלל החזה ודוחסים את הריאה. הסימן האופייני הוא קולות מעי בהאזנה לבית החזה, לצד קוצר נשימה וכאב. הנשמה בלחץ חיובי עלולה להחמיר את המצב."],["חזה","מהו חזה אוויר פשוט (Simple Pneumothorax)?",["אוויר בחלל הצדר עם הסטת מדיאסטינום לצד הנגדי","דם ואוויר יחד בחלל הצדר עם ניקוש עמום","אוויר כלוא ברקמת הריאה עצמה ללא דלף לצדר","אוויר בחלל הצדר ללא הצטברות לחץ מתקדמת"],3,"בחזה אוויר פשוט האוויר נכנס לחלל הצדר וגורם לתמט חלקי של הריאה, אך הלחץ אינו מצטבר באופן מתקדם ואין הסטת מדיאסטינום או פגיעה המודינמית. הביטויים הם קוצר נשימה, כאב פלאוריטי, ירידה בכניסת אוויר בצד הפגוע והיפר-רזוננס. הסכנה היא שהוא יהפוך לחזה אוויר בלחץ, במיוחד תחת הנשמה בלחץ חיובי."],["חזה","מהי הסכנה בהנשמה בלחץ חיובי בפצוע עם חזה אוויר?",["עלייה בקצב הלב ובצריכת החמצן של שריר הלב","גרימת אמפיזמה תת-עורית נרחבת בדופן החזה","ירידה בלחץ הדם בשל עלייה בלחץ התוך-חזי","הפיכת חזה אוויר פשוט לחזה אוויר בלחץ"],3,"הנשמה בלחץ חיובי דוחפת אוויר לחלל הצדר דרך הקרע בריאה, והאוויר אינו יכול לצאת. כתוצאה מכך חזה אוויר פשוט הופך במהירות לחזה אוויר בלחץ עם קריסה המודינמית. לכן בכל פצוע חזה שמונשם יש לנטר באופן צמוד, וכל הידרדרות פתאומית תוך כדי הנשמה מחייבת חשד מיידי ושקילת ניקור חזה."],["חזה","מהו הסימן הראשון והמוקדם ביותר של חזה אוויר בלחץ?",["סטיית קנה הנשימה לצד הבריא","גודש בולט ומתמשך בוורידי הצוואר","קוצר נשימה מחמיר וירידה בכניסת אוויר בצד הפגוע","דום לב עם פעילות חשמלית ללא דופק"],2,"סטיית קנה, גודש ורידי צוואר ותת לחץ דם הם סימנים מאוחרים שמופיעים כשהמצב כבר מתקדם. הסימנים המוקדמים הם קוצר נשימה מחמיר, ירידה בכניסת אוויר בצד אחד, אי שקט וטכיקרדיה. ההמתנה לסימנים המאוחרים מסוכנת — האבחנה היא קלינית ומבוססת על החשד, והטיפול ניתן מיד."],["חזה","מדוע שברים בצלעות התחתונות מחייבים חשד לפגיעה בטנית?",["השברים מגבילים את תנועת הסרעפת והנשימה","שברים אלו קשורים תמיד לפגיעה ישירה בכליה","הצלעות התשיעית עד השתים עשרה מגנות על הכבד והטחול","הכאב מהשבר מקרין אל דופן הבטן העליונה"],2,"הצלעות התחתונות מקיפות את החלק העליון של חלל הבטן ומגנות על הכבד מימין ועל הטחול משמאל. הכוח שנדרש לשבור אותן מספיק לפגוע גם באיברים שמתחתיהן, ולעיתים שברי העצם פוגעים בהם ישירות. לכן שבר בצלעות 9 עד 12 משמאל מחייב חשד לקרע בטחול, ומימין לקרע בכבד."],["חזה","מדוע שבר בצלעות הראשונה והשנייה מעיד על אנרגיה גבוהה?",["הן דקות במיוחד ונשברות בכוח נמוך","הן מכילות מח עצם פעיל ורגיש לחבלה","הן מוגנות היטב ודורשות כוח רב לשבירה","הן היחידות שאינן מחוברות אל עצם החזה"],2,"הצלעות העליונות קצרות, עבות ומוגנות היטב על ידי עצם הבריח, השכמה ושרירי הכתף, ולכן נדרש כוח עצום כדי לשבור אותן. שבר בהן הוא סמן לאנרגיה גבוהה מאוד ומחייב חשד לפגיעות נלוות חמורות — קרע באאורטה, פגיעה בכלי הדם הגדולים ובמקלעת הזרוע ופגיעת ריאה. התמותה בשברים אלה גבוהה."],["חזה","מטופל בן 70 עם שבר בשלוש צלעות. מדוע הוא בסיכון גבוה יותר ממטופל צעיר?",["בשל אוסטיאופורוזיס והסיכון לשברים נוספים","בשל עלייה בקצב הלב ובצריכת החמצן של הלב","בשל תחושת כאב מופחתת שמעכבת פנייה לעזרה","בשל רזרבה נשימתית מופחתת וסיכון לתמט ולדלקת ריאות"],3,"קשיש עם שברי צלעות נמנע מנשימה עמוקה ומשיעול בשל הכאב, וכתוצאה מכך מתפתחים תמט ריאתי ודלקת ריאות. הרזרבה הנשימתית שלו מוגבלת מלכתחילה, ומחלות רקע מחמירות את המצב. התמותה משברי צלעות בקשישים גבוהה משמעותית ועולה עם כל צלע נוספת. לכן שיכוך כאב יעיל הוא חלק מרכזי בטיפול ולא מותרות."],["חזה","מהי חבלת לב (Myocardial Contusion) ומה הסיכון בה?",["דלקת בקרום הלב עם כאב פלאוריטי","היצרות חדה של העורקים הכליליים והאיסכמיה","חבלה בשריר הלב — סיכון להפרעות קצב ולכשל","קרע במסתם עם אוושה חדשה וקוצר נשימה"],2,"חבלת לב נגרמת מחבלה קהה חזקה לקדמת בית החזה — לרוב פגיעה בהגה או בעצם החזה. השריר החבול עלול לפתח הפרעות קצב, מקצות חוץ-חדריות ועד הפרעות קצב מסכנות חיים, וכן ירידה בכושר ההתכווצות. לכן כל פצוע עם מנגנון כזה מחייב ניטור אק״ג רציף, גם אם הוא נראה יציב לחלוטין."],["חזה","פצוע עם דקירה בין קו הפטמות לעצם החזה. באיזו פגיעה יש לחשוד במיוחד?",["פגיעה בכבד ובכיס המרה ברביע ימני עליון","פגיעה בלב ובכלי הדם הגדולים","פגיעה בטחול ברביע השמאלי העליון","פגיעה בכליה ובחלל הרטרו-פריטונאלי"],1,"האזור שבין קווי הפטמות, מעצם הבריח ועד לקשת הצלעות, מכונה התיבה הקרדיאלית והוא מכיל את הלב, את האאורטה ואת כלי הדם הגדולים. דקירה בו נחשבת פגיעת לב עד שיוכח אחרת ומחייבת פינוי מהיר ביותר. חשוב לזכור שגם דקירה קטנה למראה עלולה לגרום לטמפונדה קטלנית תוך דקות."],["חזה","מהו הטיפול בגוף זר החודר לבית החזה?",["דחיפת הגוף הזר פנימה למניעת תזוזה בדרך","ייצוב הגוף הזר במקומו, כיסוי ופינוי מהיר","הוצאה מיידית של הגוף הזר וחבישה אטומה","סיבוב הגוף הזר לשחרורו מהרקמה הסובבת"],1,"הגוף הזר עשוי לאטום כלי דם שנקרע ולמנוע דימום מסיבי או כניסת אוויר. הוצאתו בשטח עלולה לגרום לדימום בלתי נשלט, לחזה אוויר ולפגיעה נוספת. לכן מייצבים אותו בחבישות מסביב, מכסים ומפנים מהר לחדר ניתוח. יוצא הדופן היחיד הוא גוף זר שחוסם את נתיב האוויר או מונע ביצוע החייאה."],["חזה","מדוע מבצעים ניקור חזה מעל השפה העליונה של הצלע?",["כדי למנוע זיהום של חלל הצדר בעת ההחדרה","כדי להפחית את הכאב הנגרם מהחדרת המחט","כדי להימנע מהצרור העצבי-כלי דם שבשפה התחתונה","כדי להגיע אל חלל הצדר במהירות רבה יותר"],2,"לאורך השפה התחתונה של כל צלע עובר תלם שבו נמצאים הווריד, העורק והעצב הבין-צלעיים. החדרת מחט מתחת לצלע עלולה לפגוע בהם ולגרום לדימום משמעותי ולכאב עצבי. לכן המחט מוחדרת תמיד צמוד לשפה העליונה של הצלע שמתחת למרווח הנבחר, במאונך לעור."],["חזה","מטופל לאחר חבלת חזה מתלונן על קוצר נשימה, ובהאזנה כניסת אוויר מופחתת משמאל, ניקוש מהדהד, ל״ד 130/80, דופק 95. מה האבחנה?",["חזה אוויר פשוט","טמפונדה לבבית","חזה דמי מסיבי","חזה אוויר בלחץ"],0,"הממצאים הריאתיים מתאימים לחזה אוויר — ירידה בכניסת אוויר וניקוש מהדהד. אולם המדדים ההמודינמיים תקינים לחלוטין, ואין גודש ורידי צוואר או סטיית קנה, ולכן זהו חזה אוויר פשוט ולא בלחץ. הטיפול הוא חמצן, מנוחה, ניטור צמוד ופינוי — ניקור חזה במצב זה אינו מוצדק. יש לעקוב בשל הסיכון להתקדמות."],["חזה","מהו ההבדל בין נשימה פרדוקסלית לנשימה סרעפתית?",["פרדוקסלית — מקטע נע הפוך; סרעפתית — בטן ללא חזה","שני המונחים מתארים את אותה תופעה קלינית","נשימה פרדוקסלית מופיעה בילדים ובתינוקות בלבד","נשימה סרעפתית היא הביטוי האופייני לחזה מרפרף"],0,"נשימה פרדוקסלית מתארת מקטע של דופן החזה שנע בכיוון ההפוך לשאר בית החזה — סימן לחזה מרפרף. נשימה סרעפתית מתארת מצב שבו הבטן עולה ויורדת ובית החזה כמעט אינו נע — סימן לפגיעה בחוט השדרה הצווארי עם שיתוק השרירים הבין-צלעיים. שתי התופעות מעידות על מצבים חמורים אך שונים לחלוטין."],["חזה","מהו הטיפול הראשוני בפצוע עם שברי צלעות מרובים וכאב עז?",["קיבוע בית החזה בתחבושת אלסטית הדוקה","השכבת הפצוע על הבטן להפחתת תנועת הצלעות","שיכוך כאב, חמצון ועידוד נשימה עמוקה ושיעול","הימנעות מוחלטת מתנועה עד להגעה לבית החולים"],2,"שיכוך כאב יעיל הוא הטיפול המרכזי — הוא מאפשר נשימה עמוקה ושיעול, ובכך מונע תמט ודלקת ריאות. קיבוע הדוק של בית החזה בתחבושת מגביל את התפשטותו ומחמיר את הבעיה בדיוק — זו שגיאה קלאסית. שכיבה על הבטן והימנעות מוחלטת מתנועה מחמירות אף הן את התפקוד הנשימתי."],["חזה","מהי המשמעות של סטיית קנה בפצוע חזה?",["סימן לחסימה של נתיב האוויר העליון","סימן מוקדם המופיע בכל חזה אוויר","ממצא שכיח ותקין בפצועי חזה קהה","סימן מאוחר לחזה אוויר בלחץ עם הסטת מדיאסטינום"],3,"סטיית קנה מהצד הפגוע מעידה על כך שהלחץ בחלל הצדר גבוה מספיק כדי להסיט את המדיאסטינום כולו. זהו סימן מאוחר מאוד — עד שהוא מופיע המטופל כבר בקריסה המודינמית, ובנוסף הוא קשה לזיהוי בשטח. לכן אין להמתין לו לצורך אבחנה: החשד הקליני והתמונה ההמודינמית מספיקים כדי לבצע ניקור."],["חזה","פצוע חזה שמונשם מפתח לפתע ירידה בסטורציה, עלייה בלחץ הנדרש להנשמה ותת לחץ דם. מה החשד הראשון?",["חסימת מנתב האוויר בהפרשות או בקריש","עייפות של שרירי הנשימה והסרעפת","הרעלת חמצן מריכוז גבוה ממושך","חזה אוויר בלחץ שהתפתח תחת הנשמה"],3,"התמונה של קושי גובר בהנשמה יחד עם קריסה המודינמית בפצוע חזה מונשם היא כמעט תמיד חזה אוויר בלחץ, שהתפתח מפני שהלחץ החיובי דחף אוויר לחלל הצדר. יש לבצע ניקור חזה מיידית בצד החשוד. חסימת המנתב אכן אפשרית ויש לשלול אותה במהירות, אך היא אינה מסבירה את התת לחץ דם באותה מידה."],["חזה","מהי הסיבה השכיחה ביותר למוות ניתן למניעה בפצוע חזה?",["חזה אוויר בלחץ שלא זוהה בזמן","שבר בעצם הבריח עם פגיעה נלווית","חבלה קלה בדופן החזה ללא ממצא","שבר בעצם החזה עם הסטת מקטע"],0,"חזה אוויר בלחץ הוא אחת הסיבות המובילות למוות שניתן היה למנוע בטראומה, מפני שהאבחנה קלינית פשוטה והטיפול — ניקור מחט — זמין, מהיר ומציל חיים. הכישלון נובע כמעט תמיד מאי זיהוי או מהמתנה לאישור הדמייתי. לכן ההנחיה חד משמעית: בחשד קליני מנקרים מיד."],["בטן ואגן","מהו האיבר הנפגע השכיח ביותר בחבלה קהה לבטן?",["הלבלב","הכליה","הכבד","הטחול"],3,"הטחול הוא האיבר השכיח ביותר בחבלה קהה — הוא רך, עשיר בכלי דם, ומקובע ברצועות שנקרעות בהאטה. הכבד הוא האיבר השכיח בפגיעה חודרת. הלבלב והכליות ממוקמים מאחורי הצפק ומוגנים יחסית, ופגיעה בהם דורשת כוח רב יותר."],["בטן ואגן","מהו סימן קר (Kehr's Sign) ומה משמעותו?",["כאב בפרינאום ובמפשעה — שבר בטבעת האגן","כאב בגב התחתון והמותן — פגיעה בכליה","כאב מוקרן לכתף שמאל — גירוי סרעפת מקרע בטחול","כאב מוקרן לכתף ימין — גירוי מפגיעה בכבד"],2,"דם בחלל הצפק מגרה את הסרעפת, ומכיוון שהסרעפת מעוצבבת מהשורשים C3 עד C5 — כמו העור באזור הכתף — הכאב מוקרן לכתף. בקרע בטחול הכאב מופיע בכתף שמאל. זהו סימן חשוב מפני שהוא עשוי להופיע לפני סימני הלם ברורים, ובמיוחד כשהמטופל שוכב על הגב."],["בטן ואגן","מדוע בדיקת בטן שלילית אינה שוללת פגיעה תוך-בטנית?",["המטופל נוטה להמעיט בתיאור עוצמת הכאב","הבטן מכילה דם רב ללא שינוי חיצוני, והסימנים מאוחרים","אין קשר בין ממצאי בדיקת הבטן לדימום פנימי","הבטן קטנה מכדי לאתר בה דימום במישוש"],1,"חלל הבטן הוא מרחב גדול שיכול להכיל ליטרים של דם מבלי שהיקף הבטן ישתנה באופן ניכר. בנוסף, סימני גירוי צפקי מתפתחים לאורך זמן, ולכן בדיקה בשעה הראשונה עשויה להיות שלילית לחלוטין. חבלה מסיחה, שיכרות וירידה בהכרה מקטינות עוד יותר את אמינות הבדיקה. לכן המנגנון וההמודינמיקה מכריעים."],["בטן ואגן","פצוע עם דקירה בבטן ומעי חשוף מחוץ לגוף (Evisceration). מה הטיפול?",["שטיפת המעי במים סטריליים לפני כיסוי","כיסוי בחבישה לחה וסטרילית ללא החזרה","דחיפה עדינה של המעי בחזרה לחלל הבטן","חבישה יבשה והדוקה מעל האזור החשוף"],1,"אין מחזירים איברים חשופים לחלל הבטן — הדבר גורם לזיהום ולפגיעה נוספת ואינו ניתן לביצוע בתנאי שטח. מכסים בחבישה סטרילית ולחה כדי למנוע התייבשות ונמק של הרקמה, ומעליה כיסוי שומר לחות. הפצוע מושכב עם ברכיים מכופפות להפחתת מתח על דופן הבטן. חבישה יבשה מייבשת את הרקמה, ושטיפה מזהמת."],["בטן ואגן","מהי כמות הדם שיכולה להיאבד בשבר אגן?",["עד 500 מ״ל בלבד מהמקלעת הוורידית","עד 200 מ״ל בשל לחץ הרקמות הסובבות","עד מספר ליטרים — מקור אפשרי להלם קטלני","הדימום משבר אגן זניח ואינו משמעותי"],2,"האגן מכיל מקלעת ורידית עשירה ועורקים גדולים, והחלל הרטרו-פריטונאלי יכול להכיל מספר ליטרים של דם. שבר אגן, במיוחד מסוג Open Book, הוא סיבה שכיחה להלם המורגי קטלני. הטיפול בשטח הוא קיבוע האגן בחגורת אגן ייעודית או בסדין, שמקטין את הנפח הפנימי ומסייע לעצירת הדימום."],["בטן ואגן","מהו הטיפול בשבר אגן לא יציב בשטח?",["הושבת הפצוע להפחתת לחץ על טבעת האגן","קיבוע כל גפה תחתונה בנפרד בסד ואקום","הנחת חגורת אגן בגובה הטרוכנטרים הגדולים","ביצוע בדיקות יציבות חוזרות לפני הקיבוע"],2,"חגורת אגן מונחת בגובה הטרוכנטרים הגדולים — לא על כנפי הכסל — כדי לסגור את הטבעת האגנית ולהקטין את נפח החלל הפנימי, ובכך לסייע בעצירת הדימום ולייצב את שברי העצם. בדיקות יציבות חוזרות אסורות: כל בדיקה מפרקת קרישים ומחדשת דימום. הושבת הפצוע מגדילה את התזוזה ומחמירה את המצב."],["בטן ואגן","מדוע אין לבצע בדיקת יציבות אגן חוזרת בחשד לשבר?",["הבדיקה עלולה לגרום לזיהום של השבר","הבדיקה גורמת לכאב עז ללא תועלת נוספת","כל בדיקה מפרקת קרישים ומחדשת את הדימום","הבדיקה אינה אמינה בילדים ובקשישים"],2,"תנועה של שברי האגן קורעת מחדש את הכלים שדיממו ומפרקת את הקרישים שנוצרו, וכל בדיקה כזו עלולה לגרום לאיבוד דם משמעותי. לכן בודקים לכל היותר פעם אחת ובעדינות, ובחשד גבוה — למשל מנגנון מתאים עם הלם — מוותרים על הבדיקה ומקבעים ישירות. הכאב הוא בעיה משנית לעומת סיכון הדימום."],["בטן ואגן","מהו הרביע שבו ממוקם הכבד ומהו הרביע שבו ממוקם הטחול?",["שניהם ממוקמים ברביע השמאלי העליון","שניהם ממוקמים ברביע הימני העליון","הכבד ברביע שמאלי עליון והטחול בימני עליון","הכבד ברביע ימני עליון והטחול בשמאלי עליון"],3,"הכבד תופס את הרביע הימני העליון ומשתרע גם אל השמאלי, והטחול נמצא ברביע השמאלי העליון מתחת לצלעות 9 עד 11. הידע האנטומי הזה מתרגם ישירות לחשד קליני: פגיעה בצד ימין או שבר בצלעות תחתונות מימין מחשידים לכבד, ובצד שמאל לטחול. שניהם איברים מוצקים עשירי כלי דם שדימומם עלול להיות מסיבי."],["בטן ואגן","מהי הסכנה בפגיעה באיברים חלולים בבטן?",["נזק עצבי מקומי ללא השלכה מערכתית","דלף תוכן ופריטוניטיס עם התפתחות ספסיס","הסכנה נמוכה בהשוואה לאיברים מוצקים","דימום מסיבי ומיידי לחלל הצפק"],1,"איברים חלולים — קיבה, מעי, שלפוחית השתן — מדממים מעט יחסית, אך דליפת תוכנם לחלל הצפק גורמת לפריטוניטיס. בפגיעת מעי גס התוכן עתיר החיידקים גורם לזיהום קשה ולספסיס, ובפגיעת קיבה או מעי דק החומצה והאנזימים גורמים לגירוי כימי חמור. ההידרדרות עלולה להיות איטית יותר מדימום, ולכן זיהוי מאוחר שכיח."],["בטן ואגן","מהו סימן חגורת בטיחות בבטן ומה משמעותו?",["סימן המעיד על חגירה נכונה ועל הגנה טובה","שפשוף שטחי בעור ללא משמעות קלינית","סימן שמחשיד לפגיעה במעי, בלבלב ובחוליות המותניות","סימן לפגיעה בעור ובשומן התת-עורי בלבד"],2,"חבורה או שפשוף לאורך קו החגורה בבטן מעידים על העברת כוח משמעותית לדופן הבטן ולתכולתה. הפגיעות האופייניות הן קרע במעי הדק, פגיעה בלבלב ושבר מסוג Chance בחוליות המותניות — שבר אופקי שנגרם מכיפוף חד סביב החגורה. לכן סימן חגורה מחייב חשד גבוה גם בפצוע שנראה תקין לחלוטין."],["בטן ואגן","גבר לאחר תאונה מתלונן על כאב בבטן, בבדיקה בטן קשה ורגישה מאוד, דופק 125, ל״ד 90/60. מה החשד?",["דימום תוך-בטני משמעותי עם גירוי צפקי","חסימת מעיים עם הפסקת מעבר תוכן","התכווצות רצונית של שרירי הבטן מכאב","הצטברות גזים במעי עם התנפחות הבטן"],0,"בטן קשה ורגישה בפצוע טראומה מעידה על גירוי צפקי מדם או מתוכן מעי, והמדדים ההמודינמיים מאשרים דימום משמעותי. זהו מצב שמחייב פינוי דחוף לחדר ניתוח — אין טיפול בשטח שיעצור דימום תוך-בטני. התכווצות שרירים מכאב אפשרית אך אינה מסבירה טכיקרדיה ותת לחץ דם."],["בטן ואגן","מהם האיברים הנמצאים מאחורי הצפק (Retroperitoneal)?",["המעי הדק והמעי הגס הרוחבי","הקיבה, הטחול והמעי הגס העולה","הכליות, הלבלב, האאורטה וחלקי התריסריון","הכבד, כיס המרה ודרכי המרה"],2,"האיברים הרטרו-פריטונאליים כוללים את הכליות ואת בלוטות האדרנל, את הלבלב, את התריסריון ברובו, את האאורטה הבטנית ואת הווריד הנבוב התחתון. משמעות קלינית חשובה: דימום מהם אינו גורם לגירוי צפקי ולכן הבטן עשויה להישאר רכה ולא כואבת, בעוד המטופל מדמם משמעותית — מצב שמוביל להערכת חסר."],["בטן ואגן","מהי המשמעות של דם במאטוס (פתח השופכה) בפצוע?",["חשד לפגיעה בשופכה — התווית נגד לקטטר","ממצא שכיח ותקין לאחר חבלה לאגן","פגיעה בכליה עם דימום רטרו-פריטונאלי","זיהום פעיל בדרכי השתן התחתונות"],0,"דם בפתח השופכה, המטומה בשק האשכים או בלוטת ערמונית גבוהה בבדיקה רקטלית מחשידים לקרע בשופכה — לרוב בהקשר של שבר באגן. החדרת קטטר במצב זה עלולה להפוך קרע חלקי לקרע מלא ולגרום לנזק ארוך טווח. לכן זו התווית נגד מוחלטת, והמטופל מופנה להערכה אורולוגית ולציסטוגרפיה."],["בטן ואגן","מטופל עם דקירה בבטן וסכין נעוצה. מה הטיפול?",["ייצוב הסכין במקומה, כיסוי ופינוי מהיר","הוצאה חלקית להערכת עומק החדירה","דחיפתה פנימה כדי למנוע תזוזה בדרך","הוצאת הסכין וחבישה לוחצת על הפצע"],0,"הסכין עשויה לחסום כלי דם שנקרע, והוצאתה בשטח עלולה לגרום לדימום מסיבי בלתי נשלט. לכן מייצבים אותה במקומה בחבישות מסביב ומפנים מהר לחדר ניתוח שבו ניתן לשלוט על הדימום. הוצאה חלקית או דחיפה פנימה גורמות לנזק נוסף. אין לנסות להעריך את עומק הפצע בשטח."],["בטן ואגן","מהי הסיבה לכך שדימום בטני עלול להיות סמוי?",["המטופל ממעיט בתיאור עוצמת הכאב","הדם נספג ברקמות הבטן ואינו מצטבר","דימום תוך-בטני נעצר לרוב באופן ספונטני","הבטן מכילה נפח גדול ללא שינוי חיצוני נראה"],3,"חלל הבטן מסוגל להכיל ליטרים של דם מבלי שיהיה שינוי חיצוני בולט, ומכיוון שהדימום פנימי הוא אינו נראה לעין. בנוסף, סימני גירוי צפקי מתפתחים לאט וייתכן שהמטופל לא ידווח על כאב בשל חבלה מסיחה או שיכרות. לכן ההסתמכות היא על מנגנון הפגיעה ועל סימני ההלם ולא על מראה הבטן."],["בטן ואגן","מהו מנגנון הפגיעה האופייני לשבר אגן מסוג Open Book?",["סיבוב חד של הגו ביחס לאגן המקובע","דחיסה קדמית-אחורית שפותחת את טבעת האגן","נפילה על הישבן עם העברת כוח צירי","פגיעה צדית עם דחיסה של כנף הכסל"],1,"בדחיסה קדמית-אחורית — למשל בפגיעת אופנוע חזיתית או בפגיעת הולך רגל — טבעת האגן נפתחת כמו ספר, הסימפיזה מתרחקת ונפח החלל האגני גדל משמעותית. כתוצאה מכך המקלעת הוורידית נקרעת והדם ממלא נפח גדול. זהו סוג השבר שבו חגורת אגן היא היעילה ביותר, מפני שהיא סוגרת את הטבעת פיזית."],["בטן ואגן","מדוע נשים בהיריון בטרימסטר שלישי נמצאות בסיכון מוגבר בחבלה בטנית?",["דופן הבטן קשיחה יותר ומעבירה כוח פנימה","הרחם המוגדל מגן על איברי הבטן מפגיעה","הרחם חשוף לפגיעה ישירה ויש סיכון להיפרדות שליה","נפח הדם קטן יותר ולכן הפיצוי מוגבל"],2,"בטרימסטר השלישי הרחם עולה מעל האגן ומאבד את הגנת העצמות, ולכן הוא חשוף לפגיעה ישירה. הסיכון המרכזי הוא היפרדות שליה, שעלולה להתרחש גם בחבלה קלה יחסית ולגרום לאובדן דם מסיבי ולמות העובר. בנוסף הרחם דוחק את איברי הבטן ומשנה את מיקומם, ומפחית את הרזרבה הנשימתית."],["בטן ואגן","מהי התנוחה המומלצת לאישה בהיריון מתקדם לאחר טראומה?",["שכיבה שטוחה על הגב עם רגליים מורמות","ישיבה זקופה בזווית של 90 מעלות","הטיה של 15 עד 30 מעלות שמאלה או הזזת הרחם","שכיבה על הבטן להורדת לחץ מהווריד הנבוב"],2,"בשכיבה על הגב הרחם המוגדל לוחץ על הווריד הנבוב התחתון, מפחית את ההחזר הוורידי וגורם לתת לחץ דם — תסמונת הווריד הנבוב. הטיה שמאלה או הזזה ידנית של הרחם שמאלה משחררת את הלחץ ומשפרת מיידית את תפוקת הלב. אם נדרש קיבוע ללוח גב, מטים את כל הלוח כיחידה אחת."],["בטן ואגן","מהי המשמעות של גירוי צפקי (Peritoneal Irritation)?",["דלקת הצפק מדם או מתוכן מעי — רגישות ושמירה","הצטברות גזים בלולאות המעי עם התנפחות","התכווצות רצונית של שרירי הבטן מכאב שטחי","עצירות ממושכת עם הצטברות תוכן במעי הגס"],0,"גירוי צפקי מופיע כאשר דם, תוכן מעי או מרה מגיעים לחלל הצפק וגורמים לדלקת. הביטויים הם כאב, רגישות מקומית או מפושטת, שמירה רצונית ואי-רצונית של שרירי הבטן, ורגישות ריבאונד. זהו ממצא משמעותי שמחייב פינוי דחוף, אך היעדרו אינו שולל פגיעה — במיוחד בפגיעה רטרו-פריטונאלית או בשעות הראשונות."],["בטן ואגן","פצוע עם שבר אגן ותת לחץ דם שאינו מגיב לנוזלים. מה העדיפות?",["הגדלת קצב מתן הנוזלים עד לייצוב הלחץ","המתנה בזירה לייצוב המדדים לפני הפינוי","קיבוע האגן ופינוי מהיר ביותר למרכז טראומה","ביצוע בדיקת אגן חוזרת לאישור האבחנה"],2,"דימום משבר אגן אינו נעצר בשטח — הטיפול המכריע הוא אמבוליזציה אנגיוגרפית או ניתוח. לכן העדיפות היא קיבוע האגן שמצמצם את הנפח הפנימי, ופינוי דחוף ביותר. המתנה לייצוב היא שגיאה קטלנית, בדיקה חוזרת מחמירה את הדימום, והעמסת נוזלים ללא שליטה על המקור שוטפת קרישים."],["בטן ואגן","מהו האיבר הבטני הרגיש ביותר לפגיעה בחבלה קהה בילדים?",["הכבד והטחול, בשל דופן דקה וכלוב צלעות גמיש","הלבלב בשל מיקומו העמוק בקו האמצע","שלפוחית השתן בשל מיקומה הגבוה באגן","הכליות בשל מיקומן הרטרו-פריטונאלי"],0,"אצל ילדים דופן הבטן דקה, שכבת השומן דלה, וכלוב הצלעות גמיש ומעביר כוחות פנימה במקום להישבר. כתוצאה מכך הכבד והטחול חשופים במיוחד ונפגעים בקלות רבה יותר מאשר במבוגר, ולעיתים ללא כל שבר בצלעות. בנוסף, איברי הבטן של הילד גדולים יחסית לגודל גופו."],["בטן ואגן","מטופל עם חבלה בבטן שמאלית עליונה ושבר בצלעות 10-11 משמאל. מה החשד?",["קרע בסרעפת בלבד","פגיעה בכבד","פגיעה בשלפוחית השתן","קרע בטחול"],3,"הטחול ממוקם מתחת לצלעות 9 עד 11 בצד שמאל, ולכן שבר בצלעות אלה בצד שמאל הוא סמן ישיר לחשד לקרע בטחול. הטחול עשיר מאוד בכלי דם והדימום ממנו עלול להיות מסיבי ופתאומי — לעיתים לאחר תקופת יציבות מדומה כשההמטומה התת-קופסיתית נקרעת. יש לעקוב גם אחר סימן קר בכתף שמאל."],["בטן ואגן","מהו הטיפול הראשוני בפצוע עם חשד לדימום תוך-בטני?",["ביצוע בדיקות מעמיקות ומדויקות בזירה","הנחת חגורת אגן בכל פצוע עם כאב בטני","מתן משככי כאבים להקלה לפני הפינוי","חמצן, שמירת חום, נוזלים מבוקרים ופינוי מהיר"],3,"אין טיפול בשטח שעוצר דימום תוך-בטני, ולכן כל ההתערבות מכוונת לתמיכה ולקיצור הזמן עד לחדר הניתוח: חמצון, מניעת היפותרמיה, מתן נוזלים מבוקר לפי גישת ההיפוטנסיה המותרת, ופינוי דחוף. בדיקות מעמיקות בשטח מבזבזות זמן קריטי, וחגורת אגן שמורה לחשד לשבר אגן."],["בטן ואגן","מדוע פגיעה בכליה עלולה שלא לגרום לסימני גירוי צפקי?",["הכליה מוגנת לחלוטין על ידי הצלעות והשרירים","הכליה אינה מדממת בכמות משמעותית","הכאב מהכליה מוקרן לכתף ולא לדופן הבטן","הכליה מאחורי הצפק והדם נאגר רטרו-פריטונאלית"],3,"הכליות שוכנות מאחורי הצפק, ולכן דימום מהן נאגר בחלל הרטרו-פריטונאלי מבלי לגעת בקרום הצפק ולגרות אותו. התוצאה היא בטן רכה ולא כואבת יחסית למרות דימום משמעותי. הסימנים המחשידים הם המטוריה, כאב במותן וחבורה בגב או במותן — סימן גריי-טרנר. זה מדגים מדוע בדיקת בטן תקינה אינה מרגיעה."],["בטן ואגן","מהי המשמעות של המטוריה (דם בשתן) לאחר טראומה?",["סימן לפגיעה אפשרית בכליה, בשופכן או בשלפוחית","סימן לזיהום בדרכי השתן שקדם לחבלה","ממצא שכיח וחסר משמעות לאחר חבלה","סימן לפגיעה בכבד עם דלף מרה לשתן"],0,"דם בשתן לאחר חבלה מעיד על פגיעה כלשהי במערכת השתן, ומחייב הערכה. חשוב לדעת שאין קשר ישיר בין כמות הדם לחומרת הפגיעה — פגיעות קשות מאוד, כולל ניתוק של עורק הכליה, עלולות להתבטא ללא המטוריה כלל. לכן מנגנון הפגיעה והמצב ההמודינמי חשובים יותר מהממצא עצמו."],["הדף ואר״ן","מהן חמש הקטגוריות של פגיעות הדף?",["פנימית, חיצונית, משולבת, כימית ותרמית","ראשונית, שניונית, שלישונית, רביעונית, חמישונית","קלה, בינונית, קשה, קריטית וקטלנית","ישירה, עקיפה, משנית, נלווית ומאוחרת"],1,"הסיווג המקובל הוא לחמש קטגוריות: ראשונית — מגל ההדף עצמו, שניונית — מרסיסים, שלישונית — מהעפת הגוף או מקריסת מבנה, רביעונית — כוויות, שאיפת גזים והחמרת מחלות רקע, וחמישונית — מתוספים מיוחדים כמו חומר רדיואקטיבי או חיידקים בפצצה מלוכלכת. הסיווג מנחה את החיפוש אחר פגיעות."],["הדף ואר״ן","אילו איברים פגיעים במיוחד בפגיעת הדף ראשונית?",["שרירים גדולים ורקמת חיבור עמוקה","איברים מלאי אוויר — אוזן תיכונה, ריאות ומעי","עצמות ארוכות ומפרקים גדולים","העור והרקמה התת-עורית בכל הגוף"],1,"גל ההדף גורם לנזק בממשקים שבין רקמות בעלות צפיפות שונה, ולכן איברים מלאי אוויר נפגעים במיוחד. עור התוף הוא הרגיש ביותר ונקרע בלחצים נמוכים יחסית, הריאה מפתחת Blast Lung עם דימום ובצקת, והמעי עלול להיקרע. איברים מוצקים ועצמות עמידים בהרבה לגל ההדף עצמו."],["הדף ואר״ן","מהו Blast Lung ומהם ביטוייו?",["דימום ובצקת ברקמת הריאה — כיח מדמם והיפוקסיה","דלקת ריאות זיהומית המתפתחת לאחר הפיצוץ","תמט ריאה מלא כתוצאה מחזה אוויר בלחץ","חסימת סימפונות מגוף זר שנשאף בעת הפיצוץ"],0,"Blast Lung הוא הפגיעה הקטלנית ביותר בין הניצולים מפיצוץ. גל ההדף קורע את המחיצות האלוואולריות והנימים, ונוצרים דימום ובצקת שפוגעים בחילוף הגזים. הביטויים הם קוצר נשימה, כיח מדמם, היפוקסיה ולעיתים חזה אוויר. הסכנה המיוחדת היא שההחמרה עלולה להופיע שעות לאחר האירוע, ולכן נדרש ניטור ממושך."],["הדף ואר״ן","מהו הסיכון המיוחד בהנשמה בלחץ חיובי בנפגע Blast Lung?",["הפחתת רמת החמצן בדם בשל דילול האוויר","סיכון לתסחיף אוויר עורקי ולחזה אוויר בלחץ","ירידה בלחץ הדם בשל עלייה בלחץ התוך-חזי","עלייה בטמפרטורת הגוף ובקצב המטבוליזם"],1,"רקמת הריאה הפגועה מכילה קרעים בין האלוואולות לכלי הדם, ולחץ חיובי דוחף אוויר דרכם ישירות למחזור הדם העורקי — תסחיף אוויר שעלול לגרום לשבץ או לדום לב. בנוסף הלחץ עלול ליצור חזה אוויר בלחץ. לכן מנשימים בלחצים נמוכים ככל האפשר ובזהירות רבה, ומנטרים בערנות."],["הדף ואר״ן","מהי הגדרת אר״ן?",["כל אירוע שבו יותר מחמישה נפגעים בזירה","אירוע עם נפגע אחד קשה הדורש משאבים רבים","אירוע שבו האמצעים אינם מספיקים לטיפול לאורך זמן","כל אירוע טרור ללא קשר למספר הנפגעים"],2,"אר״ן — אירוע רב נפגעים — מוגדר כמצב שבו כמות הנפגעים וחומרת פציעתם עולות על יכולות הטיפול והפינוי בשגרה, כך שהאמצעים בזירה אינם מספיקים לאורך זמן. ההגדרה יחסית ולא מספרית — אירוע עם שלושה נפגעים קשים באזור מרוחק עם אמבולנס אחד הוא אר״ן, בעוד עשרה נפגעים קלים במרכז העיר אינם."],["הדף ואר״ן","מהי אר״ן מקטגוריה ראשונה?",["אירוע שבו לא נגרמו נפגעים כלל בזירה","אירוע הנמשך ימים ודורש סיוע בין-לאומי","אירוע שבו כל הנפגעים סווגו כלא דחופים","אירוע שמסתיים תוך שעתיים מהגעת המטפל הראשון"],3,"אר״ן מקטגוריה ראשונה הוא אירוע שכל המטופלים בו מפונים תוך שעתיים מהגעת המטפל הראשון, והמערכת מסוגלת לתת מענה ברמה האזורית או בסיוע בין-אזורי. דוגמאות הן תאונות דרכים מרובות נפגעים ואירועי טרור. אר״ן מקטגוריה שנייה נמשך שעות או ימים ודורש סיוע בין-ארגוני ובין-לאומי, כמו רעידת אדמה או קריסת מבנה."],["הדף ואר״ן","מהו תפקידו של פיקוד 10?",["איש הצוות הבכיר באמבולנס הראשון, מנהל האירוע","האחראי על הפינוי מול כלל הארגונים בזירה","האחראי על סדר החניון ועל צירי הפינוי","האחראי על קדימויות הטיפול באתר הטיפול"],0,"פיקוד 10 הוא בעל התפקיד הבכיר בזירה — הפרמדיק הראשון או איש הצוות הבכיר באמבולנס הראשון. הוא מכריז על עצמו כפיקוד 10, פותח קו פתוח למוקד המפעיל, מחלק את הזירה לגזרות, ממנה אחראי לכל גזרה, ודורש או מבטל כוחות. קדימויות הטיפול הן באחריות רפואה 10, החניון באחריות חניון 10 והפינוי באחריות פינוי 10."],["הדף ואר״ן","מהי שיטת הטריאז׳ START ומה נבדק בה?",["מדידת לחץ דם וסטורציה לכל נפגע בזירה","הליכה, נשימה, פרפוזיה ומצב קוגניטיבי","חישוב GCS מלא ומתועד עבור כל נפגע","בדיקה גופנית מלאה ומסודרת של כל נפגע"],1,"START היא ראשי תיבות של Simple Triage And Rapid Treatment. היא בודקת ארבעה פרמטרים בלבד ובמהירות: האם הנפגע מתהלך, האם הוא נושם, מהו מצב הפרפוזיה, ומהו המצב הקוגניטיבי. המטרה היא מיון מהיר ולא אבחון. חשוב לזכור שנפגע מתהלך אינו בהכרח נפגע לא דחוף — יש לחזור ולהעריך אותו בסבב המשלים."],["הדף ואר״ן","מהם צבעי תגי המיון וכיצד הם מדורגים?",["אדום דחוף, ירוק קל, כחול אנוש, לבן נפטר","אדום דחוף, צהוב דחוף יציב, כחול אנוש, שחור נפטר","אדום דחוף ושחור נפטר בלבד, ללא דירוג ביניים","סגול דחוף, כתום יציב, ורוד קל, אפור נפטר"],1,"בסבב המשלים קובע הפרמדיק קדימויות פינוי בין הנפגעים הדחופים: אדום לדחוף, צהוב לדחוף יציב, כחול לאנוש — נפגע שסיכויי הישרדותו נמוכים והמשאבים הנדרשים לו אינם פרופורציונליים, ושחור לנפטר. חלל ודאי יסומן בשחור ויישאר במקום שבו נמצא. קביעת מוות מתבצעת על ידי פרמדיק או רופא בלבד."],["הדף ואר״ן","מהו העיקרון המנחה בטיפול באר״ן?",["מינימום טיפול הכרחי למקסימום נפגעים ברי הצלה","הצלת הנפגע הקשה ביותר בכל מחיר ומשאב","טיפול מלא בכל נפגע לפי סדר ההגעה לזירה","פינוי מהיר של כל הנפגעים לבית החולים הקרוב"],0,"באר״ן משתנה סדר העדיפויות מהטוב ביותר לפרט לטוב ביותר לרבים. המשמעות היא מתן מינימום טיפול הכרחי למקסימום נפגעים, והתמקדות בנפגעים ברי הצלה. השקעת כל המשאבים בנפגע אחד אנוש עלולה לעלות בחייהם של מספר נפגעים ברי הצלה. עיקרון נוסף חשוב: אין להעביר את האר״ן לבית החולים הקרוב — יש לפזר את הנפגעים."],["הדף ואר״ן","מדוע אין לפנות את כל נפגעי האר״ן לבית החולים הקרוב?",["כדי לא להעביר את מצב האר״ן לבית החולים","כדי לקצר את זמן הפינוי הכולל של האירוע","בשל עלות הפינוי והעומס על מערך האמבולנסים","בשל מרחק הנסיעה וזמן הפינוי הארוך"],0,"הצפת בית חולים אחד בכל הנפגעים יוצרת בו את אותו חוסר איזון בין צרכים ליכולות — כלומר מעבירה את האר״ן לבית החולים ופוגעת בטיפול. לכן המוקד קובע יעדי פינוי ומווסת את הנפגעים בין מספר בתי חולים, בהתחשב ביכולת הקליטה, ביכולות המיוחדות של כל מוסד ובמרחק. ההחלטה אינה של הצוות בזירה."],["הדף ואר״ן","מהו המרחק הבטוח להחניית רכבי הצלה מזירת פיצוץ?",["כ-5 מטר ממוקד הזירה","כ-200 מטר ממוקד הזירה","כ-10 מטר ממוקד הזירה","כ-50 מטר ממוקד הזירה"],3,"בזירת פיצוץ מחנים את רכבי ההצלה במרחק של כ-50 מטר ממוקד הזירה, בשל הסיכון למטען משני שנועד לפגוע בכוחות ההצלה. איש הצוות יורד מהרכב רק כשהוא ממוגן באפוד מגן ובקסדה. מפקד מד״א מתחבר לחבלן שבזירה כדי לתאם אתר לריכוז נפגעים ולעדכן על חפצים חשודים."],["הדף ואר״ן","מהי הפעולה הדחופה ביותר בזירת פיצוץ?",["החדרת עירוי לכל נפגע","קיבוע כל נפגע ללוח גב","הרחקת הנפגעים מהזירה","ביצוע סקר שניוני מלא"],2,"בזירת פיצוץ הסכנה למטען משני, לקריסת מבנה ולשריפה גוברת על כל שיקול טיפולי. לכן הפעולה הדחופה ביותר היא הרחקת הנפגעים לאזור מוגן, ובזירה עצמה מבצעים רק פעולות מצילות חיים דחופות. כל שאר הטיפול נעשה באתר הטיפול או בעת הפינוי. אין להעביר חפצי נפגעים חשודים או אמצעי לחימה מהזירה."],["הדף ואר״ן","מהם הדגשים המיוחדים לטריאז׳ בילדים?",["הקריטריונים בילדים זהים לחלוטין למבוגרים","ילדים מתויגים כדחופים בכל מקרה ובכל גיל","נשימה תקינה 15 עד 45, ופקיחת עיניים לכאב — דחוף","ילדים אינם עוברים טריאז׳ אלא מפונים ראשונים"],2,"טווח הנשימה התקין בילד רחב יותר — 15 עד 45 בדקה — ולכן שימוש בקריטריון המבוגר יגרום לתיוג שגוי. הערכת ההכרה נעשית לפי AVPU: ילד שפוקח עיניים רק לכאב או אינו פוקח כלל מתויג כדחוף. בנוסף, ילד שאינו נושם לאחר פתיחת נתיב אוויר — יש לבדוק דופק לפני קביעה שאינו בר הצלה, ואם יש דופק לבצע חמש הנשמות רצופות."],["הדף ואר״ן","מהו תפקידו של חניון 10?",["קשר רציף עם בתי החולים הקולטים והמוקד","ניהול הטיפול הרפואי ואתר הטיפול בנפגעים","שמירה על סדר החניון ועל צירי פינוי פנויים","ביצוע הטריאז׳ הראשוני של כלל הנפגעים"],2,"חניון 10 אחראי על ארגון אזור חניית האמבולנסים ועל שמירת צירי הכניסה והיציאה פנויים, כדי שרכבי הפינוי יוכלו להיכנס ולצאת ללא עיכוב. תפקיד זה קריטי — חסימת צירים היא אחת התקלות השכיחות באר״ן והיא מעכבת פינוי של נפגעים דחופים. הטיפול הרפואי הוא באחריות רפואה 10 והקשר עם בתי החולים באחריות המוקד ופינוי 10."],["הדף ואר״ן","מתי מוקם אתר טיפול באר״ן?",["אתר טיפול אינו מוקם עוד לפי ההנחיות העדכניות","באירוע מתמשך עם חילוץ ארוך או צורך לצבור כוחות","בכל אירוע שבו יותר משני נפגעים בזירה","באירועי טרור ופיגועים רב נפגעים בלבד"],1,"אתר טיפול מוקם באירוע מתמשך — אר״ן דרגה 2, מגה אר״ן או פיגוע טרור רב נפגעים — כאשר צפוי חילוץ ארוך, כשיש צורך לצבור כוחות, או כשנדרשת שליטה וויסות של מטופלים. הוא אינו מוקם בכל אירוע רב נפגעים: כשהפינוי מהיר ופשוט, עדיף לפנות ישירות ולא ליצור תחנת ביניים שמעכבת."],["הדף ואר״ן","מהן סיבות המוות באר״ן בדקות הראשונות?",["אי ספיקת כליות חדה מתסמונת מעיכה","זיהום מפצעים פתוחים וכשל רב מערכתי","קרישיות יתר עם תסחיפים מרובים","דימום, חסימת נתיב אוויר והיפוקסיה"],3,"בדקות הראשונות סיבות המוות ברות ההצלה הן דימום, חסימת נתיב אוויר והיפוקסיה — בדיוק אלה שהצוות בשטח יכול לטפל בהן. במקביל יש סיבות שאינן ברות הצלה כמו נזק מוחי נרחב או קרע בכלי דם גדול. בשעות הראשונות התמותה נובעת מהיפוקסיה ממושכת, מהלם ומכשל נשימתי, ובימים ובשבועות מזיהום ומכשל רב מערכתי."],["הדף ואר״ן","אילו פעולות מותרות בסבב הראשוני בזירת אר״ן צבאי?",["קיבוע כל השברים והנחת חוסמי עורקים","כל הפעולות הרפואיות הנדרשות לכל נפגע","ניקור חזה בפצוע מתאים ופתיחת נתיב אוויר","החדרת עירוי ומתן נוזלים לכל נפגע דחוף"],2,"עד לסיום הטריאז׳ אין מבצעים טיפולים בפצועים, למעט שתי פעולות מצילות חיים: ניקור בית החזה בצד הפגוע בפצוע ללא דופק רדיאלי או עם דופק קרוטידי מעל 130 בנוכחות פגיעת חזה, ופתיחת נתיב אוויר עם החדרת מנתב והטיה על הצד בפצוע מחוסר הכרה. כל פעולה נוספת מעכבת את הטריאז׳ ופוגעת בשאר הנפגעים."],["הדף ואר״ן","מהו תג המיון והאם הוא מעכב טיפול?",["תחליף מלא לדוח החולה בכל מקרה ובכל אירוע","טופס הנדרש עבור נפגעים דחופים וקשים בלבד","מסמך רשמי שיש למלא לפני תחילת כל טיפול","טופס לרישום פרטים ופעולות — אינו מעכב טיפול"],3,"תג המיון משמש לרישום פרטי הנפגע ולתיעוד הפעולות שבוצעו, אך הכלל ברור: הרישום אינו מעכב טיפול או פינוי. ניתן להשלים אותו על גבי הטופס במהלך הפינוי. אם לא בוצע תיוג והצוות אינו נדרש לחזור לזירה, ממלאים דוח חולה או נפגע כמו בשגרה."],["הדף ואר״ן","מהו הדיווח הראשון שעל צוות ראשון בזירה להעביר?",["תיאור קליני מפורט של כל אחד מהנפגעים","דיווח מקדים: אופי האירוע, צפי נפגעים, סכנות ודרכי הגעה","בקשה לפינוי מיידי ולשיגור אמבולנסים נוספים","רשימת שמות ופרטים מזהים של כלל הנפגעים"],1,"הצוות הראשון מעביר דיווח מקדים המכיל את האינפורמציה הרלוונטית עוד לפני ירידתו מהרכב: אופי האירוע, הערכת מספר הנפגעים, סכנות בזירה, הצורך במיגון, ודרכי הגעה וחניית אמבולנסים. דיווח מוקדם ומדויק מאפשר למוקד לשגר כוחות מתאימים ולהכין בתי חולים. פרטי נפגעים מגיעים בשלב מאוחר בהרבה."],["הדף ואר״ן","מהו ההבדל בין אר״ן סטטי לאר״ן מתגלגל?",["מתגלגל מתייחס לאירועי טבע ולרעידות אדמה בלבד","אין הבדל מהותי בין שני סוגי האירועים","סטטי מתייחס לתאונות דרכים ולאירועי דחק בלבד","בסטטי האירוע הסתיים; במתגלגל נפגעים מתווספים"],3,"באר״ן סטטי — למשל לאחר פיצוץ שהסתיים — מספר הנפגעים ידוע וסופי, ולכן ניתן לתכנן את המשאבים בהתאם. באר״ן מתגלגל האירוע ממשיך תוך כדי הטיפול, כמו ירי מתמשך או קריסה הדרגתית, ונפגעים חדשים מתווספים או עלולים להתווסף. במצב כזה נדרשת שמירה על רזרבת כוחות ועל בטיחות מוגברת, והזירה נותרת מסוכנת."],["הדף ואר״ן","גל הדף פוגע בנפגע שהועף אל קיר. באיזו קטגוריית פגיעה מדובר?",["רביעונית","שלישונית","שניונית","ראשונית"],1,"פגיעת הדף שלישונית נגרמת כאשר גל ההדף מעיף את הגוף אל משטח או עצם, או כאשר עצמים גדולים ומבנים קורסים על הנפגע. הפגיעות האופייניות הן חבלות קהות, שברים, פגיעות ראש ותסמונת מעיכה. פגיעה ראשונית היא מגל ההדף עצמו, שניונית מרסיסים מעופפים, ורביעונית מכוויות, שאיפת גזים והחמרת מחלות רקע."],["הדף ואר״ן","נפגע פיצוץ עם כוויות נשימתיות משאיפת גזים חמים. באיזו קטגוריה?",["רביעונית","שלישונית","שניונית","ראשונית"],0,"פגיעת הדף רביעונית כוללת את כל שאר הפגיעות הקשורות לפיצוץ שאינן נובעות מגל ההדף, מרסיסים או מהעפה: כוויות, שאיפת גזים רעילים וחומרים חמים, פגיעות קרינה, זיהום סביבתי והחמרה של מחלות רקע כמו אסטמה או מחלת לב. קטגוריה זו רחבה ולעיתים נשכחת בהערכה הראשונית."],["הדף ואר״ן","מהי החשיבות של קרע בעור התוף בנפגע פיצוץ?",["הוא מעיד תמיד על פגיעה ריאתית קשה נלווית","הוא מעיד על חשיפה לגל הדף ומחייב חיפוש פגיעות","הוא שולל פגיעת הדף ראשונית באיברים אחרים","הוא ממצא מקומי חסר משמעות מערכתית"],1,"עור התוף הוא האיבר הרגיש ביותר לגל הדף ולכן הוא סמן לחשיפה משמעותית — ממצא שמחייב חיפוש אקטיבי אחר Blast Lung ופגיעות מעי. עם זאת חשוב לדעת שהוא אינו מנבא אמין: היעדר קרע אינו שולל פגיעה ריאתית, ונוכחותו אינה מבטיחה אותה. לכן הוא נחשב רמז ולא כלי סינון."],["הדף ואר״ן","מהי הפעולה הנדרשת בסיום אירוע אר״ן?",["דיווח על הנפגע האחרון, שחרור כוחות, סריקות וכשירות","העברת כל הציוד שנעשה בו שימוש לבית החולים","המתנה בזירה עד לסיום חקירת המשטרה","פיזור מיידי של כלל הכוחות מהזירה"],0,"בסיום האירוע מדווח פיקוד 10 למוקד המפעיל שהנפגע האחרון פונה, משחרר כוחות שאינם נחוצים, מוודא סריקות לאיתור ציוד ואנשי צוות, ומחזיר את הכוחות לכשירות. בנוסף מועברים נתונים וסיכומים למוקד, ובהמשך מתבצע תחקיר. הטיפול בחללים ובקביעת מוות מתואם מול משטרת ישראל."],["הדף ואר״ן","מהי תסמונת המעיכה (Crush Syndrome) ומדוע היא רלוונטית בקריסת מבנה?",["פגיעה בעור וברקמה התת-עורית מלחץ ממושך","שחרור אשלגן ומיוגלובין — הפרעות קצב ואי ספיקת כליות","זיהום חיידקי של הרקמות המעוכות והנמקיות","דימום חיצוני מסיבי עם שחרור הלחץ מהגפה"],1,"בקריסת מבנה נפגעים לכודים תחת משקל כבד לשעות. השריר נמק ומצטברים בו אשלגן, מיוגלובין וחומצות. ברגע שחרור הלחץ הם נשטפים לזרם הדם ועלולים לגרום להפרעות קצב קטלניות ולאי ספיקת כליות חדה. לכן עירוי נוזלים אגרסיבי ניתן לפני שחרור הלחץ, וההיערכות כוללת ניטור אק״ג צמוד."],["הדף ואר״ן","מהו סבב משלים באר״ן ומי מבצע אותו?",["קביעת קדימויות פינוי בידי פרמדיק והשלמת טיפול ותיעוד","חזרה לזירה לאיתור ציוד ואנשי צוות חסרים","סריקת הזירה לאיתור חפצים חשודים ומטענים משניים","בדיקה חוזרת של הנפגעים הקלים בידי מתנדבים"],0,"לאחר הסבב הראשוני שממיין דחוף מול לא דחוף, מבצע הפרמדיק סבב משלים שבו הוא מדרג את הדחופים לפי קדימויות פינוי — דחוף יציב, אנוש ונפטר — ומשלים את הטיפול הרפואי ואת התיעוד. בשלב זה משלימים סכמת טיפול, מחליטים על סיוע נשימתי ומבצעים התערבויות שאינן מעכבות פינוי."],["הדף ואר״ן","מדוע נפגע מתהלך אינו בהכרח נפגע לא דחוף?",["הוא עלול לסבול מפגיעה פנימית שתתבטא מאוחר יותר","הוא עלול לעזוב את הזירה לפני שיוערך","נפגע מתהלך מוגדר תמיד כלא דחוף בכל שיטה","הוא מפריע לעבודת הצוותים ולתנועה בזירה"],0,"היכולת להתהלך שוללת פגיעה קשה בגפיים התחתונות ומעידה על פרפוזיה מוחית סבירה, אך אינה שוללת פגיעות פנימיות. נפגע פיצוץ עלול לפתח Blast Lung שעות לאחר האירוע, ופצוע עם דימום תוך-בטני עשוי להיות מפוצה בשלב מוקדם. לכן כל המתהלכים מרוכזים באזור נפרד ועוברים הערכה חוזרת מסודרת."],["כוויות","מהי כווית דרגה ראשונה וכיצד היא נראית?",["פגיעה בדרמיס עם שלפוחיות ורגישות רבה","פגיעה באפידרמיס — אודם וכאב ללא שלפוחיות","פגיעה בשריר ובעצם עם פחמון של הרקמה","פגיעה בכל שכבות העור — עור לבן ויבש ללא כאב"],1,"כווית דרגה ראשונה מוגבלת לאפידרמיס ומתבטאת באודם, בכאב וברגישות ללא שלפוחיות — כמו כוויית שמש קלאסית. היא מחלימה תוך ימים ללא צלקת. שלפוחיות מציינות דרגה שנייה, ועור לבן, יבש וחסר תחושה מציין דרגה שלישית. חשוב לדעת שכוויות דרגה ראשונה אינן נכללות בחישוב אחוזי שטח הכווייה."],["כוויות","מהם המאפיינים של כווית דרגה שלישית?",["שלפוחיות מרובות עם עור ורוד ולח מאוד","נפיחות מקומית בלבד ללא שינוי בצבע העור","אודם, כאב עז ורגישות ללא שלפוחיות","עור לבן, חרוך או דמוי עור, יבש וחסר תחושה"],3,"בכווייה מלאת עובי נהרסות כל שכבות העור כולל קצות העצבים, ולכן העור נראה לבן, חרוך או דמוי עור מעובד, יבש וקשה, וחסר תחושה. היעדר הכאב הוא סימן מטעה שעלול להביא להערכת חסר — הכווייה החמורה ביותר היא זו שאינה כואבת. סביבה של דרגה שנייה כואבת בדרך כלל מקיפה אותה."],["כוויות","מהו כלל התשיעיות (Rule of Nines) במבוגר?",["כל אזור בגוף 10 אחוז ופרינאום 10 אחוז","ראש 4.5 אחוז, גו 36 אחוז, כל גפה 9 אחוז","ראש 18 אחוז, גפה עליונה 9, גפה תחתונה 14","ראש 9 אחוז, גפה עליונה 9, גפה תחתונה 18, גו 18 ו-18"],3,"בכלל התשיעיות למבוגר: הראש והצוואר 9 אחוז, כל גפה עליונה 9 אחוז, כל גפה תחתונה 18 אחוז, גו קדמי 18 אחוז, גו אחורי 18 אחוז, והפרינאום אחוז אחד. בילדים החלוקה שונה — הראש מהווה 18 אחוז וכל רגל 14 אחוז, בשל הפרופורציות השונות. שיטה נוספת היא כף היד של המטופל שמייצגת כאחוז אחד."],["כוויות","ילד עם כוויות. במה שונה חישוב שטח הכווייה מהמבוגר?",["החישוב זהה למבוגר בכל טווחי הגיל","משתמשים באחוזים כפולים מאלו של המבוגר","הראש כ-18 אחוז וכל רגל כ-14 אחוז","הראש מהווה אחוז קטן יותר והרגליים גדול יותר"],2,"ראשו של ילד גדול יחסית לגופו ורגליו קצרות יחסית, ולכן החלוקה שונה: הראש כ-18 אחוז וכל רגל כ-14 אחוז. שימוש בכלל המבוגר בילד יגרום להערכת חסר של שטח הכווייה ולמתן נוזלים לא מספק. ככל שהילד קטן יותר כך ההבדל גדול יותר, ולכן קיימים גם תרשימי לונד-בראודר המדויקים לפי גיל."],["כוויות","מהו הטיפול הראשוני בכווייה תרמית בשטח?",["פתיחת השלפוחיות וניקוז הנוזל שבתוכן","הנחת קרח ישירות על אזור הכווייה לקירור","מריחת משחה מקומית וכיסוי בחבישה יבשה","הפסקת תהליך הכווייה, קירור מבוקר וכיסוי תוך שמירת חום"],3,"תחילה מפסיקים את תהליך הכווייה — הרחקה ממקור החום והסרת בגדים שאינם דבוקים ותכשיטים לפני שתופיע בצקת. לאחר מכן קירור מבוקר במים בטמפרטורת החדר לזמן קצר, וכיסוי בחבישה נקייה ויבשה. הסכנה המרכזית היא היפותרמיה — קירור נרחב וממושך מסוכן. אין למרוח משחות, לא לפתוח שלפוחיות ולא להניח קרח שגורם לנזק נוסף."],["כוויות","מהי הנוסחה לחישוב נוזלים בכוויות (Parkland)?",["10 מ״ל כפול אחוז שטח הכווייה לשעה","2 מ״ל כפול משקל כפול אחוז שטח הכווייה","1 ליטר לכל 10 אחוז שטח כווייה ביממה","4 מ״ל כפול משקל בק״ג כפול אחוז שטח, ל-24 שעות"],3,"נוסחת פארקלנד קובעת 4 מ״ל לכל ק״ג משקל גוף לכל אחוז שטח כווייה, במשך 24 השעות הראשונות. מחצית מהכמות ניתנת ב-8 השעות הראשונות מרגע הכווייה — לא מרגע תחילת הטיפול — והמחצית השנייה ב-16 השעות הבאות. חשוב לזכור שכוויות דרגה ראשונה אינן נכללות בחישוב."],["כוויות","מהם סימני כווית נתיב אוויר?",["פיח סביב האף והפה, שיער חרוך, צרידות וליחה מפויחת","כווייה מקיפה בזרוע עם בצקת מתפתחת","עור אדום ורגיש בגב ובגפיים העליונות","כאב עז בבטן העליונה עם רגישות במישוש"],0,"הסימנים המחשידים לפגיעה נשימתית הם כוויות בפנים ובצוואר, שיער אף ובגבות חרוכים, פיח סביב הנחיריים ובפה, צרידות או שינוי בקול, סטרידור, שיעול וליחה מפויחת, וכן היסטוריה של כווייה בחלל סגור. הסכנה היא בצקת מתקדמת שתחסום את נתיב האוויר תוך שעות, ולכן החשד מחייב פינוי דחוף ושקילת אינטובציה מוקדמת."],["כוויות","מהי הסכנה העיקרית בכווית נתיב אוויר?",["בצקת מתקדמת שתחסום את נתיב האוויר תוך שעות","ירידה בלחץ הדם בשל אובדן נוזלים מהריאות","זיהום מאוחר של דרכי הנשימה התחתונות","דימום מרקמת הריאה עם כיח מדמם"],0,"החום והרעלנים גורמים לבצקת ברקמות הרכות של הלוע והגרון, והיא מתפתחת בהדרגה ומגיעה לשיאה לאחר שעות. מטופל שנראה תקין בשעה הראשונה עלול להגיע לחסימה מוחלטת בהמשך, ואז האינטובציה קשה או בלתי אפשרית. לכן הגישה היא הבטחת נתיב אוויר מוקדמת בחשד גבוה, ולא המתנה להופעת סימני חסימה."],["כוויות","מהו הטיפול בכווייה כימית?",["כיסוי יבש וסטרילי ללא שטיפה כלל","מריחת שמן או משחה ליצירת שכבת הגנה","שטיפה ממושכת במים זורמים לאחר הסרת חומר יבש","ניטרול החומר באמצעות חומר בעל pH הפוך"],2,"בכווייה כימית מסירים תחילה חומר יבש או אבקתי במברשת — שטיפה של אבקה עלולה להפעיל אותה — ולאחר מכן שוטפים במים זורמים בכמות גדולה לאורך זמן. אין לנסות לנטרל חומצה בבסיס או להפך, מפני שהתגובה הכימית משחררת חום וגורמת לנזק תרמי נוסף. יש להגן על הצוות מפני חשיפה משנית."],["כוויות","מדוע כווית חשמל מסוכנת יותר ממה שנראה מבחוץ?",["הפגיעה שטחית בלבד ומוגבלת לנקודות המגע","הכאב העז מסווה את היקף הפגיעה האמיתי","כווית חשמל אינה מסוכנת יותר מכווייה תרמית","הזרם גורם לנזק עמוק לשריר, לעצב וללב עם פצעים קטנים"],3,"בכווית חשמל הנזק החיצוני מטעה — פצעי הכניסה והיציאה עשויים להיות קטנים, אך הזרם עובר דרך רקמות עמוקות ובעלות התנגדות גבוהה כמו שריר ועצם וגורם לנזק נרחב. הסיבוכים כוללים הפרעות קצב ודום לב, רבדומיוליזה עם אי ספיקת כליות, תסמונת מדור ושברים מהתכווצויות שרירים אלימות. לכן נדרש ניטור אק״ג ועירוי נוזלים."],["כוויות","מהי הסכנה בהיפותרמיה בנפגע כוויות?",["העור הפגוע אינו משמר חום והאובדן מהיר במיוחד","היפותרמיה מתונה משפרת את ריפוי הכווייה","היפותרמיה אינה מהווה סיכון בנפגעי כוויות","חום הגוף עולה תמיד בעקבות כווייה נרחבת"],0,"העור הוא איבר הבידוד של הגוף, וכשהוא נהרס בשטח נרחב אובד החום במהירות רבה. שטיפה ממושכת במים קרים — טעות נפוצה — מחמירה זאת מאוד ועלולה להביא להיפותרמיה מסכנת חיים, במיוחד בילדים שיחס שטח הפנים למסה שלהם גדול. לכן מקררים לזמן מוגבל בלבד ואז מכסים ומחממים."],["כוויות","מהי המשמעות של כווייה מקיפה (Circumferential) בגפה?",["היא כואבת פחות בשל פגיעה בקצות העצבים","היא יוצרת אפקט חוסם עם בצקת ופוגעת באספקת הדם","היא מחלימה מהר יותר בשל אספקת דם טובה","היא אינה מחייבת התייחסות מיוחדת בשטח"],1,"כווייה שמקיפה גפה במלואה יוצרת קליפה קשיחה ובלתי גמישה. כשמתפתחת בצקת מתחתיה נוצר לחץ שחוסם את זרימת הדם — למעשה חוסם עורקים טבעי. הסימנים הם חיוורון, קור, נימול והיעדר דופק דיסטלי. הטיפול הוא אסקרוטומיה — חיתוך של הקליפה. כווייה מקיפה בבית החזה מגבילה את האוורור ומחייבת התייחסות דחופה אף יותר."],["כוויות","מהם הקריטריונים לפינוי למרכז כוויות?",["כוויות בשטח העולה על 50 אחוז מהגוף בלבד","כוויות בפנים, בידיים, ברגליים, בפרינאום ובמפרקים","כל כווייה בדרגה ראשונה בשטח נרחב","כוויות בגב ובגו האחורי בכל שטח שהוא"],1,"הקריטריונים כוללים כוויות באזורים תפקודיים ואסתטיים — פנים, ידיים, רגליים, פרינאום ומפרקים גדולים, כוויות מקיפות, כוויות חשמל וכימיות, כוויות עם פגיעה נשימתית, כוויות בילדים ובקשישים, וכוויות נרחבות בשטח משמעותי. הסיבה היא שאזורים אלה דורשים טיפול מיוחד למניעת נכות תפקודית קבועה."],["כוויות","מהו הרעלת פחמן חד-חמצני וכיצד היא מתבטאת?",["קשירת CO להמוגלובין — סטורציה נראית תקינה ומטעה","ירידה חדה בערך הסטורציה הנמדד במד","עלייה בחום הגוף עם הזעה ורעד","שיעול דמי עם כיח מוקצף וורדרד"],0,"פחמן חד-חמצני נקשר להמוגלובין בזיקה גבוהה פי מאות מהחמצן ויוצר קרבוקסיהמוגלובין, כך שהדם אינו נושא חמצן למרות שהוא רווי. מד הסטורציה הרגיל אינו מבחין בין השניים ולכן מראה ערך תקין ומטעה. הביטויים הם כאב ראש, בחילה, סחרחורת, בלבול ואובדן הכרה. הטיפול הוא חמצן 100 אחוז שמקצר את זמן מחצית החיים של CO."],["כוויות","מהו הטיפול בכווית זפת חמה?",["קירור הזפת במקומה והשארתה עד לבית החולים","גירוד עדין של הזפת מעל פני העור","מריחת ממס אורגני להמסת הזפת בשטח","ניסיון להסיר את הזפת מיד עם ההגעה"],0,"הזפת החמה נדבקת לעור ומעבירה חום, ולכן מקררים אותה במים כדי לעצור את תהליך הכווייה. אין לנסות להסירה בשטח — משיכת הזפת קורעת את העור שמתחתיה ומחמירה משמעותית את הפגיעה. ההסרה נעשית בבית החולים בעזרת חומרים ייעודיים על בסיס שמן. ממסים אורגניים בשטח מסוכנים ורעילים."],["כוויות","מדוע כוויות בילדים חמורות יותר מאשר במבוגרים באותו שטח?",["הכווייה מחלימה לאט יותר בילדים מאשר במבוגרים","יחס שטח פנים למסה גדול יותר ועור דק יותר","ילדים חשים כאב עז יותר מאותה כווייה","ילדים אינם מגיבים למתן נוזלים כמו מבוגרים"],1,"יחס שטח הפנים למסת הגוף בילד גדול משמעותית, ולכן אותו אחוז כווייה גורם לאובדן נוזלים וחום גדול בהרבה יחסית למשקל. בנוסף עורו של הילד דק יותר, ולכן אותה חשיפה גורמת לכווייה עמוקה יותר. הרזרבה הפיזיולוגית קטנה יותר וההידרדרות מהירה. לכן הסף לפינוי למרכז כוויות בילדים נמוך יותר."],["כוויות","מהי הפעולה הראשונה בטיפול בנפגע שבגדיו בוערים?",["הרצה מהירה אל מקור המים הקרוב ביותר","עצירה, השכבה וגלגול לכיבוי האש","הסרת הבגדים הבוערים בעודם על הגוף","מריחת חומר מכבה ישירות על הבגדים"],1,"הכלל הוא Stop, Drop and Roll — עצור, שכב וגלגל. ריצה מגבירה את זרימת האוויר ומלבה את האש. לאחר הכיבוי מסירים בגדים שאינם דבוקים לעור — בגדים שנצמדו אינם מוסרים בשטח כדי לא לקרוע את העור. חשוב גם להסיר תכשיטים לפני שתתפתח בצקת."],["כוויות","מדוע אין לפתוח שלפוחיות בכווייה?",["פתיחתן מפחיתה את הכאב ואת הלחץ המקומי","השלפוחיות מהוות מחסום סטרילי טבעי מפני זיהום","פתיחתן מאיצה את תהליך הריפוי של העור","השלפוחיות מכילות מוגלה ותוכן מזוהם"],1,"השלפוחית הבלתי פגועה מהווה מחסום ביולוגי סטרילי שמגן על הרקמה החשופה מפני חיידקים ומפחית אובדן נוזלים. פתיחתה יוצרת פתח לזיהום ומגבירה כאב. הנוזל בתוכה הוא פלזמה ולא מוגלה. אם השלפוחית נקרעה מעצמה, מטפלים בפצע פתוח ומכסים בחבישה סטרילית."],["כוויות","מהי הסכנה בכוויות נשימתיות בחלל סגור מעבר לחום?",["זיהום חיידקי מיידי של דרכי הנשימה","שאיפת פחמן חד-חמצני, ציאניד וגזים רעילים","אין סכנה נוספת מעבר לחום ולעשן","חשיפה לקרינה מייננת מחומרים שנשרפו"],1,"בשריפה בחלל סגור נשרפים חומרים סינתטיים שמשחררים גזים רעילים. פחמן חד-חמצני חוסם את נשיאת החמצן, וציאניד — שמשתחרר משריפת פוליאוריתן ופלסטיק — משתק את הנשימה התאית ברמת המיטוכונדריה. מטופל עם ירידה בהכרה, חמצת קשה וסימנים חיוניים שאינם מתיישבים עם הכווייה בלבד מחשיד להרעלה משולבת."],["כוויות","מטופל עם כוויות ב-30 אחוז משטח הגוף. מה העדיפות הטיפולית הראשונה?",["חישוב מדויק של שטח הכווייה לפי כלל התשיעיות","מריחת משחות ייעודיות על אזורי הכווייה","הערכת נתיב אוויר ונשימה, ואז נוזלים ושמירת חום","חבישת הכוויות בגזה סטרילית ויבשה"],2,"למרות שהכווייה בולטת לעין, סדר העדיפויות אינו משתנה: נתיב אוויר ונשימה קודמים לכול, במיוחד כשקיים חשד לפגיעה נשימתית. לאחר מכן מתן נוזלים לפי הצורך ושמירה על חום הגוף, וחבישה נקייה. חישוב שטח מדויק חשוב אך אינו קודם לטיפול, וניתן לבצעו במקביל או במהלך הפינוי."],["כוויות","מהו ההבדל בין כווית דרגה שנייה שטחית לעמוקה?",["הכווייה העמוקה מחלימה מהר יותר וללא צלקת","הכווייה השטחית אינה כואבת כלל בשל פגיעה עצבית","שטחית — ורודה, לחה וכואבת; עמוקה — לבנבנה ויבשה","אין הבדל קליני הניתן לזיהוי בשטח"],2,"בכווית דרגה שנייה שטחית נפגע החלק העליון של הדרמיס — העור ורוד, לח, עם שלפוחיות, מלבין בלחיצה וכואב מאוד, והוא מחלים תוך כשבועיים ללא צלקת משמעותית. בכווייה עמוקה נפגע הדרמיס העמוק — העור לבנבן או מנומר, יבש יותר, מלבין פחות בלחיצה והתחושה מופחתת בשל פגיעה בקצות העצבים. היא מחלימה לאט ולעיתים דורשת השתלה."],["כוויות","מה יש לעשות עם תכשיטים ובגדים בנפגע כוויות?",["לחתוך את העור סביבם כדי לשחרר את הלחץ","להסירם מוקדם ככל האפשר, למעט בגדים דבוקים","להסירם רק לאחר מתן משככי כאבים בבית החולים","להשאירם במקומם עד להערכה בבית החולים"],1,"בצקת מתפתחת במהירות בשעות הראשונות, וטבעות, שעונים ובגדים צמודים הופכים לחוסמי דם ומסכנים את הגפה. לכן מסירים אותם מוקדם ככל האפשר. יוצא הדופן הוא בגד שנצמד לעור הכווי — משיכתו תקרע את העור, ולכן חותכים סביבו ומשאירים את החלק הדבוק במקום."],["כוויות","מהו הסיכון הזיהומי העיקרי בנפגע כוויות?",["זיהום עולה בדרכי השתן מקטטר קבוע","אובדן מחסום העור וחשיפה לזיהום ולספסיס","דלקת ריאות משאיפת עשן וגזים רעילים","זיהום של מערכת העיכול מתרגום חיידקים"],1,"העור הוא קו ההגנה הראשון של הגוף מפני חיידקים, וכשהוא נהרס בשטח נרחב נוצר שער כניסה עצום. הזיהום הוא סיבת התמותה המובילה בנפגעי כוויות ששרדו את השלב הראשוני, והוא עלול להתקדם לספסיס. לכן חבישה נקייה, טכניקה סטרילית ומניעת זיהום צולב הם חלק מרכזי בטיפול כבר בשטח."],["כוויות","מדוע כוויות בפרינאום מחייבות התייחסות מיוחדת?",["הן כואבות פחות בשל עצבוב דל באזור","הן אינן משפיעות על החלטות הטיפול והפינוי","הן מחלימות מהר יותר בשל אספקת דם עשירה","סיכון גבוה לזיהום ולסיבוכים תפקודיים ארוכי טווח"],3,"אזור הפרינאום חשוף לזיהום מהפרשות, וההחלמה בו עלולה לגרום להיצרויות ולפגיעה תפקודית ארוכת טווח בסוגרים ובתפקוד המיני. לכן הוא נכלל בקריטריונים לפינוי למרכז כוויות ללא קשר לגודל השטח. אותה מדיניות חלה על כוויות בפנים, בידיים, ברגליים ובמפרקים גדולים."],["כוויות","מטופל נחשף לחומצה חזקה על העור. מה אסור לעשות?",["לשטוף במים רבים","להסיר בגדים מזוהמים","לנסות לנטרל בבסיס","להגן על הצוות בכפפות"],2,"ניסיון לנטרל חומצה בבסיס — או להפך — יוצר תגובה כימית אקסותרמית שמשחררת חום ומוסיפה כווייה תרמית לכווייה הכימית. הטיפול הנכון הוא שטיפה ממושכת במים בכמות גדולה שמדללת ומרחיקה את החומר. הסרת בגדים מזוהמים והגנה על הצוות הן פעולות נכונות וחיוניות."],["קרדיווסקולרי","מהו התיאור הקלאסי של כאב בחזה ממקור לבבי?",["כאב המחמיר בלחיצה ישירה על דופן החזה","כאב לוחץ ומפושט המקרין ליד, ללסת או לגב","כאב החולף מיד עם שינוי תנוחת הגוף","כאב חד ומקומי המחמיר בשאיפה עמוקה"],1,"כאב איסכמי מתואר כלחץ, כובד או מועקה מפושטים באזור החזה, ולא ככאב נקודתי. הוא מקרין לזרוע שמאל, ללסת, לצוואר או לגב, ומלווה בהזעה קרה, בבחילה ובחיוורון. כאב חד שמשתנה עם הנשימה מחשיד למקור פלאורלי או לדלקת בקרום הלב, וכאב שמשתנה בלחיצה על דופן החזה מחשיד למקור שריר-שלד."],["קרדיווסקולרי","באילו אוכלוסיות שכיחה הצגה לא טיפוסית של אוטם שריר הלב?",["נשים, סוכרתיים וקשישים","אנשים רזים ללא עודף משקל","ספורטאים בעלי כושר גופני גבוה","גברים צעירים ללא גורמי סיכון ידועים"],0,"בנשים ההצגה כוללת לעיתים קרובות עייפות קיצונית, קוצר נשימה, בחילה וכאב בגב או בלסת ללא כאב חזה טיפוסי. בסוכרתיים הנוירופתיה מקהה את תחושת הכאב ולעיתים האוטם שקט לחלוטין. בקשישים ההצגה עשויה להיות בלבול, חולשה או נפילה. חשד גבוה באוכלוסיות אלה קריטי כדי לא לפספס אוטם."],["קרדיווסקולרי","מהו MONA בטיפול בתסמונת כלילית חדה?",["Monitor, Oxygen, Naloxone, Adrenaline","Morphine, Ondansetron, Nitrate, Atropine","Morphine, Oxygen, Nitroglycerin, Aspirin","Monitor, Oxygen, Nitrate, Antibiotics"],2,"MONA הוא ראשי תיבות של Morphine לשיכוך כאב, Oxygen במידת הצורך, Nitroglycerin להרחבת כלי דם והפחתת עומס הלב, ו-Aspirin לעיכוב טסיות. חשוב לדעת שהגישה העדכנית משנה את הדגשים: אספירין הוא הקריטי ביותר, חמצן ניתן רק אם הסטורציה נמוכה מ-90 אחוז, ומורפין ניתן בזהירות."],["קרדיווסקולרי","מהי ההתווית נגד העיקרית למתן ניטרוגליצרין?",["ל״ד סיסטולי נמוך, אוטם בחדר ימין ותרופות לזקפה","גיל מעל 60 עם מחלת לב ידועה","דופק מעל 90 פעימות לדקה במנוחה","כאב חזה עז שאינו מגיב למנוחה"],0,"ניטרוגליצרין מרחיב כלי דם ומפחית Preload, ולכן במטופל עם לחץ דם נמוך הוא עלול לגרום לקריסה. באוטם בחדר ימין תפוקת הלב תלויה לחלוטין ב-Preload והתרופה מסוכנת במיוחד. שימוש בתרופות לזקפה כמו סילדנפיל ב-24 עד 48 השעות האחרונות עלול לגרום לתת לחץ דם קיצוני. גיל וחומרת הכאב אינם התוויות נגד."],["קרדיווסקולרי","מדוע אספירין ניתן בחשד לאוטם?",["הוא מעכב צימות טסיות ומונע התרחבות הקריש","הוא משכך כאבים חזק ומפחית עומס על הלב","הוא מוריד את לחץ הדם ואת עומס העבודה","הוא מרחיב את העורקים הכליליים ומשפר זרימה"],0,"אספירין מעכב באופן בלתי הפיך את האנזים COX-1 בטסיות ומונע את יצירת התרומבוקסן, וכך מפחית את התגובדות הטסיות סביב הרובד שנקרע. הוא אינו ממיס את הקריש הקיים אך מונע את התרחבותו, והוא מפחית תמותה באופן משמעותי — אחת ההתערבויות היעילות ביותר. הוא ניתן בלעיסה לספיגה מהירה יותר."],["קרדיווסקולרי","מהם הסימנים של אי ספיקת לב שמאלית חדה?",["ברדיקרדיה, סחרחורת ועילפון במאמץ","בצקות בגפיים התחתונות וגודש ורידי צוואר","כאב ברביע ימני עליון, צהבת וכבד מוגדל","קוצר נשימה, קרפיטציות, כיח ורדרד ואורתופנאה"],3,"כשהחדר השמאלי כושל הדם נאגר לאחור לוורידי הריאה, הלחץ עולה ונוזל דולף לאלוואולות — בצקת ריאות. הביטויים הם קוצר נשימה קשה, קרפיטציות בהאזנה, כיח ורדרד ומוקצף, אורתופנאה וקוצר נשימה לילי התקפי. בצקות ברגליים וגודש ורידי צוואר אופייניים לאי ספיקה ימנית, שבה הגודש הוא במחזור הסיסטמי."],["קרדיווסקולרי","מהו הטיפול בבצקת ריאות חדה בשטח?",["מתן נוזלים בכמות גדולה לשיפור הפרפוזיה","השכבה שטוחה ומתן נוזלים להעלאת הלחץ","הרמת רגליים להגברת ההחזר הוורידי ללב","הושבה, חמצן, CPAP וניטרטים בהתאם ללחץ הדם"],3,"הושבה מפחיתה את ההחזר הוורידי ומשפרת את מכניקת הנשימה. CPAP הוא ההתערבות היעילה ביותר — הוא דוחף נוזל בחזרה מהאלוואולות ומפחית משמעותית את הצורך באינטובציה. ניטרטים מפחיתים Preload ו-Afterload. מתן נוזלים או השכבה שטוחה יחמירו את הגודש באופן מיידי ומסוכן."],["קרדיווסקולרי","מהי פרפור פרוזדורים (Atrial Fibrillation) ומהו הסיכון העיקרי בה?",["קצב סדיר ומהיר — סיכון מיידי לדום לב","קצב לא סדיר לחלוטין — סיכון לקרישים ולשבץ","קצב איטי וסדיר — סיכון לעילפון ולנפילות","קצב תקין לחלוטין — ללא סיכון מוגבר"],1,"בפרפור פרוזדורים הפרוזדורים אינם מתכווצים ביעילות אלא רוטטים, והקצב החדרי הופך לא סדיר לחלוטין. הדם עומד באוזנית הפרוזדור השמאלי ונוצרים בו קרישים שעלולים להשתחרר ולגרום לשבץ מוחי — סיכון גבוה פי חמישה. בנוסף אובד ה-Atrial Kick שתורם כ-20 אחוז למילוי החדר."],["קרדיווסקולרי","מהי ההגדרה של יתר לחץ דם משמעותי הדורש התייחסות דחופה?",["מעל 180/120 עם סימני נזק לאיברי מטרה","ערכים סביב 120/80 בשתי מדידות חוזרות","ערכים סביב 110/70 עם סחרחורת בקימה","ערכים סביב 140/90 עם כאב ראש קל"],0,"משבר יתר לחץ דם מוגדר כערכים מעל 180/120. ההבחנה החשובה היא בין Hypertensive Urgency — ערכים גבוהים ללא נזק לאיברי מטרה, לבין Hypertensive Emergency — ערכים גבוהים עם נזק פעיל כמו אנצפלופתיה, בצקת ריאות, אוטם או קרע באאורטה. במצב החירום נדרשת הורדה מבוקרת, והורדה מהירה מדי מסוכנת ועלולה לגרום לאיסכמיה."],["קרדיווסקולרי","מהם הסימנים לפגיעה בזרימת הדם ההיקפית בגפה?",["חום, אודם ונפיחות מקומיים בשוק","נפיחות חד-צדדית ללא שינוי בצבע העור","גירוד ופריחה מקומית באזור הגפה","חיוורון, קור, כאב, נימול והיעדר דופק היקפי"],3,"חמשת ה-P מתארים חסימה עורקית חדה: Pain, Pallor, Pulselessness, Paresthesia ו-Poikilothermia. זהו מצב חירום שבו הגפה בסכנה — הזמן לשימור רקמה מוגבל לשעות ספורות. חום ואודם מחשידים דווקא לזיהום או לדלקת ורידים, ונפיחות לבדה מחשידה לפקקת ורידים עמוקים."],["קרדיווסקולרי","מהו תסחיף ריאתי ומהם ביטוייו?",["קריש בעורק כלילי — כאב לוחץ מקרין","דלקת בקרום הריאה — חום גבוה וכאב חד","דימום לרקמת הריאה — כיח דמי וחום","קריש בעורקי הריאה — קוצר נשימה פתאומי וכאב פלאוריטי"],3,"תסחיף ריאתי נוצר לרוב מקריש שהתנתק מוורידי הרגליים ונדד לעורקי הריאה. הביטוי הקלאסי הוא קוצר נשימה פתאומי, כאב חד שמחמיר בנשימה, טכיקרדיה, היפוקסיה ולעיתים שיעול דמי. גורמי הסיכון כוללים חוסר תנועה ממושך, ניתוח לאחרונה, ממאירות, גלולות והיריון. בתסחיף מסיבי מתפתח הלם חסימתי."],["קרדיווסקולרי","מהי טכיקרדיה חדרית (VT) ומדוע היא מסוכנת?",["קצב מהיר ממקור פרוזדורי עם קומפלקס צר","קצב איטי ממקור חדרי עם קומפלקס רחב","הפרעה בהולכה בין הפרוזדורים לחדרים בלבד","קצב מהיר ממקור חדרי — עלול להידרדר לפרפור חדרים"],3,"בטכיקרדיה חדרית מוקד חשמלי בחדר משתלט על הקצב ויוצר קצב מהיר ורחב. מכיוון שזמן המילוי קצר, תפוקת הלב יורדת ולעיתים אין דופק כלל. הסכנה הגדולה היא הידרדרות לפרפור חדרים ולדום לב. הטיפול תלוי ביציבות: במטופל לא יציב מבצעים היפוך חשמלי, ובחסר דופק מטפלים כדום לב עם דפיברילציה."],["קרדיווסקולרי","מהו פרפור חדרים (VF) ומהו הטיפול?",["קצב איטי עם חסם הולכה — מתן אטרופין","קצב מהיר וסדיר — טיפול תרופתי אנטי-אריתמי","עצירה חשמלית מוחלטת — קיצוב חיצוני מיידי","פעילות חשמלית כאוטית ללא תפוקה — דפיברילציה מיידית"],3,"בפרפור חדרים שריר הלב רוטט בצורה כאוטית ואינו מתכווץ באופן מתואם, ולכן אין תפוקת לב כלל — זהו דום לב. זהו קצב בר הלם והטיפול המכריע הוא דפיברילציה מוקדמת ככל האפשר לצד עיסויים איכותיים. כל דקה של עיכוב מפחיתה את סיכויי ההישרדות בכ-7 עד 10 אחוזים."],["קרדיווסקולרי","מהו אסיסטולה ומדוע אין מבצעים בו דפיברילציה?",["מדובר בהפרעת הולכה זמנית שחולפת מעצמה","הקצב סדיר ואיטי ואינו מסכן את המטופל","הקצב מהיר מכדי לאפשר סנכרון של ההלם","היעדר פעילות חשמלית — הטיפול עיסויים ואדרנלין"],3,"באסיסטולה אין פעילות חשמלית כלל בשריר הלב. דפיברילציה פועלת על ידי דה-פולריזציה של כל השריר בו זמנית כדי לאפשר לקוצב הטבעי להשתלט — אך כשאין כל פעילות חשמלית אין מה לאפס. לכן הטיפול הוא עיסויים איכותיים, אדרנלין וחיפוש סיבות הפיכות. חשוב לוודא שאין מדובר בפרפור עדין או בתקלה טכנית בחיבורים."],["קרדיווסקולרי","מהי פעילות חשמלית ללא דופק (PEA) וכיצד מטפלים בה?",["פעילות חשמלית מאורגנת ללא דופק — טיפול בסיבה ההפיכה","קצב חשמלי מאורגן עם דופק נמוש ותקין","היעדר מוחלט של פעילות חשמלית בשריר הלב","פרפור חדרים עדין הנראה כקו כמעט ישר"],0,"ב-PEA המוניטור מציג קצב חשמלי מאורגן אך אין תפוקה מכנית. זהו קצב שאינו בר הלם, והמפתח לטיפול הוא זיהוי ותיקון של הסיבה ההפיכה. הסיבות מסודרות בזיכרון של ארבעה H וארבעה T: היפוקסיה, היפוולמיה, היפו או היפרקלמיה, היפותרמיה, טמפונדה, חזה אוויר בלחץ, תרומבוזיס ורעלים."],["קרדיווסקולרי","מהי ברדיקרדיה סימפטומטית ומהו הטיפול הראשוני?",["דופק מתחת ל-60 ללא תסמינים — מעקב בלבד","דופק מעל 100 עם דפיקות לב — חוסמי בטא","דופק לא סדיר לחלוטין — דפיברילציה מסונכרנת","דופק איטי עם תת לחץ דם או שינוי הכרה — אטרופין"],3,"ברדיקרדיה מוגדרת כסימפטומטית כאשר היא מלווה בסימני היפופרפוזיה: תת לחץ דם, שינוי במצב הכרה, כאב בחזה, קוצר נשימה או סימני הלם. הטיפול הראשוני הוא אטרופין, ואם אין תגובה עוברים לקיצוב חיצוני או לתרופות כמו דופמין ואדרנלין. דופק איטי ללא תסמינים אינו מחייב טיפול — ספורטאים רבים בדופק נמוך תקין."],["קרדיווסקולרי","מהו תפקידו של הצומת הסינו-אטריאלי (SA Node)?",["ויסות זרימת הדם בין החדר לעורקים","קוצב הלב הטבעי — 60 עד 100 גירויים לדקה","יצירת ההתכווצות המכנית של שריר הלב","הולכת הגירוי מהפרוזדורים אל החדרים"],1,"הצומת הסינו-אטריאלי הממוקם בפרוזדור הימני הוא הקוצב הטבעי של הלב, ומייצר גירויים בקצב של 60 עד 100 לדקה. אם הוא כושל, הצומת האטריו-ונטריקולרי משתלט בקצב 40 עד 60, ואם גם הוא כושל — סיבי פורקינייה בקצב 20 עד 40. ההיררכיה הזו מסבירה מדוע קצב איטי מאוד מעיד לרוב על מקור נמוך יותר במערכת ההולכה."],["קרדיווסקולרי","מהי המשמעות של עליות ST באק״ג?",["ממצא תקין בצעירים ובספורטאים","רמת אשלגן נמוכה מהטווח התקין","חשד לאוטם חד עם חסימה מלאה של עורק כלילי","הפרעת קצב ממקור פרוזדורי מהיר"],2,"עליות ST בשני לידים סמוכים ומעלה מעידות על פגיעה טרנס-מורלית חדה — חסימה מלאה של עורק כלילי. זהו STEMI, מצב חירום שדורש פתיחת חסימה מיידית בצנתור או בתרומבוליזה, וכל דקה משמעותית. חשוב לזכור שקיימים גם גורמים אחרים לעליות ST כמו פריקרדיטיס והרמה מוקדמת שפירה, ולכן ההקשר הקליני מכריע."],["קרדיווסקולרי","מהם ארבעת ה-H וארבעת ה-T בדום לב?",["שלבי ההחייאה לפי סדר ביצועם בזמן","סיבות הפיכות לדום לב שיש לזהות ולטפל בהן","רשימת התרופות הניתנות במהלך ההחייאה","סוגי קצב הלב הנצפים במוניטור בדום לב"],1,"אלו הסיבות ההפיכות לדום לב שיש לחפש באופן שיטתי: היפוקסיה, היפוולמיה, היפו או היפרקלמיה והפרעות מטבוליות, והיפותרמיה. הארבעה השניים הם טמפונדה, חזה אוויר בלחץ (Tension), תרומבוזיס — כלילי או ריאתי, ורעלים (Toxins). זיהוי הסיבה וטיפול בה הוא לעיתים ההבדל היחיד בין הצלחה לכישלון."],["קרדיווסקולרי","גבר בן 55 עם כאב בחזה, ל״ד 90/60, גודש ורידי צוואר, ריאות נקיות. איזה סוג אוטם יש לחשוד בו?",["אוטם ללא עליות ST","אוטם קדמי","אוטם צדי","אוטם בחדר ימין"],3,"השילוב של תת לחץ דם, גודש ורידי צוואר וריאות נקיות הוא המשולש הקלאסי של אוטם בחדר ימין. החדר הימני הפגוע אינו מסוגל לדחוף דם לריאות, ולכן הדם נאגר לפניו ואילו הריאות נשארות יבשות. המשמעות הטיפולית קריטית: המטופל תלוי ב-Preload, ולכן ניטרטים ומורפין מסוכנים מאוד והטיפול הוא דווקא מתן נוזלים."],["קרדיווסקולרי","מהי הסיבה השכיחה ביותר לתסמונת כלילית חדה?",["קרע ברובד טרשתי עם היווצרות קריש חוסם","זיהום ויראלי או חיידקי של שריר הלב","התכווצות ספסטית של העורק הכלילי","מום מולד במוצא העורקים הכליליים"],0,"הרובד הטרשתי מצטבר לאורך שנים בדופן העורק. כאשר הכיפה הסיבית שלו נקרעת, נחשף התוכן התרומבוגני, טסיות מתגודדות ונוצר קריש שחוסם את הזרימה. חשוב לדעת שהרובד שנקרע אינו בהכרח הגדול ביותר — רבדים קטנים ולא יציבים גורמים לרוב האוטמים, ולכן אירוע יכול להתרחש גם ללא תסמינים מקדימים."],["קרדיווסקולרי","מהו ההבדל בין תעוקת חזה יציבה לבלתי יציבה?",["תעוקה בלתי יציבה חולפת מהר יותר מהיציבה","אין הבדל קליני משמעותי בין השתיים","תעוקה יציבה מסוכנת יותר ומחייבת פינוי דחוף","יציבה — במאמץ צפוי וחולפת; בלתי יציבה — במנוחה או מחמירה"],3,"תעוקה יציבה מופיעה במאמץ בעוצמה צפויה וחולפת תוך דקות במנוחה או עם ניטרוגליצרין — היא מבטאת היצרות קבועה. תעוקה בלתי יציבה מופיעה במנוחה, היא חדשה, מחמירה בתדירות או בעוצמה, או אינה מגיבה כרגיל לטיפול. היא מבטאת רובד לא יציב ונחשבת לתסמונת כלילית חדה עם סיכון ממשי לאוטם."],["קרדיווסקולרי","מהי המשמעות של דופק לא סדיר לחלוטין?",["מחשיד לפרפור פרוזדורים","ממצא תקין בכל גיל","מעיד תמיד על דום לב מתקרב","מעיד על היפוגליקמיה"],0,"דופק שאינו סדיר בשום דפוס — Irregularly Irregular — הוא הסימן הקליני האופייני לפרפור פרוזדורים. יש להבדילו מאקסטרה-סיסטולות, שיוצרות פעימה מוקדמת בודדת על רקע קצב סדיר. הממצא מחייב אק״ג ובירור, ומעלה חשד לסיכון תסחיפי. הוא אינו תקין ואינו מעיד ישירות על היפוגליקמיה."],["קרדיווסקולרי","אישה בת 68 סוכרתית עם חולשה קיצונית, בחילה והזעה, ללא כאב בחזה. מה יש לשלול?",["עייפות רגילה","דלקת בדרכי השתן בלבד","אוטם שקט בשריר הלב","התייבשות בלבד"],2,"אישה, סוכרתית וקשישה — שלושת גורמי הסיכון להצגה לא טיפוסית של אוטם. הנוירופתיה הסוכרתית מקהה את תחושת הכאב, ולכן האוטם מתבטא בשקילות אנגינליות: חולשה קיצונית, בחילה, הזעה, קוצר נשימה או בלבול. לכן בכל מטופל באוכלוסייה זו עם תסמינים כלליים לא מוסברים מבצעים אק״ג ושוללים אוטם."],["קרדיווסקולרי","מהי הסיבה לכך שאוטם בקיר התחתון עלול להיות מלווה בברדיקרדיה?",["עלייה חדה ברמת האשלגן בדם ובשריר","פגיעה נרחבת בשריר החדר השמאלי","העורק הכלילי הימני מזין את הצמתים SA ו-AV","ירידה בנפח הדם עם תת לחץ דם נלווה"],2,"ברוב האנשים העורק הכלילי הימני מספק דם לצומת הסינו-אטריאלי ולצומת האטריו-ונטריקולרי, והוא גם העורק שמזין את הקיר התחתון. לכן אוטם תחתון פוגע לעיתים קרובות במערכת ההולכה וגורם לברדיקרדיה ולחסמים. בנוסף מתלווה לעיתים תגובה וגאלית מוגברת. אוטם תחתון מחייב גם בדיקת מעורבות חדר ימין."],["קרדיווסקולרי","מהו CPAP וכיצד הוא מסייע בבצקת ריאות?",["מכשיר לשאיבת הפרשות מדרכי האוויר","מסכת חמצן פשוטה עם רזרבואר בזרימה גבוהה","מכשיר להנשמה מלאה במקום המטופל","לחץ חיובי רציף שמשפר חמצון ודוחף נוזל מהאלוואולות"],3,"CPAP מספק לחץ חיובי רציף לאורך כל מחזור הנשימה. בבצקת ריאות הוא פותח אלוואולות שהתמוטטו, דוחף נוזל בחזרה מהאלוואולות אל האינטרסטיציום ומפחית Preload ו-Afterload. התוצאה היא שיפור מהיר בחמצון ובעבודת הנשימה, והפחתה משמעותית בצורך באינטובציה. הוא אינו מנשים במקום המטופל — נדרשת נשימה עצמונית."],["קרדיווסקולרי","מהי הסכנה במתן חמצן בריכוז גבוה למטופל עם אוטם וסטורציה תקינה?",["החמצן מעלה את לחץ הדם ואת עומס העבודה","החמצן מדכא את הדחף הנשימתי ואת קצב הנשימה","אין סכנה — יש לתת חמצן לכל חולה אוטם","היפראוקסיה גורמת לוזוקונסטריקציה ומגדילה את האוטם"],3,"מחקרים הראו שמתן חמצן למטופל עם סטורציה תקינה אינו מועיל ואף עלול להזיק — היפראוקסיה גורמת לוזוקונסטריקציה כלילית ולייצור רדיקלים חופשיים שמגדילים את אזור הנזק. לכן ההנחיה העדכנית היא לתת חמצן רק כאשר הסטורציה יורדת מתחת ל-90 אחוז, או בסימני מצוקה נשימתית או הלם."],["קרדיווסקולרי","מהו מנגנון הפעולה של ניטרוגליצרין בכאב בחזה?",["האטת קצב הלב והפחתת צריכת החמצן","עיכוב תגובדות טסיות ומניעת קריש חדש","הרחבת ורידים ועורקים — הפחתת Preload והעומס","הגברת כוח ההתכווצות של שריר הלב"],2,"ניטרוגליצרין משתחרר לתחמוצת חנקן שמרפה את השריר החלק בכלי הדם. ההשפעה העיקרית היא הרחבה ורידית שמפחיתה את ההחזר הוורידי ואת ה-Preload, ובכך מקטינה את עומס העבודה ואת צריכת החמצן של שריר הלב. בנוסף הוא מרחיב במידה מסוימת את העורקים הכליליים. הוא אינו משפיע ישירות על כוח ההתכווצות או על הטסיות."],["קרדיווסקולרי","מהו הסימן האופייני לפקקת ורידים עמוקים (DVT)?",["חיוורון וקור בגפה עם היעדר דופק","נפיחות חד-צדדית עם כאב, חום ואודם בשוק","נימול דו-צדדי בכפות הרגליים","היעדר דופק היקפי עם כאב במנוחה"],1,"ב-DVT הקריש חוסם את הניקוז הוורידי, ולכן הגפה נפוחה, חמה, אדומה וכואבת — בדרך כלל בצד אחד בלבד. חיוורון, קור והיעדר דופק מאפיינים דווקא חסימה עורקית, שהיא מצב הפוך. חשיבות הזיהוי היא בסיכון לתסחיף ריאתי, ולכן חשד ל-DVT מחייב הפניה לבירור דחוף."],["קרדיווסקולרי","מהי המשמעות של סינקופה (עילפון) בזמן מאמץ?",["סימן להתייבשות ולאובדן מלחים במאמץ","סימן מדאיג המחשיד למחלת לב מבנית או להפרעת קצב","תופעה שפירה של עייפות ומאמץ יתר","תגובה פיזיולוגית תקינה למאמץ אינטנסיבי"],1,"סינקופה בזמן מאמץ — בשונה מסינקופה וזו-וגאלית שמתרחשת בעמידה ממושכת או לאחר גירוי רגשי — מחשידה מאוד לסיבה לבבית: היצרות מסתם אאורטלי, קרדיומיופתיה היפרטרופית או הפרעת קצב מסכנת חיים. זהו דגל אדום שמחייב בירור לבבי דחוף, במיוחד בצעירים ובמי שיש היסטוריה משפחתית של מוות פתאומי."],["קרדיווסקולרי","מטופל עם דופק 180, סדיר, קומפלקסים צרים, ל״ד 70/40 ומצב הכרה ירוד. מה הטיפול?",["מתן נוזלים והמתנה","מסאז׳ קרוטידי בלבד","מתן חוסמי בטא דרך הפה","היפוך חשמלי מסונכרן"],3,"מטופל עם טכיקרדיה ועם סימני חוסר יציבות — תת לחץ דם, שינוי במצב הכרה, כאב בחזה או סימני הלם — מחייב היפוך חשמלי מסונכרן מיידי ללא ניסיונות תרופתיים ממושכים. תמרוני ואגוס ואדנוזין מתאימים למטופל יציב. חוסמי בטא דרך הפה אינם רלוונטיים במצב חירום, ומתן נוזלים בלבד לא יפתור את הבעיה."],["קרדיווסקולרי","מהי הסכנה העיקרית בהיפרקלמיה (אשלגן גבוה)?",["עלייה בחום הגוף עם הזעה מרובה","ירידה חדה ברמת הסוכר בדם","ירידה בלחץ הדם עם חולשת שרירים","הפרעות קצב מסכנות חיים ודום לב"],3,"אשלגן גבוה משנה את פוטנציאל המנוחה של תאי שריר הלב ופוגע בהולכה החשמלית. באק״ג מופיעים גלי T גבוהים ומחודדים, התרחבות של קומפלקס ה-QRS והיעלמות גלי P, ובסופו של דבר קצב סינוסואידלי ודום לב. הסיבות השכיחות הן אי ספיקת כליות, תסמונת מעיכה ותרופות. זוהי סיבה הפיכה חשובה לדום לב."],["החייאה","מהו הסדר הנכון בשרשרת ההישרדות בדום לב מחוץ לבית החולים?",["החייאה, זיהוי, דפיברילציה ופינוי מהיר","פינוי מהיר לבית החולים ללא טיפול בשטח","זיהוי והזעקה, החייאה, דפיברילציה, החייאה מתקדמת וטיפול לאחר","דפיברילציה, מתן אדרנלין ולאחריהם עיסויים"],2,"שרשרת ההישרדות מתחילה בזיהוי מוקדם של דום הלב ובהזעקת עזרה, ממשיכה בהחייאה בסיסית איכותית ומיידית, בדפיברילציה מהירה ככל האפשר, בהחייאה מתקדמת, ולבסוף בטיפול מיטבי לאחר החזרת מחזור. כל חוליה תלויה בקודמת, והחוליות המשפיעות ביותר על ההישרדות הן דווקא השתיים הראשונות שמבוצעות על ידי עוברי אורח."],["החייאה","מהו עומק העיסויים המומלץ במבוגר?",["8 עד 10 ס״מ","5 עד 6 ס״מ","2 עד 3 ס״מ","1 עד 2 ס״מ"],1,"עומק העיסוי המומלץ במבוגר הוא 5 עד 6 ס״מ — כלומר לפחות 5 אך לא יותר מ-6. עיסוי רדוד מדי אינו מייצר תפוקה מספקת, ועיסוי עמוק מדי גורם לפגיעות בצלעות ובאיברים פנימיים. בילדים העומק הוא כשליש מעומק בית החזה, כלומר כ-5 ס״מ בילד וכ-4 ס״מ בתינוק."],["החייאה","מהו קצב העיסויים המומלץ?",["80 עד 100 לדקה","140 עד 160 לדקה","60 עד 80 לדקה","100 עד 120 לדקה"],3,"הקצב המומלץ הוא 100 עד 120 עיסויים לדקה. קצב איטי יותר מייצר תפוקה נמוכה, וקצב מהיר יותר אינו מאפשר לבית החזה לחזור למצבו ולחדרים להתמלא — כך שהעיסויים הופכים לא יעילים למרות שהם נראים אנרגטיים. חשוב לא פחות לאפשר חזרה מלאה של בית החזה בין העיסויים."],["החייאה","מהו יחס העיסויים להנשמות במבוגר עם מציל יחיד?",["5 ל-1","15 ל-2","30 ל-2","3 ל-1"],2,"במבוגר היחס הוא 30 עיסויים ל-2 הנשמות, בין אם יש מציל אחד או שניים. בילדים ובתינוקות היחס הוא 30 ל-2 עם מציל יחיד ו-15 ל-2 עם שני מצילים. בהחייאת יילוד היחס הוא 3 ל-1. כאשר נתיב האוויר מאובטח מנשימים 10 הנשמות בדקה ברציפות ללא הפסקת עיסויים."],["החייאה","מדוע חשוב לצמצם הפסקות בעיסויים?",["כדי למנוע עייפות מוקדמת של המעסה","לחץ הפרפוזיה הכלילי צונח מיד וחוזר לאט","כדי לקצר את משך ההחייאה הכולל","כדי לחסוך בסוללת הדפיברילטור ובציוד"],1,"לחץ הפרפוזיה הכלילי נבנה בהדרגה במהלך רצף עיסויים, וברגע שמפסיקים הוא צונח כמעט מיידית. לאחר חידוש העיסויים נדרשות מספר פעימות כדי לחזור לרמה האפקטיבית. לכן שיעור העיסויים מתוך זמן ההחייאה — Chest Compression Fraction — צריך להיות גבוה מ-60 אחוז, וכל הפסקה מקוצרת לפחות מ-10 שניות."],["החייאה","היכן מניחים את הידיים לעיסויים במבוגר?",["בצד שמאל של בית החזה מעל אזור הלב","במרכז בית החזה, על מחצית עצם החזה התחתונה","בקצה התחתון של עצם החזה מעל הזיז","על הצלעות התחתונות בקו האמצע-בריחי"],1,"כף היד מונחת במרכז בית החזה, על המחצית התחתונה של עצם החזה. עיסוי נמוך מדי — על תחתית עצם החזה — עלול לגרום לקרע בכבד, ועיסוי לצד עצם החזה שובר צלעות ואינו יעיל. הזרועות ישרות והכתפיים מעל הידיים כדי לנצל את משקל הגוף ולא את כוח הזרועות."],["החייאה","מתי מבצעים דפיברילציה?",["בברדיקרדיה קשה שאינה מגיבה לאטרופין","בכל דום לב ללא תלות בקצב הנצפה","באסיסטולה לפני מתן אדרנלין","רק בפרפור חדרים ובטכיקרדיה חדרית ללא דופק"],3,"דפיברילציה יעילה רק בקצבים ברי הלם — פרפור חדרים וטכיקרדיה חדרית ללא דופק — שבהם השריר פועל בצורה כאוטית וניתן לאפס אותו. באסיסטולה אין פעילות חשמלית לאפס, וב-PEA הפעילות החשמלית כבר מאורגנת והבעיה מכנית. בשני המצבים הללו הטיפול הוא עיסויים, אדרנלין וחיפוש סיבות הפיכות."],["החייאה","מהו הזמן הקריטי למתן דפיברילציה?",["יש לתת דפיברילציה תוך 30 דקות מהקריסה","יש לתת דפיברילציה תוך שעה מהאירוע","עיתוי מתן ההלם אינו משפיע על התוצאה","כל דקת עיכוב מפחיתה הישרדות בכ-7 עד 10 אחוזים"],3,"בפרפור חדרים סיכויי ההצלחה יורדים במהירות עם הזמן — כל דקה שעוברת ללא דפיברילציה מפחיתה את ההישרדות בכ-7 עד 10 אחוזים, ובנוכחות החייאה איכותית הירידה מתונה יותר. זו הסיבה להצבת דפיברילטורים אוטומטיים במרחבים ציבוריים ולהדגשת ההחייאה על ידי עוברי אורח."],["החייאה","מהי ההנשמה הנכונה במפוח בזמן החייאה?",["נפח שמרים את בית החזה, כשנייה, בלחץ מתון","הנשמות רצופות ומהירות ללא הפסקה","הנשמה אחת לכל 10 עיסויים ברצף","הנשמה חזקה ומהירה ככל האפשר"],0,"ההנשמה צריכה להיות בנפח שמספיק להרמה נראית של בית החזה, במשך כשנייה, בלחץ מתון. הנשמה חזקה או מהירה מדי גורמת לניפוח קיבה, להקאה ולשאיפה, ומעלה את הלחץ התוך-חזי כך שההחזר הוורידי והתפוקה יורדים. היפרוונטילציה בהחייאה היא טעות שכיחה שפוגעת בהישרדות."],["החייאה","מהו תפקידו של אדרנלין בהחייאה?",["וזוקונסטריקציה שמשפרת פרפוזיה כלילית ומוחית","הפסקת פרפור החדרים והחזרת קצב סדיר","הרחבת הסימפונות ושיפור האוורור בלבד","האטת קצב הלב והפחתת צריכת החמצן"],0,"התועלת העיקרית של אדרנלין בהחייאה נובעת מההשפעה על קולטני אלפא — כיווץ כלי דם היקפיים שמפנה את זרימת הדם המיוצרת בעיסויים אל הלב ואל המוח, ומעלה את לחץ הפרפוזיה הכלילי. במבוגר ניתן 1 מ״ג כל 3 עד 5 דקות. הוא אינו מפסיק פרפור חדרים — לשם כך נדרשת דפיברילציה."],["החייאה","מתי ניתן אמיודרון בהחייאה?",["בכל דום לב מיד עם תחילת ההחייאה","באסיסטולה במקום מתן אדרנלין","בברדיקרדיה סימפטומטית שאינה מגיבה","בפרפור או בטכיקרדיה חדרית עמידים לאחר שלוש דפיברילציות"],3,"אמיודרון הוא אנטי-אריתמי שניתן בפרפור חדרים או בטכיקרדיה חדרית ללא דופק שאינם מגיבים לדפיברילציות ולאדרנלין — לרוב לאחר ההלם השלישי. המינון הראשון הוא 300 מ״ג ואחריו 150 מ״ג. הוא אינו רלוונטי בקצבים שאינם ברי הלם, שבהם הטיפול מתמקד בעיסויים ובסיבות הפיכות."],["החייאה","מהו ה-ETCO2 ומה משמעותו בהחייאה?",["לחץ הדם העורקי הממוצע במהלך העיסויים","ריכוז CO2 בסוף הנשיפה — מדד ליעילות העיסויים","רמת החמצן המומס בדם העורקי","קצב הנשימות הספונטניות של המטופל"],1,"ETCO2 משקף את כמות ה-CO2 שמוחזרת מהרקמות לריאות, ולכן הוא מדד עקיף לתפוקת הלב שנוצרת בעיסויים. ערך נמוך מ-10 ממ״כ מעיד על עיסויים לא יעילים ומחייב שיפור טכניקה. עלייה חדה ומתמשכת מעל 35 עד 40 היא לרוב הסימן הראשון להחזרת מחזור ספונטני, עוד לפני שנמוש דופק."],["החייאה","מהם הסימנים להחזרת מחזור ספונטני (ROSC)?",["עלייה חדה ב-ETCO2, דופק נמוש ותנועה ספונטנית","הופעת פרפור חדרים גס במוניטור","הרחבה דו-צדדית של האישונים ללא תגובה","היעלמות מוחלטת של הפעילות החשמלית"],0,"הסימן האובייקטיבי המוקדם ביותר הוא עלייה חדה ומתמשכת ב-ETCO2, שמופיעה לרוב לפני שניתן למשש דופק. סימנים נוספים הם דופק מרכזי נמוש, עלייה בלחץ הדם, תנועות ספונטניות, נשימה ושיפור בצבע העור. הרחבת אישונים והפסקת פעילות חשמלית מעידות על ההפך."],["החייאה","מהו הטיפול לאחר החזרת מחזור ספונטני?",["הפסקת הניטור ופינוי בנסיעה רגילה","מתן מנת אדרנלין נוספת לייצוב הקצב","המשך עיסויים עד להגעה לבית החולים","שמירה על חמצון ומדדים בטווח יעד, ניטור ופינוי מתאים"],3,"בשלב שלאחר ההחייאה המטרה היא מניעת נזק משני: סטורציה בטווח 94 עד 98 אחוז ולא 100, הימנעות מהיפרוונטילציה ושמירה על ETCO2 תקין, שמירה על לחץ דם מספק, בדיקת סוכר, אק״ג 12 עופרות וטיפול בסיבה. ניטור צמוד הכרחי מפני שהסיכון לדום לב חוזר גבוה, והפינוי נעשה למרכז עם יכולת צנתור."],["החייאה","מהו קצב ההנשמות כאשר נתיב האוויר מאובטח?",["כ-5 הנשמות בדקה לפי מצב המטופל","כ-10 הנשמות בדקה, ברציפות ללא הפסקת עיסויים","כ-30 הנשמות בדקה בסנכרון לעיסויים","כ-20 הנשמות בדקה עם הפסקת עיסויים"],1,"כאשר הוחדר אמצעי מתקדם לנתיב האוויר, אין עוד צורך בסנכרון בין עיסויים להנשמות. מנשימים כ-10 הנשמות בדקה — אחת לכ-6 שניות — במקביל לעיסויים רציפים. הפיתוי להנשים מהר יותר מזיק: היפרוונטילציה מעלה את הלחץ התוך-חזי, מפחיתה החזר ורידי ופוגעת בהישרדות."],["החייאה","מהו החשד המרכזי בדום לב בטראומה?",["פרפור חדרים ראשוני ממקור חשמלי","היפוגליקמיה עמוקה עם אובדן הכרה","הפרעת קצב חשמלית על רקע מחלה כלילית","היפוולמיה, היפוקסיה, חזה אוויר בלחץ וטמפונדה"],3,"בשונה מדום לב רפואי, דום לב בטראומה נובע כמעט תמיד מסיבה מכנית או נפחית. לכן הדגש אינו על אדרנלין ודפיברילציה אלא על טיפול בסיבה: עצירת דימום ומתן נפח, חמצון ופתיחת נתיב אוויר, ניקור חזה דו-צדדי בחשד לחזה אוויר בלחץ, וניקוז טמפונדה. ללא טיפול בסיבה ההחייאה כמעט תמיד נכשלת."],["החייאה","מהי החשיבות של החייאה איכותית לעומת מת
