<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן נוירואנטומיה – מחזור 29 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFC22E;--yellow-soft:#FFE39A;--yellow-deep:#E9A400;--sky:#37B6E9;--sky-soft:#C9EEFB;--sky-deep:#1C86B8;
--ink:#123A4B;--bg:#F3FBFE;--card:#fff;--muted:#5b7683;--border:#dfeef5;--good:#1e9e6a;--good-bg:#e6f8ef;--bad:#e0483d;--bad-bg:#fdecea;--shadow:0 10px 34px rgba(28,134,184,.14);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);background:linear-gradient(165deg,#fff 0%,#eaf7fd 55%,#fff7e2 100%);min-height:100vh;line-height:1.6}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',Georgia,serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 90px}
.exam-header{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow);border-top:6px solid var(--yellow)}
.cohort-logo{width:84px;height:84px;flex-shrink:0}@media(max-width:600px){.cohort-logo{width:64px;height:64px}}
.exam-header h1{font-size:26px;color:var(--ink);font-weight:900;line-height:1.2}
.exam-subtitle{color:var(--sky-deep);font-size:14px;font-weight:700;margin-top:3px}
.hero{text-align:center;padding:26px 10px 6px}.hero .brain{font-size:52px}
.hero p{color:var(--muted);font-size:17px;max-width:600px;margin:8px auto 0}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:26px}@media(max-width:820px){.modes{grid-template-columns:1fr}}
.mode-card{background:#fff;border:2px solid var(--border);border-radius:20px;padding:26px 22px;cursor:pointer;transition:.18s;text-align:center;box-shadow:var(--shadow)}
.mode-card:hover{transform:translateY(-4px);border-color:var(--sky)}.mode-card .ico{font-size:42px}
.mode-card h3{color:var(--ink);font-size:22px;margin:10px 0 8px}.mode-card p{color:var(--muted);font-size:14.5px;min-height:42px}
.mode-card .count{display:inline-block;margin-top:14px;background:var(--yellow);color:#5a4100;padding:6px 16px;border-radius:999px;font-weight:800;font-size:14px}
.mode-card.sky .count{background:var(--sky);color:#04384c}
.opts-toggle{margin-top:24px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 18px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.opts-toggle label{font-size:15px;cursor:pointer;display:flex;gap:7px;align-items:center}.opts-toggle input{width:18px;height:18px;accent-color:var(--sky)}
.legend{margin-top:14px;color:var(--muted);font-size:13.5px;text-align:center}
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,251,254,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:9px 16px;margin:14px -16px 16px}
.topbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:18px;color:var(--ink);flex:1;min-width:120px}
.pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-weight:800;font-size:13.5px}
.pill.score{color:var(--good)}.pill.pos{color:var(--sky-deep)}
.btn{font-family:inherit;border:none;border-radius:12px;padding:10px 17px;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.btn:disabled{opacity:.38;cursor:default}
.btn-exit{background:#fff;color:var(--bad);border:1px solid #f3cdc9}.btn-exit:hover:not(:disabled){background:var(--bad-bg)}
.btn-primary{background:var(--sky);color:#fff}.btn-primary:hover:not(:disabled){background:var(--sky-deep)}
.btn-ghost{background:#fff;color:var(--sky-deep);border:1px solid var(--border)}.btn-ghost:hover:not(:disabled){background:var(--bg)}
.btn-yellow{background:var(--yellow);color:#5a4100}.btn-yellow:hover:not(:disabled){background:var(--yellow-deep)}
.progress{height:8px;background:var(--sky-soft);border-radius:999px;overflow:hidden;margin-top:8px;flex:1}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--sky));width:0;transition:width .3s}
.qcard{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.qnum{color:var(--sky-deep);font-weight:800;font-size:13.5px}
.qtopic{float:left;color:var(--muted);font-size:12.5px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.qtext{font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:700;margin:6px 0;clear:both}
.qimg{display:block;max-width:100%;max-height:360px;margin:14px auto 4px;border-radius:14px;border:1px solid var(--border);background:#fff}
.badge-map{display:inline-block;background:var(--sky-soft);color:var(--sky-deep);font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:999px;margin-bottom:4px}
.answers{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:flex-start;gap:12px;background:#fff;border:2px solid var(--border);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.14s;font-size:16.5px}
.ans:hover{border-color:var(--sky);background:#f5fcff}
.ans .mark{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--sky-deep);font-size:14px}
.ans.correct{border-color:var(--good);background:var(--good-bg)}.ans.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-bg)}.ans.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.locked{cursor:default}.ans.dim{opacity:.5}
.feedback{margin-top:15px;border-radius:13px;padding:13px 15px;font-size:15px;display:none}.feedback.show{display:block}
.feedback.ok{background:var(--good-bg);border:1px solid #b6e6cf;color:#14663f}.feedback.no{background:var(--bad-bg);border:1px solid #f3cdc9;color:#9a2b23}
.navrow{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
.results{background:#fff;border-radius:22px;padding:32px 26px;text-align:center;box-shadow:var(--shadow)}
.results .logo-sm{width:60px;height:60px;margin-bottom:6px}.results .big{font-size:60px}
.results h2{color:var(--ink);font-size:28px;margin:6px 0}
.ring{--p:0;width:160px;height:160px;border-radius:50%;margin:12px auto;background:conic-gradient(var(--sky) calc(var(--p)*1%), var(--sky-soft) 0);display:flex;align-items:center;justify-content:center}
.ring>div{width:124px;height:124px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-size:34px;font-weight:900;color:var(--ink);font-family:'Frank Ruhl Libre',serif}.ring .lbl{font-size:13px;color:var(--muted)}
.statline{color:var(--muted);font-size:16px;margin:4px}.grade{font-size:20px;font-weight:800;margin-top:6px;color:var(--ink)}
.section{text-align:right;margin-top:26px}
.section h3{font-size:19px;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.focus-item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.focus-item .name{flex:1;font-weight:700;font-size:15px}
.focus-bar{flex:0 0 120px;height:9px;background:#eef;border-radius:999px;overflow:hidden}
.focus-bar>i{display:block;height:100%;border-radius:999px}
.focus-item .frac{font-weight:800;font-size:13.5px;min-width:52px;text-align:left}
.wrap-scroll{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:14px;padding:4px}
.wrong-item{border-bottom:1px solid var(--border);padding:14px 12px}
.wrong-item:last-child{border-bottom:none}
.wrong-item .wq{font-weight:700;font-size:15.5px;margin-bottom:8px}
.wrong-item .wq .tp{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.wrong-item .line{font-size:14.5px;margin:3px 0;display:flex;gap:7px}
.wrong-item .you{color:var(--bad)}.wrong-item .cor{color:var(--good)}
.wrong-item .exp{font-size:13.5px;color:var(--muted);margin-top:5px}
.wrong-item img{max-height:150px;border-radius:10px;border:1px solid var(--border);margin-top:6px}
.allok{background:var(--good-bg);border:1px solid #b6e6cf;border-radius:14px;padding:18px;color:#14663f;font-weight:700}
@media print{.topbar,.btn,.navrow{display:none}.exam-header{box-shadow:none}}
</style></head>

function start(){
  app.innerHTML=header()+`
   <div class="hero"><div class="brain">🧠</div><p>מבחן אינטרקטיבי לתרגול. אפשר לנווט קדימה ואחורה בין השאלות, ובסוף לקבל סיכום של הטעויות ומוקדי חיזוק. בחרו מצב:</p></div>
   <div class="modes">
     <div class="mode-card sky" onclick="begin('full')"><div class="ico">🧠</div><h3>מבחן מלא</h3><p>מאגר גדול על כל חומר הקורס, כולל שאלות מפות אנטומיה. ערבוב בכל ריצה.</p><span class="count">${DATA.full.length} שאלות</span></div>
     <div class="mode-card" onclick="begin('moed')"><div class="ico">📝</div><h3>שחזור מועד א׳ 2026</h3><p>שאלות ששוחזרו ממועד א׳ האחרון, כולל שאלות זיהוי מבנים.</p><span class="count">${DATA.moed.length} שאלות</span></div>
     <div class="mode-card sky" onclick="begin('recon')"><div class="ico">📚</div><h3>שחזורי שנים קודמות</h3><p>שאלות מתוך שחזורי המבחנים 2022–2025, כולל שאלות תמונה.</p><span class="count">${DATA.recon.length} שאלות</span></div>
   </div>
   <div class="opts-toggle"><label><input type="checkbox" id="shuf" checked> ערבוב סדר השאלות בכל ריצה 🔀</label></div>
   <div class="legend">📸 שאלות מפות אנטומיה · ◀▶ ניווט חופשי בין השאלות · משוב מיידי · סיכום טעויות ומוקדי חיזוק בסוף</div>`;
}
function begin(bank){
  const chk=document.getElementById('shuf'); const sh=chk?chk.checked:true;
  const n=DATA[bank].length;
  let order=[...Array(n).keys()]; if(sh) shuffle(order);
  S={bank, order, optOrder:order.map(qi=>shuffle([...Array(DATA[bank][qi].opts.length).keys()])), ans:order.map(()=>null), i:0};
  render();
}
function curQ(){return DATA[S.bank][S.order[S.i]];}
function scoreObj(){let a=0,c=0;S.ans.forEach((v,idx)=>{if(v!=null){a++;if(DATA[S.bank][S.order[idx]].correct.includes(v))c++;}});return {answered:a,correct:c};}
function titleOf(){return {full:'🧠 מבחן מלא',moed:'📝 שחזור מועד א׳ 2026',recon:'📚 שחזורי 2022–2025'}[S.bank];}
function render(){
  const q=curQ(), total=S.order.length, om=S.optOrder[S.i], chosen=S.ans[S.i], done=chosen!=null;
  const {answered,correct}=scoreObj(), pct=Math.round(answered/total*100);
  let opts='';
  om.forEach((orig,pos)=>{
    let cls='ans';
    if(done){cls+=' locked';cls+= q.correct.includes(orig)?' correct':(orig===chosen?' wrong':' dim');}
    opts+=`<div class="${cls}" data-orig="${orig}" onclick="pick(${orig})"><div class="mark">${HE[pos]}</div><div class="txt">${q.opts[orig]}</div></div>`;
  });
  let fb='';
  if(done){const ok=q.correct.includes(chosen); const ct=q.correct.map(c=>q.opts[c]).join(' | ');
    fb=`<div class="feedback show ${ok?'ok':'no'}">${ok?'<b>✅ תשובה נכונה!</b> ':'<b>❌ טעות.</b> התשובה הנכונה: <b>'+ct+'</b>. '}${q.fb?('<br>'+q.fb):''}</div>`;}
  const last=S.i>=total-1;
  app.innerHTML=`
   <div class="topbar"><div class="topbar-in">
     <h2>${titleOf()}</h2>
     <span class="pill pos">שאלה ${S.i+1} / ${total}</span>
     <span class="pill score">✔ ${correct}/${answered}</span>
     <button class="btn btn-exit" onclick="finish()">סיום וציון</button>
   </div><div class="topbar-in"><div class="progress"><i style="width:${pct}%"></i></div></div></div>
   <div class="qcard">
     <span class="qtopic">${q.topic||''}</span>
     <div class="qnum">שאלה ${S.i+1}</div>
     ${q.img?'<div class="badge-map">📸 מפת אנטומיה</div>':''}
     <div class="qtext">${q.q}</div>
     ${q.img&&MAPS[q.img]?`<img class="qimg" src="${MAPS[q.img]}" alt="מפת אנטומיה">`:''}
     <div class="answers">${opts}</div>
     ${fb}
     <div class="navrow">
       <button class="btn btn-ghost" onclick="go(-1)" ${S.i==0?'disabled':''}>◀ הקודמת</button>
       <button class="btn btn-ghost" onclick="go(1)" ${last?'disabled':''}>הבאה ▶</button>
       <span class="spacer"></span>
       ${last?`<button class="btn btn-primary" onclick="finish()">סיום וקבלת ציון ✓</button>`:`<button class="btn btn-yellow" onclick="go(1)">דלג ▶</button>`}
     </div>
   </div>`;
  window.scrollTo(0,0);
}
function pick(orig){ if(S.ans[S.i]!=null) return; S.ans[S.i]=orig; render(); }
function go(d){const ni=S.i+d; if(ni<0||ni>=S.order.length) return; S.i=ni; render();}
function finish(){
  const total=S.order.length; const {answered,correct}=scoreObj(); const pct=answered?Math.round(correct/answered*100):0;
  // topic tally + wrong list
  const byTopic={}; const wrong=[];
  S.ans.forEach((v,idx)=>{ if(v==null) return; const q=DATA[S.bank][S.order[idx]]; const t=q.topic||'כללי';
    byTopic[t]=byTopic[t]||{c:0,n:0}; byTopic[t].n++; if(q.correct.includes(v))byTopic[t].c++; else wrong.push({q,chosen:v}); });
  let grade,emoji;
  if(pct>=90){grade='מצוין! שליטה מלאה 🧠';emoji='🏆';}else if(pct>=75){grade='כל הכבוד, רמה טובה';emoji='🎉';}
  else if(pct>=60){grade='עובר – יש מה לחזק';emoji='👍';}else{grade='כדאי לחזור על החומר';emoji='📖';}
  // focus areas sorted by error-rate desc
  const topics=Object.keys(byTopic).map(t=>{const o=byTopic[t];return {t,c:o.c,n:o.n,rate:(o.n-o.c)/o.n};}).sort((a,b)=>b.rate-a.rate||b.n-a.n);
  let focusHtml='';
  topics.forEach(o=>{const p=Math.round(100*o.c/o.n); const col=p>=80?'var(--good)':(p>=60?'var(--yellow-deep)':'var(--bad)');
    focusHtml+=`<div class="focus-item"><span class="name">${o.t}</span><span class="focus-bar"><i style="width:${p}%;background:${col}"></i></span><span class="frac">${o.c}/${o.n}</span></div>`;});
  const weak=topics.filter(o=>o.rate>0).slice(0,3).map(o=>o.t);
  // wrong review
  let wrongHtml='';
  if(wrong.length===0){wrongHtml=`<div class="allok">🎉 לא טעית באף שאלה מבין אלו שענית! כל הכבוד.</div>`;}
  else{ wrongHtml='<div class="wrap-scroll">'+wrong.map(w=>{const q=w.q;const ct=q.correct.map(c=>q.opts[c]).join(' | ');
      return `<div class="wrong-item"><div class="wq">${q.q}<span class="tp">${q.topic||''}</span></div>
        ${q.img&&MAPS[q.img]?`<img src="${MAPS[q.img]}" alt="">`:''}
        <div class="line you">✗ בחרת: <b>${q.opts[w.chosen]}</b></div>
        <div class="line cor">✓ הנכונה: <b>${ct}</b></div>
        ${q.fb?`<div class="exp">💡 ${q.fb}</div>`:''}</div>`;}).join('')+'</div>';}
  app.innerHTML=`<div class="results"><img class="logo-sm" src="${LOGO}" alt="לוגו">
     <div class="big">${emoji}</div><h2>סיכום המבחן</h2>
     <div class="ring" style="--p:${pct}"><div><div class="pct">${pct}%</div><div class="lbl">הצלחה</div></div></div>
     <div class="statline">ענית על <b>${answered}</b> מתוך <b>${total}</b> שאלות</div>
     <div class="statline">נכונות: <b style="color:var(--good)">${correct}</b> · שגויות: <b style="color:var(--bad)">${answered-correct}</b></div>
     <div class="grade">${grade}</div>
     <div class="section"><h3>🎯 מוקדי חיזוק לפי נושא</h3>
       ${weak.length?`<div class="statline" style="text-align:right;margin:0 0 10px">כדאי להתמקד ב: <b>${weak.join(' · ')}</b></div>`:''}
       ${focusHtml||'<div class="statline">לא נרשמו נתונים.</div>'}</div>
     <div class="section"><h3>📝 שאלות שטעית בהן (${wrong.length})</h3>${wrongHtml}</div>
     <div class="navrow" style="justify-content:center;margin-top:22px">
       <button class="btn btn-primary" onclick="begin(S.bank)">🔁 תרגול חוזר</button>
       <button class="btn btn-ghost" onclick="start()">🏠 מסך הבית</button></div></div>`;
  window.scrollTo(0,0);
}
start();
</script></body></html>
