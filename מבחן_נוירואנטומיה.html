<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן תרגול – נוירואנטומיה 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#5b2a86;      /* deep purple - neuro */
  --primary-dark:#3d1b5c;
  --primary-light:#8b5fbf;
  --accent:#00b4a6;       /* teal */
  --bg:#f4f1f9;
  --card:#ffffff;
  --text:#241b30;
  --muted:#6b6478;
  --good:#1e9e6a;
  --good-bg:#e4f7ee;
  --bad:#d64545;
  --bad-bg:#fdeaea;
  --border:#e6def2;
  --shadow:0 8px 30px rgba(60,27,92,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;
  background:linear-gradient(160deg,#f4f1f9 0%,#ece3f7 100%);
  color:var(--text);min-height:100vh;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',Georgia,serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}

/* ---- Start screen ---- */
.hero{text-align:center;padding:44px 20px 26px}
.hero .brain{font-size:64px;line-height:1;filter:drop-shadow(0 6px 14px rgba(91,42,134,.35))}
.hero h1{color:var(--primary-dark);font-size:40px;font-weight:900;margin:14px 0 6px}
.hero p{color:var(--muted);font-size:18px;max-width:560px;margin:0 auto}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.modes3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.modes3{grid-template-columns:1fr}}
@media(max-width:620px){.modes{grid-template-columns:1fr}}
.mode-card{
  background:var(--card);border:2px solid var(--border);border-radius:20px;
  padding:26px 22px;cursor:pointer;transition:.18s;text-align:center;box-shadow:var(--shadow)
}
.mode-card:hover{transform:translateY(-4px);border-color:var(--primary-light);box-shadow:0 14px 40px rgba(91,42,134,.22)}
.mode-card .ico{font-size:44px}
.mode-card h3{color:var(--primary-dark);font-size:23px;margin:12px 0 8px}
.mode-card p{color:var(--muted);font-size:15px;min-height:44px}
.mode-card .count{display:inline-block;margin-top:14px;background:var(--primary);color:#fff;
  padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px}
.mode-card.alt .count{background:var(--accent)}
.mode-card.alt2 .count{background:#c0568a}
.opts-toggle{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.opts-toggle label{font-size:15px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:7px}
.opts-toggle input{width:18px;height:18px;accent-color:var(--primary)}

/* ---- Quiz header ---- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,241,249,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:10px 16px;margin:-20px -16px 18px}
.topbar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:19px;color:var(--primary-dark);flex:1;min-width:120px}
.pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pill.score{color:var(--good)}
.pill.pos{color:var(--primary)}
.btn{font-family:inherit;border:none;border-radius:12px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.btn-exit{background:#fff;color:var(--bad);border:1px solid #f2c9c9}
.btn-exit:hover{background:var(--bad-bg)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}
.progress{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .3s}

/* ---- Question card ---- */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow)}
.qnum{color:var(--primary-light);font-weight:700;font-size:14px;letter-spacing:.5px}
.qtext{font-family:'Frank Ruhl Libre',serif;font-size:23px;font-weight:700;color:var(--text);margin:8px 0 6px}
.qimg{display:block;max-width:100%;margin:14px auto 4px;border-radius:14px;border:1px solid var(--border);background:#fff}
.multi-hint{display:inline-block;background:#efe7fb;color:var(--primary);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;margin:6px 0}
.answers{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.ans{display:flex;align-items:flex-start;gap:12px;background:#fff;border:2px solid var(--border);border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:.14s;font-size:17px}
.ans:hover{border-color:var(--primary-light);background:#faf7fe}
.ans .mark{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:14px}
.ans.multi .mark{border-radius:7px}
.ans.correct{border-color:var(--good);background:var(--good-bg)}
.ans.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ans.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.locked{cursor:default}
.ans.dim{opacity:.55}
.ans.sel{border-color:var(--primary);background:#f3ecfb}
.ans.sel .mark{background:var(--primary);border-color:var(--primary);color:#fff}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:15.5px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-bg);border:1px solid #b7e6cf;color:#146b48}
.feedback.no{background:var(--bad-bg);border:1px solid #f2c9c9;color:#9e2b2b}
.feedback b{font-weight:700}
.rowbtns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.check-btn{display:none}
.check-btn.show{display:inline-block}

/* ---- Results ---- */
.results{background:var(--card);border-radius:22px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
.results .big{font-size:74px;line-height:1}
.results h2{color:var(--primary-dark);font-size:30px;margin:10px 0}
.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:12px auto;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--border) 0)}
.ring > div{width:132px;height:132px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-size:38px;font-weight:900;color:var(--primary-dark);font-family:'Frank Ruhl Libre',serif}
.ring .lbl{font-size:13px;color:var(--muted)}
.statline{color:var(--muted);font-size:17px;margin:6px 0 2px}
.grade{font-size:20px;font-weight:700;margin-top:6px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"A": [{"q": "מה תפקידם של החדרים (ventricles) הנמצאים במוח?", "opts": ["בלימת זעזועים בלבד", "איסוף דם ורידי של המוח", "ייצור וזרימת CSF וויסות הלחץ התוך-גולגלתי", "עיבוד מידע חושתי"], "correct": [2], "img": null, "fb": "החדרים מכילים CSF שמייצב את הלחץ התוך-גולגלתי ומגן על המוח."}, {"q": "מדוע מבצעים ניקור מותני (LP) בגובה L3 ומטה?", "opts": ["כי זהו האזור הכי פחות כואב", "כי חוט השדרה מסתיים בערך ב-L1, ולכן אין סכנה לפגוע בו", "כי שכבת הפיה נגמרת ב-L3", "כי אין שם עצבים כלל"], "correct": [1], "img": null, "fb": "החוט מסתיים סביב L1 (conus medullaris); מתחתיו יש רק את ה-cauda equina, ולכן בטוח לנקר."}, {"q": "היכן ממוקם הגנגליון של המערכת הסימפטטית?", "opts": ["קרוב לאיבר המטרה ורחוק מחוט השדרה", "קרוב לחוט השדרה ורחוק מאיבר המטרה", "בדיוק באמצע הדרך", "אין גנגליון במערכת הסימפטטית"], "correct": [1], "img": null, "fb": "בסימפטטית הגנגליון קרוב לחוט השדרה (שרשרת פארא-ורטברלית); הנוירון הפרה-גנגליוני קצר והפוסט-גנגליוני ארוך."}, {"q": "על מה אחראית האונה הפריאטלית הימנית?", "opts": ["מידע תחושתי מצד שמאל של הגוף", "הנעת שרירי הגוף בצד שמאל", "מידע ויזואלי מעין ימין", "מידע תחושתי מצד ימין"], "correct": [0], "img": null, "fb": "הקורטקס הסומטוסנסורי בכל המיספרה מקבל תחושה מהצד הנגדי של הגוף."}, {"q": "מהו הסדר הנכון של המבנים מלטרלי למדיאלי (אזור הגרעינים הבזאליים)?", "opts": ["אינסולה, אקסטרים קפסולה, קלאוסטרום, אקסטרנל קפסולה, פוטאמן, גלובוס פלידוס", "אינסולה, גלובוס פלידוס, פוטאמן, קלאוסטרום", "פוטאמן, אינסולה, קלאוסטרום, גלובוס פלידוס", "אינסולה, אקסטרנל קפסולה, פוטאמן בלבד"], "correct": [0], "img": null, "fb": "מבחוץ פנימה: אינסולה → אקסטרים קפסולה → קלאוסטרום → אקסטרנל קפסולה → פוטאמן → גלובוס פלידוס."}, {"q": "איזה מבנה במוח אחראי על יצירת תנועה מוטורית רצונית?", "opts": ["Precentral gyrus", "Postcentral gyrus", "Precentral sulcus", "Superior frontal gyrus"], "correct": [0], "img": null, "fb": "ה-Precentral gyrus הוא הקורטקס המוטורי הראשוני (M1)."}, {"q": "מה מהבאים אינו חלק מתסמונת Brown-Séquard (חתך חצי של חוט השדרה)?", "opts": ["שיתוק וחוסר תחוש s": ["התרחבות מקומית וחלשה של דופן עורק, שעלולה להיקרע ולגרום לדימום סאב-ארכנואידלי", "חסימה של ורידים", "גידול", "הצטברות CSF"], "correct": [0], "img": null, "fb": "מפרצת (לרוב במעגל ויליס) עלולה להיקרע → SAH מסכן חיים."}, {"q": "ה-Anterior communicating artery (ACOM) מחברת בין:", "opts": ["שני עורקי ה-ACA (ימין ושמאל)", "שני ה-MCA", "הבזילרי לקרוטיד", "שני עורקי PCA"], "correct": [0], "img": null, "fb": "ACOM מחברת בין שני ה-ACA בקדמת מעגל ויליס."}, {"q": "ה-Posterior communicating artery (PCOM) מחברת בין:", "opts": ["הקרוטיד הפנימי / MCA-ACA למחזור האחורי (PCA)", "שני ה-ACA", "שני הוורטברלים", "הסינוסים"], "correct": [0], "img": null, "fb": "PCOM מחברת את המחזור הקדמי לאחורי — חלק מהטבעת."}, {"q": "מהו Watershed infarct?", "opts": ["אוטם באזורי הגבול בין טריטוריות של שני עורקים גדולים, רגיש לירידת לחץ דם", "אוטם במרכז ה-MCA", "דימום ורידי", "גידול בגבול המוח"], "correct": [0], "img": null, "fb": "אזורי ה-watershed (גבול ACA-MCA וכו') סובלים ראשונים בהיפופרפוזיה כללית."}, {"q": "CN1 (Olfactory) אחראי על:", "opts": ["חוש הריח", "חוש הראייה", "תנועת העין", "שמיעה"], "correct": [0], "img": null, "fb": "CN1 = ריח."}, {"q": "CN2 (Optic) אחראי על:", "opts": ["ראייה", "ריח", "תנועת הלשון", "שמיעה"], "correct": [0], "img": null, "fb": "CN2 = ראייה."}, {"q": "CN3 (Oculomotor) מעצבב את רוב שרירי העין ובנוסף:", "opts": ["מכווץ אישון ומרים עפעף (סיבים פרה-סימפטטיים)", "שמיעה", "טעם", "תנועת הלשון"], "correct": [0], "img": null, "fb": "CN3 מפעיל 4 שרירי עין, מרים עפעף, ונושא סיבים פרה-סימפטטיים לכיווץ אישון."}, {"q": "CN4 (Trochlear) מעצבב את:", "opts": ["שריר Superior oblique", "Lateral rectus", "Medial rectus", "Inferior rectus"], "correct": [0], "img": null, "fb": "CN4 → superior oblique (מוריד ומסובב את העין פנימה)."}, {"q": "CN5 (Trigeminal) אחראי על:", "opts": ["תחושה מהפנים ומוטוריקה של שרירי הלעיסה", "תנועת כל שרירי העין", "שמיעה", "ראייה"], "correct": [0], "img": null, "fb": "Trigeminal: תחושת פנים (V1-V3) + מוטורי ללעיסה."}, {"q": "CN6 (Abducens) מעצבב את:", "opts": ["Lateral rectus", "Superior oblique", "Medial rectus", "Inferior oblique"], "correct": [0], "img": null, "fb": "CN6 → lateral rectus (abduction)."}, {"q": "CN7 (Facial) אחראי בעיקר על:", "opts": ["מוטוריקה של שרירי הבעת הפנים (וגם טעם ב-2/3 קדמיים של הלשון)", "תחושת פנים", "תנועת העין", "ראייה"], "correct": [0], "img": null, "fb": "Facial: שרירי ההבעה + טעם קדמי + דמעות ורוק."}, {"q": "CN8 (Vestibulocochlear) אחראי על:", "opts": ["שמיעה ושיווי משקל", "ריח", "טעם", "תנועת הלשון"], "correct": [0], "img": null, "fb": "CN8 = שמיעה (cochlear) + שיווי משקל (vestibular)."}, {"q": "CN10 (Vagus) אחראי בין היתר על:", "opts": ["עצבוב פרה-סימפטטי של איברים פנימיים (לב, ריאות, מערכת עיכול)", "תנועת העין", "ראייה", "שמיעה"], "correct": [0], "img": null, "fb": "Vagus = הסיב הפרה-סימפטטי הראשי לאיברי החזה והבטן."}, {"q": "CN12 (Hypoglossal) אחראי על:", "opts": ["תנועת הלשון", "טעם", "שמיעה", "ריח"], "correct": [0], "img": null, "fb": "Hypoglossal = מוטורי לשרירי הלשון."}, {"q": "אילו עצבים קרניאליים נושאים סיבים פרה-סימפטטיים? (בחר/י את כל הנכונים)", "opts": ["CN3", "CN7", "CN10", "CN2"], "correct": [0, 1, 2], "img": null, "fb": "הסיבים הפרה-סימפטטיים הקרניאליים: CN3, CN7, CN9, CN10. CN2 חושי בלבד."}, {"q": "צניחת עפעף (ptosis), אישון מורחב ועין 'למטה והחוצה' אופייניים לפגיעה ב:", "opts": ["CN3 (Oculomotor)", "CN4", "CN6", "CN7"], "correct": [0], "img": null, "fb": "שיתוק CN3: העין נמשכת ע\"י lateral rectus ו-superior oblique → down-and-out, עם ptosis ואישון מורחב."}, {"q": "חוסר יכולת לסגור עין ולסמן חיוך בצד אחד של הפנים אופייני לפגיעה ב:", "opts": ["CN7 (Facial)", "CN5", "CN8", "CN3"], "correct": [0], "img": null, "fb": "שיתוק פאשיאל היקפי (Bell's palsy) → חולשה של כל חצי הפנים כולל המצח."}, {"q": "מוצא רוב העצבים הקרניאליים הוא מ:", "opts": ["גזע המוח (Brainstem)", "הצרבלום", "חוט השדרה", "התלמוס"], "correct": [0], "img": null, "fb": "רוב 12 העצבים הקרניאליים יוצאים מגזע המוח (למעט CN1 ו-CN2)."}, {"q": "ה-Dorsal columns (עמודות אחוריות) של חוט השדרה מובילות:", "opts": ["תחושה עמוקה: מגע עדין, רטט ופרופריוצפציה", "כאב וטמפרטורה", "פקודות מוטוריות", "אותות אוטונומיים בלבד"], "correct": [0], "img": null, "fb": "Dorsal column-medial lemniscus = מגע עדין, רטט, פרופריוצפציה; חוצה בגזע המוח."}, {"q": "ה-Spinothalamic tract מוביל:", "opts": ["כאב וטמפרטורה", "רטט ופרופריוצפציה", "פקודות מוטוריות רצוניות", "טעם"], "correct": [0], "img": null, "fb": "Spinothalamic = כאב וטמפרטורה; חוצה בחוט השדרה מיד סמוך לכניסה."}, {"q": "ה-Corticospinal tract אחראי על:", "opts": ["פקודות מוטוריות רצוניות מהקורטקס לשרירים", "תחושת כאב", "שיווי משקל", "ריח"], "correct": [0], "img": null, "fb": "המסלול הפירמידלי (corticospinal) — תנועה רצונית; רובו חוצה במדולה (pyramidal decussation)."}, {"q": "במחלת Brown-Séquard (חתך חצי חוט השדרה), מה נכון?", "opts": ["מוטוריקה ותחושה עמוקה נפגעות באותו צד (ipsi), כאב וטמפרטורה בצד הנגדי (contra)", "הכול נפגע באותו צד", "הכול בצד הנגדי", "רק מוטוריקה נפגעת"], "correct": [0], "img": null, "fb": "Ipsilateral: מוטורי + dorsal column. Contralateral: pain/temp (spinothalamic חוצה)."}, {"q": "היכן חוצה ה-Spinothalamic tract?", "opts": ["בחוט השדרה, ברמה סמוכה לכניסת הסיב (תוך 1-2 סגמנטים)", "במדולה", "בתלמוס", "בקורטקס"], "correct": [0], "img": null, "fb": "Spinothalamic חוצה מיד בחוט; לכן פגיעה חד-צדדית → גירעון כאב/טמפ' נגדי."}, {"q": "היכן חוצה מסלול ה-Dorsal column?", "opts": ["ב-medulla (במעבר ל-medial lemniscus)", "בחוט השדרה מיד בכניסה", "בתלמוס", "בקורטקס"], "correct": [0], "img": null, "fb": "סיבי dorsal column עולים באותו צד וחוצים במדולה — לכן פגיעה בחוט נותנת גירעון ipsilateral."}, {"q": "ה-Cauda equina מורכבת מ:", "opts": ["צרור שורשי עצבים מותניים-סקרליים מתחת לקצה חוט השדרה", "סיבים מוטוריים בגזע המוח", "קרום מוח", "כלי דם"], "correct": [0], "img": null, "fb": "מתחת ל-conus medullaris (~L1) יש רק שורשי עצבים = cauda equina."}, {"q": "Upper motor neuron lesion (למשל בקורטקס/חוט מעל) מתאפיין בדרך כלל ב:", "opts": ["ספסטיות, רפלקסים מוגברים וסימן בבינסקי חיובי", "אטרופיה קשה ופסיקולציות", "שיתוק רפוי מוחלט מיידי", "אובדן תחושה בלבד"], "correct": [0], "img": null, "fb": "UMN: היפרטוניה/ספסטיות, רפלקסים מוגברים, Babinski+. LMN: רפיון, אטרופיה, פסיקולציות."}, {"q": "האונה הפרונטלית אחראית בין היתר על:", "opts": ["תנועה רצונית, תכנון, קבלת החלטות והתנהגות", "עיבוד ראייה", "שמיעה ראשונית", "תחושה מהגוף"], "correct": [0], "img": null, "fb": "פרונטלי: קורטקס מוטורי, prefrontal לתכנון/אישיות, ו-Broca (בדומיננטית)."}, {"q": "האונה האוקסיפיטלית אחראית בעיקר על:", "opts": ["עיבוד ראייה", "שמיעה", "תחושה", "תנועה"], "correct": [0], "img": null, "fb": "אוקסיפיטלי = קורטקס ויזואלי ראשוני."}, {"q": "אזור Broca אחראי על:", "opts": ["הפקת דיבור (motor speech)", "הבנת שפה", "ראייה", "שמיעה"], "correct": [0], "img": null, "fb": "פגיעה ב-Broca → אפאזיה מוטורית (דיבור לא שוטף, הבנה שמורה)."}, {"q": "אזור Wernicke אחראי על:", "opts": ["הבנת שפה", "הפקת דיבור", "תנועת יד", "ריח"], "correct": [0], "img": null, "fb": "פגיעה ב-Wernicke → אפאזיה שטפית עם הבנה לקויה (דיבור שוטף חסר-משמעות)."}, {"q": "בהומונקולוס המוטורי, אזור הפנים והפה ממוקם:", "opts": ["לטרלית ותחתונה על הקורטקס", "מדיאלית על גבול החריץ הבין-המיספרי", "באונה האוקסיפיטלית", "בצרבלום"], "correct": [0], "img": null, "fb": "סדר: רגל מדיאלית → גו → יד → פנים/פה לטרלית ותחתונה."}, {"q": "Neglect (התעלמות מרחבית) אופיינית לפגיעה ב:", "opts": ["אונה פריאטלית לא-דומיננטית (ימין)", "אונה אוקסיפיטלית שמאל", "צרבלום", "גזע מוח"], "correct": [0], "img": null, "fb": "פגיעה פריאטלית ימנית → התעלמות מהצד השמאלי."}, {"q": "איזו אונה מכילה את הקורטקס האודיטורי הראשוני?", "opts": ["טמפורלית", "אוקסיפיטלית", "פריאטלית", "פרונטלית"], "correct": [0], "img": null, "fb": "הקורטקס השמיעתי (Heschl) באונה הטמפורלית."}, {"q": "ה-Corpus callosum מחבר בין:", "opts": ["שתי ההמיספרות המוחיות", "המוח לחוט השדרה", "הצרברום לצרבלום", "החדרים"], "correct": [0], "img": null, "fb": "ה-corpus callosum הוא הצרור הקומיסורלי הגדול המחבר בין ההמיספרות."}, {"q": "ההמיספרה השמאלית (ברוב האנשים) מתמחה בעיקר ב:", "opts": ["שפה, דיבור וחשיבה אנליטית", "עיבוד מרחבי ומוזיקה", "שיווי משקל", " אותות נכנסים?", "opts": ["Dendrites", "Axon terminal", "Node of Ranvier", "Myelin"], "correct": [0], "img": null, "fb": "דנדריטים קולטים קלט; אקסון מוליך פלט."}, {"q": "Axon hillock חשוב כי:", "opts": ["שם מתחיל פוטנציאל הפעולה (אזור טריגר)", "מייצר מיאלין", "קולט מידע חושתי", "סופג CSF"], "correct": [0], "img": null, "fb": "ה-axon hillock הוא אזור ההצתה של ה-AP (צפיפות תעלות Na+)."}, {"q": "תאי Schwann יוצרים מיאלין ב:", "opts": ["מערכת העצבים ההיקפית (PNS)", "CNS בלבד", "חדרי המוח", "כלי דם"], "correct": [0], "img": null, "fb": "Schwann → מיאלין ב-PNS; oligodendrocytes → CNS."}, {"q": "Oligodendrocytes יוצרים מיאלין ב:", "opts": ["מערכת העצבים המרכזית (CNS)", "PNS", "שרירים", "עצם"], "correct": [0], "img": null, "fb": "אוליגודנדרוציט אחד ממאלן כמה אקסונים ב-CNS."}, {"q": "Multiple Sclerosis (MS) היא מחלה של:", "opts": ["דה-מיאלינציה ב-CNS", "ניוון שרירים", "דלקת מפרקים", "גידול מוחי"], "correct": [0], "img": null, "fb": "MS — פגיעה אוטואימונית במיאלין של ה-CNS."}, {"q": "Astrocytes מבצעים בין היתר:", "opts": ["תמיכה מטבולית, שמירת BBB ואיזון סביבתי", "הולכת AP", "ייצור דם", "עיכול"], "correct": [0], "img": null, "fb": "אסטרוציטים — תמיכה, BBB, ויסות יונים ונוירוטרנסמיטרים."}, {"q": "Microglia הם:", "opts": ["התאים החיסוניים (מקרופאגים) של ה-CNS", "יוצרי מיאלין", "נוירונים חושתיים", "תאי דם אדומים"], "correct": [0], "img": null, "fb": "מיקרוגליה — הגנה חיסונית ופאגוציטוזה ב-CNS."}, {"q": "Saltatory conduction פירושה:", "opts": ["הולכה 'מדלגת' בין nodes of Ranvier, מהירה יותר", "הולכה איטית רציפה", "הולכה כימית", "הולכה לאחור"], "correct": [0], "img": null, "fb": "ה-AP 'קופץ' בין הצמתים באקסון ממיאלן → הולכה מהירה."}, {"q": "שלב הדה-פולריזציה נובע מ:", "opts": ["כניסת Na+", "יציאת K+", "כניסת Cl-", "יציאת Ca2+"], "correct": [0], "img": null, "fb": "פתיחת תעלות Na+ מהירות → דה-פולריזציה."}, {"q": "שלב הרה-פולריזציה נובע מ:", "opts": ["יציאת K+", "כניסת Na+", "כניסת Ca2+", "יציאת Cl-"], "correct": [0], "img": null, "fb": "יציאת K+ מחזירה את הממברנה לפוטנציאל שלילי."}, {"q": "התקופה הרפרקטורית (refractory period) חשובה כי:", "opts": ["מבטיחה הולכה חד-כיוונית ומגבילה תדירות", "מאיצה הולכה לאחור", "מייצרת CSF", "מכווצת שריר"], "correct": [0], "img": null, "fb": "בתקופה הרפרקטורית לא ניתן ליצור AP חדש → כיווניות ובקרת קצב."}, {"q": "כניסת אילו יונים לקצה האקסון גורמת לשחרור נוירוטרנסמיטר?", "opts": ["Ca2+", "Na+", "K+", "Cl-"], "correct": [0], "img": null, "fb": "דה-פולריזציה פותחת תעלות Ca2+ → מיזוג שלפוחיות → שחרור NT."}, {"q": "משאבת Na+/K+-ATPase שומרת על:", "opts": ["מפל היונים ופוטנציאל המנוחה", "ייצור מיאלין", "BBB", "שחרור NT ישיר"], "correct": [0], "img": null, "fb": "המשאבה (3Na+ החוצה / 2K+ פנימה) שומרת על מפל וריכוזים."}]};
const HE = ['א','ב','ג','ד','ה','ו'];
let S = {bank:null, mode:null, order:[], i:0, answered:0, correct:0, shuffleQ:true};

const app = document.getElementById('app');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- Start ---------- */
function start(){
  S.mode=null;
  app.innerHTML=`
   <div class="hero">
     <div class="brain">🧠</div>
     <h1>מבחן תרגול – נוירואנטומיה</h1>
     <p>מבחן אינטרקטיבי לתרגול לקראת המבחן. בחרו מצב תרגול:</p>
   </div>
   <div class="modes modes3">
     <div class="mode-card" onclick="begin('A')">
       <div class="ico">📚</div>
       <h3>מבחן השחזורים</h3>
       <p>שאלות מתוך שחזורי המבחנים שהעלית (2022–2025), כולל שאלות תמונה.</p>
       <span class="count">${DATA.A.length} שאלות</span>
     </div>
     <div class="mode-card alt" onclick="begin('B')">
       <div class="ico">⚡</div>
       <h3>100 שאלות תרגול</h3>
       <p>שאלות חדשות באותו סגנון על כל חומר הקורס – עם מסיחים ומשוב.</p>
       <span class="count">${DATA.B.length} שאלות</span>
     </div>
     <div class="mode-card alt2" onclick="begin('C')">
       <div class="ico">🧬</div>
       <h3>200 שאלות תרגול</h3>
       <p>מאגר מורחב וחדש – כיסוי מעמיק של כל נושאי הקורס ומקרים קליניים.</p>
       <span class="count">${DATA.C.length} שאלות</span>
     </div>
   </div>
   <div class="opts-toggle">
     <label><input type="checkbox" id="shuf" checked> ערבוב סדר השאלות בכל ריצה 🔀</label>
   </div>`;
}

function begin(bank){
  S.bank=bank; S.mode=bank;
  const chk=document.getElementById('shuf'); S.shuffleQ = chk?chk.checked:true;
  const n=DATA[bank].length;
  S.order=[...Array(n).keys()];
  if(S.shuffleQ) shuffle(S.order);
  S.i=0; S.answered=0; S.correct=0;
  render();
}

/* ---------- Render question ---------- */
function render(){
  const q = DATA[S.bank][S.order[S.i]];
  const total = S.order.length;
  const multi = q.correct.length>1;
  // shuffle option order, keep mapping to original index
  const map = shuffle([...Array(q.opts.length).keys()]);
  q._map = map;
  const pct = Math.round((S.answered/total)*100);
  const titles={A:'📚 מבחן השחזורים',B:'⚡ 100 שאלות תרגול',C:'🧬 200 שאלות תרגול'};const title=titles[S.bank];

  let ansHtml='';
  map.forEach((orig,pos)=>{
    ansHtml += `<div class="ans ${multi?'multi':''}" data-orig="${orig}" onclick="pick(this,${multi})">
        <div class="mark">${HE[pos]}</div><div class="txt">${q.opts[orig]}</div></div>`;
  });

  app.innerHTML=`
   <div class="topbar"><div class="topbar-in">
     <h2>${title}</h2>
     <span class="pill pos">שאלה ${S.i+1} / ${total}</span>
     <span class="pill score">✔ ${S.correct}/${S.answered}</span>
     <button class="btn btn-exit" onclick="finish(true)">סיום וקבלת ציון</button>
   </div>
   <div class="topbar-in"><div class="progress" style="flex:1"><i style="width:${pct}%"></i></div></div>
   </div>
   <div class="qcard">
     <div class="qnum">שאלה ${S.i+1}</div>
     <div class="qtext">${q.q}</div>
     ${q.img?`<img class="qimg" src="${q.img}" alt="תמונה לשאלה">`:''}
     ${multi?'<div class="multi-hint">✔ שאלה עם יותר מתשובה נכונה אחת – סמנו את כולן</div>':''}
     <div class="answers" id="answers">${ansHtml}</div>
     <button class="btn btn-primary check-btn ${multi?'show':''}" id="checkBtn" onclick="checkMulti()">בדיקת התשובה</button>
     <div class="feedback" id="fb"></div>
     <div class="rowbtns" id="nav"></div>
   </div>`;
  window.scrollTo(0,0);
}

/* ---------- Single select ---------- */
let curMulti=false;
function pick(el,multi){
  if(multi){
    if(el.classList.contains('locked'))return;
    el.classList.toggle('sel');
    return;
  }
  const ansBox=document.getElementById('answers');
  if(ansBox.dataset.done)return;
  ansBox.dataset.done='1';
  const q=DATA[S.bank][S.order[S.i]];
  const chosen=+el.dataset.orig;
  const ok=q.correct.includes(chosen);
  reveal(ok, [chosen]);
}

/* ---------- Multi select ---------- */
function checkMulti(){
  const ansBox=document.getElementById('answers');
  if(ansBox.dataset.done)return;
  const sel=[...ansBox.querySelectorAll('.ans.sel')].map(e=>+e.dataset.orig);
  if(sel.length===0){return;}
  ansBox.dataset.done='1';
  const q=DATA[S.bank][S.order[S.i]];
  const cs=q.correct.slice().sort().join(',');
  const ss=sel.slice().sort().join(',');
  reveal(cs===ss, sel);
  document.getElementById('checkBtn').style.display='none';
}

/* ---------- Reveal feedback ---------- */
function reveal(ok, chosen){
  const q=DATA[S.bank][S.order[S.i]];
  const nodes=[...document.querySelectorAll('.ans')];
  nodes.forEach(n=>{
    n.classList.add('locked');
    const orig=+n.dataset.orig;
    n.classList.remove('sel');
    if(q.correct.includes(orig)) n.classList.add('correct');
    else if(chosen.includes(orig)) n.classList.add('wrong');
    else n.classList.add('dim');
  });
  S.answered++;
  if(ok)S.correct++;
  const correctTxt=q.correct.map(c=>q.opts[c]).join(' | ');
  const fb=document.getElementById('fb');
  fb.className='feedback show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'<b>✅ תשובה נכונה!</b> ':'<b>❌ טעות.</b> התשובה הנכונה: <b>'+correctTxt+'</b>. ')
    + (q.fb?('<br>'+q.fb):'');
  // update score pills live
  const sp=document.querySelector('.pill.score'); if(sp)sp.textContent=`✔ ${S.correct}/${S.answered}`;
  const last = S.i>=S.order.length-1;
  document.getElementById('nav').innerHTML =
     `<button class="btn btn-ghost" onclick="finish(true)">סיום וקבלת ציון</button>`
   + (last?`<button class="btn btn-primary" onclick="finish(false)">סיום המבחן ➜</button>`
          :`<button class="btn btn-primary" onclick="next()">לשאלה הבאה ➜</button>`);
}

function next(){ S.i++; render(); }

/* ---------- Results ---------- */
function finish(early){
  const total=S.order.length;
  const answered=S.answered, correct=S.correct;
  const pct = answered? Math.round(correct/answered*100):0;
  let grade, emoji;
  if(pct>=90){grade='מצוין! 🧠⚡';emoji='🏆';}
  else if(pct>=75){grade='כל הכבוד, שליטה טובה';emoji='🎉';}
  else if(pct>=60){grade='עובר – יש עוד מה לחזק';emoji='👍';}
  else {grade='כדאי לחזור על החומר';emoji='📖';}
  app.innerHTML=`
   <div class="results">
     <div class="big">${emoji}</div>
     <h2>סיכום המבחן</h2>
     <div class="ring" style="--p:${pct}"><div>
        <div class="pct">${pct}%</div><div class="lbl">אחוז הצלחה</div>
     </div></div>
     <div class="statline">ענית על <b>${answered}</b> מתוך <b>${total}</b> שאלות${early&&answered<total?' (סיום מוקדם)':''}</div>
     <div class="statline">תשובות נכונות: <b style="color:var(--good)">${correct}</b> · שגויות: <b style="color:var(--bad)">${answered-correct}</b></div>
     <div class="grade">${grade}</div>
     <div class="rowbtns" style="justify-content:center;margin-top:24px">
       <button class="btn btn-primary" onclick="begin(S.bank)">🔁 תרגול חוזר</button>
       <button class="btn btn-ghost" onclick="start()">🏠 למסך הבית</button>
     </div>
   </div>`;
  window.scrollTo(0,0);
}

start();
</script>
</body>
</html>
